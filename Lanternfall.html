        else hand = { x: sh.x + Math.round(Math.cos(pose.ang) * 5), y: sh.y + Math.round(Math.sin(pose.ang) * 5) };
        this.drawWeapon(ctx, pose, hand, sh);
      }
      if (this.state === 'heal') {
        ctx.fillStyle = '#70c070';
        ctx.fillRect(hand.x - 1, hand.y - 4, 3, 4);
        ctx.fillStyle = '#c0ffc0';
        ctx.fillRect(hand.x, hand.y - 3, 1, 1);
      }
      // front arm
      G.pixLine(ctx, sh.x, sh.y, hand.x, hand.y, wax);
      ctx.fillStyle = wax;
      ctx.fillRect(hand.x - 1, hand.y - 1, 2, 2);
      // head: the flame
      const hy = -17 + bodyY;
      const fl2 = Math.sin(A.t * 13) * 0.5 + 0.5, fl3 = Math.sin(A.t * 17 + 1) * 0.5 + 0.5;
      const lean = G.clamp(-this.vx / 90, -2, 2);
      ctx.fillStyle = fc[0];
      ctx.fillRect(-3, hy - 6, 7, 6);
      ctx.fillRect(-2 + Math.round(lean * 0.5), hy - 8 - Math.round(fl2), 5, 3);
      ctx.fillRect(-1 + Math.round(lean), hy - 10 - Math.round(fl3 * 2), 3, 3);
      ctx.fillRect(Math.round(lean * 1.5), hy - 12 - Math.round(fl2 * 2), 1, 2);
      ctx.fillStyle = fc[1];
      ctx.fillRect(-2, hy - 5, 5, 5);
      ctx.fillRect(-1 + Math.round(lean * 0.5), hy - 7 - Math.round(fl3), 3, 3);
      ctx.fillStyle = fc[2];
      ctx.fillRect(-1, hy - 4, 3, 3);
      ctx.fillRect(0 + Math.round(lean * 0.5), hy - 6 - Math.round(fl2), 1, 2);
      // eye
      ctx.fillStyle = '#2a0808';
      ctx.fillRect(1, hy - 4, 2, 1);
      ctx.restore();
      // light from the flame
      const lc = fc[1];
      G.addLight(this.cx, this.y - 2, 150 + Math.sin(A.t * 10) * 6, lc, 1);
      if (Math.random() < 0.25) G.fx.spawn({ x: this.cx + (Math.random() - 0.5) * 4, y: this.y - 6, vx: -this.vx * 0.2 + (Math.random() - 0.5) * 10, vy: -30 - Math.random() * 20, life: 0.5, color: fc[1], size: 1, add: true });
      // ward bubble
      if (this.ward) {
        ctx.globalAlpha = 0.35 + Math.sin(A.t * 6) * 0.1;
        ctx.strokeStyle = '#c0e8ff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y - 11, 16, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      if (this.curse > 0) {
        G.addLight(this.cx, this.cy, 60, '#b040ff', 0.8);
      }
      G.drawStatusIcons(ctx, this, x - 10, y - 38);
    }
    drawWeapon(ctx, pose, hand, sh) {
      const d = G.ITEMS[pose.id];
      const spr = G.heldSprite(pose.id);
      if (pose.shield) {
        const up = pose.up;
        ctx.save();
        ctx.translate(hand.x + 2, hand.y - (up ? 2 : 0));
        ctx.drawImage(spr.img, -spr.img.width / 2, -spr.img.height / 2);
        ctx.restore();
        if (up && this.atk && this.atk.t < this.atk.def.parryWin) {
          ctx.globalAlpha = 0.6;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(hand.x + 4, hand.y - spr.img.height / 2 - 2, 2, spr.img.height + 2);
          ctx.globalAlpha = 1;
        }
        return;
      }
      if (pose.ranged) {
        ctx.save();
        ctx.translate(hand.x, hand.y);
        ctx.rotate(pose.ang);
        ctx.drawImage(spr.img, -spr.px, -spr.py);
        if ((d.look.shape === 'bow' || d.look.shape === 'longbow') && pose.pull > 0) {
          ctx.fillStyle = '#fff0d0';
          const pull = Math.round(pose.pull * 5);
          ctx.fillRect(-spr.px + 6 - pull, -spr.py + 1, 1, spr.img.height - 2);
          ctx.fillStyle = '#d8c090';
          ctx.fillRect(-spr.px + 6 - pull, -1, 12, 1);
        }
        ctx.restore();
        return;
      }
      // melee
      if (pose.active && !pose.thrust && pose.arc) {
        // smear
        const r = spr.img.width - spr.px + 3;
        const a0 = pose.arc[0];
        const a1 = G.lerp(pose.arc[0], pose.arc[1], G.ease.outCubic(pose.t));
        ctx.save();
        ctx.translate(sh.x, sh.y);
        const glow = d.look.glow || '#ffffff';
        for (let i = 0; i < 3; i++) {
          ctx.globalAlpha = 0.28 - i * 0.07;
          ctx.strokeStyle = i === 0 ? '#ffffff' : glow;
          ctx.lineWidth = 5 - i * 1.5;
          ctx.beginPath();
          const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
          ctx.arc(0, 0, r + 4 - i * 3, lo, hi);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }
      if (pose.spin && pose.active) {
        ctx.globalAlpha = 0.25;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(sh.x, sh.y, 20, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      if (d.look.shape === 'whip') {
        // lash
        ctx.save();
        ctx.translate(hand.x, hand.y);
        ctx.rotate(pose.ang);
        ctx.drawImage(spr.img, -spr.px, -spr.py);
        ctx.restore();
        const ext = pose.whip || 0;
        if (ext > 0) {
          const len = 66 * ext;
          for (let i = 0; i < len; i += 2) {
            const t = i / 66;
            ctx.fillStyle = i > len - 4 ? '#b0ff90' : d.look.lash;
            ctx.fillRect(Math.round(hand.x + 3 + i), Math.round(hand.y - 5 + Math.sin(t * 9 - ext * 6) * (1 - ext) * 6 + t * 3), 2, 1);
          }
        }
        return;
      }
      if (d.look.shape === 'flail') {
        ctx.save();
        ctx.translate(hand.x, hand.y);
        ctx.rotate(pose.ang);
        ctx.drawImage(spr.img, -spr.px, -spr.py);
        ctx.restore();
        const bx = hand.x + Math.cos(pose.ang) * 22, by = hand.y + Math.sin(pose.ang) * 22;
        G.pixLine(ctx, hand.x + Math.cos(pose.ang) * 6, hand.y + Math.sin(pose.ang) * 6, bx, by, '#8a8a90');
        G.pixCircle(ctx, bx, by, 4, d.look.ball);
        ctx.fillStyle = '#e0e0e0';
        ctx.fillRect(Math.round(bx) - 1, Math.round(by) - 6, 2, 2);
        ctx.fillRect(Math.round(bx) + 4, Math.round(by) - 1, 2, 2);
        ctx.fillRect(Math.round(bx) - 6, Math.round(by) - 1, 2, 2);
        return;
      }
      ctx.save();
      ctx.translate(hand.x, hand.y);
      ctx.rotate(pose.ang);
      ctx.drawImage(spr.img, -spr.px, -spr.py);
      if (d.look.twin) { ctx.rotate(0.5); ctx.globalAlpha = 0.8; ctx.drawImage(spr.img, -spr.px - 2, -spr.py + 3); ctx.globalAlpha = 1; }
      ctx.restore();
      if (d.look.glow) G.addLight(this.cx + this.facing * 10, this.cy - 6, 50, d.look.glow, 0.7);
      if (pose.active && pose.thrust) {
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(hand.x + 2, hand.y - 1, spr.img.width + 10, 2);
        ctx.globalAlpha = 1;
      }
    }
  }
  G.Player = Player;
})();

</script>
<script>
'use strict';
// ============================================================================
// Skills: grenades, traps, turrets, powers, summons
// ============================================================================
(function () {
  const G = window.G;
  const TS = G.TS;

  class Deployable extends G.Entity {
    constructor(x, y, w, h, o) {
      super(x - w / 2, y - h, w, h);
      Object.assign(this, o);
      this.layer = 2;
      this.age = 0;
    }
    settle(dt) {
      this.vy = Math.min(400, this.vy + 1200 * dt);
      const r = this.moveY(this.vy * dt);
      if (r === 'floor') this.vy = 0;
    }
  }

  class Trap extends Deployable {
    constructor(x, y, o) { super(x, y, 14, 6, o); this.armed = 0.25; }
    update(dt) {
      this.age += dt;
      this.settle(dt);
      if (this.age > 30) return G.world.kill(this);
      if (this.sprung) { this.sprungT -= dt; if (this.sprungT <= 0) G.world.kill(this); return; }
      if (this.age < this.armed) return;
      for (const e of G.world.enemiesIn(this.x - 2, this.y - 10, this.w + 4, this.h + 10)) {
        if (e.flying) continue;
        this.sprung = true;
        this.sprungT = 1.5;
        const fd = this.p.finalDamage(this.dmg, e, this.inst, false);
        e.takeHit({ dmg: fd.dmg, crit: fd.crit, kind: 'skill', team: 'player', x: this.cx, y: this.cy, dir: 0, knock: 0, statuses: this.st, power: this.pow, item: this.inst, poise: 20 });
        G.Audio.play('lever', { x: this.cx });
        G.Audio.play('hit', { x: this.cx });
        G.fx.burst(this.cx, this.y, 8, { color: '#c0c0c8', speed: 90, life: 0.3, size: 1, type: 'spark' });
        break;
      }
    }
    draw(ctx, cx, cy) {
      const x = Math.round(this.x - cx), y = Math.round(this.y - cy);
      ctx.fillStyle = '#5a5a60';
      ctx.fillRect(x, y + 4, 14, 2);
      ctx.fillStyle = '#9a9aa4';
      if (this.sprung) { for (let i = 0; i < 5; i++) ctx.fillRect(x + 2 + i * 2, y - 2, 1, 6); }
      else { for (let i = 0; i < 5; i++) { ctx.fillRect(x + i * 1, y + 3 - i % 2, 1, 2); ctx.fillRect(x + 13 - i, y + 3 - i % 2, 1, 2); } ctx.fillStyle = '#c0a060'; ctx.fillRect(x + 6, y + 3, 2, 1); }
    }
  }

  class Turret extends Deployable {
    constructor(x, y, o) { super(x, y, 12, 14, o); this.fireT = 0.3; }
    update(dt) {
      this.age += dt;
      this.settle(dt);
      if (this.age > this.life) { G.fx.burst(this.cx, this.cy, 8, { color: '#8a7a6a', speed: 60, life: 0.4, size: 2, grav: 300 }); return G.world.kill(this); }
      this.fireT -= dt;
      const tgt = G.world.nearestEnemy(this.cx, this.cy - 4, this.flame ? 60 : 240, (e) => G.world.level.los(this.cx, this.y + 4, e.cx, e.cy));
      if (tgt) this.facing = Math.sign(tgt.cx - this.cx) || this.facing;
      if (tgt && this.fireT <= 0) {
        this.fireT = this.rate;
        if (this.flame) {
          for (let i = 0; i < 3; i++) G.fx.spawn({ x: this.cx + this.facing * 6, y: this.y + 4, vx: this.facing * (120 + Math.random() * 80), vy: (Math.random() - 0.5) * 40, life: 0.35, color: '#ffa030', color2: '#601010', size: 3, size2: 6, add: true, drag: 0.05 });
          for (const e of G.world.enemiesIn(this.facing > 0 ? this.cx : this.cx - 60, this.y - 12, 60, 30)) {
            e.takeHit({ dmg: this.dmg, kind: 'skill', team: 'player', x: this.cx, dir: this.facing, knock: 0, statuses: { burn: 1 }, power: this.pow, item: this.inst, silent: true, poise: 1 });
          }
          G.addLight(this.cx + this.facing * 20, this.y, 70, '#ff8030', 1);
          if (Math.random() < 0.3) G.Audio.play('fire', { x: this.cx, vol: 0.3 });
        } else {
          const a = Math.atan2(tgt.cy - (this.y + 4), tgt.cx - this.cx);
          G.world.add(new G.Proj({ x: this.cx, y: this.y + 4, vx: Math.cos(a) * 480, vy: Math.sin(a) * 480, type: 'bolt', team: 'player', dmg: this.dmg, item: this.inst, power: this.pow, life: 1 }));
          G.Audio.play('turret', { x: this.cx, vol: 0.5 });
        }
      }
    }
    draw(ctx, cx, cy) {
      const x = Math.round(this.x - cx), y = Math.round(this.y - cy);
      if (this.flame) {
        ctx.fillStyle = '#6a5a50'; ctx.fillRect(x + 2, y + 2, 8, 12);
        ctx.fillStyle = '#2a2020'; ctx.fillRect(x + 3, y + 5, 2, 2); ctx.fillRect(x + 7, y + 5, 2, 2); ctx.fillRect(x + 4, y + 9, 4, 1);
        const f = Math.sin(this.age * 12) * 0.5 + 0.5;
        ctx.fillStyle = '#ff8030'; ctx.fillRect(x + 3, y - 2 - f * 2, 6, 4);
        ctx.fillStyle = '#ffe080'; ctx.fillRect(x + 5, y - 3 - f * 2, 2, 3);
        G.addLight(this.cx, this.y, 50, '#ff8030', 0.8);
      } else {
        ctx.fillStyle = '#5a4030'; ctx.fillRect(x + 4, y + 6, 4, 8); ctx.fillRect(x, y + 12, 12, 2);
        ctx.fillStyle = '#8a9aa0'; ctx.fillRect(x + 1, y + 3, 10, 3);
        ctx.fillStyle = '#6a5040'; ctx.fillRect(this.facing > 0 ? x + 8 : x, y + 1, 4, 7);
      }
      // lifetime bar
      ctx.fillStyle = '#000'; ctx.fillRect(x, y - 5, 12, 2);
      ctx.fillStyle = '#c0c0c0'; ctx.fillRect(x, y - 5, Math.round(12 * (1 - this.age / this.life)), 2);
    }
  }

  class OrbitBlades extends G.Entity {
    constructor(o) { super(0, 0, 1, 1); Object.assign(this, o); this.layer = 4; this.age = 0; this.hitT = new Map(); this.alwaysDraw = true; }
    update(dt) {
      this.age += dt;
      const p = G.world.player;
      if (this.age > this.life || !p || p.dead) return G.world.kill(this);
      this.x = p.cx;
      this.y = p.cy;
      for (let i = 0; i < 3; i++) {
        const a = this.age * 5 + (i / 3) * Math.PI * 2;
        const bx = this.x + Math.cos(a) * 30, by = this.y + Math.sin(a) * 22;
        for (const e of G.world.enemiesIn(bx - 5, by - 5, 10, 10)) {
          const t = this.hitT.get(e) || 0;
          if (G.world.time - t < 0.3) continue;
          this.hitT.set(e, G.world.time);
          const fd = p.finalDamage(this.dmg, e, this.inst, false);
          e.takeHit({ dmg: fd.dmg, crit: fd.crit, kind: 'skill', team: 'player', x: this.x, y: this.y, dir: Math.sign(e.cx - this.x) || 1, knock: 60, item: this.inst, poise: 6 });
        }
        if (Math.random() < 0.3) G.fx.spawn({ x: bx, y: by, life: 0.2, color: '#80c0ff', size: 1, add: true });
      }
      G.addLight(this.x, this.y, 70, '#80c0ff', 0.6);
    }
    draw(ctx, cx, cy) {
      for (let i = 0; i < 3; i++) {
        const a = this.age * 5 + (i / 3) * Math.PI * 2;
        const bx = this.x + Math.cos(a) * 30 - cx, by = this.y + Math.sin(a) * 22 - cy;
        ctx.save();
        ctx.translate(Math.round(bx), Math.round(by));
        ctx.rotate(a + Math.PI / 2);
        ctx.globalAlpha = Math.min(1, (this.life - this.age) * 2);
        ctx.fillStyle = '#80c0ff'; ctx.fillRect(-1, -7, 3, 12);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(-1, -7, 1, 10);
        ctx.fillStyle = '#806040'; ctx.fillRect(-2, 4, 5, 1);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
  }

  class Gull extends G.Entity {
    constructor(x, y, o) { super(x - 5, y - 4, 10, 8); Object.assign(this, o); this.layer = 4; this.age = 0; this.state = 'hover'; this.t = Math.random(); this.alwaysDraw = true; }
    update(dt) {
      this.age += dt;
      const p = G.world.player;
      if (this.age > this.life || !p) { G.fx.burst(this.cx, this.cy, 6, { color: '#d0e0f0', speed: 60, life: 0.4, size: 1 }); return G.world.kill(this); }
      this.t -= dt;
      if (this.state === 'hover') {
        const tx = p.cx + Math.cos(this.age * 2 + this.i * 2) * 26, ty = p.y - 18 + Math.sin(this.age * 3 + this.i) * 6;
        this.x += (tx - this.cx) * 4 * dt;
        this.y += (ty - this.cy) * 4 * dt;
        if (this.t <= 0) {
          const e = G.world.nearestEnemy(this.cx, this.cy, 220);
          if (e) { this.state = 'dive'; this.target = e; this.t = 0.8; }
          else this.t = 0.3;
        }
      } else {
        const e = this.target;
        if (!e || e.dead || this.t <= 0) { this.state = 'hover'; this.t = 0.6; return; }
        const a = Math.atan2(e.cy - this.cy, e.cx - this.cx);
        this.vx = Math.cos(a) * 360;
        this.vy = Math.sin(a) * 360;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.facing = Math.sign(this.vx) || 1;
        if (G.overlap(this, e.hurtbox ? e.hurtbox() : e)) {
          const fd = p.finalDamage(this.dmg, e, this.inst, false);
          e.takeHit({ dmg: fd.dmg, crit: fd.crit, kind: 'skill', team: 'player', x: this.cx, y: this.cy, dir: this.facing, knock: 60, item: this.inst, poise: 6, statuses: { bleed: 1 }, power: this.pow });
          this.state = 'hover';
          this.t = 0.7;
        }
      }
    }
    draw(ctx, cx, cy) {
      const x = Math.round(this.cx - cx), y = Math.round(this.cy - cy);
      const flap = Math.sin(this.age * 20) > 0;
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#d0e0f0';
      ctx.fillRect(x - 2, y - 1, 5, 3);
      ctx.fillRect(x - 6, y - (flap ? 3 : -1), 4, 2);
      ctx.fillRect(x + 3, y - (flap ? 3 : -1), 4, 2);
      ctx.fillStyle = '#ffb040';
      ctx.fillRect(x + (this.facing > 0 ? 3 : -4), y, 2, 1);
      ctx.globalAlpha = 1;
      G.addLight(this.cx, this.cy, 30, '#d0e0f0', 0.4);
    }
  }
  G.Deployables = { Trap, Turret, OrbitBlades, Gull };

  G.Skills = {
    use(p, inst, def) {
      const pw = p.power(inst);
      const pow = p.dotPower(inst);
      const st = p.itemStatuses(inst);
      const W = G.world;
      switch (def.type) {
        case 'grenade': {
          const tgt = W.nearestEnemy(p.cx + p.facing * 60, p.cy, 200, (e) => Math.sign(e.cx - p.cx) === p.facing || Math.abs(e.cx - p.cx) < 20);
          let vx = p.facing * 200, vy = -260;
          if (tgt) {
            const dx = tgt.cx - p.cx, t = G.clamp(Math.abs(dx) / 220, 0.3, 0.9);
            vx = dx / t;
            vy = (tgt.cy - p.cy - 0.5 * 900 * t * t) / t;
          }
          const col = def.look.glass;
          W.add(new G.Proj({
            x: p.cx, y: p.cy - 6, w: 7, h: 7, vx, vy: Math.max(-420, vy), grav: 900, type: 'grenade', team: 'player', dmg: pw, color: col, life: 2,
            onExplode: (pr) => {
              const colors = inst.id === 'rime_flask' ? ['#a0f0ff', '#ffffff', '#60c0e0'] : inst.id === 'pitch_flask' ? ['#4a4030', '#2a2a2a', '#6a5a40'] : ['#ffd060', '#ff8030', '#ff4020'];
              G.explode(pr.cx, pr.cy, def.aoe, pw, 'player', { statuses: st, power: pow, item: inst, color: colors[0], colors, sfx: inst.id === 'rime_flask' ? 'freeze' : 'explosion' });
              if (inst.id === 'cinder_flask') for (let i = -1; i <= 1; i++) W.add(new G.Puddle(pr.cx + i * 24, pr.cy, 'fire', pow * 6));
            },
          }));
          G.Audio.play('throw');
          break;
        }
        case 'blast': {
          G.explode(p.cx, p.cy, def.aoe, pw, 'player', { statuses: st, power: pow, item: inst, color: '#ffe060', colors: ['#ffffff', '#ffe060', '#c0a040'], sfx: 'lightning', shake: 0.4 });
          G.screenFlash('#fff0c0', 0.15, 0.4);
          break;
        }
        case 'trap':
          W.add(new Trap(p.cx + p.facing * 10, p.bottom, { dmg: pw, st, pow, inst, p }));
          G.Audio.play('lever');
          break;
        case 'turret':
          W.add(new Turret(p.cx + p.facing * 12, p.bottom, { dmg: pw, pow, inst, life: def.life, rate: def.rate, facing: p.facing }));
          G.Audio.play('turret');
          break;
        case 'flameturret':
          W.add(new Turret(p.cx + p.facing * 12, p.bottom, { dmg: pw * 0.5, pow, inst, life: def.life, rate: def.rate, flame: true, facing: p.facing }));
          G.Audio.play('fire');
          break;
        case 'phase': {
          const e = W.nearestEnemy(p.cx, p.cy, def.range, (e) => W.level.los(p.cx, p.cy, e.cx, e.cy));
          if (!e) { G.game.notify('[gray]No target in range.[]'); G.Audio.play('uiDeny'); return false; }
          const L = W.level;
          const side = e.facing ? -e.facing : Math.sign(e.cx - p.cx) || 1;
          let nx = e.cx + side * (e.w / 2 + 10) - p.w / 2;
          const ny = e.bottom - p.h;
          if (L.rectSolid(nx, ny, p.w, p.h)) nx = e.cx - side * (e.w / 2 + 10) - p.w / 2;
          if (L.rectSolid(nx, ny, p.w, p.h)) { nx = p.x; }
          G.fx.burst(p.cx, p.cy, 16, { color: ['#c080ff', '#ffffff'], speed: 120, life: 0.4, size: 2, add: true });
          p.x = nx;
          p.y = ny;
          p.facing = Math.sign(e.cx - p.cx) || 1;
          p.resetScarf();
          p.invuln = Math.max(p.invuln, 0.3);
          p.nextCritT = 1;
          G.applyStatuses(e, { stun: 1 });
          e.takeHit({ dmg: pw, kind: 'skill', team: 'player', x: p.cx, y: p.cy, dir: p.facing, knock: 40, item: inst, poise: 20 });
          G.fx.burst(p.cx, p.cy, 16, { color: ['#c080ff', '#ffffff'], speed: 120, life: 0.4, size: 2, add: true });
          G.Audio.play('teleport');
          break;
        }
        case 'chain': {
          let from = { cx: p.cx, cy: p.cy - 6 };
          const hit = new Set();
          let n = 0;
          for (let j = 0; j < def.jumps; j++) {
            let best = null, bd = j === 0 ? def.range : 110;
            for (const e of W.enemies) {
              if (e.dead || e.dying || hit.has(e)) continue;
              const d = Math.hypot(e.cx - from.cx, e.cy - from.cy);
              if (d < bd) { bd = d; best = e; }
            }
            if (!best) break;
            hit.add(best);
            G.boltFx(from.cx, from.cy, best.cx, best.cy, '#a0d0ff');
            const fd = p.finalDamage(pw, best, inst, false);
            best.takeHit({ dmg: fd.dmg, crit: fd.crit, kind: 'skill', team: 'player', x: from.cx, y: from.cy, dir: Math.sign(best.cx - from.cx) || 1, knock: 60, statuses: Object.assign({ stun: 0.3 }, st), power: pow, item: inst, poise: 20 });
            from = best;
            n++;
          }
          if (!n) { G.game.notify('[gray]No target in range.[]'); G.Audio.play('uiDeny'); return false; }
          G.Audio.play('lightning');
          G.shake(0.2);
          break;
        }
        case 'orbit':
          W.add(new OrbitBlades({ dmg: pw, inst, life: def.life }));
          G.Audio.play('magic');
          break;
        case 'ward':
          p.ward = { t: def.life };
          G.Audio.play('freeze');
          break;
        case 'gulls':
          for (let i = 0; i < 3; i++) W.add(new Gull(p.cx, p.y - 10, { dmg: pw, inst, pow, life: def.life, i }));
          G.Audio.play('magic');
          break;
      }
      return true;
    },
  };
})();

          W.add(new G.Proj({ x, y, w: 8, h: 8, vx, vy, type: 'orb', team: 'enemy', dmg, life: 3, homing: 1.5, ghost: true, color: '#a0c0ff', statuses: { stun: 0.4 } }));
          G.Audio.play('lightning', { x: this.cx, vol: 0.4 });
          break;
        }
      }
    }
    activeTick(dt, a, p) {
      const d = a.d;
      switch (d.type) {
        case 'melee':
        case 'lunge':
          if (d.type === 'lunge') this.vx = G.approach(this.vx, 0, d.lunge * 2.5 * dt);
          if (!a.hit) this.meleeHit(a, p, d.box);
          break;
        case 'charge': {
          this.vx = a.chargeDir * d.speed * (this.elite ? 1.2 : 1);
          if (Math.random() < 0.5) G.fx.spawn({ x: this.cx - a.chargeDir * 10, y: this.bottom - 2, vx: -a.chargeDir * 60, vy: -40, life: 0.3, color: '#8a7a60', size: 2, grav: 300 });
          if (!a.hit) this.meleeHit(a, p, d.box);
          if (this.wallAhead(a.chargeDir * 3) || (!this.floorAhead(a.chargeDir * 6) && this.onGround)) {
            if (this.wallAhead(a.chargeDir * 3)) {
              G.shake(0.3);
              G.Audio.play('stomp', { x: this.cx });
              G.applyStatuses(this, { stun: 1.6 });
              G.fx.burst(this.cx + a.chargeDir * 12, this.cy, 10, { color: '#c0b0a0', speed: 120, life: 0.4, size: 2 });
            }
            this.vx = 0;
            a.phase = 'r';
            a.t = 0;
          }
          break;
        }
        case 'dive':
          if (!a.hit) this.meleeHit(a, p, d.box);
          this.vx *= Math.pow(0.4, dt);
          this.vy *= Math.pow(0.4, dt);
          break;
        case 'leap':
          if (!a.landed && this.onGround && a.t > 0.1) {
            a.landed = true;
            this.vx = 0;
            G.shake(0.35);
            G.Audio.play('stomp', { x: this.cx });
            G.fx.burst(this.cx, this.bottom, 14, { color: ['#8a7a60', '#c0b0a0'], speed: 150, life: 0.4, size: 2, angle: -Math.PI / 2, spread: 2.6, grav: 400 });
            this.meleeHit(a, p, d.box);
            a.t = d.a;
          }
          break;
        case 'spin': {
          const n = 3;
          const k = Math.floor((a.t / d.a) * n);
          if (k !== a.lastK) { a.lastK = k; a.hit = false; G.Audio.play('swingHeavy', { x: this.cx, vol: 0.5 }); }
          if (!a.hit) this.meleeHit(a, p, d.box, 0.5);
          break;
        }
        case 'scream': {
          const len = 130 * this.sc;
          if (Math.random() < 0.8) G.fx.spawn({ x: this.cx + this.facing * 8, y: this.cy, vx: this.facing * 260, vy: (Math.random() - 0.5) * 120, life: 0.45, color: '#c0d0ff', type: 'ring', size: 2, size2: 10, add: true, rot: 1 });
          if (!a.hit && p) {
            const dx = (p.cx - this.cx) * this.facing;
            if (dx > 0 && dx < len && Math.abs(p.cy - this.cy) < 20 + dx * 0.35) {
              p.takeHit({ dmg: this.def.dmg * this.dmgMul, team: 'enemy', kind: 'scream', x: this.cx, dir: this.facing, knock: 220, statuses: d.statuses, src: this, unblockable: false });
              a.hit = true;
            }
          }
          break;
        }
        case 'strikes': {
          a.st -= dt;
          if (a.si < a.targets.length && a.st <= 0) {
            a.st = 0.45;
            const tx = a.targets[a.si++];
            G.world.add(new StrikeMarker(tx, p ? p.bottom : this.bottom, this.def.dmg * this.dmgMul, 0.7));
          }
          break;
        }
      }
    }
    // ------------------------------------------------------------ damage
    takeHit(h) {
      if (this.dead || this.dying) return 'miss';
      if (this.hanging) this.dropFromCeiling();
      let dmg = h.dmg;
      // shields block frontal hits unless the enemy is attacking or disabled
      if (this.def.shield && h.kind !== 'dot' && !h.parried && !G.isDisabled(this) && !(this.atk && this.atk.phase !== 'w') && h.x !== undefined) {
        if (Math.sign(h.x - this.cx) === this.facing) {
          dmg *= 1 - this.def.shield;
          if (!h.silent) { G.Audio.play('hitMetal', { x: this.cx, y: this.cy }); G.hitFx(this.cx + this.facing * 8, this.cy - 4, -this.facing, '#c0d0ff'); }
          h.knock = (h.knock || 0) * 0.3;
          h.poise = (h.poise || 0) * 1.5;
          this.blockFlash = 0.15;
        }
      }
      this.hp -= dmg;
      this.hpBarT = 3;
      this.lastItem = h.item || this.lastItem;
      if (h.kind !== 'dot') {
        this.flashT = 0.1;
        this.setAggro();
        if (h.dir && !h.noKnock && !this.def.heavy) {
          const kb = (h.knock === undefined ? 100 : h.knock) * (this.elite ? 0.5 : 1);
          this.vx = h.dir * kb;
          if (h.knockUp && !this.flying) this.vy = -h.knockUp;
        }
        if (!this.def.heavy || h.poise >= 40) {
          this.poise -= h.poise || 10;
          if (this.poise <= 0) {
            this.poise = this.def.poise * (this.elite ? 1.5 : 1);
            if (this.atk && this.atk.phase === 'w') { this.atk = null; this.atkCd = 0.4; }
            this.hurtT = 0.25;
          }
        }
        if (h.statuses) G.applyStatuses(this, h.statuses, h.power || 1);
        if (!h.silent) {
          G.Audio.play(h.crit ? 'hitCrit' : 'hit', { x: this.cx, y: this.cy });
          G.hitFx(this.cx - (h.dir || 0) * 4, this.cy - 2, h.dir || 1, h.crit ? '#ffe14a' : '#ffffff', h.crit);
          G.bloodFx(this.cx, this.cy, h.dir || 1, this.def.blood, h.crit ? 10 : 5);
        }
        if (h.crit) G.hitStop(3);
      }
      if (!h.silent || dmg >= 1) G.dmgNumber(this.cx + (Math.random() - 0.5) * 8, this.y - 4, dmg, h.kind === 'dot' ? h.color : null, h.crit);
      const p = G.world.player;
      if (p && h.team === 'player' && h.kind !== 'dot') p.onDealtDamage(dmg);
      if (G.game) G.game.stats.damageDealt += dmg;
      if (this.hp <= 0) this.die(h);
      return 'hit';
    }
    die(h) {
      const p = G.world.player;
      // bonewalkers collapse and may reassemble
      if (this.def.revive && !(h && h.crit) && !G.hasSt(this, 'burn') && !this.revived) {
        this.dying = true;
        this.deathT = 0;
        this.boneT = 4;
        this.revived = true;
        this.atk = null;
        G.Audio.play('crumble', { x: this.cx });
        G.fx.burst(this.cx, this.cy, 12, { color: '#d8cfb8', speed: 120, life: 0.6, size: 2, grav: 500, collide: true });
        G.fx.text(this.cx, this.y - 10, 'It stirs...', '#90ffb0', 1, 1.2);
        return;
      }
      this.dying = true;
      this.deathT = 0;
      this.atk = null;
      this.hanging = false;
      G.Audio.play('enemyDie', { x: this.cx, y: this.cy });
      G.fx.burst(this.cx, this.cy, 18, { color: [this.def.blood, G.shade(this.def.blood, 0.3), '#ffffff'], speed: 160, life: 0.7, size: 2, size2: 1, grav: 500, collide: true });
      G.fx.spawn({ x: this.cx, y: this.cy, type: 'glow', size: 30, size2: 2, life: 0.3, color: '#ffffff', add: true });
      if (this.elite) { G.slowMo(0.5, 0.3); G.shake(0.4); }
      G.dropLoot(this);
      if (p) p.onKill(this);
      G.save.bestiary = G.save.bestiary || {};
      if (!this.def.noBestiary) G.save.bestiary[this.id] = (G.save.bestiary[this.id] || 0) + 1;
      if (this.def.split) {
        for (const s of [-1, 1]) {
          const m = G.world.add(new Enemy(this.def.split, this.cx + s * 6, this.bottom, { tier: this.tier }));
          m.vx = s * 120;
          m.vy = -200;
          m.aggro = true;
        }
      }
      if (this.def.deathCloud) {
        G.fx.burst(this.cx, this.cy, 30, { color: ['#60c040', '#a0e060'], speed: 80, life: 1.2, size: 3, size2: 9, type: 'smoke', drag: 0.05 });
        if (p && Math.hypot(p.cx - this.cx, p.cy - this.cy) < 55) G.applyStatuses(p, { poison: 2 }, this.dmgMul);
      }
      if (this.guardian) G.game.onGuardianDefeated(this);
      if (this.onDeath) this.onDeath();
    }
    reassemble() {
      this.dying = false;
      this.boneT = undefined;
      this.hp = Math.round(this.maxHp * 0.5);
      this.alertT = 0.6;
      G.Audio.play('crumble', { x: this.cx });
      G.fx.burst(this.cx, this.cy, 12, { color: ['#90ffb0', '#d8cfb8'], speed: 90, life: 0.5, size: 2, add: true });
    }
    onFrozen() { G.Audio.play('freeze', { x: this.cx, vol: 0.6 }); }

    // ------------------------------------------------------------ drawing
    draw(ctx, cx, cy) {
      const x = Math.round(this.cx - cx), y = Math.round(this.bottom - cy);
      const a = this.atk;
      const tele = a && a.phase === 'w' && (Math.floor(a.t * 12) % 2 === 0);
      const flash = this.flashT > 0;
      const frozen = G.hasSt(this, 'freeze');
      const tint = flash ? '#ffffff' : frozen ? '#a0e8ff' : tele ? '#ff5040' : null;
      const tintAmt = flash ? 1 : frozen ? 0.5 : 0.45;
      const C = tint ? (c) => G.mix(c, tint, tintAmt) : (c) => c;
      let alpha = 1;
      if (this.dying && this.boneT === undefined) alpha = Math.max(0, 1 - this.deathT / 0.45);
      ctx.save();
      ctx.globalAlpha = alpha * (this.def.ghost ? 0.85 : 1);
      ctx.translate(x, y);
      if (this.elite && !this.dying) {
        // aura
        const pulse = Math.sin(this.animT * 5) * 0.5 + 0.5;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.25 + pulse * 0.15;
        const ac = this.guardian ? '#ffd060' : '#ff5a8a';
        ctx.drawImage(G.glowSprite(ac), -this.w - 6, -this.h * 1.5, this.w * 2 + 12, this.h * 2);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = alpha;
        G.addLight(this.cx, this.cy, 70, ac, 0.8);
      }
      ctx.scale(this.facing * this.sc, this.sc);
      if (this.hanging) ctx.scale(1, -1), ctx.translate(0, this.h / this.sc);
      if (this.boneT !== undefined) {
        // bone pile
        ctx.fillStyle = C('#d8cfb8');
        ctx.fillRect(-7, -3, 14, 3);
        ctx.fillRect(-4, -5, 6, 2);
        ctx.fillStyle = C('#b8af98');
        ctx.fillRect(3, -6, 4, 4);
        const f = Math.sin(this.animT * 10) > 0;
        if (this.boneT < 1.5 && f) { ctx.fillStyle = '#90ffb0'; ctx.fillRect(4, -5, 1, 1); }
      } else {
        DRAW[this.def.draw](ctx, this, C);
      }
      ctx.restore();
      if (frozen) {
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = '#b0f0ff';
        ctx.fillRect(Math.round(this.x - cx) - 2, Math.round(this.y - cy) - 2, this.w + 4, this.h + 3);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.round(this.x - cx), Math.round(this.y - cy), 2, this.h - 2);
        ctx.globalAlpha = 1;
      }
      if (G.hasSt(this, 'stun') && !this.dying) {
        for (let i = 0; i < 3; i++) {
          const ang = this.animT * 6 + (i / 3) * Math.PI * 2;
          ctx.fillStyle = '#ffe060';
          ctx.fillRect(Math.round(x + Math.cos(ang) * 8), Math.round(this.y - cy - 5 + Math.sin(ang) * 2), 2, 2);
        }
      }
      // telegraph "!"
      if (a && a.phase === 'w' && !this.dying) {
        const big = a.d.w >= 0.6;
        G.text(ctx, '!', x, Math.round(this.y - cy) - 14 - (big ? 2 : 0), big ? '#ff4030' : '#ffb040', { align: 'center', outline: '#000', scale: big ? 2 : 1 });
      } else if (this.alertT > 0 && !this.dying) {
        G.text(ctx, '?', x, Math.round(this.y - cy) - 12, '#ffe060', { align: 'center', outline: '#000' });
      }
      // aim line for harpooners / archers
      if (a && a.d.aimLine && a.phase === 'w' && a.aim) {
        const lock = a.t > a.d.w - 0.22;
        ctx.globalAlpha = lock ? 0.9 : 0.45;
        G.pixLine(ctx, this.cx - cx + this.facing * 8, this.cy - cy - 4, a.aim.x - cx, a.aim.y - cy, lock ? '#ffffff' : '#ff3030');
        ctx.globalAlpha = 1;
      }
      // hp bar
      if (!this.dying && (this.hpBarT > 0 || this.elite) && !this.guardian) {
        const bw = Math.max(18, this.w + 6);
        const bx = x - bw / 2, by = Math.round(this.y - cy) - 7;
        ctx.fillStyle = '#000';
        ctx.fillRect(bx - 1, by - 1, bw + 2, 4);
        ctx.fillStyle = '#5a1010';
        ctx.fillRect(bx, by, bw, 2);
        ctx.fillStyle = this.elite ? '#ff5a8a' : '#e84040';
        ctx.fillRect(bx, by, Math.round(bw * Math.max(0, this.hp / this.maxHp)), 2);
        if (this.elite) G.text(ctx, this.name, x, by - 10, '#ffb0c8', { align: 'center', outline: '#000' });
      }
      if (!this.dying) G.drawStatusIcons(ctx, this, x - 8, Math.round(this.y - cy) - (this.elite ? 26 : 14));
    }
  }
  G.Enemy = Enemy;

  // lightning strike marker (stormcaller)
  class StrikeMarker extends G.Entity {
    constructor(x, groundY, dmg, delay) {
      super(x - 10, groundY - 120, 20, 120);
      const L = G.world.level;
      const gy = L.groundBelow(x, groundY - 60, 200);
      if (gy !== null) this.y = gy - 120;
      this.dmg = dmg;
      this.t = delay;
      this.layer = 4;
      this.alwaysDraw = true;
    }
    update(dt) {
      this.t -= dt;
      if (this.t <= 0 && !this.fired) {
        this.fired = true;
        this.after = 0.25;
        G.Audio.play('lightning', { x: this.cx });
        G.shake(0.25);
        G.boltFx(this.cx, this.y - 60, this.cx, this.bottom, '#c0d8ff');
        const p = G.world.player;
        if (p && G.rectsOverlap(this.x, this.y, this.w, this.h, p.x, p.y, p.w, p.h)) p.takeHit({ dmg: this.dmg, team: 'enemy', kind: 'lightning', x: this.cx, dir: Math.sign(p.cx - this.cx) || 1, knock: 160, statuses: { stun: 0.3 } });
      }
      if (this.fired) { this.after -= dt; if (this.after <= 0) G.world.kill(this); }
    }
    draw(ctx, cx, cy) {
      const x = Math.round(this.x - cx), y = Math.round(this.bottom - cy);
      if (!this.fired) {
        ctx.globalAlpha = 0.4 + Math.sin(this.t * 40) * 0.2;
        ctx.fillStyle = '#80a0ff';
        ctx.fillRect(x, y - 2, this.w, 2);
        ctx.fillRect(x + this.w / 2 - 1, y - 30, 2, 28);
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = this.after * 4;
        ctx.fillStyle = '#e0e8ff';
        ctx.fillRect(x + 6, y - this.h, 8, this.h);
        ctx.globalAlpha = 1;
      }
    }
  }
  G.StrikeMarker = StrikeMarker;

  // ================================================================ drawing
  // local coords: origin at feet centre, facing right
  function R(ctx, x, y, w, h, col) {
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }
  function atkPhase(e) {
    const a = e.atk;
    if (!a) return { ph: null, t: 0 };
    const d = a.d;
    return { ph: a.phase, t: a.phase === 'w' ? Math.min(1, a.t / d.w) : a.phase === 'a' ? Math.min(1, a.t / Math.max(0.01, d.a)) : Math.min(1, a.t / d.r), d };
  }
  function armAngle(e, rest) {
    const P = atkPhase(e);
    if (!P.ph) return rest + Math.sin(e.walkT) * 0.3;
    if (P.ph === 'w') return G.lerp(rest, -2.2, G.ease.outCubic(P.t));
    if (P.ph === 'a') return G.lerp(-2.2, 1.0, G.ease.outCubic(Math.min(1, P.t * 2)));
    return G.lerp(1.0, rest, P.t);
  }
  function legs(ctx, e, C, hipY, col, col2, spread) {
    spread = spread || 3;
    const moving = Math.abs(e.vx) > 5 && e.onGround;
    const s = moving ? Math.sin(e.walkT) : 0;
    const f1 = Math.round(s * spread), f2 = -f1;
    const l1 = moving ? Math.max(0, Math.cos(e.walkT)) * 2 : 0, l2 = moving ? Math.max(0, -Math.cos(e.walkT)) * 2 : 0;
    R(ctx, f2 - 1, hipY, 2, -hipY - l2, C(col2));
    R(ctx, f2 - 1, -1 - l2, 3, 1, C(col2));
    R(ctx, f1 - 1, hipY, 2, -hipY - l1, C(col));
    R(ctx, f1 - 1, -1 - l1, 3, 1, C(col));
  }
  function lean(e) {
    const P = atkPhase(e);
    if (P.ph === 'w') return -P.t * 2;
    if (P.ph === 'a') return 3;
    return 0;
  }
  function eyes(ctx, x, y, col, e) {
    R(ctx, x, y, 2, 1, col);
    G.addLight(e.cx + e.facing * 2, e.y + 4, 16, col, 0.5);
  }
  function weaponAt(ctx, sx, sy, ang, len, drawFn) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(ang);
    drawFn(ctx, len);
    ctx.restore();
  }
  function trail(ctx, e, sx, sy, r, col) {
    const P = atkPhase(e);
    if (P.ph !== 'a' || P.t > 0.6) return;
    ctx.globalAlpha = 0.35 * (1 - P.t);
    ctx.strokeStyle = col || '#ffffff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(sx, sy, r, -2.2, G.lerp(-2.2, 1.0, Math.min(1, P.t * 2)));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  const DRAW = {
    husk(ctx, e, C) {
      const l = lean(e);
      legs(ctx, e, C, -8, '#3a3a30', '#2a2a22');
      R(ctx, -4 + l, -17, 8, 10, C('#4a4a3a'));
      R(ctx, -4 + l, -17, 8, 3, C('#7a8a78'));
      R(ctx, -3 + l, -23, 7, 7, C('#7a8a78'));
      R(ctx, 2 + l, -21, 3, 3, C('#5a6a58'));
      eyes(ctx, 2 + l, -21, '#e0f0a0', e);
      const ang = armAngle(e, 1.1);
      R(ctx, -5 + l, -16, 2, 7, C('#6a7a68'));
      weaponAt(ctx, 1 + l, -15, ang, 9, (c, len) => { R(c, 0, -1, len, 2, C('#7a8a78')); R(c, len - 1, -2, 3, 1, C('#c0c8b0')); R(c, len - 1, 1, 3, 1, C('#c0c8b0')); });
      trail(ctx, e, 1 + l, -15, 12);
    },
    spitter(ctx, e, C) {
      const P = atkPhase(e);
      const puff = P.ph === 'w' ? P.t * 2 : 0;
      legs(ctx, e, C, -5, '#4a5a2a', '#3a4a20', 2);
      G.pixCircle(ctx, 0, -11, 7 + Math.round(puff), C('#6a7a3a'));
      R(ctx, -5, -14, 3, 3, C('#8a9a4a'));
      R(ctx, 2, -9, 5, 3, C('#2a1a10'));
      if (P.ph === 'w') R(ctx, 3, -9, 3, 2, C('#a0e040'));
      eyes(ctx, 1, -15, '#ffe060', e);
      R(ctx, -2, -19, 2, 2, C('#8a9a4a'));
    },
    crawler(ctx, e, C) {
      const P = atkPhase(e);
      const s = Math.sin(e.walkT * 1.5);
      for (let i = 0; i < 4; i++) {
        const x = -6 + i * 4, h = 6 + (i === 3 ? 2 : 0) + (i % 2 ? s : -s);
        R(ctx, x, -h - 1, 4, h, C(i % 2 ? '#8a5a6a' : '#9a6a7a'));
      }
      R(ctx, 6, -8, 4, 5, C('#9a6a7a'));
      const open = P.ph === 'a' ? 3 : P.ph === 'w' ? 2 : 1;
      R(ctx, 9, -9, 3, 1, C('#e0d0c0'));
      R(ctx, 9, -9 + open + 2, 3, 1, C('#e0d0c0'));
      eyes(ctx, 7, -7, '#ff5050', e);
      for (let i = 0; i < 4; i++) R(ctx, -5 + i * 4, -1, 1, 1, C('#5a3a4a'));
    },
    jailer(ctx, e, C) {
      const l = lean(e);
      legs(ctx, e, C, -9, '#3a3a44', '#2a2a32');
      R(ctx, -5 + l, -19, 10, 11, C('#5a5a66'));
      R(ctx, -5 + l, -19, 10, 2, C('#7a7a88'));
      R(ctx, -4 + l, -26, 8, 8, C('#6a6a78'));
      R(ctx, -4 + l, -26, 8, 2, C('#8a8a98'));
      R(ctx, 0 + l, -23, 4, 1, C('#1a1a20'));
      eyes(ctx, 1 + l, -23, '#ff8040', e);
      // shield
      R(ctx, 5 + l, -20, 3, 13, C('#4a3a2a'));
      R(ctx, 7 + l, -20, 1, 13, C('#6a5a3a'));
      R(ctx, 5 + l, -15, 3, 2, C('#9a9aa4'));
      const ang = armAngle(e, 0.8);
      weaponAt(ctx, -2 + l, -17, ang, 11, (c, len) => { R(c, 0, -1, len, 2, C('#3a2a1a')); R(c, len - 3, -1, 3, 2, C('#6a6a74')); });
      trail(ctx, e, -2 + l, -17, 13);
    },
    hookhand(ctx, e, C) {
      const l = lean(e);
      legs(ctx, e, C, -8, '#3a4a5a', '#2a3a4a');

        { id: 'leap', w: 0.6, a: 1.2, r: 0.8, range: [80, 999], weight: 2, cd: 4, phase: 2 },

    }
    onActive(mv, p) {
      const m = mv.m;

        case 'slam': {

          G.fx.burst(this.cx + this.facing * 40, this.bottom, 18, { color: ['#a09080', '#ffd080'], speed: 180, life: 0.5, size: 2, angle: -Math.PI / 2, spread: 2.6, grav: 500 });

          if (this.phase >= 2) setTimeoutWorld(0.35, () => { for (const d of [1, -1]) G.world.add(new G.Proj({ x: this.cx + d * 30, y: this.bottom - 8, w: 12, h: 16, vx: d * 170, type: 'shock', team: 'enemy', dmg: this.dmg(0.5), life: 2, pierce: 99, color: '#ffd080' })); });
          break;
        }
        case 'sweep':
          G.Audio.play('swingHeavy');
          this.hit([-10, -44, 80, 44], 1.1, { knock: 300 });
          this.vx = this.facing * 120;
          break;
        case 'charge':
          mv.data.dir = this.facing;
          G.Audio.play('bossRoar', { vol: 0.5 });
          break;
        case 'toll': {
          G.Audio.play('toll');
          G.shake(0.4);
          G.fx.ring(this.cx, this.y + 10, 120, '#ffd080', 0.6, 4);
          G.fx.ring(this.cx, this.y + 10, 200, '#ffd080', 0.8, 2);
          const n = this.phase >= 2 ? 7 : 5;
          const pts = [p.cx];
          for (let i = 1; i < n; i++) pts.push(ar.x0 + 20 + G.rng.next() * (ar.x1 - ar.x0 - 40));
          pts.forEach((x, i) => G.world.add(new DropHazard(x, ar.floor, 22, 0.8 + i * 0.12, this.dmg(0.8), 'bell')));
          // ring shockwave on the ground
          for (const d of [1, -1]) G.world.add(new G.Proj({ x: this.cx + d * 30, y: this.bottom - 7, w: 12, h: 14, vx: d * 200, type: 'shock', team: 'enemy', dmg: this.dmg(0.5), life: 2.4, pierce: 99, color: '#ffd080' }));
          break;
        }
        case 'leap': {
          const t = 0.75;
          this.vx = (p.cx - this.cx) / t;
          this.vy = -GRAV * t / 2;
          mv.data.air = true;
          G.Audio.play('jump', { vol: 1 });
          this.onLand = () => {
            this.onLand = null;
            if (!this.mv || this.mv.m.id !== 'leap') return;
            this.vx = 0;
            G.shake(0.6);
            G.Audio.play('stomp');
            this.hit([-30, -40, 60, 42], 1.3, { knock: 260 });
            for (const d of [1, -1]) G.world.add(new G.Proj({ x: this.cx + d * 30, y: this.bottom - 8, w: 12, h: 16, vx: d * 260, type: 'shock', team: 'enemy', dmg: this.dmg(0.6), life: 1.6, pierce: 99, color: '#ffd080' }));
            G.fx.burst(this.cx, this.bottom, 24, { color: ['#a09080', '#ffd080'], speed: 200, life: 0.5, size: 2, angle: -Math.PI / 2, spread: 2.8, grav: 500 });
            this.mv.t = this.mv.m.a;
          };
          break;
        }
        case 'greatbell':
          G.Audio.play('toll');
          G.game.notify('[orange]The great bell breaks loose![]');
          G.world.add(new DropHazard(p.cx, ar.floor, 64, 1.3, this.dmg(2.2), 'bigbell'));
          break;
      }
    }
    moveWindup(mv, dt, p) {
      if (mv.m.id === 'charge' && Math.random() < 0.4) G.fx.spawn({ x: this.cx - this.facing * 20, y: this.bottom - 2, vx: -this.facing * 80, vy: -40, life: 0.3, color: '#ffd080', size: 1, type: 'spark' });
      if (mv.m.id === 'toll') this.vx = 0;
    }
    moveActive(mv, dt, p) {
      if (mv.m.id === 'charge') {
        this.vx = mv.data.dir * (this.phase >= 2 ? 420 : 360);
        if (Math.random() < 0.8) G.fx.spawn({ x: this.cx - mv.data.dir * 20, y: this.bottom - 2, vx: -mv.data.dir * 120, vy: -60, life: 0.3, color: '#ffd080', size: 1, type: 'spark' });
        if (!mv.data.hit && this.hit([4, -48, 30, 48], 1.2, { knock: 320 })) mv.data.hit = true;
        const ar = G.world.level.arena;
        if ((mv.data.dir > 0 && this.x + this.w >= ar.x1 - 2) || (mv.data.dir < 0 && this.x <= ar.x0 + 2)) {
          G.shake(0.6);
          G.Audio.play('toll', { vol: 0.6 });
          G.fx.burst(this.cx + mv.data.dir * 20, this.cy, 20, { color: '#c0b0a0', speed: 160, life: 0.5, size: 2 });
          this.vx = -mv.data.dir * 100;
          this.addStagger(this.def.stagger * 0.8);
          if (this.phase >= 2) for (let i = 0; i < 3; i++) G.world.add(new DropHazard(ar.x0 + 30 + G.rng.next() * (ar.x1 - ar.x0 - 60), ar.floor, 22, 0.6 + i * 0.2, this.dmg(0.8), 'bell'));
          return true;
        }
      }
      if (mv.m.id === 'leap' && this.onGround && mv.t > 0.2 && mv.data.air) return false;
      return false;
    }
    draw(ctx, cx, cy) {
      const x = Math.round(this.cx - cx), y = Math.round(this.bottom - cy);
      const flash = this.flashT > 0;
      const mv = this.mv;
      const tele = mv && mv.ph === 'w' && Math.floor(mv.t * 12) % 2 === 0;
      const C = flash ? () => '#ffffff' : tele ? (c) => G.mix(c, '#ff5040', 0.4) : (c) => c;
      const R = (a, b, w, h, c) => { ctx.fillStyle = C(c); ctx.fillRect(Math.round(a), Math.round(b), Math.round(w), Math.round(h)); };
      ctx.save();
      ctx.translate(x, y);
      if (this.state === 'dying') ctx.translate((Math.random() - 0.5) * 3, 0);
      ctx.scale(this.facing, 1);
      const walk = Math.abs(this.vx) > 10 && this.onGround ? Math.sin(this.animT * 8) : 0;
      let lean = 0, hamAng = 0.6;
      if (mv) {
        const id = mv.m.id, t = mv.ph === 'w' ? Math.min(1, mv.t / mv.m.w) : 1;
        if (id === 'slam') hamAng = mv.ph === 'w' ? G.lerp(0.6, -2.6, G.ease.outCubic(t)) : mv.ph === 'a' ? 1.3 : 1.2;
        if (id === 'sweep') hamAng = mv.ph === 'w' ? G.lerp(0.6, 2.8, t) : mv.ph === 'a' ? G.lerp(2.8, -0.2, Math.min(1, mv.t / 0.15)) : -0.2;
        if (id === 'charge') { hamAng = 2.4; lean = mv.ph === 'a' ? 6 : -2; }
        if (id === 'toll' || id === 'greatbell') hamAng = -1.6;
        if (id === 'leap') hamAng = -2.2;
        if (mv.ph === 'w' && id !== 'charge') lean = -t * 3;
      }
      if (this.staggered > 0) { lean = -4; hamAng = 1.6; }
      // legs
      R(-12 + walk * 3, -16, 8, 16, '#3a3440');
      R(4 - walk * 3, -16, 8, 16, '#4a4450');
      R(-13 + walk * 3, -3, 10, 3, '#2a2430');
      R(3 - walk * 3, -3, 10, 3, '#2a2430');
      // torso
      R(-16 + lean, -40, 32, 26, '#5a5060');
      R(-16 + lean, -40, 32, 4, '#8a8090');
      R(-16 + lean, -22, 32, 3, '#b08a4a');
      R(-10 + lean, -34, 20, 10, '#6a6070');
      R(-2 + lean, -34, 4, 12, '#b08a4a');
      // pauldrons
      R(-20 + lean, -42, 10, 8, '#7a7080');
      R(12 + lean, -42, 10, 8, '#7a7080');
      // bell head
      ctx.fillStyle = C('#9a7a3a');
      ctx.beginPath();
      ctx.moveTo(-8 + lean, -60);
      ctx.lineTo(8 + lean, -60);
      ctx.lineTo(13 + lean, -42);
      ctx.lineTo(-13 + lean, -42);
      ctx.fill();
      R(-14 + lean, -44, 28, 4, '#c8a050');
      R(-3 + lean, -64, 6, 4, '#7a5a2a');
      R(-6 + lean, -54, 12, 3, '#1a1008');
      const eye = this.phase >= 2 ? '#ff5030' : '#ffd060';
      R(-4 + lean, -53, 3, 1, eye);
      R(2 + lean, -53, 3, 1, eye);
      G.addLight(this.cx, this.y + 8, 60, eye, 0.8);
      // arm + hammer
      const sx = 10 + lean, sy = -36;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(hamAng);
      R(0, -3, 12, 6, '#5a5060');
      R(10, -2, 30, 4, '#5a4030');
      R(36, -9, 14, 18, '#8a6a30');
      R(36, -9, 14, 3, '#c8a050');
      R(48, -7, 3, 14, '#6a5020');
      ctx.restore();
      if (mv && mv.ph === 'a' && (mv.m.id === 'slam' || mv.m.id === 'sweep') && mv.t < 0.2) {
        ctx.globalAlpha = 0.4;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(sx, sy, 44, mv.m.id === 'slam' ? -2.6 : -0.2, mv.m.id === 'slam' ? 1.3 : 2.8);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
      if (this.staggered > 0) for (let i = 0; i < 4; i++) { const a = this.animT * 5 + (i / 4) * Math.PI * 2; ctx.fillStyle = '#ffe060'; ctx.fillRect(Math.round(x + Math.cos(a) * 14), Math.round(this.y - cy - 12 + Math.sin(a) * 3), 2, 2); }
      if (mv && mv.ph === 'w') G.text(ctx, '!', x, Math.round(this.y - cy) - 26, '#ff4030', { align: 'center', outline: '#000', scale: 2 });
    }
  }

  // ================================================================ MOTHER BRINE
  class MotherBrine extends Boss {
    constructor(x, y) {
      super('motherbrine', x, y);
      this.blood = '#e080b0';
      this.baseY = y - 60;
      this.y = this.baseY - this.h;
      this.moves = [
        { id: 'tentacles', w: 0.5, a: 1.6, r: 0.6, range: [0, 999], weight: 3, cd: 2.5 },
        { id: 'bubbles', w: 0.7, a: 0.9, r: 0.7, range: [0, 999], weight: 2.5, cd: 3 },
        { id: 'sweep', w: 0.5, a: 1.6, r: 0.5, range: [0, 999], weight: 2, cd: 5 },
        { id: 'summon', w: 0.8, a: 0.3, r: 0.8, range: [0, 999], weight: 1, cd: 12 },
        { id: 'beam', w: 1.2, a: 0.7, r: 0.8, range: [0, 999], weight: 2, cd: 6, phase: 2 },
        { id: 'flood', w: 0.8, a: 0.4, r: 0.4, range: [0, 999], weight: 1.5, cd: 14, phase: 2 },
      ];
    }
    hurtbox() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
    physics(dt) {
      const p = this.player();
      const ar = G.world.level.arena;
      if (!ar) return;
      if (this.state === 'fight' && p && !(this.mv && this.mv.m.id === 'beam')) {
        const tx = G.clamp(p.cx, ar.x0 + 80, ar.x1 - 80);
        this.vx = G.approach(this.vx, G.clamp((tx - this.cx) * 0.8, -50, 50), 60 * dt);
      } else this.vx *= 0.95;
      this.x += this.vx * dt;
      const bob = Math.sin(this.animT * 1.4) * 8;
      const dip = this.staggered > 0 ? 36 : 0;
      this.y = G.lerp(this.y, this.baseY - this.h + bob + dip, 1 - Math.pow(0.02, dt));
      this.x = G.clamp(this.x, ar.x0 + 20, ar.x1 - this.w - 20);
      this.facing = p ? Math.sign(p.cx - this.cx) || 1 : 1;
      // contact damage
      if (p && this.state === 'fight' && G.rectsOverlap(this.x + 6, this.y + 6, this.w - 12, this.h - 12, p.x, p.y, p.w, p.h)) p.takeHit({ dmg: this.dmg(0.6), team: 'enemy', kind: 'contact', x: this.cx, dir: Math.sign(p.cx - this.cx) || 1, knock: 220, src: this });
    }
    idleMove() {}
    onActive(mv, p) {
      const ar = G.world.level.arena;
      switch (mv.m.id) {
        case 'tentacles': {
          const n = this.phase >= 2 ? 6 : 4;
          const xs = [p.cx];
          for (let i = 1; i < n; i++) xs.push(G.clamp(p.cx + (G.rng.next() - 0.5) * 360, ar.x0 + 12, ar.x1 - 12));
          xs.forEach((x, i) => G.world.add(new Tentacle(x, ar.floor, 0.75 + i * 0.12, this.dmg(0.9))));
          G.Audio.play('bubble');
          break;
        }
        case 'bubbles': {
          const n = this.phase >= 2 ? 7 : 5;
          for (let i = 0; i < n; i++) {
            const tx = p.cx + (i - (n - 1) / 2) * 34;
            const t = 1.0 + i * 0.04;
            const sx = this.cx, sy = this.y + this.h - 10;
            G.world.add(new G.Proj({ x: sx, y: sy, w: 8, h: 8, vx: (tx - sx) / t, vy: (ar.floor - 6 - sy - 0.5 * 500 * t * t) / t, grav: 500, type: 'bubble', team: 'enemy', dmg: this.dmg(0.7), life: 3, puddle: 'brine', color: '#a0e0ff' }));
          }
          G.Audio.play('bubble');
          G.Audio.play('splash');
          break;
        }
        case 'sweep':
          G.world.add(new Sweep(ar, p.cx > (ar.x0 + ar.x1) / 2 ? 1 : -1, this.dmg(1)));
          if (this.phase >= 2) setTimeoutWorld(1.1, () => G.world.add(new Sweep(ar, G.rng.sign(), this.dmg(1))));
          G.Audio.play('scream', { vol: 0.5 });
          break;
        case 'summon':
          for (const s of [-1, 1]) {
            const m = G.world.add(new G.Enemy('slime', G.clamp(this.cx + s * 60, ar.x0 + 20, ar.x1 - 20), ar.floor, { tier: this.def.tier || 4 }));
            m.aggro = true;
          }
          G.Audio.play('splash');
          break;
        case 'beam':
          mv.data.fire = true;
          G.Audio.play('lightning');
          G.shake(0.4);
          break;
        case 'flood':
          G.world.add(new Flood(ar, 6, this.dmg(1)));
          G.game.notify('[teal]The brine rises! Get to higher ground![]');
          G.Audio.play('scream');
          break;
      }
    }
    moveWindup(mv, dt, p) {
      if (mv.m.id === 'beam') {
        mv.data.ax = G.lerp(mv.data.ax === undefined ? p.cx : mv.data.ax, p.cx, mv.t < mv.m.w - 0.3 ? 0.08 : 0);
        mv.data.ay = G.lerp(mv.data.ay === undefined ? p.cy : mv.data.ay, p.cy, mv.t < mv.m.w - 0.3 ? 0.08 : 0);
      }
    }
    moveActive(mv, dt, p) {
      if (mv.m.id === 'beam' && mv.data.fire) {
        const sx = this.cx, sy = this.y + this.h * 0.55;
        const ang = Math.atan2(mv.data.ay - sy, mv.data.ax - sx);
        mv.data.ang = ang;
        // extend beam to far
        const ex = sx + Math.cos(ang) * 700, ey = sy + Math.sin(ang) * 700;
        mv.data.ex = ex; mv.data.ey = ey;
        if (!mv.data.hit && p) {
          // distance from player centre to segment
          const vx = ex - sx, vy = ey - sy, wx = p.cx - sx, wy = p.cy - sy;
          const t = G.clamp((wx * vx + wy * vy) / (vx * vx + vy * vy), 0, 1);
          const d = Math.hypot(sx + vx * t - p.cx, sy + vy * t - p.cy);
          if (d < 12) { mv.data.hit = true; p.takeHit({ dmg: this.dmg(1.3), team: 'enemy', kind: 'beam', x: sx, dir: Math.sign(p.cx - sx) || 1, knock: 260, unblockable: true }); }
        }
        if (Math.random() < 0.8) {
          const r = Math.random();
          G.fx.spawn({ x: sx + (ex - sx) * r * 0.5, y: sy + (ey - sy) * r * 0.5, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60, life: 0.3, color: '#ffc0e0', size: 2, add: true });
        }
      }
      return false;
    }
    cleanupMove() {}
    draw(ctx, cx, cy) {
      const x = Math.round(this.cx - cx), y = Math.round(this.y - cy);
      const flash = this.flashT > 0;
      const mv = this.mv;
      const tele = mv && mv.ph === 'w' && Math.floor(mv.t * 10) % 2 === 0;
      const C = flash ? () => '#ffffff' : tele ? (c) => G.mix(c, '#ff5070', 0.35) : (c) => c;
      const t = this.animT;
      // trailing tentacles
      for (let i = 0; i < 7; i++) {
        const bx = x - 30 + i * 10;
        for (let k = 0; k < 14; k++) {
          const yy = y + this.h - 6 + k * 5;
          const xx = bx + Math.sin(t * 2 + i + k * 0.4) * (2 + k * 0.7);
          ctx.fillStyle = C(k % 3 ? '#7a3060' : '#9a4a80');
          ctx.fillRect(Math.round(xx), Math.round(yy), Math.max(1, 4 - k * 0.25), 5);
        }
      }
      // bell of the jellyfish
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = C('#6a2a58');
      ctx.beginPath();
      ctx.ellipse(x, y + 18, 46, 38, 0, Math.PI, 0);
      ctx.lineTo(x + 46, y + 30);
      ctx.lineTo(x - 46, y + 30);
      ctx.fill();
      ctx.fillStyle = C('#8a3a78');
      ctx.beginPath();
      ctx.ellipse(x, y + 14, 36, 28, 0, Math.PI, 0);
      ctx.fill();
      ctx.globalAlpha = 1;
      for (let i = 0; i < 8; i++) { ctx.fillStyle = C('#f0a0d0'); ctx.fillRect(x - 40 + i * 11, y + 26 + Math.round(Math.sin(t * 3 + i) * 2), 4, 4); }
      // glowing organs
      const pulse = Math.sin(t * 3) * 0.5 + 0.5;
      G.addLight(this.cx, this.y + 10, 160 + pulse * 30, '#ff80c0', 1);
      ctx.fillStyle = C('#ff90c8');
      ctx.fillRect(x - 14, y - 6, 6, 6);
      ctx.fillRect(x + 8, y - 10, 5, 5);
      // the face (Ilyse's)
      const fy = y + 20;
      ctx.fillStyle = C('#e8d8e8');
      ctx.fillRect(x - 9, fy, 18, 20);
      ctx.fillRect(x - 7, fy + 20, 14, 3);
      ctx.fillStyle = C('#f0e8ff');
      ctx.fillRect(x - 11, fy - 2, 22, 4);
      ctx.fillRect(x - 12, fy, 3, 16);
      ctx.fillRect(x + 9, fy, 3, 16);
      const eyeC = this.phase >= 2 ? '#ff3080' : '#40d0ff';
      ctx.fillStyle = '#1a0a1a';
      ctx.fillRect(x - 6, fy + 7, 4, 2);
      ctx.fillRect(x + 2, fy + 7, 4, 2);
      ctx.fillStyle = eyeC;
      ctx.fillRect(x - 5, fy + 7, 2, 1);
      ctx.fillRect(x + 3, fy + 7, 2, 1);
      const open = mv && (mv.m.id === 'beam' || mv.m.id === 'bubbles') ? 4 : 1;
      ctx.fillStyle = '#2a0a1a';
      ctx.fillRect(x - 2, fy + 14, 4, open);
      // tears
      ctx.fillStyle = '#a0e0ff';
      ctx.fillRect(x - 5, fy + 10 + Math.round((t * 10) % 8), 1, 2);
      ctx.fillRect(x + 4, fy + 10 + Math.round((t * 10 + 4) % 8), 1, 2);
      // crown remnant
      ctx.fillStyle = C('#c0a050');
      ctx.fillRect(x - 8, fy - 5, 16, 2);
      ctx.fillRect(x - 8, fy - 8, 2, 3);
      ctx.fillRect(x - 1, fy - 9, 2, 4);
      ctx.fillRect(x + 6, fy - 8, 2, 3);
      // beam
      if (mv && mv.m.id === 'beam') {
        const sx = x, sy = Math.round(this.y + this.h * 0.55 - cy);
        if (mv.ph === 'w' && mv.data.ax !== undefined) {
          ctx.globalAlpha = 0.3 + (mv.t / mv.m.w) * 0.5;
          G.pixLine(ctx, sx, sy, mv.data.ax - cx, mv.data.ay - cy, mv.t > mv.m.w - 0.3 ? '#ffffff' : '#ff4080');
          ctx.globalAlpha = 1;
        } else if (mv.ph === 'a' && mv.data.ex !== undefined) {
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = '#ff80c0';
          ctx.lineWidth = 10;
          ctx.globalAlpha = 0.5;
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(mv.data.ex - cx, mv.data.ey - cy); ctx.stroke();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.globalAlpha = 1;
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(mv.data.ex - cx, mv.data.ey - cy); ctx.stroke();
          ctx.globalCompositeOperation = 'source-over';
          G.addLight((this.cx + mv.data.ex) / 2, (this.cy + mv.data.ey) / 2, 200, '#ff80c0', 1);
        }
      }
      if (this.staggered > 0) G.text(ctx, '* * *', x, y - 20, '#ffe060', { align: 'center', outline: '#000' });
    }
  }

  // ================================================================ KING ORIS
  class Oris extends Boss {
    constructor(x, y) {
      super('oris', x, y);
      this.blood = '#6a9ab8';

        { id: 'leapslam', w: 0.5, a: 1.3, r: 0.7, range: [60, 999], weight: 2, cd: 4 },
        { id: 'crown', w: 0.5, a: 1.6, r: 0.4, range: [100, 999], weight: 1.8, cd: 5 },
        { id: 'wave', w: 0.8, a: 0.5, r: 0.8, range: [0, 999], weight: 2, cd: 6, phase: 2 },
        { id: 'swords', w: 0.6, a: 0.6, r: 0.6, range: [0, 999], weight: 2, cd: 7, phase: 2 },
        { id: 'puddle', w: 0.4, a: 0.8, r: 0.1, range: [0, 999], weight: 1.8, cd: 5, phase: 2 },
        { id: 'undertow', w: 0.8, a: 2.6, r: 0.9, range: [0, 999], weight: 2, cd: 10, phase: 3 },

    }
    onPhase(ph) {

        G.game.darkPhase = true;

    }
    onActive(mv, p) {
      const ar = G.world.level.arena;
      switch (mv.m.id) {
        case 'combo': mv.data.k = 0; mv.data.next = 0; break;
        case 'thrust':
          this.vx = this.facing * (this.phase >= 3 ? 520 : 440);

          break;
        case 'leapslam': {

          G.Audio.play('throw');
          break;
        case 'wave': {
          const dir = p.cx > this.cx ? 1 : -1;
          const sx = dir > 0 ? ar.x0 + 10 : ar.x1 - 10;
          G.world.add(new G.Proj({ x: sx, y: ar.floor - 22, w: 26, h: 44, vx: dir * 300, type: 'wave', team: 'enemy', dmg: this.dmg(1.1), life: 3, pierce: 99 }));
          if (this.phase >= 3) setTimeoutWorld(0.9, () => G.world.add(new G.Proj({ x: dir > 0 ? ar.x1 - 10 : ar.x0 + 10, y: ar.floor - 22, w: 26, h: 44, vx: -dir * 300, type: 'wave', team: 'enemy', dmg: this.dmg(1.1), life: 3, pierce: 99 })));
          G.Audio.play('splash');
          G.shake(0.3);
          break;
        }
        case 'swords': {
          const n = this.phase >= 3 ? 7 : 5;
          for (let i = 0; i < n; i++) G.world.add(new DropHazard(G.clamp(p.cx + (i - (n - 1) / 2) * 44 + (G.rng.next() - 0.5) * 16, ar.x0 + 10, ar.x1 - 10), ar.floor, 14, 0.7 + i * 0.1, this.dmg(0.9), 'sword'));
          G.Audio.play('magic');
          break;
        }
        case 'puddle':
          this.hidden = true;
          mv.data.target = p;
          G.fx.burst(this.cx, this.bottom, 20, { color: ['#3a7a90', '#a0e0f0'], speed: 100, life: 0.5, size: 2, grav: 300 });

        case 'undertow':

          G.Audio.play('swingHeavy');

      }
    }
    moveActive(mv, dt, p) {
      const id = mv.m.id;
      if (id === 'combo') {
        // three quick slashes
        if (mv.t >= mv.data.next && mv.data.k < 3) {
          mv.data.k++;
          mv.data.next = mv.t + (this.phase >= 3 ? 0.26 : 0.32);
          mv.data.hit = false;
          this.facing = Math.sign(p.cx - this.cx) || this.facing;
          this.vx = this.facing * 160;
          G.Audio.play('swing');
        }
        this.vx = G.approach(this.vx, 0, 900 * dt);
        if (!mv.data.hit && mv.t < mv.data.next - 0.12 && this.hit([0, -40, 44, 42], 0.8, { knock: 180 })) mv.data.hit = true;
        return mv.data.k >= 3 && mv.t >= mv.data.next;
      }
      if (id === 'thrust') {
        if (!mv.data.hit && this.hit([4, -30, 30, 16], 1.3, { knock: 260 })) mv.data.hit = true;
        if (Math.random() < 0.7) G.fx.spawn({ x: this.cx, y: this.cy, vx: -this.vx * 0.2, life: 0.25, color: '#a0e0ff', size: 2, add: true });
        this.vx = G.approach(this.vx, 0, 700 * dt);
      }
      if (id === 'puddle') {
        if (mv.t > 0.6 && this.hidden) {
          this.hidden = false;
          const side = -(p.facing || 1);
          const ar = G.world.level.arena;
          this.x = G.clamp(p.cx + side * 34 - this.w / 2, ar.x0, ar.x1 - this.w);
          this.y = p.bottom - this.h;
          this.facing = Math.sign(p.cx - this.cx) || 1;
          G.fx.burst(this.cx, this.bottom, 20, { color: ['#3a7a90', '#a0e0f0'], speed: 100, life: 0.5, size: 2, grav: 300 });

          const a = this.animT * 4 + (i / 4) * Math.PI * 2;
          const bx = this.cx + Math.cos(a) * 52, by = this.cy + Math.sin(a) * 30;
          if (Math.random() < 0.3) G.fx.spawn({ x: bx, y: by, life: 0.2, color: '#80c0ff', size: 2, add: true });
          if (mv.data.hitT <= 0 && Math.hypot(p.cx - bx, p.cy - by) < 12) { mv.data.hitT = 0.5; p.takeHit({ dmg: this.dmg(0.7), team: 'enemy', kind: 'blade', x: bx, dir: Math.sign(p.cx - bx) || 1, knock: 160 }); }
        }
        if (Math.random() < 0.5) G.fx.spawn({ x: p.cx + Math.sign(-d) * 30 + (Math.random() - 0.5) * 20, y: p.bottom - 4, vx: Math.sign(d) * 120, life: 0.3, color: '#6ad0e0', size: 1 });
      }
      if (id === 'whirl') {
        const k = Math.floor(mv.t / 0.27);
        if (k !== mv.data.k) { mv.data.k = k; mv.data.hit = false; G.Audio.play('swingHeavy', { vol: 0.6 }); }
        this.vx = Math.sign(p.cx - this.cx) * 120;
        if (!mv.data.hit && this.hit({ x: this.cx - 40, y: this.bottom - 44, w: 80, h: 46 }, 0.7, { knock: 200 })) mv.data.hit = true;
      }
      return false;
    }
    cleanupMove() { this.hidden = false; }
    draw(ctx, cx, cy) {
      if (this.hidden) {
        const x = Math.round(this.cx - cx), y = Math.round(this.bottom - cy);
        ctx.fillStyle = '#2a6a80';
        ctx.fillRect(x - 12, y - 2, 24, 2);
        return;
      }
      const x = Math.round(this.cx - cx), y = Math.round(this.bottom - cy);
      const flash = this.flashT > 0;
      const mv = this.mv;
      const tele = mv && mv.ph === 'w' && Math.floor(mv.t * 12) % 2 === 0;
      const C = flash ? () => '#ffffff' : tele ? (c) => G.mix(c, '#ff5040', 0.4) : (c) => c;
      const R = (a, b, w, h, c) => { ctx.fillStyle = C(c); ctx.fillRect(Math.round(a), Math.round(b), Math.round(w), Math.round(h)); };

      ctx.scale(this.facing, 1);

        const id = mv.m.id, t = mv.ph === 'w' ? Math.min(1, mv.t / mv.m.w) : 0;
        if (id === 'combo') swAng = mv.ph === 'w' ? G.lerp(0.9, -2.2, t) : mv.ph === 'a' ? (mv.data.k % 2 ? -1.8 : 1.1) : 1;
        if (id === 'thrust') { swAng = 0; lean = mv.ph === 'a' ? 5 : -3 * t; }
        if (id === 'leapslam') swAng = -2.4;
        if (id === 'wave' || id === 'swords' || id === 'undertow') swAng = -1.57;
        if (id === 'whirl' && mv.ph === 'a') swAng = this.animT * 20;
        if (id === 'crown') swAng = 0.9;
      }
      if (this.staggered > 0) { lean = -3; swAng = 1.4; }
      // cape
      const capeSw = Math.sin(this.animT * 3) * 2 - G.clamp(this.vx / 60, -4, 4);
      R(-10 - capeSw, -32, 8, 30, '#1a2a4a');
      R(-12 - capeSw * 1.4, -8, 6, 8, '#1a2a4a');
      // legs
      R(-5 + walk * 3, -14, 4, 14, '#2a3040');
      R(1 - walk * 3, -14, 4, 14, '#3a4050');
      // body
      R(-7 + lean, -30, 14, 17, '#3a4a6a');
      R(-7 + lean, -30, 14, 3, '#6a7a9a');
      R(-7 + lean, -17, 14, 2, '#c0a050');
      R(-2 + lean, -28, 4, 10, '#c0a050');
      // head
      R(-5 + lean, -38, 10, 9, '#8aa0b0');
      R(-5 + lean, -38, 10, 2, '#a0b8c8');
      R(0 + lean, -34, 3, 1, '#0a1020');
      const eye = this.phase >= 3 ? '#ff4040' : '#a0e0ff';
      R(1 + lean, -34, 2, 1, eye);
      G.addLight(this.cx, this.y + 4, 40, eye, 0.6);
      R(-5 + lean, -30, 3, 6, '#6a8090');
      // crown (if not thrown)
      if (!(mv && mv.m.id === 'crown' && mv.ph !== 'w')) {
        R(-6 + lean, -41, 12, 3, '#d8b050');
        R(-6 + lean, -44, 2, 3, '#d8b050');
        R(-1 + lean, -45, 2, 4, '#d8b050');
        R(4 + lean, -44, 2, 3, '#d8b050');
        R(-1 + lean, -43, 2, 1, '#ff4060');
      }
      // dripping brine
      if (Math.random() < 0.2) G.fx.spawn({ x: this.cx + (Math.random() - 0.5) * 10, y: this.y + 4, vy: 30, grav: 400, life: 0.5, color: '#6ad0e0', size: 1 });
      // greatsword
      ctx.save();
      ctx.translate(4 + lean, -27);
      ctx.rotate(swAng);
      R(0, -2, 5, 4, '#3a4a6a');
      R(4, -2, 4, 4, '#2a2020');
      R(8, -5, 2, 10, '#d8b050');
      R(10, -2, 28, 4, '#90b8d0');
      R(10, -2, 28, 1, '#e0f8ff');
      R(38, -1, 3, 2, '#90b8d0');
      ctx.restore();
      if (mv && mv.ph === 'a' && (mv.m.id === 'combo' || mv.m.id === 'whirl')) {
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = '#c0f0ff';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(4, -27, 40, mv.m.id === 'whirl' ? 0 : -2.2, mv.m.id === 'whirl' ? Math.PI * 2 : 1.1);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
      if (mv && mv.m.id === 'undertow' && mv.ph === 'a') {
        for (let i = 0; i < 4; i++) {
          const a = this.animT * 4 + (i / 4) * Math.PI * 2;
          const bx = Math.round(this.cx + Math.cos(a) * 52 - cx), by = Math.round(this.cy + Math.sin(a) * 30 - cy);
          ctx.fillStyle = '#80c0ff'; ctx.fillRect(bx - 1, by - 6, 3, 12);
          ctx.fillStyle = '#ffffff'; ctx.fillRect(bx - 1, by - 6, 1, 10);
        }
      }
      if (this.staggered > 0) for (let i = 0; i < 3; i++) { const a = this.animT * 6 + (i / 3) * Math.PI * 2; ctx.fillStyle = '#ffe060'; ctx.fillRect(Math.round(x + Math.cos(a) * 9), Math.round(this.y - cy - 10 + Math.sin(a) * 2), 2, 2); }
      if (mv && mv.ph === 'w') G.text(ctx, '!', x, Math.round(this.y - cy) - 22, mv.m.w >= 0.6 ? '#ff4030' : '#ffb040', { align: 'center', outline: '#000', scale: 2 });
    }
  }

  class CrownProj extends G.Entity {
    constructor(owner, p, dmg) {
      super(owner.cx - 6, owner.y - 4, 12, 8);
      this.owner = owner;
      this.dmg = dmg;
      this.t = 0;
      this.layer = 5;
      this.bossHazard = true;
      this.alwaysDraw = true;
      const ang = Math.atan2(p.cy - this.cy, p.cx - this.cx);
      this.vx = Math.cos(ang) * 360;
      this.vy = Math.sin(ang) * 360;
      this.hitT = 0;
    }
    update(dt) {
      this.t += dt;
      this.hitT -= dt;
      const o = this.owner;
      if (this.t > 0.6) {
        const a = Math.atan2(o.cy - 20 - this.cy, o.cx - this.cx);
        const sp = Math.min(460, Math.hypot(this.vx, this.vy) + 800 * dt);
        this.vx = G.lerp(this.vx, Math.cos(a) * sp, 0.1);
        this.vy = G.lerp(this.vy, Math.sin(a) * sp, 0.1);
        if (Math.hypot(o.cx - this.cx, o.cy - 20 - this.cy) < 16 || this.t > 2.4) return G.world.kill(this);
      } else { this.vx *= Math.pow(0.3, dt); this.vy *= Math.pow(0.3, dt); }
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      const p = G.world.player;
      if (p && this.hitT <= 0 && G.overlap(this, p)) { this.hitT = 0.5; p.takeHit({ dmg: this.dmg, team: 'enemy', kind: 'ranged', x: this.cx, dir: Math.sign(this.vx) || 1, knock: 150, proj: null }); }
      G.fx.spawn({ x: this.cx, y: this.cy, life: 0.2, color: '#ffd060', size: 2, add: true });
      G.addLight(this.cx, this.cy, 50, '#ffd060', 0.8);
    }
    draw(ctx, cx, cy) {
      ctx.save();
      ctx.translate(Math.round(this.cx - cx), Math.round(this.cy - cy));
      ctx.rotate(this.t * 14);
      ctx.fillStyle = '#d8b050';
      ctx.fillRect(-6, -1, 12, 3);
      ctx.fillRect(-6, -4, 2, 3);
      ctx.fillRect(-1, -5, 2, 4);
      ctx.fillRect(4, -4, 2, 3);
      ctx.restore();
    }
  }

  // delayed callbacks in world time
  class Timer extends G.Entity {
    constructor(t, fn) { super(0, 0, 1, 1); this.t = t; this.fn = fn; this.bossHazard = true; }
    update(dt) { this.t -= dt; if (this.t <= 0) { G.world.kill(this); this.fn(); } }
    draw() {}
  }
  function setTimeoutWorld(t, fn) { G.world.add(new Timer(t, fn)); }
  G.setTimeoutWorld = setTimeoutWorld;

  G.makeBoss = (id, x, y) => {
    if (id === 'bellwarden') return new Bellwarden(x, y);
    if (id === 'motherbrine') return new MotherBrine(x, y);
    return new Oris(x, y);
  };
})();

<script>
'use strict';

(function () {

    { name: 'Sun', color: '#ffd24a' },

    update(dt) {

  // ------------------------------------------------------------------ chest
  class Chest extends Obj {
    constructor(x, y, o) {
      super(x, y, 20, 14);
      this.o = o || {};
      this.cursed = !!this.o.cursed;
      this.opened = false;
      this.age = 0;
      this.mapIcon = this.cursed ? 'cursed' : 'chest';
    }
    prompt() { return this.opened ? null : this.cursed ? '[purple]Open Cursed Chest[]' : 'Open'; }
    interact(p) {
      if (this.opened) return;
      if (this.cursed && !this.confirming) {
        this.confirming = true;
        G.ui.confirm(G.DIALOGUE.cursedChest[0][1] + '\n\nOpen it anyway?', (yes) => { this.confirming = false; if (yes) this.open(p); });
        return;
      }
      this.open(p);
    }
    open(p) {
      this.opened = true;
      this.mapIcon = null;
      const tier = W().level.tier || 1;
      G.Audio.play('chest');
      G.fx.burst(this.cx, this.y, 20, { color: ['#ffd24a', '#ffffff'], speed: 120, life: 0.6, size: 2, add: true, angle: -Math.PI / 2, spread: 1.6 });
      const bonus = (this.o.bonus || 0) + (this.cursed ? 0.8 : 0);
      if (!this.o.small || G.rng.chance(0.5)) {
        const inst = G.makeItem(G.rng.pick(G.itemPool()), tier, G.rng, { bonus });
        W().add(new ItemDrop(this.cx, this.y, inst, { pop: true }));
      }
      G.spawnGold(this.cx, this.y, (20 + tier * 18) * (this.cursed ? 3 : 1) * (this.o.small ? 0.5 : 1) * (p.hasMut('greed') ? 1.6 : 1));
      if (this.o.rune || this.cursed) G.spawnEmbers(this.cx, this.y, 4 + G.rng.int(0, 6));
      if (G.rng.chance(this.o.rune ? 0.45 : this.cursed ? 0.4 : 0.15)) {
        const locked = Object.keys(G.ITEMS).filter((id) => G.ITEMS[id].bp && !G.ITEMS[id].bossItem && G.ITEMS[id].bp.from !== 'guardian' && !G.save.bpFound[id] && !G.save.unlocked[id]);
        if (locked.length) W().add(new BlueprintDrop(this.cx, this.y - 4, G.rng.pick(locked)));
      }
      if (this.cursed) {
        p.curse = Math.max(p.curse, 8 + tier * 2);
        G.Audio.play('curse');
        G.screenFlash('#8030c0', 0.6, 0.5);
        G.game.notify('[purple]Cursed![] Any hit will kill you. Slay ' + p.curse + ' foes to lift it.');
      }
      G.game.stats.chests++;
    }
    update(dt) { this.age += dt; }
    draw(ctx, cx, cy) {
      const x = Math.round(this.x - cx), y = Math.round(this.y - cy);
      const wood = this.cursed ? '#3a2a40' : '#7a5030', band = this.cursed ? '#8a40c0' : '#c0a050';
      ctx.fillStyle = G.shade(wood, -0.3);
      ctx.fillRect(x, y + 5, 20, 9);
      ctx.fillStyle = wood;
      ctx.fillRect(x + 1, y + 6, 18, 7);
      if (this.opened) {
        ctx.fillStyle = wood;
        ctx.fillRect(x, y - 2, 20, 4);
        ctx.fillStyle = '#1a1008';
        ctx.fillRect(x + 1, y + 5, 18, 2);
      } else {
        ctx.fillStyle = wood;
        ctx.fillRect(x, y, 20, 6);
        ctx.fillStyle = G.shade(wood, 0.2);
        ctx.fillRect(x + 1, y, 18, 1);
        ctx.fillStyle = band;
        ctx.fillRect(x + 3, y, 2, 14);
        ctx.fillRect(x + 15, y, 2, 14);
        ctx.fillRect(x + 8, y + 4, 4, 4);
        ctx.fillStyle = '#1a1008';
        ctx.fillRect(x + 9, y + 6, 2, 1);
        if (this.cursed) {
          for (let i = 0; i < 2; i++) { ctx.fillStyle = '#5a5060'; ctx.fillRect(x - 1, y + 3 + i * 5, 22, 1); }
          if (Math.random() < 0.2) G.fx.spawn({ x: this.x + Math.random() * 20, y: this.y + 4, vy: -20, life: 0.8, color: '#a050ff', size: 2, size2: 0, add: true });
          G.addLight(this.cx, this.cy, 50, '#a050ff', 0.8);
        } else G.addLight(this.cx, this.cy, 30, '#ffd070', 0.4);
      }
    }
  }

    constructor(x, y, o) { super(x, y, 14, 12); this.o = o; this.grown = false; this.age = 0; this.mapIcon = 'seed'; }

    interact(p) {
      if (this.grown) return;
      if (!G.save.runes.vine) { G.game.say(G.DIALOGUE.seedNoRune); return; }

      this.mapIcon = null;
      this.growT = 0;
      this.growY = this.o.ty0;
      G.Audio.play('vine');

    update(dt) {
      this.age += dt;
      if (this.grown && this.growY >= this.o.ty1) {
        this.growT += dt;
        while (this.growT > 0.035 && this.growY >= this.o.ty1) {
          this.growT -= 0.035;
          const L = W().level;
          L.set(this.o.tx, this.growY, G.T.VINE);
          G.fx.burst(this.o.tx * TS + 8, this.growY * TS + 8, 3, { color: ['#5fae4a', '#8ae070'], speed: 50, life: 0.4, size: 1 });
          this.growY--;
        }
      }
    }
    draw(ctx, cx, cy) {
      const x = Math.round(this.x - cx), y = Math.round(this.bottom - cy);
      ctx.fillStyle = this.grown ? '#4f9a3a' : '#5a4a3a';
      ctx.fillRect(x + 3, y - 8, 8, 8);

  // ------------------------------------------------------------------ gates & puzzles
  class Gate extends G.Entity {
    constructor(x, y, h, o) {
      super(x - 4, y - h, 8, h);
      this.o = o || {};
      this.id = this.o.id;
      this.solid = true;
      this.canBeSolid = true;
      this.openAmt = 0;
      this.layer = 1;
      this.fullH = h;
      this.kind = this.o.kind;
      this.mapIcon = this.kind && this.kind !== 'boss' ? 'vault' : null;
      if (this.kind === 'timed' && G.game.runTime < (this.o.limit || 0)) { this.isOpen = true; this.openAmt = 1; }
    }
    setOpen(v) {
      if (this.isOpen === v) return;
      this.isOpen = v;
      G.Audio.play(v ? 'door' : 'lever', { x: this.cx });
      if (v && this.kind && this.kind !== 'boss' && this.kind !== 'crate' && this.kind !== 'timed' && !this.solvedOnce) {
        this.solvedOnce = true;
        G.Audio.play('solved');
        G.game.notify('[yellow]The vault seal opens.[]');
        G.game.stats.puzzles++;
        this.mapIcon = null;
      }
    }
    update(dt) {
      if (this.kind === 'timed') {
        const lim = this.o.limit || 0;
        this.setOpen(G.game.runTime < lim);
      }
      this.openAmt = G.approach(this.openAmt, this.isOpen ? 1 : 0, dt * 2.5);
      this.solid = this.openAmt < 0.8;
    }
    draw(ctx, cx, cy) {
      const x = Math.round(this.x - cx), y = Math.round(this.y - cy);
      const vis = Math.round(this.fullH * (1 - this.openAmt));
      ctx.fillStyle = '#2a2a30';
      ctx.fillRect(x - 2, y - 3, 12, 3);
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = '#5a5a66';
        ctx.fillRect(x + i * 3, y, 2, vis);
        ctx.fillStyle = '#8a8a96';
        ctx.fillRect(x + i * 3, y, 1, vis);
      }
      ctx.fillStyle = '#4a4a56';
      for (let yy = 6; yy < vis; yy += 12) ctx.fillRect(x - 1, y + yy, 10, 2);
      if (vis > 2) { ctx.fillStyle = '#9a9aa6'; ctx.fillRect(x - 1, y + vis - 3, 10, 3); }
      if (this.kind === 'timed') {
        const left = (this.o.limit || 0) - G.game.runTime;
        G.text(ctx, left > 0 ? G.fmtTime(left) : 'SEALED', x + 4, y - 14, left > 0 ? '#ffe060' : '#a05050', { align: 'center', outline: '#000' });
      }
      if (this.kind === 'levers') {
        const levers = W().ents.filter((e) => e instanceof Lever && e.id === this.id).sort((a, b) => a.idx - b.idx);
        levers.forEach((lv, i) => {
          const on = lv.state[lv.idx];
          ctx.fillStyle = on ? '#80ff90' : '#5a2020';
          ctx.fillRect(x - 10 + i * 8, y - 12, 5, 5);
          if (on) G.addLight(this.x - 8 + i * 8, this.y - 10, 20, '#80ff90', 0.6);
        });
      }
    }
  }
  G.Gate = Gate;

  G.VaultReward = VaultReward;

  const gateFor = (id) => W().ents.find((e) => e instanceof Gate && e.id === id);

  class Brazier extends Obj {
    constructor(x, y, o) {
      super(x, y, 12, 18);
      this.o = o;
      this.id = o.id;
      this.sym = o.sym;
      this.lit = false;
      this.age = Math.random() * 3;
      this.projHittable = true;
    }
    onHit() {
      if (this.lit) return;
      const all = W().ents.filter((e) => e instanceof Brazier && e.id === this.id);
      const litCount = all.filter((b) => b.lit).length;
      const expected = this.o.order[litCount];
      if (this.sym === expected) {
        this.lit = true;
        G.Audio.play('brazier', { x: this.cx });
        G.fx.burst(this.cx, this.y, 12, { color: ['#ffd060', '#ff8030'], speed: 90, life: 0.5, size: 2, add: true, angle: -Math.PI / 2, spread: 1.2 });
        if (litCount + 1 === all.length) { const g = gateFor(this.id); if (g) g.setOpen(true); }
      } else {
        G.Audio.play('wrong', { x: this.cx });
        G.game.notify('[red]The flames gutter out.[] The order was wrong.');
        for (const b of all) b.lit = false;
        G.fx.burst(this.cx, this.y, 10, { color: '#606060', speed: 50, life: 0.8, size: 4, size2: 8, type: 'smoke' });
      }
    }
    update(dt) { this.age += dt; }
    draw(ctx, cx, cy) {
      const x = Math.round(this.cx - cx), y = Math.round(this.bottom - cy);
      ctx.fillStyle = '#5a4a3a'; ctx.fillRect(x - 6, y - 12, 12, 4);
      ctx.fillStyle = '#3a2a1a'; ctx.fillRect(x - 2, y - 8, 4, 8); ctx.fillRect(x - 5, y - 2, 10, 2);
      G.drawSymbol(ctx, this.sym, x, y - 26, this.lit ? SYMBOLS[this.sym].color : '#6a6070');
      if (this.lit) {
        const f = Math.sin(this.age * 10) * 0.5 + 0.5;
        ctx.fillStyle = '#ff8030'; ctx.fillRect(x - 4, y - 18 - f * 2, 8, 6);
        ctx.fillStyle = '#ffd060'; ctx.fillRect(x - 2, y - 20 - f * 3, 4, 5);
        G.addLight(this.cx, this.y, 90, '#ffa050', 1);
      } else {
        ctx.fillStyle = '#2a2a2a'; ctx.fillRect(x - 4, y - 14, 8, 2);
      }
    }
  }
  G.Brazier = Brazier;

  class Mural extends Obj {

    interact(p) {

      G.ui.open('lore', { title: 'A Scorched Mural', text: 'Four flames are painted here, each beneath a sigil. Soot marks show the order in which they were lit:\n\n' + names + '\n\nSomewhere on this level, braziers bearing these sigils guard a sealed vault.', symbols: this.o.order });
      this.mapIcon = null;

      ctx.fillStyle = '#4a3a3a'; ctx.fillRect(x, y - 30, 28, 22);
      ctx.fillStyle = '#6a5a4a'; ctx.fillRect(x + 1, y - 29, 26, 20);

      ctx.fillStyle = '#2a2020'; ctx.fillRect(x + 3, y - 13, 22, 1);
    }
