<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanternfall</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; outline: none; cursor: default; }
  #err { position: fixed; left: 8px; bottom: 8px; color: #f88; font: 12px monospace; white-space: pre-wrap; max-width: 90vw; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="err"></div>
<script>
'use strict';
// ============================================================================
// LANTERNFALL — core: namespace, math, RNG, colors, input, storage
// ============================================================================
(function () {
  const G = (window.G = window.G || {});
  G.W = 640;
  G.H = 360;
  G.TS = 16;
  G.DT = 1 / 60;
  G.time = 0; // total seconds of simulated game time
  G.frame = 0;

  // ---------------------------------------------------------------- math
  G.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  G.lerp = (a, b, t) => a + (b - a) * t;
  G.approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
  G.sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
  G.dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  G.angleTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);
  G.wrapAngle = (a) => {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  };
  G.overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  G.rectsOverlap = (x1, y1, w1, h1, x2, y2, w2, h2) => x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
  G.ease = {
    linear: (t) => t,
    inQuad: (t) => t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    inOutQuad: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    outBack: (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
    outElastic: (t) => (t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
  };
  G.fmtTime = (s) => {
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  };
  G.fmtNum = (n) => {
    n = Math.round(n);
    if (n >= 10000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return '' + n;
  };
  G.roman = (n) => ['0', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'][n] || '' + n;

  // ---------------------------------------------------------------- RNG
  class RNG {
    constructor(seed) {
      this.s = seed >>> 0 || 0x9e3779b9;
    }
    next() {
      let t = (this.s += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    range(a, b) {
      return a + (b - a) * this.next();
    }
    int(a, b) {
      return a + Math.floor(this.next() * (b - a + 1));
    }
    chance(p) {
      return this.next() < p;
    }
    pick(arr) {
      return arr[Math.floor(this.next() * arr.length)];
    }
    sign() {
      return this.next() < 0.5 ? -1 : 1;
    }
    weighted(items, wf) {
      let tot = 0;
      for (const it of items) tot += Math.max(0, wf(it));
      if (tot <= 0) return items[0];
      let r = this.next() * tot;
      for (const it of items) {
        r -= Math.max(0, wf(it));
        if (r <= 0) return it;
      }
      return items[items.length - 1];
    }
    shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(this.next() * (i + 1));
        const t = a[i];
        a[i] = a[j];
        a[j] = t;
      }
      return a;
    }
  }
  G.RNG = RNG;
  G.rng = new RNG((Math.random() * 4294967295) >>> 0);
  G.rnd = (a, b) => (b === undefined ? G.rng.next() * a : a + G.rng.next() * (b - a));
  G.hash = (x, y, s) => {
    let h = (x * 374761393 + y * 668265263 + (s || 0) * 2246822519) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };

  // ---------------------------------------------------------------- colors
  const hexCache = new Map();
  G.hexToRgb = (hex) => {
    let c = hexCache.get(hex);
    if (c) return c;
    let h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16);
    c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    hexCache.set(hex, c);
    return c;
  };
  const to2 = (v) => {
    v = G.clamp(Math.round(v), 0, 255).toString(16);
    return v.length < 2 ? '0' + v : v;
  };
  G.rgbToHex = (r, g, b) => '#' + to2(r) + to2(g) + to2(b);
  G.mix = (a, b, t) => {
    const A = G.hexToRgb(a), B = G.hexToRgb(b);
    return G.rgbToHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
  };
  G.shade = (hex, amt) => (amt >= 0 ? G.mix(hex, '#ffffff', amt) : G.mix(hex, '#000000', -amt));
  G.rgba = (hex, a) => {
    const c = G.hexToRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  };

  // stat colors (scroll colors)
  G.STAT_COLORS = { fury: '#e8483c', cunning: '#a55cf0', vigor: '#4fcf5a', none: '#c8c8c8' };
  G.STAT_NAMES = { fury: 'Fury', cunning: 'Cunning', vigor: 'Vigor' };
  G.QUALITY_COLORS = ['#d8d8d8', '#6fd46f', '#58a8ff', '#ffb43c'];
  G.QUALITY_NAMES = ['', 'Fine', 'Superior', 'Legendary'];

  // ---------------------------------------------------------------- storage
  G.store = {
    get(key, def) {
      try {
        const v = localStorage.getItem('lanternfall.' + key);
        return v == null ? def : JSON.parse(v);
      } catch (e) {
        return def;
      }
    },
    set(key, val) {
      try {
        localStorage.setItem('lanternfall.' + key, JSON.stringify(val));
      } catch (e) {}
    },
    del(key) {
      try {
        localStorage.removeItem('lanternfall.' + key);
      } catch (e) {}
    },
  };

  // ---------------------------------------------------------------- input
  const DEFAULT_BINDS = {
    left: ['ArrowLeft', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    up: ['ArrowUp', 'KeyW'],
    down: ['ArrowDown', 'KeyS'],
    jump: ['Space', 'KeyZ'],
    attack1: ['KeyJ', 'KeyX', 'Mouse0'],
    attack2: ['KeyK', 'KeyC', 'Mouse2'],
    roll: ['KeyL', 'ShiftLeft', 'ShiftRight'],
    skill1: ['KeyQ', 'KeyU'],
    skill2: ['KeyE', 'KeyI'],
    interact: ['KeyF', 'KeyV'],
    heal: ['KeyR', 'KeyH'],
    map: ['KeyM', 'Tab'],
    pause: ['Escape', 'KeyP'],
    confirm: ['Enter', 'Space', 'KeyJ', 'KeyF', 'KeyX'],
    cancel: ['Escape', 'Backspace', 'KeyK', 'KeyC'],
    mleft: ['ArrowLeft', 'KeyA'],
    mright: ['ArrowRight', 'KeyD'],
    mup: ['ArrowUp', 'KeyW'],
    mdown: ['ArrowDown', 'KeyS'],
    tabL: ['KeyQ', 'PageUp'],
    tabR: ['KeyE', 'PageDown'],
  };
  // standard gamepad mapping
  const PAD_BINDS = {
    jump: [0],
    roll: [1],
    attack1: [2],
    attack2: [3],
    heal: [4],
    interact: [5],
    skill1: [6],
    skill2: [7],
    map: [8],
    pause: [9],
    up: [12],
    down: [13],
    left: [14],
    right: [15],
    confirm: [0],
    cancel: [1],
    mup: [12],
    mdown: [13],
    mleft: [14],
    mright: [15],
    tabL: [4],
    tabR: [5],
  };
  const Input = (G.Input = {
    binds: DEFAULT_BINDS,
    keys: Object.create(null),
    latched: Object.create(null), // codes pressed since last poll
    down: Object.create(null),
    pressed: Object.create(null),
    released: Object.create(null),
    prev: Object.create(null),
    device: 'kb',
    anyKeyLatched: false,
    anyPressed: false,
    padIndex: -1,
    padPrev: [],
    axisX: 0,
    axisY: 0,
    mouse: { x: 0, y: 0, moved: false },
    init(canvas) {
      const prevent = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Tab', 'Backspace']);
      window.addEventListener('keydown', (e) => {
        if (prevent.has(e.code)) e.preventDefault();
        if (!e.repeat) {
          this.latched[e.code] = true;
          this.anyKeyLatched = true;
        }
        this.keys[e.code] = true;
        this.device = 'kb';
        if (G.Audio) G.Audio.unlock();
      });
      window.addEventListener('keyup', (e) => {
        this.keys[e.code] = false;
      });
      window.addEventListener('blur', () => {
        this.keys = Object.create(null);
      });
      canvas.addEventListener('mousedown', (e) => {
        const c = 'Mouse' + e.button;
        this.keys[c] = true;
        this.latched[c] = true;
        this.anyKeyLatched = true;
        this.device = 'kb';
        if (G.Audio) G.Audio.unlock();
        e.preventDefault();
      });
      window.addEventListener('mouseup', (e) => {
        this.keys['Mouse' + e.button] = false;
      });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      canvas.addEventListener('mousemove', (e) => {
        const r = canvas.getBoundingClientRect();
        this.mouse.x = ((e.clientX - r.left) / r.width) * G.W;
        this.mouse.y = ((e.clientY - r.top) / r.height) * G.H;
        this.mouse.moved = true;
      });
      window.addEventListener('gamepadconnected', (e) => {
        this.padIndex = e.gamepad.index;
      });
      // touch: tap anywhere counts as confirm on menus (basic)
      canvas.addEventListener('touchstart', () => {
        this.latched['Enter'] = true;
        this.anyKeyLatched = true;
        if (G.Audio) G.Audio.unlock();
      }, { passive: true });
    },
    poll() {
      // gamepad
      let pad = null;
      if (navigator.getGamepads) {
        const pads = navigator.getGamepads();
        if (this.padIndex >= 0 && pads[this.padIndex]) pad = pads[this.padIndex];
        else for (const p of pads) if (p) { pad = p; this.padIndex = p.index; break; }
      }
      const padDown = [];
      this.axisX = 0;
      this.axisY = 0;
      if (pad) {
        for (let i = 0; i < pad.buttons.length; i++) {
          const b = pad.buttons[i];
          padDown[i] = b && (b.pressed || b.value > 0.5);
          if (padDown[i] && !this.padPrev[i]) {
            this.device = 'gp';
            this.anyKeyLatched = true;
            if (G.Audio) G.Audio.unlock();
          }
        }
        const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
        if (Math.abs(ax) > 0.35) { this.axisX = ax; this.device = 'gp'; }
        if (Math.abs(ay) > 0.45) { this.axisY = ay; this.device = 'gp'; }
      }
      const padPrev = this.padPrev;
      for (const act in this.binds) {
        let now = false, latch = false;
        for (const code of this.binds[act]) {
          if (this.keys[code]) now = true;
          if (this.latched[code]) latch = true;
        }
        const pb = PAD_BINDS[act];
        if (pb) for (const bi of pb) {
          if (padDown[bi]) now = true;
          if (padDown[bi] && !padPrev[bi]) latch = true;
        }
        if (act === 'left' || act === 'mleft') { if (this.axisX < -0.35) now = true; }
        if (act === 'right' || act === 'mright') { if (this.axisX > 0.35) now = true; }
        if (act === 'up' || act === 'mup') { if (this.axisY < -0.45) now = true; }
        if (act === 'down' || act === 'mdown') { if (this.axisY > 0.45) now = true; }
        const was = this.prev[act] || false;
        this.pressed[act] = (now && !was) || (latch && !was) || (latch && now === false);
        this.released[act] = (!now && was) || (latch && !now);
        this.down[act] = now || latch;
        this.prev[act] = now;
      }
      this.anyPressed = this.anyKeyLatched;
      this.anyKeyLatched = false;
      this.latched = Object.create(null);
      this.padPrev = padDown;
    },
    consume(act) {
      this.pressed[act] = false;
    },
    clearAll() {
      for (const k in this.pressed) this.pressed[k] = false;
      this.anyPressed = false;
    },
    // pretty key names for prompts
    keyName(act) {
      if (this.device === 'gp') {
        const names = { jump: 'A', roll: 'B', attack1: 'X', attack2: 'Y', heal: 'LB', interact: 'RB', skill1: 'LT', skill2: 'RT', map: 'SELECT', pause: 'START', confirm: 'A', cancel: 'B', up: 'UP', down: 'DOWN' };
        return names[act] || act;
      }
      const code = this.binds[act] && this.binds[act][0];
      if (!code) return '?';
      if (code.startsWith('Key')) return code.slice(3);
      if (code === 'Space') return 'SPACE';
      if (code.startsWith('Arrow')) return code.slice(5).toUpperCase();
      if (code.startsWith('Shift')) return 'SHIFT';
      if (code === 'Escape') return 'ESC';
      return code.toUpperCase();
    },
  });
})();

</script>

    lights.length = 0;
  };

  // ---------------------------------------------------------------- drawing helpers
  G.rect = (ctx, x, y, w, h, color) => {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  };
  G.strokeRect = (ctx, x, y, w, h, color) => {
    ctx.fillStyle = color;
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    ctx.fillRect(x, y, w, 1);
    ctx.fillRect(x, y + h - 1, w, 1);
    ctx.fillRect(x, y, 1, h);
    ctx.fillRect(x + w - 1, y, 1, h);
  };
  // pixel-art panel with bevel
  G.panel = (ctx, x, y, w, h, opts) => {
    opts = opts || {};
    const bg = opts.bg || 'rgba(12,10,20,0.92)';
    const border = opts.border || '#5a4a6a';
    const hi = opts.hi || '#8a7a9a';
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    ctx.fillStyle = bg;
    ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
    ctx.fillStyle = border;
    ctx.fillRect(x + 1, y, w - 2, 1);
    ctx.fillRect(x + 1, y + h - 1, w - 2, 1);
    ctx.fillRect(x, y + 1, 1, h - 2);
    ctx.fillRect(x + w - 1, y + 1, 1, h - 2);
    ctx.fillStyle = hi;
    ctx.fillRect(x + 2, y + 1, w - 4, 1);
    if (opts.corner !== false) {
      ctx.fillStyle = opts.cornerColor || '#d8a860';
      ctx.fillRect(x, y, 2, 2);
      ctx.fillRect(x + w - 2, y, 2, 2);
      ctx.fillRect(x, y + h - 2, 2, 2);
      ctx.fillRect(x + w - 2, y + h - 2, 2, 2);
    }
  };
  G.bar = (ctx, x, y, w, h, frac, color, bg, frac2, color2) => {
    ctx.fillStyle = bg || '#1a1420';
    ctx.fillRect(x, y, w, h);
    if (frac2 !== undefined && frac2 > frac) {
      ctx.fillStyle = color2 || '#ff9a40';
      ctx.fillRect(x, y, Math.round(w * G.clamp(frac2, 0, 1)), h);
    }
    ctx.fillStyle = color;
    ctx.fillRect(x, y, Math.round(w * G.clamp(frac, 0, 1)), h);
  };
  // line of pixels (Bresenham) — for crisp beams/ropes
  G.pixLine = (ctx, x0, y0, x1, y1, color) => {
    ctx.fillStyle = color;
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy, n = 0;
    for (;;) {
      ctx.fillRect(x0, y0, 1, 1);
      if ((x0 === x1 && y0 === y1) || n++ > 2000) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  };
  // filled pixel circle
  G.pixCircle = (ctx, cx, cy, r, color) => {
    ctx.fillStyle = color;
    cx = Math.round(cx); cy = Math.round(cy);
    for (let y = -r; y <= r; y++) {
      const w = Math.round(Math.sqrt(r * r - y * y));
      ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1);
    }
  };
  // draw an image rotated around pivot (px,py in image coords) at (x,y)
  G.drawRot = (ctx, img, x, y, ang, px, py, flip, sx, sy) => {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    if (flip) ctx.scale(-1, 1);
    ctx.rotate(ang);
    if (sx || sy) ctx.scale(sx || 1, sy || 1);
    ctx.drawImage(img, -px, -py);
    ctx.restore();
  };
})();

<script>
'use strict';
// ============================================================================
// Audio: WebAudio synth instruments, procedural SFX, music sequencer
// ============================================================================
(function () {
  const G = window.G;
  const A = (G.Audio = {
    ctx: null,
    ready: false,
    musicVol: 0.7,
    sfxVol: 0.8,
    last: {},
  });
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  A.mtof = mtof;

  A.unlock = () => {
    if (A.ctx) {
      if (A.ctx.state === 'suspended') A.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    let ctx;
    try { ctx = new AC(); } catch (e) { return; }
    A.setupGraph(ctx);
    if (A.pendingMusic) {
      const pm = A.pendingMusic;
      A.pendingMusic = null;
      A.playMusic(pm);
    }
    setInterval(schedulerTick, 25);
  };
  // builds the mixing graph on any (realtime or offline) context
  A.setupGraph = (ctx) => {
    A.ctx = ctx;
    A.master = ctx.createGain();
    A.master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 12;
    comp.ratio.value = 4;
    comp.attack.value = 0.004;
    comp.release.value = 0.2;
    A.master.connect(comp);
    comp.connect(ctx.destination);
    A.musicBus = ctx.createGain();
    A.sfxBus = ctx.createGain();
    A.musicBus.connect(A.master);
    A.sfxBus.connect(A.master);
    // reverb
    A.reverb = ctx.createConvolver();
    A.reverb.buffer = makeImpulse(ctx, 2.8, 2.6);
    A.revSend = ctx.createGain();
    A.revSend.gain.value = 0.35;
    A.revSend.connect(A.reverb);
    A.reverb.connect(A.master);
    A.sfxRev = ctx.createGain();
    A.sfxRev.gain.value = 0.18;
    A.sfxBus.connect(A.sfxRev);
    A.sfxRev.connect(A.reverb);
    // echo delay for leads
    A.delay = ctx.createDelay(1.5);
    A.delay.delayTime.value = 0.36;
    A.delayFb = ctx.createGain();
    A.delayFb.gain.value = 0.32;
    const dlp = ctx.createBiquadFilter();
    dlp.type = 'lowpass';
    dlp.frequency.value = 2200;
    A.delay.connect(dlp);
    dlp.connect(A.delayFb);
    A.delayFb.connect(A.delay);
    A.delaySend = ctx.createGain();
    A.delaySend.gain.value = 0.25;
    A.delaySend.connect(A.delay);
    dlp.connect(A.musicBus);
    // noise
    const len = ctx.sampleRate * 2;
    A.noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = A.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    A.ready = true;
    A.applyVolumes();
  };

  function makeImpulse(ctx, dur, decay) {
    const rate = ctx.sampleRate, len = Math.floor(rate * dur);
    const buf = ctx.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const ch = buf.getChannelData(c);
      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  A.applyVolumes = () => {
    if (!A.ready) return;
    const s = G.settings || { music: 0.7, sfx: 0.8 };
    A.musicBus.gain.setTargetAtTime(s.music * 0.55, A.ctx.currentTime, 0.05);
    A.sfxBus.gain.setTargetAtTime(s.sfx * 0.9, A.ctx.currentTime, 0.05);
  };

  // ------------------------------------------------------------ low-level
  function env(g, t, a, d, s, r, peak, dur) {
    // ADSR on gain param; note lasts dur then release
    const p = g.gain;
    p.setValueAtTime(0.0001, t);
    p.linearRampToValueAtTime(peak, t + a);
    p.setTargetAtTime(peak * s, t + a, d / 3 + 0.001);
    const rel = t + Math.max(a, dur);
    p.cancelScheduledValues(rel);
    p.setTargetAtTime(0.0001, rel, r / 3 + 0.001);
    return rel + r * 1.2;
  }
  function osc(type, freq, t, end, dest, detune) {
    const o = A.ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (detune) o.detune.setValueAtTime(detune, t);
    o.connect(dest);
    o.start(t);
    o.stop(end + 0.05);
    return o;
  }
  function noiseSrc(t, end, dest, rate) {
    const n = A.ctx.createBufferSource();
    n.buffer = A.noise;
    n.loop = true;
    if (rate) n.playbackRate.value = rate;
    n.connect(dest);
    n.start(t, Math.random() * 1.5);
    n.stop(end + 0.05);
    return n;
  }
  function filt(type, f, q, dest) {
    const b = A.ctx.createBiquadFilter();
    b.type = type;
    b.frequency.value = f;
    if (q) b.Q.value = q;
    b.connect(dest);
    return b;
  }
  function gainNode(v, dest) {
    const g = A.ctx.createGain();
    g.gain.value = v;
    g.connect(dest);
    return g;
  }
  function vibrato(o, t, rate, cents, delay) {
    const l = A.ctx.createOscillator();
    const lg = A.ctx.createGain();
    l.frequency.value = rate;
    lg.gain.setValueAtTime(0, t);
    lg.gain.linearRampToValueAtTime(cents, t + (delay || 0.2));
    l.connect(lg);
    lg.connect(o.detune);
    l.start(t);
    return l;
  }

  // ------------------------------------------------------------ instruments
  // play(inst, midi, t, dur, vol, out, opts)
  const INST = {
    pluck(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      const lp = filt('lowpass', f * 6, 2, g);
      lp.frequency.setValueAtTime(Math.min(9000, f * 10), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(200, f * 1.5), t + 0.4);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.5, dur * 1.5));
      const e = t + Math.max(0.5, dur * 1.5);
      osc('sawtooth', f, t, e, lp);
      osc('triangle', f * 2, t, e, lp, 3);
    },
    harp(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
      osc('triangle', f, t, t + 1.6, g);
      const g2 = gainNode(0.3, g);
      osc('sine', f * 2, t, t + 1.6, g2);
    },
    kalimba(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      osc('sine', f, t, t + 0.9, g);
      const g2 = A.ctx.createGain();
      g2.connect(out);
      g2.gain.setValueAtTime(v * 0.4, t);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      osc('sine', f * 5.4, t, t + 0.15, g2);
    },
    pad(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      const lp = filt('lowpass', 900, 0.7, g);
      const end = env(g, t, 0.5, 0.5, 0.85, 1.0, v, dur);
      osc('sawtooth', f, t, end, lp, -8);
      osc('sawtooth', f, t, end, lp, 8);
      osc('triangle', f / 2, t, end, lp);
    },
    strings(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      const lp = filt('lowpass', 2200, 0.5, g);
      const end = env(g, t, 0.14, 0.3, 0.8, 0.4, v, dur);
      const o1 = osc('sawtooth', f, t, end, lp, -6);
      const o2 = osc('sawtooth', f, t, end, lp, 7);
      const l = vibrato(o1, t, 5.2, 9, 0.25);
      l.stop(end);
      const l2 = vibrato(o2, t, 4.8, 9, 0.3);
      l2.stop(end);
    },
    bass(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      const lp = filt('lowpass', 600, 4, g);
      lp.frequency.setValueAtTime(1400, t);
      lp.frequency.exponentialRampToValueAtTime(280, t + 0.25);
      const end = env(g, t, 0.008, 0.2, 0.6, 0.08, v, dur * 0.95);
      osc('sawtooth', f, t, end, lp);
      osc('square', f / 2, t, end, gainNode(0.5, lp));
    },
    subbass(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      const end = env(g, t, 0.02, 0.3, 0.8, 0.12, v, dur * 0.95);
      osc('sine', f, t, end, g);
      osc('triangle', f, t, end, gainNode(0.3, g));
    },
    lead(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      g.connect(A.delaySend);
      const lp = filt('lowpass', 2600, 1, g);
      const end = env(g, t, 0.02, 0.2, 0.7, 0.15, v, dur);
      const o = osc('square', f, t, end, lp);
      const l = vibrato(o, t, 5.5, 12, 0.18);
      l.stop(end);
      osc('triangle', f * 2, t, end, gainNode(0.25, lp));
    },
    flute(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      g.connect(A.delaySend);
      const end = env(g, t, 0.07, 0.2, 0.8, 0.18, v, dur);
      const o = osc('sine', f, t, end, g);
      const l = vibrato(o, t, 5, 14, 0.25);
      l.stop(end);
      osc('triangle', f, t, end, gainNode(0.35, g));
      const bn = gainNode(0.06, g);
      noiseSrc(t, end, filt('bandpass', f * 2, 3, bn));
    },
    reed(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      const lp = filt('lowpass', 1800, 1.5, g);
      const end = env(g, t, 0.03, 0.1, 0.85, 0.08, v, dur);
      osc('sawtooth', f, t, end, lp, -10);
      osc('square', f, t, end, lp, 10);
      const o = osc('sawtooth', f * 2, t, end, gainNode(0.2, lp));
      const l = vibrato(o, t, 6, 10, 0.1);
      l.stop(end);
    },
    brass(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      g.connect(A.delaySend);
      const lp = filt('lowpass', 400, 2, g);
      lp.frequency.setValueAtTime(350, t);
      lp.frequency.linearRampToValueAtTime(2600, t + 0.09);
      lp.frequency.setTargetAtTime(1500, t + 0.1, 0.2);
      const end = env(g, t, 0.05, 0.2, 0.8, 0.15, v, dur);
      const o = osc('sawtooth', f, t, end, lp);
      osc('sawtooth', f, t, end, lp, 9);
      const l = vibrato(o, t, 5, 10, 0.3);
      l.stop(end);
    },
    bell(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      g.connect(A.delaySend);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
      const car = osc('sine', f, t, t + 2.4, g);
      const mod = A.ctx.createOscillator();
      mod.frequency.value = f * 3.5;
      const mg = A.ctx.createGain();
      mg.gain.setValueAtTime(f * 2.2, t);
      mg.gain.exponentialRampToValueAtTime(f * 0.05, t + 1.2);
      mod.connect(mg);
      mg.connect(car.frequency);
      mod.start(t);
      mod.stop(t + 2.4);
      osc('sine', f * 2.01, t, t + 1.2, gainNode(0.15, g));
    },
    glass(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      g.connect(A.delaySend);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
      osc('sine', f, t, t + 1.4, g);
      osc('sine', f * 2.76, t, t + 0.6, gainNode(0.25, g));
      osc('sine', f * 5.4, t, t + 0.3, gainNode(0.1, g));
    },
    organ(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      const end = env(g, t, 0.06, 0.1, 0.9, 0.35, v, dur);
      osc('sine', f, t, end, g);
      osc('sine', f * 2, t, end, gainNode(0.5, g));
      osc('sine', f * 3, t, end, gainNode(0.28, g));
      osc('sine', f * 4, t, end, gainNode(0.18, g));
      osc('sine', f / 2, t, end, gainNode(0.35, g));
    },
    choir(m, t, dur, v, out) {
      const f = mtof(m);
      const g = A.ctx.createGain();
      g.connect(out);
      const end = env(g, t, 0.35, 0.3, 0.85, 0.7, v, dur);
      const mixer = A.ctx.createGain();
      mixer.gain.value = 1;
      const b1 = filt('bandpass', 750, 5, g);
      const b2 = filt('bandpass', 1180, 6, gainNode(0.6, g));
      const b3 = filt('bandpass', 2600, 7, gainNode(0.25, g));
      mixer.connect(b1);
      mixer.connect(b2);
      mixer.connect(b3);
      const o1 = osc('sawtooth', f, t, end, mixer, -12);
      const o2 = osc('sawtooth', f, t, end, mixer, 10);
      const o3 = osc('sawtooth', f * 2, t, end, gainNode(0.3, mixer), 4);
      vibrato(o1, t, 4.6, 14, 0.4).stop(end);
      vibrato(o2, t, 5.1, 12, 0.5).stop(end);
      vibrato(o3, t, 4.9, 10, 0.4).stop(end);
    },
    // ---- drums
    kick(m, t, dur, v, out) {
      const g = A.ctx.createGain();
      g.connect(out);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      const o = osc('sine', 150, t, t + 0.35, g);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      const c = gainNode(v * 0.3, out);
      c.gain.setValueAtTime(v * 0.3, t);
      c.gain.exponentialRampToValueAtTime(0.0001, t + 0.02);
      noiseSrc(t, t + 0.03, filt('lowpass', 3000, 0, c));
    },
    snare(m, t, dur, v, out) {
      const g = A.ctx.createGain();
      g.connect(out);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      noiseSrc(t, t + 0.22, filt('highpass', 1200, 0, g));
      const g2 = A.ctx.createGain();
      g2.connect(out);
      g2.gain.setValueAtTime(v * 0.7, t);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      const o = osc('triangle', 210, t, t + 0.12, g2);
      o.frequency.exponentialRampToValueAtTime(140, t + 0.1);
    },
    hat(m, t, dur, v, out) {
      const g = A.ctx.createGain();
      g.connect(out);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
      noiseSrc(t, t + 0.06, filt('highpass', 7500, 0, g));
    },
    ohat(m, t, dur, v, out) {
      const g = A.ctx.createGain();
      g.connect(out);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      noiseSrc(t, t + 0.32, filt('highpass', 6500, 0, g));
    },
    shaker(m, t, dur, v, out) {
      const g = A.ctx.createGain();
      g.connect(out);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      noiseSrc(t, t + 0.1, filt('bandpass', 5500, 1.5, g));
    },
    tom(m, t, dur, v, out) {
      const g = A.ctx.createGain();
      g.connect(out);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      const o = osc('sine', mtof(m || 45) * 1.5, t, t + 0.4, g);
      o.frequency.exponentialRampToValueAtTime(mtof(m || 45) * 0.8, t + 0.3);
    },
    taiko(m, t, dur, v, out) {
      const g = A.ctx.createGain();
      g.connect(out);
      g.connect(A.revSend);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
      const o = osc('sine', 95, t, t + 0.8, g);
      o.frequency.exponentialRampToValueAtTime(48, t + 0.25);
      const n = gainNode(v * 0.5, out);
      n.gain.setValueAtTime(v * 0.5, t);
      n.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      noiseSrc(t, t + 0.16, filt('lowpass', 900, 0, n));
    },
    crash(m, t, dur, v, out) {
      const g = A.ctx.createGain();
      g.connect(out);
      g.connect(A.revSend);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);

    { id: 'dmg', kinds: ['melee', 'ranged', 'skill'], roll: [12, 28], text: '+{v}% damage' },
    { id: 'aspd', kinds: ['melee', 'ranged'], roll: [8, 16], text: '+{v}% attack speed' },
    { id: 'crit', kinds: ['melee', 'ranged'], roll: [8, 16], text: '+{v}% critical chance' },
    { id: 'bleed', kinds: ['melee', 'ranged'], roll: [1, 1], text: 'Hits inflict [red]Bleed[]' },
    { id: 'burn', kinds: ['melee', 'ranged'], roll: [1, 1], text: 'Hits [orange]ignite[] enemies' },
    { id: 'poison', kinds: ['melee', 'ranged'], roll: [1, 1], text: 'Hits inflict [green]Poison[]' },
    { id: 'chill', kinds: ['melee', 'ranged'], roll: [8, 15], text: '{v}% chance to [cyan]Freeze[]' },
    { id: 'vsBleed', kinds: ['melee', 'ranged', 'skill'], roll: [40, 70], text: '+{v}% damage to bleeding enemies' },
    { id: 'vsBurn', kinds: ['melee', 'ranged', 'skill'], roll: [40, 70], text: '+{v}% damage to burning enemies' },
    { id: 'vsPoison', kinds: ['melee', 'ranged', 'skill'], roll: [40, 70], text: '+{v}% damage to poisoned enemies' },
    { id: 'vsDisabled', kinds: ['melee', 'ranged', 'skill'], roll: [50, 80], text: '+{v}% damage to stunned, frozen or rooted enemies' },
    { id: 'killHeal', kinds: ['melee', 'ranged'], roll: [2, 4], text: 'Kills restore {v}% health' },
    { id: 'killBoom', kinds: ['melee', 'ranged', 'skill'], roll: [1, 1], text: 'Victims [orange]explode[] on death' },
    { id: 'fullHp', kinds: ['melee', 'ranged'], roll: [30, 55], text: '+{v}% damage while at full health' },
    { id: 'elite', kinds: ['melee', 'ranged', 'skill', 'shield'], roll: [20, 40], text: '+{v}% damage to elites and bosses' },
    { id: 'air', kinds: ['melee'], roll: [35, 60], text: '+{v}% damage while airborne' },
    { id: 'cd', kinds: ['skill'], roll: [15, 28], text: '-{v}% cooldown' },
    { id: 'skillStun', kinds: ['skill'], roll: [1, 1], text: 'Also [vigor]stuns[] briefly' },
    { id: 'parryHeal', kinds: ['shield'], roll: [4, 8], text: 'Parries restore {v}% health' },
    { id: 'parryBoom', kinds: ['shield'], roll: [1, 1], text: 'Parries release a damaging shockwave' },
    { id: 'blockPlus', kinds: ['shield'], roll: [8, 15], text: '+{v}% block' },
    { id: 'parryBurn', kinds: ['shield'], roll: [1, 1], text: 'Parries [orange]ignite[] attackers' },
  ];
  G.AFFIXES = AFFIXES;
  const AFFIX_BY_ID = {};
  for (const a of AFFIXES) AFFIX_BY_ID[a.id] = a;

  // ---------------------------------------------------------------- unlocks
  G.isUnlocked = (id) => {
    const d = ITEMS[id];
    if (!d) return false;
    if (d.start) return true;
    return !!(G.save && G.save.unlocked && G.save.unlocked[id]);
  };
  G.itemPool = (kinds) => {
    const out = [];
    for (const id in ITEMS) {
      const d = ITEMS[id];
      if (kinds && !kinds.includes(d.kind)) continue;
      if (G.isUnlocked(id)) out.push(id);
    }
    return out;
  };

  let uidCounter = 1;
  // create an item instance
  G.makeItem = (id, tier, rng, opts) => {
    opts = opts || {};
    rng = rng || G.rng;
    const d = ITEMS[id];
    let q = opts.q;
    if (q === undefined) {
      const forge = G.save ? (G.hasUpgrade('forge3') ? 3 : G.hasUpgrade('forge2') ? 2 : G.hasUpgrade('forge1') ? 1 : 0) : 0;
      const p3 = (forge >= 3 ? 0.035 : 0.0) + (tier >= 4 ? 0.02 : 0) + (opts.bonus || 0) * 0.3;
      const p2 = 0.06 + 0.03 * tier + forge * 0.04 + (opts.bonus || 0) * 0.5;
      const p1 = 0.22 + 0.05 * tier + forge * 0.06 + (opts.bonus || 0);
      const r = rng.next();
      q = r < p3 ? 3 : r < p3 + p2 ? 2 : r < p3 + p2 + p1 ? 1 : 0;
    }
    const nAff = q === 0 ? 0 : q === 1 ? 1 : 2;
    const affixes = [];
    const pool = AFFIXES.filter((a) => a.kinds.includes(d.kind));
    // avoid redundant status affixes
    const skip = new Set();
    if (d.onHit) for (const k in d.onHit) skip.add(k);
    for (let i = 0; i < nAff && pool.length; i++) {
      let a, tries = 0;
      do { a = rng.pick(pool); tries++; } while ((skip.has(a.id) || affixes.find((x) => x.id === a.id)) && tries < 20);
      if (tries >= 20) break;
      affixes.push({ id: a.id, v: rng.int(a.roll[0], a.roll[1]) });
      skip.add(a.id);
    }
    return { id, tier: Math.max(1, tier), q, affixes, uid: uidCounter++ };
  };
  G.itemMods = (inst) => {
    if (inst._mods) return inst._mods;
    const m = {};
    for (const a of inst.affixes) m[a.id] = (m[a.id] || 0) + a.v;
    inst._mods = m;
    return m;
  };
  G.itemPower = (inst) => {
    const d = ITEMS[inst.id];
    const m = G.itemMods(inst);
    return d.base * G.itemScale(inst.tier) * (inst.q === 3 ? 1.25 : 1) * (1 + (m.dmg || 0) / 100);
  };
  G.itemName = (inst) => {
    const d = ITEMS[inst.id];
    return (inst.q === 3 ? 'Legendary ' : '') + d.name + (inst.q > 0 && inst.q < 3 ? ' ' + '+'.repeat(inst.q) : '');
  };
  G.itemPrice = (inst) => {
    const d = ITEMS[inst.id];
    return Math.round((90 + 70 * inst.tier) * (1 + 0.45 * inst.q) * (d.kind === 'skill' ? 0.9 : 1) / 5) * 5;
  };
  G.itemMainStat = (inst) => {
    const d = ITEMS[inst.id];
    return d.stats[0];
  };
  // approximate DPS number for tooltips
  G.itemDps = (inst, player) => {
    const d = ITEMS[inst.id];
    const p = G.itemPower(inst);
    const sm = player ? player.statMult(d.stats) : 1;
    if (d.kind === 'melee') {
      let dmg = 0, t = 0;
      for (const s of d.combo) { dmg += s.dmg * (s.multi || 1); t += s.w + s.a + s.r * 0.6; }
      return (p * sm * dmg) / t;
    }
    if (d.kind === 'ranged') {
      const n = d.burst || 1;
      let t = d.draw + d.rec + (d.burstGap || 0) * (n - 1);
      if (d.ammo) t += d.reload / d.ammo;
      return (p * sm * n) / t;
    }
    return p * sm;
  };
  G.itemTooltip = (inst, player) => {
    const d = ITEMS[inst.id];
    const lines = [];
    const kindName = { melee: 'Melee Weapon', ranged: 'Ranged Weapon', shield: 'Shield', skill: 'Skill' }[d.kind];
    const statTxt = d.stats.map((s) => '[' + s + ']' + G.STAT_NAMES[s] + '[]').join(' / ');
    lines.push('[gray]' + kindName + '  •  ' + statTxt + '  •  [gray]Tier ' + G.roman(inst.tier) + '[]');
    const p = G.itemPower(inst) * (player ? player.statMult(d.stats) : 1);
    if (d.kind === 'melee' || d.kind === 'ranged') lines.push('[white]DPS ' + Math.round(G.itemDps(inst, player)) + '[]  [gray](' + Math.round(p) + ' per hit)[]');
    else if (d.kind === 'shield') lines.push('[white]Block ' + Math.round(Math.min(0.98, d.block + (G.itemMods(inst).blockPlus || 0) / 100) * 100) + '%[]  [gray]Parry ' + Math.round(p * d.parryMult) + ' dmg[]');
    else lines.push('[white]Damage ' + Math.round(p) + '[]  [gray]Cooldown ' + (d.cd * (1 - (G.itemMods(inst).cd || 0) / 100)).toFixed(1) + 's[]');
    lines.push(d.desc);
    for (const a of inst.affixes) {
      const ad = AFFIX_BY_ID[a.id];
      lines.push('[q' + Math.min(3, inst.q) + ']•[] ' + ad.text.replace('{v}', a.v));
    }
    if (inst.q === 3) lines.push('[q3]• Legendary: +25% base damage[]');
    return lines;
  };

  // ---------------------------------------------------------------- sprites
  // Held sprites point right with pivot (grip) returned. Icons are 16x16.
  const spriteCache = {};
  function px(c, x, y, col) {
    c.fillStyle = col;
    c.fillRect(x, y, 1, 1);
  }
  function hl(c, x, y, w, col) {
    c.fillStyle = col;
    c.fillRect(x, y, w, 1);
  }
  function vl(c, x, y, h, col) {
    c.fillStyle = col;
    c.fillRect(x, y, 1, h);
  }
  function buildHeld(look) {
    const L = look.len || 12;
    let cv, pv;
    switch (look.shape) {
      case 'sword':
      case 'greatsword':
      case 'katana':
      case 'rapier':
      case 'dagger': {
        const thick = look.shape === 'greatsword' ? 4 : look.shape === 'rapier' ? 1 : 2;
        const H = thick + 6;
        cv = G.makeCanvas(L + 6, H);
        const c = cv.ctx, my = Math.floor(H / 2);
        // hilt
        hl(c, 0, my, 3, look.hilt);
        if (thick >= 2) hl(c, 0, my - 1, 3, look.hilt);
        px(c, 0, my, look.guard);
        // guard
        const gh = look.shape === 'rapier' ? 5 : look.shape === 'katana' ? 3 : thick + 4;
        vl(c, 3, my - Math.floor(gh / 2) - (thick >= 2 ? 1 : 0) + (thick >= 2 ? 1 : 0) - (gh % 2 ? 0 : 1), gh, look.guard);
        if (look.shape === 'rapier') { px(c, 4, my - 2, look.guard); px(c, 4, my + 2, look.guard); }
        // blade
        const bx = 4;
        for (let i = 0; i < L; i++) {
          const x = bx + i;
          const taper = i >= L - 2 ? Math.max(1, thick - (i - (L - 3))) : thick;
          let top = my - Math.floor(thick / 2);
          if (look.shape === 'katana') top -= Math.round((i / L) * (i / L) * 2);
          for (let t = 0; t < taper; t++) px(c, x, top + t, t === 0 ? look.edge : look.blade);
          if (thick >= 3 && i < L - 3) px(c, x, top + Math.floor(thick / 2), G.shade(look.blade, -0.15));
        }
        pv = [1.5, my];
        break;
      }
      case 'spear':
      case 'trident': {
        cv = G.makeCanvas(L + 7, 9);
        const c = cv.ctx;
        hl(c, 0, 4, L, look.shaft);
        hl(c, 0, 5, L, G.shade(look.shaft, -0.3));
        if (look.shape === 'spear') {
          for (let i = 0; i < 6; i++) { const h = Math.max(1, 3 - Math.floor(i / 2)); vl(c, L + i, 5 - h + 1 - 0, h * 2 - 1, i < 2 ? G.shade(look.head, -0.2) : look.head); }
          px(c, L + 1, 3, look.head); px(c, L + 1, 6, look.head);
        } else {
          vl(c, L, 1, 7, look.head);
          hl(c, L, 1, 6, look.head); hl(c, L, 4, 7, look.head); hl(c, L, 7, 6, look.head);
          px(c, L + 6, 1, '#ffffff'); px(c, L + 6, 7, '#ffffff');
        }
        pv = [4, 4.5];
        break;
      }
      case 'hammer':
      case 'anchor': {
        cv = G.makeCanvas(L + 9, 14);
        const c = cv.ctx;
        hl(c, 0, 6, L + 2, look.shaft);
        hl(c, 0, 7, L + 2, G.shade(look.shaft, -0.3));
        if (look.shape === 'hammer') {
          c.fillStyle = look.head; c.fillRect(L, 1, 7, 12);
          c.fillStyle = G.shade(look.head, -0.3); c.fillRect(L, 9, 7, 4);
          c.fillStyle = G.shade(look.head, 0.3); c.fillRect(L + 1, 2, 5, 1);
        } else {
          c.fillStyle = look.head; c.fillRect(L + 1, 3, 2, 8);
          hl(c, L - 2, 3, 7, look.head); hl(c, L - 2, 10, 7, look.head);
          px(c, L - 3, 2, look.head); px(c, L + 5, 2, look.head); px(c, L - 3, 11, look.head); px(c, L + 5, 11, look.head);
          c.fillStyle = G.shade(look.head, 0.3); c.fillRect(L + 4, 5, 3, 4);
        }
        pv = [4, 6.5];
        break;
      }
      case 'axe': {
        cv = G.makeCanvas(L + 6, 14);
        const c = cv.ctx;
        hl(c, 0, 8, L + 2, look.shaft);
        hl(c, 0, 9, L + 2, G.shade(look.shaft, -0.3));
        c.fillStyle = look.head;
        c.fillRect(L - 2, 2, 5, 7);
        c.fillRect(L + 3, 1, 2, 9);
        c.fillStyle = '#ffffff';
        c.fillRect(L + 4, 1, 1, 9);
        pv = [3, 8.5];
        break;
      }
      case 'scythe': {
        cv = G.makeCanvas(L + 4, 16);
        const c = cv.ctx;
        hl(c, 0, 4, L + 2, look.shaft);
        hl(c, 0, 5, L + 2, G.shade(look.shaft, -0.3));
        // blade curves downward back toward the grip
        for (let i = 0; i < 12; i++) {
          const y = 4 + Math.round(Math.sin((i / 12) * Math.PI * 0.6) * 9);
          const x = L + 1 - i;
          px(c, x, y, look.head);
          px(c, x, y + 1, i < 10 ? '#ffffff' : look.head);
          px(c, x, y - 1, G.shade(look.head, -0.25));
        }
        pv = [6, 4.5];
        break;
      }
      case 'whip': {
        cv = G.makeCanvas(L + 6, 6);
        const c = cv.ctx;
        hl(c, 0, 2, 5, look.hilt);
        hl(c, 0, 3, 5, G.shade(look.hilt, -0.3));
        for (let i = 0; i < L; i++) px(c, 5 + i, 2 + Math.round(Math.sin(i * 0.8)), look.lash);
        pv = [2, 2.5];
        break;
      }
      case 'knuckles': {
        cv = G.makeCanvas(8, 8);
        const c = cv.ctx;
        c.fillStyle = look.wrap; c.fillRect(0, 2, 4, 4);
        c.fillStyle = look.metal; c.fillRect(4, 1, 3, 6);
        c.fillStyle = '#ffffff'; c.fillRect(6, 1, 1, 6);
        pv = [2, 4];
        break;
      }
      case 'flail': {
        cv = G.makeCanvas(10, 6);
        const c = cv.ctx;
        hl(c, 0, 2, 8, look.hilt);
        hl(c, 0, 3, 8, G.shade(look.hilt, -0.3));
        pv = [2, 2.5];
        break;
      }
      case 'club': {
        cv = G.makeCanvas(L + 6, 10);
        const c = cv.ctx;
        for (let i = 0; i < L + 4; i++) {
          const h = 2 + Math.floor((i / (L + 4)) * 4);
          vl(c, i, 5 - Math.floor(h / 2), h, i % 5 === 0 ? look.dark : look.bone);
        }
        c.fillStyle = look.bone; c.fillRect(L + 1, 1, 4, 8);
        c.fillStyle = look.dark; c.fillRect(L + 2, 3, 2, 1); c.fillRect(L + 2, 6, 2, 1);
        pv = [2, 5];
        break;
      }
      case 'bow':
      case 'longbow': {
        const H = look.shape === 'longbow' ? 24 : 18;
        cv = G.makeCanvas(8, H);
        const c = cv.ctx;
        for (let y = 0; y < H; y++) {
          const t = (y / (H - 1)) * 2 - 1;
          const x = Math.round(5 - (1 - t * t) * 4 + 0.5) + 1;
          px(c, x, y, look.wood);
          if (Math.abs(t) < 0.9) px(c, x + 1, y, G.shade(look.wood, -0.3));
        }
        vl(c, 6, 1, H - 2, look.string);
        pv = [3, H / 2];
        break;
      }
      case 'crossbow':
      case 'harpoongun': {
        cv = G.makeCanvas(16, 12);
        const c = cv.ctx;
        c.fillStyle = look.wood; c.fillRect(0, 5, 12, 3);
        c.fillStyle = G.shade(look.wood, -0.3); c.fillRect(0, 7, 12, 1);
        c.fillStyle = look.metal;
        if (look.shape === 'crossbow') { c.fillRect(11, 0, 2, 12); c.fillRect(12, 5, 4, 1); }
        else { c.fillRect(6, 4, 9, 3); c.fillRect(14, 3, 2, 5); }
        pv = [3, 6.5];
        break;
      }
      case 'staff':
      case 'wand': {
        const Ls = look.shape === 'staff' ? 18 : 10;
        cv = G.makeCanvas(Ls + 6, 8);
        const c = cv.ctx;
        hl(c, 0, 4, Ls, look.wood);
        hl(c, 0, 3, Ls, G.shade(look.wood, 0.2));
        c.fillStyle = look.orb; c.fillRect(Ls, 2, 4, 4);
        c.fillStyle = '#ffffff'; c.fillRect(Ls + 1, 2, 1, 1);
        pv = [3, 4];
        break;
      }
      case 'knives': {
        cv = G.makeCanvas(10, 4);
        const c = cv.ctx;
        hl(c, 0, 1, 3, look.hilt); hl(c, 3, 1, 6, look.blade); hl(c, 3, 2, 5, G.shade(look.blade, -0.2));
        pv = [1, 1.5];
        break;
      }
      case 'chakram': {
        cv = G.makeCanvas(12, 12);
        const c = cv.ctx;
        c.strokeStyle = look.metal;
        c.lineWidth = 2;
        c.beginPath(); c.arc(6, 6, 4.2, 0, Math.PI * 2); c.stroke();
        px(c, 6, 1, look.edge); px(c, 10, 6, look.edge); px(c, 1, 6, look.edge); px(c, 6, 10, look.edge);
        pv = [3, 6];
        break;
      }
      case 'shield':
      case 'buckler':
      case 'tower':
      case 'kite': {
        const w = look.shape === 'tower' ? 8 : 10, h = look.shape === 'tower' ? 18 : look.shape === 'kite' ? 14 : 10;
        cv = G.makeCanvas(w + 2, h + 2);
        const c = cv.ctx;
        if (look.shape === 'kite') {
          for (let y = 0; y < h; y++) {
            const half = y < h * 0.45 ? w / 2 : Math.max(0.5, (w / 2) * (1 - (y - h * 0.45) / (h * 0.55)));
            hl(c, Math.round(1 + w / 2 - half), 1 + y, Math.round(half * 2), look.face);
            px(c, Math.round(1 + w / 2 - half), 1 + y, look.rim);
            px(c, Math.round(w / 2 + half), 1 + y, look.rim);
          }
          hl(c, 1, 1, w, look.rim);
        } else if (look.shape === 'shield' || look.shape === 'buckler') {
          G.pixCircle(c, 1 + w / 2 - 0.5, 1 + h / 2 - 0.5, Math.floor(w / 2), look.rim);
          G.pixCircle(c, 1 + w / 2 - 0.5, 1 + h / 2 - 0.5, Math.floor(w / 2) - 1, look.face);
          if (look.shape === 'buckler') { px(c, 1, h / 2, look.boss); px(c, w, h / 2, look.boss); px(c, w / 2, 1, look.boss); px(c, w / 2, h, look.boss); }
          else { hl(c, 2, 3, w - 2, G.shade(look.face, -0.2)); hl(c, 2, 7, w - 2, G.shade(look.face, -0.2)); }
        } else {
          c.fillStyle = look.rim; c.fillRect(1, 1, w, h);
          c.fillStyle = look.face; c.fillRect(2, 2, w - 2, h - 2);
        }
        c.fillStyle = look.boss; c.fillRect(Math.floor(w / 2), Math.floor(h / 2), 2, 2);
        pv = [w / 2, h / 2 + 1];
        break;
      }
      default: {
        cv = G.makeCanvas(10, 10);
        pv = [5, 5];
      }
    }
    return { img: cv, px: pv[0], py: pv[1] };
  }
  G.heldSprite = (id) => {
    const key = 'h:' + id;
    if (spriteCache[key]) return spriteCache[key];
    const d = ITEMS[id];
    const s = buildHeld(d.look);
    spriteCache[key] = s;
    return s;
  };
  function buildIcon(d) {
    const cv = G.makeCanvas(16, 16);
    const c = cv.ctx;
    const look = d.look;
    const rotShapes = ['sword', 'greatsword', 'katana', 'rapier', 'dagger', 'spear', 'trident', 'hammer', 'anchor', 'axe', 'scythe', 'whip', 'club', 'staff', 'wand', 'knives', 'crossbow', 'harpoongun', 'flail'];
    if (rotShapes.includes(look.shape)) {
      const h = buildHeld(look);
      const diag = Math.hypot(h.img.width, h.img.height);
      const s = Math.min(1, 19 / diag);
      c.save();
      c.translate(8, 8);
      c.rotate(-Math.PI / 4);
      c.scale(s, s);
      c.drawImage(h.img, -h.img.width / 2, -h.img.height / 2);
      c.restore();
      if (look.twin) {
        c.save(); c.translate(8, 8); c.rotate(-Math.PI * 0.75); c.scale(s, s); c.drawImage(h.img, -h.img.width / 2, -h.img.height / 2); c.restore();
      }
      if (look.shape === 'flail') {
        G.pixCircle(c, 11, 5, 3, look.ball); px(c, 11, 1, '#ddd'); px(c, 15, 5, '#ddd'); px(c, 7, 5, '#ddd');
        G.pixLine(c, 6, 10, 9, 7, '#888');
      }
      if (look.shape === 'knuckles') {
        c.clearRect(0, 0, 16, 16);
        c.fillStyle = look.wrap; c.fillRect(3, 7, 6, 6);
        c.fillStyle = look.metal; c.fillRect(8, 4, 5, 10); c.fillRect(6, 3, 7, 2);
        c.fillStyle = '#ffffff'; c.fillRect(12, 4, 1, 9);
        c.fillStyle = G.shade(look.metal, -0.3); c.fillRect(8, 7, 5, 1); c.fillRect(8, 10, 5, 1);
      }
      if (look.shape === 'knives') {
        c.save(); c.translate(9, 10); c.rotate(-Math.PI / 4); c.drawImage(h.img, -5, -2); c.restore();
      }
    } else if (['bow', 'longbow', 'shield', 'buckler', 'tower', 'kite', 'chakram'].includes(look.shape)) {
      const h = buildHeld(look);
      const s = Math.min(1, 15 / Math.max(h.img.width, h.img.height));
      c.save();
      c.translate(8, 8);
      if (look.shape === 'bow' || look.shape === 'longbow') c.rotate(Math.PI / 4);
      c.scale(s, s);
      c.drawImage(h.img, -h.img.width / 2, -h.img.height / 2);
      c.restore();
    } else {
      switch (look.shape) {
        case 'bomb':
          G.pixCircle(c, 8, 10, 5, look.glass);
          G.pixCircle(c, 8, 11, 3, look.liquid);
          c.fillStyle = '#c0a080'; c.fillRect(7, 2, 3, 4);
          c.fillStyle = '#ffffff'; c.fillRect(5, 8, 1, 2);

      if (h(tx, ty, 6) < 0.2) R(ctx, px + 2, py + 12, 2, 2, G.mix(base, '#5a8a6a', 0.3));

    block(ctx, px, py, tx, ty, base, dark, light) {
      const v = h(tx, ty, 1);
      const b = v < 0.3 ? G.mix(base, dark, 0.15) : v > 0.85 ? G.mix(base, light, 0.12) : base;
      R(ctx, px, py, TS, TS, b);
      R(ctx, px, py, TS, 1, G.mix(b, light, 0.5));
      R(ctx, px, py, 1, TS, G.mix(b, light, 0.3));

      R(ctx, px + TS - 1, py, 1, TS, dark);
      if (h(tx, ty, 2) < 0.25) { R(ctx, px + 4, py + 5, 1, 4, G.mix(b, dark, 0.5)); R(ctx, px + 5, py + 8, 3, 1, G.mix(b, dark, 0.5)); }
    },
    earth(ctx, px, py, tx, ty, base, dark, light) {
      R(ctx, px, py, TS, TS, base);

  function drawBack(ctx, px, py, tx, ty, L, st) {
    const S = st.back;
    const p = S.pattern;
    const base = S.base, dark = S.dark, light = S.light;

      case 'brick':
        R(ctx, px, py, TS, TS, base);
        for (let row = 0; row < 2; row++) {

          R(ctx, px, y + 7, TS, 1, dark);
          for (let bx = off; bx < TS; bx += 16) R(ctx, px + bx, y, 1, 7, dark);
        }
        break;
      case 'block':
        R(ctx, px, py, TS, TS, base);
        R(ctx, px, py + TS - 1, TS, 1, dark);
        if ((tx + (ty % 2) * 1) % 2 === 0) R(ctx, px + TS - 1, py, 1, TS, dark);
        if (h(tx, ty, 5) < 0.12) R(ctx, px + 3, py + 4, 6, 1, light);
        break;
      case 'plank':
        R(ctx, px, py, TS, TS, base);
        R(ctx, px + 7, py, 1, TS, dark);
        R(ctx, px + 15, py, 1, TS, dark);
        if (ty % 4 === 0) { R(ctx, px, py + 3, TS, 1, dark); R(ctx, px + 3, py + 3, 1, 1, light); R(ctx, px + 11, py + 3, 1, 1, light); }
        if (h(tx, ty, 2) < 0.2) R(ctx, px + 2, py + 6, 3, 1, G.mix(base, light, 0.5));
        break;
      case 'hedge':
        R(ctx, px, py, TS, TS, base);
        for (let i = 0; i < 8; i++) {
          const r = h(tx * 8 + i, ty, 3);
          R(ctx, px + ((r * 14) | 0), py + ((h(tx, ty * 8 + i, 4) * 14) | 0), 3, 2, r < 0.5 ? dark : light);
        }
        break;
      case 'cave':
        R(ctx, px, py, TS, TS, base);
        for (let i = 0; i < 3; i++) {
          const r = h(tx * 3 + i, ty, 7);
          R(ctx, px + ((r * 12) | 0), py + ((h(tx, ty * 3 + i, 8) * 15) | 0), 4, 1, r < 0.5 ? dark : light);
        }
        break;
      case 'gothic': {
        R(ctx, px, py, TS, TS, base);

        if (col === 0) R(ctx, px + 4, py, 8, TS, dark);

  function drawPlatform(ctx, px, py, tx, ty, L, st) {

  function drawLadder(ctx, px, py, tx, ty, L, st) {

  // ================================================================ decorations
  const ANIM_DECOS = new Set(['torch', 'candle', 'lantern', 'mushroom', 'crystal', 'window', 'brazierDeco', 'glowvine', 'bigbell', 'lanternTop', 'waterfall', 'fire']);
  G.ANIM_DECOS = ANIM_DECOS;
  function drawStaticDeco(ctx, d, x, y, L, st) {

  function drawAnimDeco(ctx, d, x, y, t, st, L) {

        }
        const pulse = Math.sin(t * 0.7 + d.v * 5) * 0.1 + 0.9;
        ctx.globalCompositeOperation = 'lighter';

        shaft.addColorStop(0, d.stained ? 'rgba(255,208,160,0.09)' : 'rgba(160,192,255,0.07)');
        shaft.addColorStop(1, 'rgba(0,0,0,0)');

        break;
      }
      case 'glowvine': {
        const pulse = Math.sin(t * 2 + d.v * 7) * 0.5 + 0.5;
        for (let i = 0; i < d.len * 4; i++) R(ctx, x + Math.round(Math.sin(i * 0.3 + t + d.v * 6)), y + i, 1, 1, '#3aa088');
        R(ctx, x - 1, y + d.len * 4, 3, 3, '#6affe0');
        G.addLight(d.x, d.y + d.len * 4, 30 + pulse * 10, '#6affe0', 0.8);

        R(ctx, x - 2, y - 6, 4, 6, '#4a3a2a');
        R(ctx, x - 5, y, 10, 2, '#4a3a2a');
        const f = Math.sin(t * 10 + d.v * 10) * 0.5 + 0.5;

        if (Math.random() < 0.15) G.fx.spawn({ x: d.x + (Math.random() - 0.5) * 6, y: d.y - 18, vx: (Math.random() - 0.5) * 20, vy: -40, life: 0.9, color: '#ffa040', size: 1, type: 'px', add: true });

      case 'lanternTop': {
        // the great Lantern (final area). lit flag controls glow
        const lit = L.lanternLit;
        R(ctx, x - 20, y - 4, 40, 6, '#5a4a30');
        R(ctx, x - 16, y - 50, 4, 46, '#6a5a3a');
        R(ctx, x + 12, y - 50, 4, 46, '#6a5a3a');
        R(ctx, x - 22, y - 56, 44, 6, '#7a6a40');
        R(ctx, x - 14, y - 70, 28, 14, '#5a4a30');
        R(ctx, x - 4, y - 80, 8, 10, '#7a6a40');

        } else {

        ctx.globalAlpha = 0.5;

        break;
