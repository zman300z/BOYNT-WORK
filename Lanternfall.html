<script>
'use strict';
// ============================================================================
// World & entity physics
// ============================================================================
(function () {
  const G = window.G;
  const TS = G.TS;

  class Entity {
    constructor(x, y, w, h) {
      this.x = x;
      this.y = y;
      this.w = w;
      this.h = h;
      this.vx = 0;
      this.vy = 0;
      this.onGround = false;
      this.dead = false;
      this.layer = 1;
      this.solid = false; // blocks other movers
      this.facing = 1;
    }
    get cx() { return this.x + this.w / 2; }
    get cy() { return this.y + this.h / 2; }
    get bottom() { return this.y + this.h; }
    setFeet(x, y) {
      this.x = x - this.w / 2;
      this.y = y - this.h;
    }
    blockedBySolids(nx, ny) {
      for (const s of G.world.solids) {
        if (s === this || s.dead || !s.solid) continue;
        if (this.ignoreSolid && this.ignoreSolid(s)) continue;
        if (nx < s.x + s.w && nx + this.w > s.x && ny < s.y + s.h && ny + this.h > s.y) return s;
      }
      return null;
    }
    moveX(dx) {
      if (!dx) return false;
      const L = G.world.level;
      const steps = Math.max(1, Math.ceil(Math.abs(dx) / 6));
      const s = dx / steps;
      for (let i = 0; i < steps; i++) {
        const nx = this.x + s;
        if (L.rectSolid(nx, this.y, this.w, this.h)) {
          if (s > 0) this.x = Math.floor((nx + this.w) / TS) * TS - this.w - 0.001;
          else this.x = Math.floor(nx / TS) * TS + TS + 0.001;
          if (L.rectSolid(this.x, this.y, this.w, this.h)) this.x = nx - s;
          return true;
        }
        const b = this.blockedBySolids(nx, this.y);
        if (b) {
          if (this.pushSolid && this.pushSolid(b, s) && !this.blockedBySolids(nx, this.y)) { this.x = nx; continue; }
          if (s > 0) this.x = Math.min(this.x, b.x - this.w - 0.001);
          else this.x = Math.max(this.x, b.x + b.w + 0.001);
          return true;
        }
        this.x = nx;
      }
      return false;
    }
    // returns 'floor' | 'ceil' | false
    moveY(dy, dropThrough) {
      if (!dy) return false;
      const L = G.world.level;
      const steps = Math.max(1, Math.ceil(Math.abs(dy) / 6));
      const s = dy / steps;
      for (let i = 0; i < steps; i++) {
        const ny = this.y + s;
        if (s > 0) {
          // one-way platforms
          if (!dropThrough) {
            const oldB = this.y + this.h, newB = ny + this.h;
            const ty = Math.floor((newB - 0.001) / TS);
            const top = ty * TS;
            if (oldB <= top + 0.5 && newB >= top) {
              const x0 = Math.floor(this.x / TS), x1 = Math.floor((this.x + this.w - 0.001) / TS);
              for (let tx = x0; tx <= x1; tx++)
                if (L.isOneWay(tx, ty)) {
                  this.y = top - this.h;
                  return 'floor';
                }
            }
          }
          if (L.rectSolid(this.x, ny, this.w, this.h)) {
            this.y = Math.floor((ny + this.h) / TS) * TS - this.h - 0.001;
            if (L.rectSolid(this.x, this.y, this.w, this.h)) this.y = ny - s;
            return 'floor';
          }
          const b = this.blockedBySolids(this.x, ny);
          if (b) { this.y = b.y - this.h - 0.001; return 'floor'; }
        } else {
          if (L.rectSolid(this.x, ny, this.w, this.h)) {
            this.y = Math.floor(ny / TS) * TS + TS + 0.001;
            if (L.rectSolid(this.x, this.y, this.w, this.h)) this.y = ny - s;
            return 'ceil';
          }
          const b = this.blockedBySolids(this.x, ny);
          if (b) { this.y = b.y + b.h + 0.001; return 'ceil'; }
        }
        this.y = ny;
      }
      return false;
    }
    // is there ground directly under the feet (tile or platform)?
    groundCheck() {
      const L = G.world.level;
      const y = this.y + this.h + 1;
      const ty = Math.floor(y / TS);
      const x0 = Math.floor((this.x + 1) / TS), x1 = Math.floor((this.x + this.w - 1) / TS);
      for (let tx = x0; tx <= x1; tx++) {
        if (L.isSolid(tx, ty)) return true;
        if (L.isOneWay(tx, ty) && this.y + this.h <= ty * TS + 1) return true;
      }
      for (const s of G.world.solids) {
        if (s === this || s.dead || !s.solid) continue;
        if (this.x < s.x + s.w && this.x + this.w > s.x && Math.abs(this.y + this.h - s.y) < 1.5) return true;
      }
      return false;
    }
    // ledge check for AI: is there floor ahead at distance dx?
    floorAhead(dx) {
      const L = G.world.level;
      const x = dx > 0 ? this.x + this.w + dx : this.x + dx;
      const ty = Math.floor((this.y + this.h + 2) / TS);
      const tx = Math.floor(x / TS);
      return L.isSolid(tx, ty) || L.isOneWay(tx, ty);
    }
    wallAhead(dx) {
      const L = G.world.level;
      const x = dx > 0 ? this.x + this.w + dx : this.x + dx;
      return L.rectSolid(x, this.y + 2, 1, this.h - 4) || !!this.blockedBySolids(this.x + dx, this.y);
    }
    update() {}
    draw() {}
  }
  G.Entity = Entity;

  const world = (G.world = {
    level: null,
    player: null,
    ents: [],
    enemies: [],
    solids: [],
    interactables: [],
    time: 0,
    bg: null,
    reset(level) {
      this.level = level;
      this.ents = [];
      this.enemies = [];
      this.solids = [];
      this.interactables = [];
      this.time = 0;
      this.boss = null;
      G.fx.clear();
      G.Ambient.clear();
    },
    add(e) {
      this.ents.push(e);
      if (e.isEnemy) this.enemies.push(e);
      if (e.solid || e.canBeSolid) this.solids.push(e);
      if (e.interact) this.interactables.push(e);
      if (e.onAdd) e.onAdd();
      return e;
    },
    update(dt) {
      this.time += dt;
      const list = this.ents;
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        if (!e.dead) e.update(dt);
      }
      if (this.anyDead) {
        this.ents = this.ents.filter((e) => !e.dead);
        this.enemies = this.enemies.filter((e) => !e.dead);
        this.solids = this.solids.filter((e) => !e.dead);
        this.interactables = this.interactables.filter((e) => !e.dead);
        this.anyDead = false;
      }
    },
    kill(e) {
      e.dead = true;
      this.anyDead = true;
    },
    draw(ctx, cx, cy) {
      const sorted = this.ents.slice().sort((a, b) => a.layer - b.layer);
      for (const e of sorted) {
        if (e.dead) continue;
        if (e.x + e.w < cx - 96 || e.x > cx + G.W + 96 || e.y + e.h < cy - 128 || e.y > cy + G.H + 128) {
          if (!e.alwaysDraw) continue;
        }
        e.draw(ctx, cx, cy);
      }
    },
    enemiesIn(x, y, w, h) {
      const out = [];
      for (const e of this.enemies) {
        if (e.dead || e.dying) continue;
        const hb = e.hurtbox ? e.hurtbox() : e;
        if (x < hb.x + hb.w && x + w > hb.x && y < hb.y + hb.h && y + h > hb.y) out.push(e);
      }
      return out;
    },
    nearestEnemy(x, y, range, filter) {
      let best = null, bd = range;
      for (const e of this.enemies) {
        if (e.dead || e.dying || e.hidden) continue;
        if (filter && !filter(e)) continue;
        const d = Math.hypot(e.cx - x, e.cy - y);
        if (d < bd) { bd = d; best = e; }
      }
      return best;
    },
    // objects hittable by player attacks (breakables, doors, braziers, bells)
    hittablesIn(x, y, w, h) {
      const out = [];
      for (const e of this.ents) {
        if (e.dead || !e.onHit) continue;
        if (x < e.x + e.w && x + w > e.x && y < e.y + e.h && y + h > e.y) out.push(e);
      }
      return out;
    },
  });
})();

</script>
<script>
'use strict';
// ============================================================================
// Combat: statuses, damage helpers, projectiles, explosions, pickups, drops
// ============================================================================
(function () {
  const G = window.G;
  const TS = G.TS;

  // ---------------------------------------------------------------- statuses
  const ST_COLORS = { bleed: '#ff3a3a', poison: '#6ae04a', burn: '#ff9a30', oil: '#6a5a3a', freeze: '#80e8ff', stun: '#ffe060', root: '#8a6a3a', slow: '#6090ff', curse: '#b040ff' };
  G.ST_COLORS = ST_COLORS;
  G.applyStatuses = (t, st, power, opts) => {
    if (!st || t.dead) return;
    opts = opts || {};
    const S = t.st || (t.st = {});
    power = power || 1;
    const resist = t.isBoss ? 0.35 : t.elite ? 0.6 : 1;
    for (const k in st) {
      const v = st[k];
      if (!v) continue;
      switch (k) {
        case 'bleed':
          S.bleed = S.bleed || { n: 0, t: 0, p: 0 };
          S.bleed.n = Math.min(6, S.bleed.n + v);
          S.bleed.t = 4;
          S.bleed.p = Math.max(S.bleed.p * 0.9, power);
          break;
        case 'poison':
          S.poison = S.poison || { n: 0, t: 0, p: 0 };
          S.poison.n = Math.min(8, S.poison.n + v);
          S.poison.t = 6;
          S.poison.p = Math.max(S.poison.p * 0.9, power);
          break;
        case 'burn': {
          S.burn = S.burn || { t: 0, p: 0 };
          const dur = (3 + v * 1.5) * (S.oil && S.oil.t > 0 ? 2 : 1);
          S.burn.t = Math.max(S.burn.t, dur);
          S.burn.p = Math.max(S.burn.p * 0.9, power);
          break;
        }
        case 'oil':
          S.oil = { t: v };
          break;
        case 'freeze':
          if (t.isBoss) { S.slow = { t: Math.max((S.slow && S.slow.t) || 0, v) }; break; }
          S.freeze = { t: Math.max((S.freeze && S.freeze.t) || 0, v * resist) };
          if (t.onFrozen) t.onFrozen();
          break;
        case 'freezeChance':
          if (Math.random() < v) G.applyStatuses(t, { freeze: 1.5 }, power);
          break;
        case 'stun':
          if (t.isBoss) { if (t.addStagger) t.addStagger(v * 20); break; }
          S.stun = { t: Math.max((S.stun && S.stun.t) || 0, v * resist) };
          if (t.onStunned) t.onStunned();
          break;
        case 'root':
          if (t.isBoss) break;
          S.root = { t: Math.max((S.root && S.root.t) || 0, v * resist) };
          break;
        case 'slow':
          S.slow = { t: Math.max((S.slow && S.slow.t) || 0, v) };
          break;
      }
    }
  };
  G.hasSt = (t, k) => !!(t.st && t.st[k] && (t.st[k].t > 0));
  G.isDisabled = (t) => G.hasSt(t, 'stun') || G.hasSt(t, 'freeze') || G.hasSt(t, 'root');
  // tick DoTs; returns nothing. target must implement takeHit
  G.tickStatuses = (t, dt) => {
    const S = t.st;
    if (!S) return;
    S._acc = (S._acc || 0) + dt;
    let dps = 0;
    if (S.bleed && S.bleed.t > 0) dps += S.bleed.n * 4 * S.bleed.p;
    if (S.poison && S.poison.t > 0) dps += S.poison.n * 3 * S.poison.p;
    if (S.burn && S.burn.t > 0) dps += 6 * S.burn.p * (S.oil && S.oil.t > 0 ? 2 : 1);
    if (S._acc >= 0.5) {
      const amt = dps * S._acc;
      S._acc = 0;
      if (amt > 0.05 && !t.dead && !t.dying) {
        const col = S.burn && S.burn.t > 0 ? ST_COLORS.burn : S.poison && S.poison.t > 0 ? ST_COLORS.poison : ST_COLORS.bleed;
        t.takeHit({ dmg: amt, kind: 'dot', team: t.team === 'player' ? 'enemy' : 'player', color: col, noKnock: true });
      }
      // burning spreads
      if (S.burn && S.burn.t > 0 && t.isEnemy && Math.random() < 0.25) {
        for (const o of G.world.enemies) {
          if (o === t || o.dead) continue;
          if (Math.abs(o.cx - t.cx) < 40 && Math.abs(o.cy - t.cy) < 30 && !G.hasSt(o, 'burn')) { G.applyStatuses(o, { burn: 1 }, S.burn.p * 0.7); break; }
        }
      }
    }
    for (const k in S) {
      const s = S[k];
      if (s && typeof s === 'object' && s.t > 0) {
        s.t -= dt;
        if (s.t <= 0) { s.t = 0; if (s.n) s.n = 0; }
      }
    }
    // particles
    if (S.burn && S.burn.t > 0 && Math.random() < 0.5) G.fx.spawn({ x: t.x + Math.random() * t.w, y: t.y + t.h * 0.3 + Math.random() * t.h * 0.6, vx: (Math.random() - 0.5) * 10, vy: -40 - Math.random() * 30, life: 0.5, color: Math.random() < 0.5 ? '#ffb040' : '#ff6020', color2: '#401010', size: 2, size2: 0, add: true });
    if (S.poison && S.poison.t > 0 && Math.random() < 0.15) G.fx.spawn({ x: t.x + Math.random() * t.w, y: t.y + Math.random() * t.h, vy: -15, life: 0.7, color: '#6ae04a', size: 2, size2: 0 });
    if (S.bleed && S.bleed.t > 0 && Math.random() < 0.12) G.fx.spawn({ x: t.x + Math.random() * t.w, y: t.y + Math.random() * t.h * 0.5, vy: 20, grav: 300, life: 0.6, color: '#c01818', size: 1 });
  };
  // draw status icons above an entity
  G.drawStatusIcons = (ctx, t, x, y) => {
    const S = t.st;
    if (!S) return;
    let i = 0;
    for (const k of ['bleed', 'poison', 'burn', 'freeze', 'stun', 'root', 'oil', 'slow']) {
      const s = S[k];
      if (!s || !(s.t > 0)) continue;
      ctx.fillStyle = ST_COLORS[k];
      ctx.fillRect(Math.round(x + i * 5), Math.round(y), 4, 4);
      if (s.n > 1) G.text(ctx, '' + s.n, x + i * 5, y - 8, ST_COLORS[k], { shadow: '#000' });
      i++;
    }
  };

  // ---------------------------------------------------------------- hit fx
  G.hitFx = (x, y, dir, color, big) => {
    const n = big ? 14 : 7;
    G.fx.burst(x, y, n, { color: [color || '#ffffff', '#ffffff'], speed: big ? 220 : 150, life: 0.3, size: 1, type: 'spark', angle: dir > 0 ? 0 : Math.PI, spread: 1.6, drag: 0.06 });
    G.fx.spawn({ x, y, type: 'glow', size: big ? 22 : 14, size2: 4, life: 0.12, color: '#ffffff', add: true });
  };
  G.bloodFx = (x, y, dir, color, n) => {
    G.fx.burst(x, y, n || 6, { color: color || '#8a1a1a', speed: 120, life: 0.6, size: 2, size2: 1, grav: 500, angle: dir > 0 ? -0.4 : Math.PI + 0.4, spread: 1.4, collide: true });
  };
  G.dmgNumber = (x, y, amount, color, crit) => {
    const n = Math.max(1, Math.round(amount));
    G.fx.text(x, y, crit ? n + '!' : '' + n, color || (crit ? '#ffe14a' : '#ffffff'), crit ? 2 : 1, crit ? 0.9 : 0.7);
  };

  // ---------------------------------------------------------------- explosions
  G.explode = (x, y, r, dmg, team, opts) => {
    opts = opts || {};
    G.fx.ring(x, y, r, opts.color || '#ffb050', 0.3, 3);
    G.fx.spawn({ x, y, type: 'glow', size: r * 1.6, size2: r * 0.4, life: 0.25, color: opts.color || '#ff9040', add: true });
    G.fx.burst(x, y, 16, { color: opts.colors || ['#ffd060', '#ff8030', '#ff4020'], speed: r * 5, life: 0.4, size: 2, size2: 0, drag: 0.08, add: true });
    G.fx.burst(x, y, 8, { color: '#3a3030', speed: r * 2, life: 0.9, size: 6, size2: 14, type: 'smoke', drag: 0.05, vy: -20 });
    G.addLight(x, y, r * 4, opts.color || '#ffa050', 1.5);
    G.shake(opts.shake === undefined ? 0.3 : opts.shake);
    if (!opts.silent) G.Audio.play(opts.sfx || 'explosion', { x, y });
    const hits = [];
    if (team === 'player' || team === 'neutral') {
      for (const e of G.world.enemies) {
        if (e.dead || e.dying) continue;
        if (Math.hypot(e.cx - x, e.cy - y) < r + Math.max(e.w, e.h) / 2) {
          e.takeHit({ dmg, kind: opts.kind || 'skill', team: 'player', x, y, dir: e.cx > x ? 1 : -1, knock: opts.knock || 200, statuses: opts.statuses, power: opts.power, item: opts.item, poise: 40 });
          hits.push(e);
        }
      }
    }
    if (team === 'enemy' || team === 'neutral') {
      const p = G.world.player;
      if (p && !p.dead && Math.hypot(p.cx - x, p.cy - y) < r + 8) p.takeHit({ dmg: opts.pdmg || dmg, kind: 'explosion', team: 'enemy', x, y, dir: p.cx > x ? 1 : -1, knock: 220, statuses: opts.pstatuses });
    }
    return hits;
  };

  // lightning bolt visual between two points
  G.boltFx = (x0, y0, x1, y1, color) => {
    const n = 8;
    let px = x0, py = y0;
    for (let i = 1; i <= n; i++) {
      const t = i / n;
      const nx = x0 + (x1 - x0) * t + (i < n ? (Math.random() - 0.5) * 16 : 0);
      const ny = y0 + (y1 - y0) * t + (i < n ? (Math.random() - 0.5) * 16 : 0);
      const steps = Math.ceil(Math.hypot(nx - px, ny - py) / 3);
      for (let k = 0; k < steps; k++) G.fx.spawn({ x: px + ((nx - px) * k) / steps, y: py + ((ny - py) * k) / steps, life: 0.18, color: k % 3 ? color || '#a0d0ff' : '#ffffff', size: 2, size2: 1, add: true });
      px = nx;
      py = ny;
    }
    G.addLight((x0 + x1) / 2, (y0 + y1) / 2, 140, color || '#a0d0ff', 1.3);
  };

  // ---------------------------------------------------------------- projectiles
  class Proj extends G.Entity {
    constructor(o) {
      const w = o.w || 6, h = o.h || 4;
      super(o.x - w / 2, o.y - h / 2, w, h);
      Object.assign(this, o);
      this.w = w;
      this.h = h;
      this.layer = 5;
      this.life = o.life || 3;
      this.age = 0;
      this.hitSet = new Set();
      this.pierce = o.pierce || 0;
      this.grav = o.grav || 0;
      this.alwaysDraw = true;
    }
    get ang() { return Math.atan2(this.vy, this.vx); }
    update(dt) {
      this.age += dt;
      this.life -= dt;
      if (this.life <= 0) return this.expire();
      const L = G.world.level;
      const T = this.type;
      if (this.homing && this.age > 0.2) {
        const tgt = this.team === 'enemy' ? G.world.player : G.world.nearestEnemy(this.cx, this.cy, 260);
        if (tgt && !tgt.dead) {
          const a = Math.atan2(tgt.cy - this.cy, tgt.cx - this.cx);
          const sp = Math.hypot(this.vx, this.vy);
          let cur = this.ang;
          const diff = G.wrapAngle(a - cur);
          cur += G.clamp(diff, -this.homing * dt, this.homing * dt);
          this.vx = Math.cos(cur) * sp;
          this.vy = Math.sin(cur) * sp;
        }
      }
      if (T === 'chakram') {
        const p = G.world.player;
        if (!this.returning && this.age > (this.outTime || 0.45)) { this.returning = true; this.hitSet.clear(); }
        if (this.returning && p) {
          const a = Math.atan2(p.cy - this.cy, p.cx - this.cx);
          const sp = Math.min(520, Math.hypot(this.vx, this.vy) + 900 * dt);
          this.vx = Math.cos(a) * sp;
          this.vy = Math.sin(a) * sp;
          if (Math.hypot(p.cx - this.cx, p.cy - this.cy) < 14) { G.world.kill(this); if (p.chakramBack) p.chakramBack(); return; }
        } else this.vx *= Math.pow(0.2, dt);
      }
      this.vy += this.grav * dt;
      if (T === 'wave' || T === 'shock') {
        // hug the ground
        this.x += this.vx * dt;
        const fx = this.vx > 0 ? this.x + this.w : this.x;
        if (L.solidAt(fx, this.y + this.h / 2) || (!L.solidAt(fx, this.y + this.h + 4) && !L.isOneWay(Math.floor(fx / TS), Math.floor((this.y + this.h + 4) / TS)))) return this.expire();
        if (Math.random() < 0.7) G.fx.spawn({ x: this.cx, y: this.y + this.h, vx: -this.vx * 0.1, vy: -60 - Math.random() * 60, grav: 400, life: 0.4, color: T === 'wave' ? (Math.random() < 0.5 ? '#6ad0e0' : '#ffffff') : (this.color || '#c0a080'), size: 2, size2: 0 });
      } else {
        const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;
        if (!this.ghost && L.rectSolid(nx, ny, this.w, this.h)) {
          if (T === 'bomb' || T === 'grenade' || T === 'bubble' || T === 'glob') {
            if (T === 'grenade' || T === 'glob' || T === 'bubble') { this.x = nx; this.y = ny; return this.expire(); }
            if (L.rectSolid(nx, this.y, this.w, this.h)) this.vx *= -0.5;
            else { this.vy *= -0.45; this.vx *= 0.7; }
          } else if (T === 'chakram' && !this.returning) {
            this.returning = true;
            this.hitSet.clear();
          } else {
            this.x = nx - this.vx * dt * 0.5;
            this.y = ny - this.vy * dt * 0.5;
            return this.expire(true);
          }
        } else { this.x = nx; this.y = ny; }
      }
      // trails
      this.trail();
      // hits
      if (this.team === 'player') {
        const r = this.hitR || 0;
        for (const e of G.world.enemiesIn(this.x - r, this.y - r, this.w + r * 2, this.h + r * 2)) {
          if (this.hitSet.has(e)) continue;
          this.hitSet.add(e);
          this.hitEnemy(e);
          if (this.dead) return;
        }
        for (const o of G.world.hittablesIn(this.x, this.y, this.w, this.h)) {
          if (this.hitSet.has(o) || !o.projHittable) continue;
          this.hitSet.add(o);
          o.onHit({ dmg: this.dmg, kind: 'ranged', dir: Math.sign(this.vx) || 1, proj: this });
          if (!this.pierce) return this.expire();
        }
      } else if (this.team === 'enemy') {
        const p = G.world.player;
        if (p && !p.dead && G.overlap(this, p)) {
          const res = p.takeHit({ dmg: this.dmg, kind: 'ranged', team: 'enemy', x: this.cx - this.vx * 0.05, y: this.cy, dir: Math.sign(this.vx) || (p.cx > this.cx ? 1 : -1), knock: this.knock || 120, statuses: this.statuses, proj: this, unblockable: this.unblockable });
          if (res === 'reflect') {
            this.team = 'player';
            this.vx = -this.vx * 1.3;
            this.vy = -this.vy * 0.5 - 30;
            this.dmg *= p.reflectMult || 1;
            this.hitSet.clear();
            this.life = 2;
            G.Audio.play('parry');
          } else if (res !== 'miss') {
            if (T === 'glob') this.expire();
            else if (!this.pierce) this.expire();
          }
        }
      }
    }
    hitEnemy(e) {
      const p = G.world.player;
      let crit = this.crit;
      if (this.critIf === 'returning' && this.returning) crit = true;
      if (this.critIf === 'far' && p && Math.hypot(e.cx - this.startX, e.cy - this.startY) > 160) crit = true;
      const dmg = p ? p.finalDamage(this.dmg, e, this.item, crit || (this.critIf && p.checkCrit(this.critIf, e, { proj: this }))) : { dmg: this.dmg, crit };
      e.takeHit({ dmg: dmg.dmg, crit: dmg.crit, kind: 'ranged', team: 'player', x: this.cx - this.vx * 0.05, y: this.cy, dir: Math.sign(this.vx) || 1, knock: this.knock === undefined ? 80 : this.knock, statuses: this.statuses, power: this.power, item: this.item, poise: this.poise || 8 });
      if (this.type === 'harpoon' && !e.isBoss && !e.heavy) {
        e.pullTo = { x: p.cx + p.facing * 16, t: 0.3 };
      }
      if (this.type === 'fireball' || this.type === 'grenade') return this.expire();
      if (this.pierce > 0) { this.pierce--; return; }
      this.expire();
    }
    trail() {
      const T = this.type;
      if (T === 'fireball') {
        G.fx.spawn({ x: this.cx, y: this.cy, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30, life: 0.35, color: '#ffa030', color2: '#601010', size: 4, size2: 0, add: true });
        G.addLight(this.cx, this.cy, 70, '#ff8030', 1);
      } else if (T === 'frostbolt') {
        G.fx.spawn({ x: this.cx, y: this.cy, life: 0.3, color: '#a0f0ff', size: 2, size2: 0, add: true });
        G.addLight(this.cx, this.cy, 50, '#80e0ff', 0.8);
      } else if (T === 'orb') {
        G.fx.spawn({ x: this.cx, y: this.cy, life: 0.4, color: this.color || '#60e0c0', size: 3, size2: 0, add: true });
        G.addLight(this.cx, this.cy, 60, this.color || '#60e0c0', 0.9);
      } else if (T === 'crescent' || T === 'chakram') {
        G.fx.spawn({ x: this.cx, y: this.cy, life: 0.15, color: T === 'crescent' ? '#ff90d0' : '#80e0f0', size: 2, size2: 0, add: true });
      } else if (T === 'glob' || T === 'bubble') {
        if (Math.random() < 0.4) G.fx.spawn({ x: this.cx, y: this.cy, vy: 20, life: 0.3, color: this.color || '#8ae04a', size: 2, size2: 0 });
      } else if (T === 'bomb' || T === 'grenade') {
        if (Math.random() < 0.5) G.fx.spawn({ x: this.cx, y: this.cy - 3, vy: -20, life: 0.3, color: '#ffd060', size: 1, add: true });
      } else if (T === 'spore') {
        G.addLight(this.cx, this.cy, 30, '#c090ff', 0.6);
      }
    }
    expire(wall) {
      if (this.dead) return;
      G.world.kill(this);
      const T = this.type;
      if (T === 'fireball' || T === 'grenade' || T === 'bomb') {
        if (this.onExplode) this.onExplode(this);
        else G.explode(this.cx, this.cy, this.aoe || 32, this.dmg, this.team, { statuses: this.statuses, power: this.power, item: this.item, pdmg: this.dmg });
      } else if (T === 'glob') {
        G.world.add(new G.Puddle(this.cx, this.cy, this.puddle || 'poison', this.dmg * 0.5));
        G.Audio.play('splash', { x: this.cx, y: this.cy, vol: 0.5 });
      } else if (T === 'bubble') {
        G.fx.ring(this.cx, this.cy, 16, '#a0e0ff', 0.25, 2);
        G.Audio.play('bubble', { x: this.cx, y: this.cy });
        if (this.puddle) G.world.add(new G.Puddle(this.cx, this.cy, this.puddle, this.dmg * 0.4));
      } else if (T === 'frostbolt') G.fx.burst(this.cx, this.cy, 8, { color: ['#a0f0ff', '#ffffff'], speed: 80, life: 0.3, size: 2, size2: 0 });
      else if (wall && (T === 'arrow' || T === 'bolt' || T === 'earrow' || T === 'knife')) {
        G.fx.spawn({ x: this.cx, y: this.cy, life: 1.2, type: 'shard', size: 3, rot: this.ang, color: '#8a6a4a' });
        G.fx.burst(this.cx, this.cy, 3, { color: '#c0c0c0', speed: 60, life: 0.2, size: 1 });
      } else G.fx.burst(this.cx, this.cy, 4, { color: this.color || '#ffffff', speed: 60, life: 0.25, size: 1 });
    }
    draw(ctx, cx, cy) {
      const x = this.cx - cx, y = this.cy - cy;
      const T = this.type;
      const a = this.ang;
      ctx.save();
      ctx.translate(Math.round(x), Math.round(y));
      switch (T) {
        case 'arrow': case 'earrow':
          ctx.rotate(a);
          ctx.fillStyle = T === 'earrow' ? '#c8a070' : '#d8c090';
          ctx.fillRect(-8, -0.5, 12, 1);
          ctx.fillStyle = '#e0e0e8';
          ctx.fillRect(3, -1, 3, 3);
          ctx.fillStyle = T === 'earrow' ? '#a03030' : '#f0f0f0';
          ctx.fillRect(-9, -1.5, 3, 1); ctx.fillRect(-9, 1, 3, 1);
          break;
        case 'bolt':
          ctx.rotate(a);
          ctx.fillStyle = '#9aa8b0'; ctx.fillRect(-6, -1, 10, 2);
          ctx.fillStyle = '#e8f0f0'; ctx.fillRect(4, -1.5, 3, 3);
          break;
        case 'knife':
          ctx.rotate(this.age * 30);
          ctx.fillStyle = '#d0d8e0'; ctx.fillRect(-4, -1, 6, 2);
          ctx.fillStyle = '#6a2a2a'; ctx.fillRect(-6, -1, 2, 2);
          break;
        case 'thorn':
          ctx.rotate(a);
          ctx.fillStyle = '#a0c060'; ctx.fillRect(-4, -1, 7, 2);
          ctx.fillStyle = '#e0f090'; ctx.fillRect(2, -1, 2, 1);
          break;
        case 'fireball':
          G.pixCircle(ctx, 0, 0, 4, '#ff7020'); G.pixCircle(ctx, 0, 0, 2, '#ffe080');
          break;
        case 'frostbolt':
          ctx.rotate(a);
          ctx.fillStyle = '#80e0ff'; ctx.fillRect(-5, -2, 8, 4);
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, -1, 4, 2);
          break;
        case 'orb':
          G.pixCircle(ctx, 0, 0, 4, this.color || '#40c0a0');
          G.pixCircle(ctx, 0, 0, 2, '#ffffff');
          break;
        case 'chakram':
          ctx.rotate(this.age * 25);
          ctx.strokeStyle = '#60c0d0'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = '#ffffff'; ctx.fillRect(3, -1, 2, 2);
          break;
        case 'harpoon': case 'eharpoon':
          ctx.rotate(a);
          ctx.fillStyle = '#6a5038'; ctx.fillRect(-12, -1, 14, 2);
          ctx.fillStyle = '#b0b8c0'; ctx.fillRect(2, -2, 5, 4); ctx.fillRect(0, -3, 2, 1); ctx.fillRect(0, 2, 2, 1);
          break;
        case 'wave':
          ctx.fillStyle = '#3a9ab0'; ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
          ctx.fillStyle = '#9ae8f0'; ctx.fillRect(-this.w / 2, -this.h / 2, this.w, 2);
          ctx.fillStyle = '#ffffff'; ctx.fillRect(this.vx > 0 ? this.w / 2 - 3 : -this.w / 2, -this.h / 2 - 2, 3, 3);
          break;
        case 'shock':
          ctx.fillStyle = this.color || '#e0c080';
          for (let i = 0; i < 3; i++) ctx.fillRect(-4 + i * 3, this.h / 2 - 4 - ((i * 3 + this.age * 40) % 6), 2, 4 + ((i * 3 + this.age * 40) % 6));
          break;
        case 'crescent':
          ctx.scale(Math.sign(this.vx) || 1, 1);
          ctx.strokeStyle = '#ff90d0'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(-6, 0, 10, -1.1, 1.1); ctx.stroke();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(-5, 0, 10, -0.9, 0.9); ctx.stroke();
          break;
        case 'glob':
          G.pixCircle(ctx, 0, 0, 3, this.color || '#6ab030');
          ctx.fillStyle = '#d0ff90'; ctx.fillRect(-1, -2, 2, 1);
          break;
        case 'bubble':
          ctx.strokeStyle = this.color || '#a0e0ff'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = '#ffffff'; ctx.fillRect(-2, -2, 1, 1);
          break;
        case 'bomb': case 'grenade': {
          const col = this.color || '#3a3a44';
          G.pixCircle(ctx, 0, 0, 4, col);
          ctx.fillStyle = '#ffffff'; ctx.fillRect(-2, -2, 1, 1);
          ctx.fillStyle = '#c0a060'; ctx.fillRect(0, -6, 1, 2);
          if ((this.age * 10) % 2 < 1) { ctx.fillStyle = '#ffe060'; ctx.fillRect(-1, -8, 2, 2); }
          break;
        }
        case 'spore':
          ctx.globalAlpha = 0.8;
          G.pixCircle(ctx, 0, 0, 3, '#b080f0');
          ctx.fillStyle = '#f0d0ff'; ctx.fillRect(-1, -1, 2, 2);
          break;
        case 'feather':
          ctx.rotate(a);
          ctx.fillStyle = '#d0d8e0'; ctx.fillRect(-5, -1, 8, 2);
          ctx.fillStyle = '#8090a0'; ctx.fillRect(-5, 0, 8, 1);
          break;
        case 'blade':
          ctx.rotate(Math.PI / 2);
          ctx.fillStyle = '#80c0ff'; ctx.fillRect(-1, -8, 3, 14);
          ctx.fillStyle = '#ffffff'; ctx.fillRect(-1, -8, 1, 12);
          G.addLight(this.cx, this.cy, 40, '#80c0ff', 0.7);
          break;
        default:
          ctx.fillStyle = this.color || '#ffffff';
          ctx.fillRect(-2, -2, 4, 4);
      }
      ctx.restore();
    }
  }
  G.Proj = Proj;

  // hazardous puddle (poison / brine / fire)
  class Puddle extends G.Entity {
    constructor(x, y, kind, dps) {
      super(x - 18, y - 4, 36, 6);
      this.kind = kind;
      this.dps = Math.max(2, dps || 4);
      this.life = kind === 'fire' ? 3 : 4;
      this.layer = 0;
      this.tick = 0;
      // settle on ground
      const gy = G.world.level.groundBelow(x, y - 4, 200);
      if (gy !== null) this.y = gy - 4;
    }
    update(dt) {
      this.life -= dt;
      if (this.life <= 0) return G.world.kill(this);
      this.tick -= dt;
      const col = this.kind === 'fire' ? '#ff8030' : this.kind === 'brine' ? '#6ae0c0' : '#8ae04a';
      if (Math.random() < 0.3) G.fx.spawn({ x: this.x + Math.random() * this.w, y: this.y + 2, vy: -20 - Math.random() * 20, life: 0.5, color: col, size: 2, size2: 0, add: this.kind === 'fire' });
      if (this.kind === 'fire') G.addLight(this.cx, this.y, 60, '#ff8030', 0.7);
      if (this.tick <= 0) {
        this.tick = 0.4;
        if (this.kind === 'fire') {
          for (const e of G.world.enemiesIn(this.x, this.y - 12, this.w, 16)) G.applyStatuses(e, { burn: 1 }, this.dps / 6);
        } else {
          const p = G.world.player;
          if (p && !p.dead && G.rectsOverlap(this.x, this.y - 8, this.w, 12, p.x, p.y, p.w, p.h)) G.applyStatuses(p, { poison: 1 }, this.dps / 8);
        }
      }
    }
    draw(ctx, cx, cy) {
      const a = Math.min(1, this.life);
      ctx.globalAlpha = a * 0.8;
      const col = this.kind === 'fire' ? '#ff7030' : this.kind === 'brine' ? '#3aa090' : '#5aa030';
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(this.x - cx), Math.round(this.y - cy + 2), this.w, 3);
      ctx.fillRect(Math.round(this.x - cx + 4), Math.round(this.y - cy + 1), this.w - 8, 1);
      ctx.globalAlpha = 1;
    }
  }
  G.Puddle = Puddle;

  // ---------------------------------------------------------------- pickups
  class Coin extends G.Entity {
    constructor(x, y, value, kind) {
      super(x - 3, y - 3, 6, 6);
      this.value = value;
      this.kind = kind || 'gold';
      this.vx = (Math.random() - 0.5) * 160;
      this.vy = -120 - Math.random() * 140;
      this.age = 0;
      this.layer = 4;
    }
    update(dt) {
      this.age += dt;
      const p = G.world.player;
      const magnet = this.age > 0.45 && p && !p.dead;
      if (magnet && Math.hypot(p.cx - this.cx, p.cy - this.cy) < (this.kind === 'ember' ? 120 : 80)) {
        const a = Math.atan2(p.cy - this.cy, p.cx - this.cx);
        this.vx = G.lerp(this.vx, Math.cos(a) * 420, 0.2);
        this.vy = G.lerp(this.vy, Math.sin(a) * 420, 0.2);
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        if (Math.hypot(p.cx - this.cx, p.cy - this.cy) < 10) {
          G.world.kill(this);
          if (this.kind === 'gold') p.addGold(this.value);
          else p.addEmbers(this.value);
        }
        return;
      }
      this.vy = Math.min(this.vy + 900 * dt, 400);
      this.vx *= Math.pow(0.3, dt);
      if (this.moveX(this.vx * dt)) this.vx *= -0.5;
      const r = this.moveY(this.vy * dt);
      if (r === 'floor') { this.vy = Math.abs(this.vy) > 60 ? -this.vy * 0.4 : 0; this.vx *= 0.8; }
      if (this.age > 30) G.world.kill(this);
    }
    draw(ctx, cx, cy) {
      const x = Math.round(this.x - cx), y = Math.round(this.y - cy);
      if (this.kind === 'gold') {
        const s = Math.abs(Math.sin(this.age * 6 + this.value));
        const w = Math.max(1, Math.round(s * 5));
        ctx.fillStyle = '#a07010';
        ctx.fillRect(x + 3 - w / 2, y, w, 6);
        ctx.fillStyle = '#ffd24a';
        ctx.fillRect(x + 3 - w / 2, y, Math.max(1, w - 1), 5);
        if (w > 3) { ctx.fillStyle = '#fff0a0'; ctx.fillRect(x + 2, y + 1, 1, 2); }
      } else {
        const p = Math.sin(this.age * 8) * 0.5 + 0.5;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.6;
        ctx.drawImage(G.glowSprite('#ff8a30'), x - 7, y - 7, 20, 20);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#ff9a3c';
        ctx.fillRect(x + 1, y + 1, 4, 4);
        ctx.fillStyle = p > 0.5 ? '#fff0c0' : '#ffd080';
        ctx.fillRect(x + 2, y + 2, 2, 2);
        G.addLight(this.cx, this.cy, 30, '#ff9a3c', 0.6);
      }
    }
  }
  G.Coin = Coin;

  G.spawnGold = (x, y, total) => {
    total = Math.round(total);
    if (total <= 0) return;
    const n = Math.min(10, Math.max(1, Math.round(total / 6)));
    let left = total;
    for (let i = 0; i < n; i++) {
      const v = i === n - 1 ? left : Math.max(1, Math.round(total / n));
      left -= v;
      if (v > 0) G.world.add(new Coin(x, y, v, 'gold'));
    }
  };
  G.spawnEmbers = (x, y, total) => {
    const n = Math.min(12, total);
    let left = total;
    for (let i = 0; i < n; i++) {
      const v = i === n - 1 ? left : Math.max(1, Math.floor(total / n));
      left -= v;
      if (v > 0) G.world.add(new Coin(x, y, v, 'ember'));
    }
  };

  // loot from a slain enemy
  G.dropLoot = (e) => {
    const tier = G.world.level.tier || 1;
    const p = G.world.player;
    const greed = p && p.hasMut('greed') ? 1.6 : 1;
    let gold = (e.def.gold || 3) * (0.7 + Math.random() * 0.6) * (1 + (tier - 1) * 0.7) * greed;
    if (e.elite) gold *= 6;
    G.spawnGold(e.cx, e.cy, gold);
    let emb = 0;
    if (Math.random() < (e.def.ember || 0.3)) emb = 1 + (Math.random() < 0.35 ? 1 : 0);
    if (e.elite) emb += 8 + Math.floor(Math.random() * 8);
    if (emb) G.spawnEmbers(e.cx, e.cy, emb);
    // blueprints
    for (const id in G.ITEMS) {
      const d = G.ITEMS[id];
      if (!d.bp || d.bp.from !== e.id) continue;
      if (G.save.bpFound[id] || G.save.unlocked[id]) continue;
      if (Math.random() < d.bp.chance * (e.elite ? 4 : 1)) G.world.add(new G.BlueprintDrop(e.cx, e.cy - 6, id));
    }
    if (e.elite) {
      const pool = G.itemPool();
      const it = G.makeItem(G.rng.pick(pool), tier, G.rng, { bonus: 0.4 });
      G.world.add(new G.ItemDrop(e.cx, e.y + e.h, it, { pop: true }));
      if (Math.random() < 0.5) {
        // elites often carry an unfound blueprint
        const locked = Object.keys(G.ITEMS).filter((id) => G.ITEMS[id].bp && !G.ITEMS[id].bossItem && G.ITEMS[id].bp.from !== 'guardian' && !G.save.bpFound[id] && !G.save.unlocked[id]);
        if (locked.length) G.world.add(new G.BlueprintDrop(e.cx, e.cy - 10, G.rng.pick(locked)));
      }
    }
    if (Math.random() < 0.025) G.world.add(new G.FoodDrop(e.cx, e.y + e.h, tier));
  };
})();

</script>
<script>
'use strict';
// ============================================================================
// Player: "the Wick" — movement, combat, skills, health, drawing
// ============================================================================
(function () {
  const G = window.G;
  const TS = G.TS;
  const GRAV = 1400, MAXFALL = 480, RUN = 150, JUMP_V = 400, DJUMP_V = 370;
  const ROLL_V = 290, ROLL_T = 0.32;
  const NOINPUT = { down: {}, pressed: {}, released: {} };

  class Player extends G.Entity {
    constructor() {
      super(0, 0, 10, 22);
      this.layer = 3;
      this.team = 'player';
      this.alwaysDraw = true;
      this.baseHp = 100;
      this.maxHp = 100;
      this.hp = 100;
      this.rally = 0;
      this.rallyT = 0;
      this.state = 'normal';
      this.stateT = 0;
      this.airJumps = 0;
      this.coyote = 0;
      this.jumpBuf = 0;
      this.dropT = 0;
      this.invuln = 0;
      this.flashT = 0;
      this.rollCd = 0;
      this.lastRollEnd = -99;
      this.weapons = [null, null];
      this.skills = [null, null];
      this.cds = [0, 0];
      this.cdMax = [1, 1];
      this.ammo = [0, 0];
      this.reload = [0, 0];
      this.flaskMax = 1;
      this.flask = 1;
      this.healLeft = 0;
      this.gold = 0;
      this.embers = 0;
      this.stats = { fury: 0, cunning: 0, vigor: 0 };
      this.scrolls = 0;
      this.muts = [];
      this.curse = 0;
      this.st = {};
      this.atk = null;
      this.lastAtk = null;
      this.kindledT = 0;
      this.nextCritT = 0;
      this.deathsDoorUsed = false;
      this.ward = null;
      this.anim = { run: 0, t: 0, land: 0, bob: 0 };
      this.scarf = [];
      for (let i = 0; i < 7; i++) this.scarf.push({ x: 0, y: 0, px: 0, py: 0 });
      this.control = true;
      this.chakramOut = [false, false];
      this.wallDir = 0;
      this.wallLock = 0;
      this.kills = 0;
      this.stepT = 0;
    }
    // ------------------------------------------------------------ stats
    recalc() {
      const s = this.stats;
      const old = this.maxHp;
      this.maxHp = Math.round(this.baseHp + this.scrolls * 10 + s.vigor * 12);
      if (this.maxHp > old) this.hp += this.maxHp - old;
      this.hp = Math.min(this.hp, this.maxHp);
      this.flaskMax = 1 + (G.hasUpgrade('flask1') ? 1 : 0) + (G.hasUpgrade('flask2') ? 1 : 0) + (G.hasUpgrade('flask3') ? 1 : 0) + (this.hasMut('alchemy') ? 1 : 0);
      this.flask = Math.min(this.flask, this.flaskMax);
    }
    statMult(stats) {
      let lv = 0;
      for (const k of stats) lv = Math.max(lv, this.stats[k] || 0);
      return 1 + 0.15 * lv;
    }
    hasMut(id) {
      return this.muts.includes(id);
    }
    dominantStat() {
      const s = this.stats;
      if (s.fury === 0 && s.cunning === 0 && s.vigor === 0) return null;
      if (s.fury >= s.cunning && s.fury >= s.vigor) return 'fury';
      if (s.cunning >= s.vigor) return 'cunning';
      return 'vigor';
    }
    atkSpeed(def) {
      let s = 1;
      if (this.hasMut('frenzy')) s += 0.18;
      const inst = this.atk && this.atk.inst;
      if (inst) s += (G.itemMods(inst).aspd || 0) / 100;
      if (def && def.kind === 'ranged' && this.hasMut('quiver')) s += 0.2;
      if (G.hasSt(this, 'slow')) s *= 0.7;
      return s;
    }
    runSpeed() {
      let s = RUN * (this.hasMut('quickwick') ? 1.15 : 1);
      if (G.hasSt(this, 'slow')) s *= 0.6;
      return s;
    }
    addGold(v) {
      this.gold += v;
      G.Audio.play('gold', { vol: 0.6 });
      G.game.goldFlash = 0.4;
    }
    addEmbers(v) {
      if (this.hasMut('embersoul')) v += 1;
      G.game.hint('embers', '[ember]Embers[] are lost when you fall. Spend them with the Keeper in the passage between biomes.');
      this.embers += v;
      G.Audio.play('ember', { vol: 0.7 });
      G.game.emberFlash = 0.4;
      G.game.stats.embers += v;
    }
    heal(v, silent) {
      const before = this.hp;
      this.hp = Math.min(this.maxHp, this.hp + v);
      this.rally = Math.max(0, this.rally - (this.hp - before));
      if (!silent && this.hp - before >= 1) G.fx.text(this.cx, this.y - 6, '+' + Math.round(this.hp - before), '#70e070', 1, 0.7);
    }

    // ------------------------------------------------------------ damage out
    checkCrit(cond, e, ctx) {
      if (!cond) return false;
      switch (cond) {
        case 'lastHit': return !!(ctx && ctx.last);
        case 'behind': return e.facing !== undefined && Math.sign(this.cx - e.cx) === -e.facing;
        case 'burning': return G.hasSt(e, 'burn');
        case 'bleeding': return G.hasSt(e, 'bleed');
        case 'poisoned': return G.hasSt(e, 'poison');
        case 'frozen': return G.hasSt(e, 'freeze');
        case 'stunned': return G.hasSt(e, 'stun') || (e.isBoss && e.staggered > 0);
        case 'disabled': return G.isDisabled(e) || (e.isBoss && e.staggered > 0);
        case 'afterRoll': return G.world.time - this.lastRollEnd < 1.0 || this.state === 'roll';
        case 'lowHp': return e.hp < e.maxHp * 0.4;
        case 'charged': return !!(ctx && ctx.charged);
        case 'close': return Math.hypot(e.cx - this.cx, e.cy - this.cy) < 70;
        case 'tip': return ctx && ctx.box && Math.abs(e.cx - this.cx) > ctx.reach * 0.6;
        default: return false;
      }
    }
    finalDamage(base, e, inst, crit) {
      let d = base;
      const m = inst ? G.itemMods(inst) : {};
      const def = inst ? G.ITEMS[inst.id] : null;
      if (m.vsBleed && G.hasSt(e, 'bleed')) d *= 1 + m.vsBleed / 100;
      if (m.vsBurn && G.hasSt(e, 'burn')) d *= 1 + m.vsBurn / 100;
      if (m.vsPoison && G.hasSt(e, 'poison')) d *= 1 + m.vsPoison / 100;
      if (m.vsDisabled && G.isDisabled(e)) d *= 1 + m.vsDisabled / 100;
      if (m.fullHp && this.hp >= this.maxHp - 0.5) d *= 1 + m.fullHp / 100;
      if (m.elite && (e.elite || e.isBoss)) d *= 1 + m.elite / 100;
      if (m.air && !this.onGround) d *= 1 + m.air / 100;
      if (this.kindledT > 0) d *= 1.35;
      if (this.hasMut('laststand') && this.hp < this.maxHp * 0.4) d *= 1.45;
      if (this.hasMut('hunter') && (e.elite || e.isBoss)) d *= 1.3;
      if (def && def.kind === 'ranged' && this.hasMut('quiver')) d *= 1.3;
      if (!crit) {
        let cc = (m.crit || 0) / 100 + (this.hasMut('tidesense') ? 0.1 : 0);
        if (cc > 0 && G.rng.next() < cc) crit = true;
      }
      if (this.nextCritT > 0) { crit = true; this.nextCritT = 0; }
      if (crit) d *= (def && def.critMult) || 2;
      return { dmg: d, crit };
    }
    itemStatuses(inst, extra) {
      const def = G.ITEMS[inst.id];
      const m = G.itemMods(inst);
      const st = Object.assign({}, def.onHit || {}, extra || {});
      if (m.bleed) st.bleed = (st.bleed || 0) + 1;
      if (m.burn) st.burn = (st.burn || 0) + 1;
      if (m.poison) st.poison = (st.poison || 0) + 1;
      if (m.chill) st.freezeChance = Math.max(st.freezeChance || 0, m.chill / 100);
      if (m.skillStun) st.stun = Math.max(st.stun || 0, 0.8);
      return st;
    }
    power(inst) {
      const def = G.ITEMS[inst.id];
      return G.itemPower(inst) * this.statMult(def.stats);
    }
    dotPower(inst) {
      const def = G.ITEMS[inst.id];
      return G.itemScale(inst.tier) * this.statMult(def.stats);
    }
    onDealtDamage(amount) {
      if (this.rally > 0) {
        const mult = this.hasMut('secondwind') ? 2 : 1;
        const r = Math.min(this.rally, Math.max(1, amount * 0.3 * mult));
        this.rally -= r;
        this.hp = Math.min(this.maxHp, this.hp + r);
      }
    }
    onKill(e) {
      this.kills++;
      G.game.stats.kills++;
      if (this.hasMut('kindled')) this.kindledT = 4;
      if (this.hasMut('leech')) this.heal(this.maxHp * 0.03, true);
      const inst = e.lastItem;
      if (inst) {
        const m = G.itemMods(inst);
        if (m.killHeal) this.heal(this.maxHp * m.killHeal / 100, true);
        if (m.killBoom) G.explode(e.cx, e.cy, 36, this.power(inst) * 0.8, 'player', { shake: 0.15 });
      }
      if (this.curse > 0) {
        this.curse--;
        if (this.curse === 0) {
          G.game.notify('[purple]The curse is lifted![]');
          G.Audio.play('solved');
          G.fx.burst(this.cx, this.cy, 30, { color: ['#c080ff', '#ffffff'], speed: 160, life: 0.8, size: 2, add: true });
        }
      }
    }

    // ------------------------------------------------------------ update
    input() {
      return this.control && G.game.canControl() ? G.Input : NOINPUT;
    }
    update(dt) {
      const I = this.input();
      const W = G.world;
      this.stateT += dt;
      if (this.invuln > 0) this.invuln -= dt;
      if (this.flashT > 0) this.flashT -= dt;
      if (this.rollCd > 0) this.rollCd -= dt;
      if (this.kindledT > 0) this.kindledT -= dt;
      if (this.nextCritT > 0) this.nextCritT -= dt;
      if (this.dropT > 0) this.dropT -= dt;
      if (this.wallLock > 0) this.wallLock -= dt;
      for (let i = 0; i < 2; i++) {
        if (this.cds[i] > 0) this.cds[i] -= dt;
        if (this.reload[i] > 0) { this.reload[i] -= dt; if (this.reload[i] <= 0) this.ammo[i] = 0; }
      }
      if (this.ward) { this.ward.t -= dt; if (this.ward.t <= 0) this.ward = null; }
      // rally decay
      if (this.rally > 0) {
        this.rallyT -= dt;
        if (this.rallyT <= 0) this.rally = Math.max(0, this.rally - this.maxHp * (this.hasMut('secondwind') ? 0.04 : 0.08) * dt);
      }
      // flask healing over time
      if (this.healLeft > 0) {
        const h = Math.min(this.healLeft, this.maxHp * 0.9 * dt);
        this.healLeft -= h;
        this.hp = Math.min(this.maxHp, this.hp + h);
        this.rally = Math.max(0, this.rally - h);
        if (Math.random() < 0.4) G.fx.spawn({ x: this.x + Math.random() * this.w, y: this.y + this.h, vy: -40, life: 0.6, color: '#70f070', size: 2, size2: 0, add: true });
      }
      G.tickStatuses(this, dt);
      if (this.dead) return;
      // hazards
      if (W.level.rectHazard(this.x + 2, this.y, this.w - 4, this.h) && this.invuln <= 0 && this.state !== 'dead') {
        const tier = Math.max(1, W.level.tier || 1);
        this.takeHit({ dmg: 12 * G.TIER_DMG[tier], kind: 'hazard', team: 'enemy', x: this.cx, dir: -this.facing, knock: 60, knockUp: 330 });
      }
      const frozen = G.hasSt(this, 'freeze') || G.hasSt(this, 'stun');
      if (frozen && this.state !== 'dead') {
        this.vx = G.approach(this.vx, 0, 1200 * dt);
        this.gravity(dt);
        this.physics(dt, false);
        this.atk = null;
        if (this.state !== 'hurt') this.state = 'normal';
        return;
      }
      switch (this.state) {
        case 'normal': this.stNormal(dt, I); break;
        case 'attack': this.stNormal(dt, I, true); this.updateAttack(dt, I); break;
        case 'roll': this.stRoll(dt, I); break;
        case 'climb': this.stClimb(dt, I); break;
        case 'cling': this.stCling(dt, I); break;
        case 'hurt':
          this.gravity(dt);
          this.vx = G.approach(this.vx, 0, 500 * dt);
          this.physics(dt, false);
          if (this.stateT > 0.22) this.state = 'normal';
          break;
        case 'heal':
          this.stNormal(dt, I, true, 0.35);
          if (this.stateT > 0.5) this.state = 'normal';
          break;
        case 'stomp': this.stStomp(dt); break;
        case 'cast':
          this.stNormal(dt, I, true, 0.3);
          if (this.stateT > 0.16) this.state = 'normal';
          break;
        case 'dead':
          this.gravity(dt);
          this.vx *= 0.9;
          this.physics(dt, false);
          break;
        case 'cutscene':
          this.gravity(dt);
          this.vx = G.approach(this.vx, this.autoWalk || 0, 1200 * dt);
          if (this.autoWalk) this.facing = Math.sign(this.autoWalk);
          this.physics(dt, false);
          break;
      }
      this.updateAnim(dt);
    }
    gravity(dt, mult) {
      this.vy = Math.min(MAXFALL, this.vy + GRAV * (mult || 1) * dt);
    }
    physics(dt, allowMantle) {
      const wasGround = this.onGround;
      const hitX = this.moveX(this.vx * dt);
      if (hitX && allowMantle && !this.onGround && this.vy > -120) this.tryMantle();
      const r = this.moveY(this.vy * dt, this.dropT > 0 || this.state === 'climb');
      if (r === 'floor') {
        if (this.vy > 300) {
          G.Audio.play('land', { vol: Math.min(1, this.vy / 480) });
          G.fx.burst(this.cx, this.bottom, 5, { color: '#a09a90', speed: 50, life: 0.3, size: 1, angle: -Math.PI / 2, spread: 2.5 });
          this.anim.land = 0.12;
        }
        this.vy = 0;
      } else if (r === 'ceil') {
        // corner correction
        if (this.vy < -100) {
          const L = G.world.level;
          for (const off of [4, -4, 7, -7]) {
            if (!L.rectSolid(this.x + off, this.y - 3, this.w, this.h)) { this.x += off; this.y -= 3; return; }
          }
        }
        this.vy = Math.max(0, this.vy);
      }
      this.onGround = this.vy >= 0 && this.groundCheck();
      if (this.onGround) { this.airJumps = 0; this.coyote = 0.1; }
      else if (wasGround) { /* coyote runs */ }
    }
    tryMantle() {
      const L = G.world.level;
      const f = this.facing;
      const fx = f > 0 ? this.x + this.w + 2 : this.x - 2;
      const tx = Math.floor(fx / TS);
      const feet = this.y + this.h;
      const ty = Math.floor((feet - 2) / TS);
      for (const t of [ty, ty - 1]) {
        const top = t * TS;
        if (L.isSolid(tx, t) && !L.isSolid(tx, t - 1) && !L.isSolid(tx, t - 2) && feet - top < 14 && feet - top > -2) {
          const nx = f > 0 ? tx * TS + 1 : tx * TS + TS - this.w - 1;
          if (!L.rectSolid(nx, top - this.h - 0.5, this.w, this.h)) {
            this.x = nx;
            this.y = top - this.h - 0.01;
            this.vy = 0;
            this.onGround = true;
            this.anim.land = 0.1;
            return true;
          }
        }
      }
      return false;
    }
    onLadderTile() {
      const L = G.world.level;
      const tx = Math.floor(this.cx / TS);
      const ty0 = Math.floor((this.y + 4) / TS), ty1 = Math.floor((this.y + this.h - 1) / TS);
      for (let ty = ty0; ty <= ty1; ty++) if (L.isLadder(tx, ty)) return tx;
      return -1;
    }
    stNormal(dt, I, attacking, slowMult) {
      const L = G.world.level;
      const dir = (I.down.right ? 1 : 0) - (I.down.left ? 1 : 0);
      let speed = this.runSpeed();
      let mult = slowMult !== undefined ? slowMult : 1;
      if (attacking && this.atk) {
        const a = this.atk;
        if (a.kind === 'melee') mult = this.onGround ? (a.phase === 'a' ? 0.1 : 0.25) : 0.7;
        else if (a.kind === 'ranged') mult = this.onGround ? 0.35 : 0.75;
        else if (a.kind === 'shield') mult = (a.def.slow || 0.45);
      }
      if (this.wallLock > 0 && dir === this.wallDir) mult = 0;
      const target = dir * speed * mult;
      const acc = this.onGround ? (dir ? 1500 : 2400) : 1000;
      this.vx = G.approach(this.vx, target, acc * dt);
      if (dir && (!attacking || !this.atk || this.atk.canTurn)) this.facing = dir;
      if (this.coyote > 0) this.coyote -= dt;
      if (I.pressed.jump) this.jumpBuf = 0.12;
      else if (this.jumpBuf > 0) this.jumpBuf -= dt;
      // ladders
      if (!attacking && (I.down.up || I.down.down)) {
        const tx = this.onLadderTile();
        const below = this.onGround && I.down.down && L.isLadder(Math.floor(this.cx / TS), Math.floor((this.bottom + 2) / TS));
        if ((tx >= 0 && (I.down.up || !this.onGround)) || below) {
          const lx = (below ? Math.floor(this.cx / TS) : tx) * TS + TS / 2;
          if (Math.abs(lx - this.cx) < 9) {
            this.x = lx - this.w / 2;
            this.state = 'climb';
            this.stateT = 0;
            this.vx = 0;
            if (below) this.y += 3;
            return;
          }
        }
      }
      // drop through
      if (this.jumpBuf > 0 && I.down.down && this.onGround) {
        const tyB = Math.floor((this.bottom + 1) / TS);
        const x0 = Math.floor((this.x + 1) / TS), x1 = Math.floor((this.x + this.w - 1) / TS);
        let oneWay = true;
        for (let tx = x0; tx <= x1; tx++) if (L.isSolid(tx, tyB)) oneWay = false;
        if (oneWay) { this.dropT = 0.2; this.jumpBuf = 0; this.onGround = false; this.y += 1; }
      }
      // jumps
      const canAct = !attacking || !this.atk || this.atk.phase === 'r' || this.atk.kind === 'shield' || this.atk.phase === 'pre';
      if (this.jumpBuf > 0 && canAct) {
        if (this.onGround || this.coyote > 0) {
          this.cancelAtk();
          this.vy = -JUMP_V;
          this.jumpBuf = 0;
          this.coyote = 0;
          this.onGround = false;
          G.Audio.play('jump', { vol: 0.8 });
          G.fx.burst(this.cx, this.bottom, 4, { color: '#a09a90', speed: 40, life: 0.25, size: 1, angle: Math.PI / 2, spread: 2 });
        } else if (I.down.down && this.state !== 'stomp') {
          this.jumpBuf = 0;
          this.cancelAtk();
          this.state = 'stomp';
          this.stateT = 0;
          this.vy = -120;
          this.vx = 0;
          return;
        } else if (this.airJumps < 1) {
          this.cancelAtk();
          this.airJumps++;
          this.vy = -DJUMP_V;
          this.jumpBuf = 0;
          G.Audio.play('djump', { vol: 0.8 });
          G.fx.ring(this.cx, this.bottom, 10, '#ffb060', 0.25, 2);
          G.fx.burst(this.cx, this.bottom, 8, { color: ['#ffb060', '#ff7030'], speed: 70, life: 0.3, size: 1, angle: Math.PI / 2, spread: 2, add: true });
        }
      }
      if (I.released.jump && this.vy < -150) this.vy *= 0.5;
      this.gravity(dt);
      this.physics(dt, true);
      // wall cling (spider rune)
      if (G.save.runes.spider && !this.onGround && this.vy > 20 && dir !== 0 && !attacking && this.wallLock <= 0) {
        if (this.wallAhead(dir * 1.5)) {
          this.state = 'cling';
          this.stateT = 0;
          this.wallDir = dir;
          this.airJumps = 0;
          return;
        }
      }
      if (this.state === 'climb') return;
      // actions
      if (I.pressed.roll && this.rollCd <= 0 && (canAct || (this.atk && this.atk.phase === 'w'))) return this.startRoll(dir);
      if (this.state === 'normal' || (this.state === 'attack' && this.atk && this.atk.phase === 'r')) {
        if (I.pressed.attack1 && this.state === 'normal') this.startAttack(0);
        else if (I.pressed.attack2 && this.state === 'normal') this.startAttack(1);
      }
      if (this.state === 'normal') {
        if (I.pressed.skill1) this.useSkill(0);
        else if (I.pressed.skill2) this.useSkill(1);
        else if (I.pressed.heal) this.drinkFlask();
      }
      // footsteps
      if (this.onGround && Math.abs(this.vx) > 60) {
        this.stepT -= dt;
        if (this.stepT <= 0) { this.stepT = 0.28; G.Audio.play('step', { vol: 0.5 }); }
      }
    }
    stRoll(dt, I) {
      const sp = ROLL_V * (this.hasMut('quickwick') ? 1.15 : 1);
      this.vx = this.facing * sp * (this.stateT > ROLL_T * 0.75 ? 0.6 : 1);
      this.gravity(dt);
      this.physics(dt, true);
      this.rollIframe = this.stateT > 0.01 && this.stateT < ROLL_T - 0.03;
      if (this.hasMut('scorched') && Math.random() < 0.3 && this.onGround) {
        if (!this._lastFire || G.world.time - this._lastFire > 0.12) {
          this._lastFire = G.world.time;
          G.world.add(new G.Puddle(this.cx, this.bottom, 'fire', this.weapons[0] ? this.dotPower(this.weapons[0]) * 6 : 6));
        }
      }
      if (Math.random() < 0.6) G.fx.spawn({ x: this.cx - this.facing * 4, y: this.cy, vx: -this.facing * 30, life: 0.25, color: '#ffa050', size: 2, size2: 0, add: true });
      if (I.pressed.jump && this.onGround && this.stateT > 0.08) {
        this.state = 'normal';
        this.jumpBuf = 0.12;
        this.lastRollEnd = G.world.time;
        return;
      }
      if (this.stateT >= ROLL_T) {
        this.state = 'normal';
        this.rollIframe = false;
        this.lastRollEnd = G.world.time;
        this.vx *= 0.5;
      }
    }
    startRoll(dir) {
      this.cancelAtk();
      if (dir) this.facing = dir;
      this.state = 'roll';
      this.stateT = 0;
      this.rollCd = ROLL_T + (this.hasMut('quickwick') ? 0.08 : 0.2);
      G.Audio.play('roll', { vol: 0.7 });
      G.fx.burst(this.cx, this.bottom, 5, { color: '#a09a90', speed: 50, life: 0.3, size: 1, angle: this.facing > 0 ? Math.PI : 0, spread: 1 });
    }
    stClimb(dt, I) {
      const L = G.world.level;
      const dirY = (I.down.down ? 1 : 0) - (I.down.up ? 1 : 0);
      this.vy = dirY * 130;
      this.vx = 0;
      const beforeY = this.y;
      this.moveY(this.vy * dt, true);
      if (dirY && Math.floor(this.y / 6) !== Math.floor(beforeY / 6)) G.Audio.play('ladder', { vol: 0.5 });
      const tx = Math.floor(this.cx / TS);
      const onL = this.onLadderTile() >= 0;
      // reached top: stand on the ladder top
      if (dirY < 0) {
        const feetT = Math.floor((this.bottom - 1) / TS);
        if (!L.isLadder(tx, feetT) && L.isOneWay(tx, feetT + 1)) { this.y = (feetT + 1) * TS - this.h - 0.01; this.state = 'normal'; this.vy = 0; this.onGround = true; return; }
      }
      if (!onL) { this.state = 'normal'; return; }
      if (dirY > 0 && this.groundCheck() && !L.isLadder(tx, Math.floor((this.bottom + 2) / TS))) { this.state = 'normal'; return; }
      if (I.pressed.jump) {
        const dir = (I.down.right ? 1 : 0) - (I.down.left ? 1 : 0);
        this.state = 'normal';
        this.vy = dir ? -300 : -150;
        this.vx = dir * 120;
        this.dropT = 0.15;
        if (dir) this.facing = dir;
        return;
      }
      if (I.pressed.roll && (I.down.left || I.down.right)) { this.state = 'normal'; this.startRoll((I.down.right ? 1 : 0) - (I.down.left ? 1 : 0)); }
      if (I.pressed.attack1 || I.pressed.attack2) { this.state = 'normal'; this.startAttack(I.pressed.attack1 ? 0 : 1); }
    }
    stCling(dt, I) {
      const dir = (I.down.right ? 1 : 0) - (I.down.left ? 1 : 0);
      this.vy = Math.min(this.vy + 800 * dt, 50);
      this.vx = this.wallDir * 30;
      this.facing = -this.wallDir;
      this.physics(dt, false);
      if (Math.random() < 0.2) G.fx.spawn({ x: this.wallDir > 0 ? this.x + this.w : this.x, y: this.y + 4, vy: 30, life: 0.3, color: '#a09a90', size: 1 });
      if (I.pressed.jump) {
        this.state = 'normal';
        this.vy = -390;
        this.vx = -this.wallDir * 210;
        this.facing = -this.wallDir;
        this.wallLock = 0.16;
        this.airJumps = 0;
        this.jumpBuf = 0;

      }
      if (this.onGround || dir !== this.wallDir || !this.wallAhead(this.wallDir * 1.5)) this.state = 'normal';
    }
    stStomp(dt) {
      this.invuln = Math.max(this.invuln, 0.05);
      if (this.stateT < 0.12) { this.vy = G.approach(this.vy, 0, 2000 * dt); this.moveY(this.vy * dt); return; }
      this.vy = 640;
      const r = this.moveY(this.vy * dt, this.dropT > 0);
      G.fx.spawn({ x: this.cx, y: this.y, life: 0.2, color: '#ffb060', size: 3, size2: 0, add: true });
      if (r === 'floor' || this.groundCheck()) {
        this.vy = 0;
        this.onGround = true;
        this.state = 'normal';
        this.invuln = 0.25;
        const L = G.world.level;
        // Ram rune: shatter rune-marked floor
        if (G.save.runes.ram) {
          const tyB = Math.floor((this.bottom + 2) / TS);
          let broke = false;
          for (let tx = Math.floor((this.x - 8) / TS); tx <= Math.floor((this.x + this.w + 8) / TS); tx++)
            for (let ty = tyB; ty <= tyB + 1; ty++)
              if (L.get(tx, ty) === G.T.RAM) { L.breakAt(tx, ty); broke = true; }
          if (broke) { G.Audio.play('crumble'); G.shake(0.5); this.onGround = false; }
        } else {
          const tyB = Math.floor((this.bottom + 2) / TS);

            G.game.ramHintShown = true;
            G.game.notify('The cracked floor holds firm. You need the [orange]Rune of Ruin[].');
          }
        }
        const tier = G.world.level.tier || 1;
        const best = Math.max(this.stats.fury, this.stats.cunning, this.stats.vigor);
        const dmg = 16 * G.itemScale(Math.max(1, tier)) * (1 + 0.15 * best);
        for (const e of G.world.enemiesIn(this.cx - 30, this.bottom - 24, 60, 30)) e.takeHit({ dmg, kind: 'melee', team: 'player', x: this.cx, y: this.cy, dir: e.cx > this.cx ? 1 : -1, knock: 200, knockUp: 200, statuses: { stun: 1 }, poise: 50 });
        G.Audio.play('stomp');
        G.shake(0.35);
        G.fx.burst(this.cx, this.bottom, 14, { color: ['#c0b8a8', '#ffb060'], speed: 160, life: 0.4, size: 2, angle: -Math.PI / 2, spread: 2.8, grav: 400 });

      }
    }

    // ------------------------------------------------------------ attacks
    cancelAtk() {
      if (this.atk && this.atk.kind === 'melee') this.lastAtk = { slot: this.atk.slot, step: this.atk.step, end: G.world.time };
      this.atk = null;
      if (this.state === 'attack') this.state = 'normal';
    }
    startAttack(slot) {
      const inst = this.weapons[slot];
      if (!inst) return;
      const def = G.ITEMS[inst.id];
      const I = this.input();
      const dir = (I.down.right ? 1 : 0) - (I.down.left ? 1 : 0);
      if (dir) this.facing = dir;
      if (def.kind === 'melee') {
        let step = 0;
        const la = this.lastAtk;
        if (la && la.slot === slot && G.world.time - la.end < 0.5 && la.step < def.combo.length - 1) step = la.step + 1;
        this.atk = { slot, inst, def, kind: 'melee', step, phase: def.chargeable && step === 0 ? 'pre' : 'w', t: 0, hit: new Set(), queued: false, charge: 0, canTurn: true };
      } else if (def.kind === 'ranged') {
        if (this.reload[slot] > 0) { G.Audio.play('uiDeny', { vol: 0.4 }); return; }
        if (def.shot.type === 'chakram' && this.chakramOut[slot]) return;
        this.atk = { slot, inst, def, kind: 'ranged', phase: 'w', t: 0, shots: 0, canTurn: true };
        if (def.charge) G.Audio.play('bowDraw');
      } else if (def.kind === 'shield') {
        this.atk = { slot, inst, def, kind: 'shield', phase: 'up', t: 0, canTurn: true };
        G.Audio.play('shield');
      }
      this.state = 'attack';
      this.stateT = 0;
    }
    held(slot) {
      const I = this.input();
      return slot === 0 ? I.down.attack1 : I.down.attack2;
    }
    pressedSlot(slot) {
      const I = this.input();
      return slot === 0 ? I.pressed.attack1 : I.pressed.attack2;
    }
    updateAttack(dt) {
      const a = this.atk;
      if (!a || this.state !== 'attack') return;
      if (a.kind === 'melee') this.updateMelee(dt, a);
      else if (a.kind === 'ranged') this.updateRanged(dt, a);
      else this.updateShield(dt, a);
    }
    meleeStep(a) {
      return a.chargedStep ? a.def.charged : a.def.combo[a.step];
    }
    updateMelee(dt, a) {
      const spd = this.atkSpeed(a.def);
      a.t += dt * (a.phase === 'pre' || a.phase === 'charge' ? 1 : spd);
      const step = this.meleeStep(a);
      if (this.pressedSlot(a.slot) && (a.phase === 'a' || a.phase === 'r' || (a.phase === 'w' && a.t > step.w * 0.5))) a.queued = true;
      const other = 1 - a.slot;
      switch (a.phase) {
        case 'pre':
          if (!this.held(a.slot)) { a.phase = 'w'; a.t = 0; }
          else if (a.t >= 0.14) { a.phase = 'charge'; a.t = 0; }
          break;
        case 'charge':
          a.charge += dt;
          a.canTurn = true;
          if (a.charge >= a.def.chargeable && !a.chargedFx) { a.chargedFx = true; G.Audio.play('charge'); G.fx.ring(this.cx, this.cy, 16, '#a0c8ff', 0.3, 2); }
          if (Math.random() < 0.5) G.fx.spawn({ x: this.cx + (Math.random() - 0.5) * 24, y: this.cy + (Math.random() - 0.5) * 24, vx: 0, vy: 0, life: 0.3, color: a.charge >= a.def.chargeable ? '#ffffff' : '#80a0ff', size: 1, add: true });
          if (!this.held(a.slot)) {
            if (a.charge >= a.def.chargeable) a.chargedStep = true;
            a.phase = 'w';
            a.t = 0;
          }
          break;
        case 'w':
          a.canTurn = a.t < step.w * 0.5;
          if (a.t >= step.w) {
            a.phase = 'a';
            a.t = 0;
            a.canTurn = false;
            a.hit.clear();
            a.tick = 0;
            G.Audio.play(step.sfx || 'swing', { vol: 0.9 });
            if (step.shake) G.shake(step.shake * 0.4);
            if (step.iframes) this.invuln = Math.max(this.invuln, step.a + 0.05);
            this.spawnStepExtras(a, step);
          }
          break;
        case 'a': {
          if (step.lunge) this.vx = this.facing * step.lunge * (this.onGround ? 1 : 0.6);
          const n = step.multi || 1;
          const interval = step.a / n;
          if (a.t >= (a.tick + 1) * interval && a.tick < n - 1) { a.tick++; a.hit.clear(); }
          this.doMeleeHits(a, step);
          if (a.t >= step.a) { a.phase = 'r'; a.t = 0; }
          break;
        }
        case 'r':
          if (a.queued && a.t >= step.r * 0.35 && !a.chargedStep && a.step < a.def.combo.length - 1) {
            a.step++;
            a.phase = 'w';
            a.t = 0;
            a.queued = false;
            a.canTurn = true;
            const I = this.input();
            const dir = (I.down.right ? 1 : 0) - (I.down.left ? 1 : 0);
            if (dir) this.facing = dir;
          } else if (a.t >= step.r * 0.35 && this.pressedSlot(other) && this.weapons[other]) {
            this.lastAtk = null;
            this.startAttack(other);
          } else if (a.t >= step.r) {
            this.lastAtk = { slot: a.slot, step: a.chargedStep ? a.def.combo.length - 1 : a.step, end: G.world.time };
            this.atk = null;
            this.state = 'normal';
            if (a.queued && a.step >= a.def.combo.length - 1) {
              this.lastAtk = null;
              this.startAttack(a.slot);
            }
          }
          break;
      }
    }
    stepBox(step) {
      const [bx, by, bw, bh] = step.box;
      const x = this.facing > 0 ? this.cx + bx : this.cx - bx - bw;
      return { x, y: this.cy + by, w: bw, h: bh };
    }
    spawnStepExtras(a, step) {
      const pw = this.power(a.inst);
      if (step.shock) {
        const dirs = step.shock.n === 2 ? [1, -1] : [this.facing];
        for (const d of dirs)
          G.world.add(new G.Proj({ x: this.cx + d * 20, y: this.bottom - 7, w: 12, h: 14, vx: d * 260, vy: 0, type: 'shock', team: 'player', dmg: pw * step.dmg * step.shock.dmg, life: 0.9, pierce: 99, item: a.inst, statuses: { stun: 0.5 }, knock: 120, color: '#c0b090' }));
        G.Audio.play('shockwave');
      }
      if (step.proj) {
        if (step.proj.type === 'wave')
          G.world.add(new G.Proj({ x: this.cx + this.facing * 16, y: this.bottom - 9, w: 16, h: 18, vx: this.facing * 300, type: 'wave', team: 'player', dmg: pw * step.proj.dmg, life: 1.2, pierce: 99, item: a.inst, knock: 180, statuses: { slow: 1.5 } }));
        else
          G.world.add(new G.Proj({ x: this.cx + this.facing * 14, y: this.cy - 4, w: 14, h: 22, vx: this.facing * 380, type: 'crescent', team: 'player', dmg: pw * step.proj.dmg, life: 0.8, pierce: 99, item: a.inst, statuses: this.itemStatuses(a.inst) }));
      }
      if (step.ring) {
        const r = step.ring;
        G.fx.ring(this.cx + this.facing * 20, this.bottom - 4, r, '#ffd080', 0.35, 4);
        G.Audio.play('toll', { vol: 0.35 });
        for (const e of G.world.enemiesIn(this.cx + this.facing * 20 - r, this.bottom - r, r * 2, r * 2)) {
          const fd = this.finalDamage(pw * step.dmg * 0.6, e, a.inst, this.checkCrit(a.def.critIf, e, {}));
          e.takeHit({ dmg: fd.dmg, crit: fd.crit, kind: 'melee', team: 'player', x: this.cx, y: this.cy, dir: e.cx > this.cx ? 1 : -1, knock: 150, statuses: { stun: step.stun || 0.8 }, item: a.inst, poise: 40 });
        }
      }
    }
    doMeleeHits(a, step) {
      const box = this.stepBox(step);
      const pw = this.power(a.inst);
      const last = a.chargedStep || a.step === a.def.combo.length - 1;
      let hitAny = false;
      for (const e of G.world.enemiesIn(box.x, box.y, box.w, box.h)) {
        if (a.hit.has(e)) continue;
        a.hit.add(e);
        const crit = !!step.crit || this.checkCrit(a.def.critIf, e, { last, charged: a.chargedStep, box, reach: step.box[0] + step.box[2] });
        const fd = this.finalDamage(pw * step.dmg, e, a.inst, crit);
        const extra = {};
        if (step.freeze) extra.freeze = step.freeze;
        if (step.stun) extra.stun = step.stun;
        e.takeHit({ dmg: fd.dmg, crit: fd.crit, kind: 'melee', team: 'player', x: this.cx, y: this.cy, dir: this.facing, knock: step.knock || 90, statuses: this.itemStatuses(a.inst, extra), power: this.dotPower(a.inst), item: a.inst, poise: step.poise || 14 * step.dmg });
        hitAny = true;
      }
      for (const o of G.world.hittablesIn(box.x, box.y, box.w, box.h)) {
        if (a.hit.has(o)) continue;
        a.hit.add(o);
        o.onHit({ dmg: pw * step.dmg, kind: 'melee', dir: this.facing });
      }
