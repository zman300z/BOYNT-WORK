    if (!drag) { sweepGhosts(); return; }
    const d = drag;
    drag = null;
    if (d.ghost) d.ghost.remove();
    sweepGhosts();
    document.body.classList.remove('dragging-now');
    clearDropHighlights();
    $$('.card.pressed').forEach(n => n.classList.remove('pressed'));
    $$('.card.lifted').forEach(n => n.classList.remove('lifted'));
    if (d.moved) {
      const dst = dropTargetAt(e.clientX, e.clientY);
      if (dst) doMove(d.src, dst);
      else render();
    } else {
      onTap(d.src, e);
    }
  }

  function installDragHandlers() {
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
    window.addEventListener('pointercancel', () => cancelDrag());
    window.addEventListener('blur', () => cancelDrag());
    document.addEventListener('visibilitychange', () => { if (document.hidden) cancelDrag(); });
  }

  function buildGhost(e) {
    const layer = $('#draglayer');
    const rect = drag.node.getBoundingClientRect();
    drag.ox = e.clientX - rect.left;
    drag.oy = e.clientY - rect.top;
    const g = el('div', 'ghost-stack');
    drag.cards.forEach((c, i) => {
      const n = cardEl(c);
      n.style.top = (i * 30) + 'px';
      g.appendChild(n);
    });
    g.style.transform = 'translate(' + rect.left + 'px,' + rect.top + 'px)';
    layer.appendChild(g);
    drag.ghost = g;
    /* fade the originals */
    if (drag.src.zone === 'tableau') {
      const pile = $$('#tableau .tab-pile')[drag.src.col];
      Array.from(pile.children).forEach(n => { if (n.dataset.index != null && +n.dataset.index >= drag.src.index) n.classList.add('lifted'); });
    } else drag.node.classList.add('lifted');
  }

  function dropTargetAt(x, y) {
    const stack = document.elementsFromPoint(x, y);
    for (const n of stack) {
      const pile = n.closest && n.closest('[data-zone]');
      if (!pile) continue;
      const z = pile.dataset.zone;
      if (z === 'tableau') return { zone: 'tableau', col: +pile.dataset.col };
      if (z === 'foundation') return { zone: 'foundation', suit: pile.dataset.suit };
      if (z === 'stash') return { zone: 'stash' };
    }
    return null;
  }

  function highlightDrop(x, y) {
    clearDropHighlights();
    const t = dropTargetAt(x, y);
    if (!t || !drag) return;
    const m = Engine.mods(G.run);
    let ok = false, node = null;
    if (t.zone === 'stash') {
      node = $('#stash');
      ok = drag.cards.length === 1 && drag.src.zone !== 'stash' && Game.canStash(drag.src);
    } else if (t.zone === 'tableau') {
      node = $$('#tableau .tab-pile')[t.col];
      ok = !(drag.src.zone === 'tableau' && drag.src.col === t.col) && Engine.canPlaceOnColumn(G.board, t.col, drag.cards[0], m);
    } else {
      node = $('#f-' + t.suit);
      ok = drag.cards.length === 1 && Engine.canPlaceOnFoundation(G.board, drag.cards[0], t.suit);
    }
    if (node) node.classList.add(ok ? 'drop-ok' : 'drop-no');
  }

  function clearDropHighlights() {
    $$('.drop-ok,.drop-no').forEach(n => n.classList.remove('drop-ok', 'drop-no'));
  }

  function onTap(src, e) {
    if (selection && sameSrc(selection, src)) { clearSelection(); Sfx.click(); return; }
    if (selection) {
      const dst = src.zone === 'foundation' ? { zone: 'foundation', suit: src.suit } : { zone: 'tableau', col: src.col };
      if (src.zone === 'waste') { selection = src; applySelectionClasses(); Sfx.click(); return; }
      const held = selection;
      clearSelection();
      if (!doMove(held, dst)) { selection = src; applySelectionClasses(); }
      return;
    }
    selection = src;
    applySelectionClasses();
    Sfx.click();
  }

  function bindPileTargets() {
    document.addEventListener('click', e => {
      if (G.phase !== 'play') return;
      const pile = e.target.closest && e.target.closest('[data-zone]');
      if (!pile || !selection) return;
      if (e.target.classList && e.target.classList.contains('card')) return;
      const z = pile.dataset.zone;
      if (z === 'tableau') { const held = selection; clearSelection(); doMove(held, { zone: 'tableau', col: +pile.dataset.col }); }
      else if (z === 'foundation') { const held = selection; clearSelection(); doMove(held, { zone: 'foundation', suit: pile.dataset.suit }); }
      else if (z === 'stash') { const held = selection; clearSelection(); doMove(held, { zone: 'stash' }); }
    });
  }

  /* ============ SCORE FX ============ */
  function drainFx() {
    if (fxBusy) return;
    const q = G.fx.splice(0, G.fx.length);
    if (!q.length) { syncScore(); checkStuck(); return; }
    fxBusy = true;
    runPackets(q, 0);
  }

  function runPackets(q, i) {
    if (i >= q.length) {
      fxBusy = false;
      syncScore();
      if (G.fx.length) { drainFx(); }
      else { rush = false; afterFx(); }
      return;
    }
    const base = q.length > 6 ? 0.28 : (q.length > 3 ? 0.5 : 1);
    const speed = () => base * (rush ? 0.06 : 1);
    animatePacket(q[i], speed, () => runPackets(q, i + 1));
  }

  /* the player did something while the fireworks were still going -- don't
     swallow their input, just finish the show immediately */
  function rushFx() { if (fxBusy) rush = true; }

  function animatePacket(p, spd, done) {
    if (p.event === 'illegal') { done(); return; }
    if (p.event === 'nudge') { floatText($('#table'), p.label, 'fx-flash'); done(); return; }
    if (p.event === 'wish-result') {
      const w = p.wish;
      const anchor = anchorEl(p.anchor);
      const card = el('div', 'wish-card ' + w.cls,
        '<div class="wc-name">' + w.name + '</div>' +
        '<div class="wc-text">' + w.text + '</div>' +
        (p.detail ? '<div class="wc-detail">' + p.detail + '</div>' : ''));
      $('#fxlayer').appendChild(card);
      if (w.cls === 'jackpot') { Sfx.win(); screenShake(12); confetti(anchor, 60, 't4'); flashScreen(0.3, '#b07cff'); }
      else if (w.cls === 'great') { Sfx.big(); confetti(anchor, 26, 't2'); flashScreen(0.16, '#7ee787'); }
      else if (w.cls === 'meh') { Sfx.error(); }
      else { Sfx.money(); burst(anchor, 12, '#ffd166'); }
      renderHud();
      setTimeout(() => card.classList.add('out'), 1050 * spd());
      setTimeout(() => card.remove(), 1450 * spd());
      setTimeout(done, 520 * spd());
      return;
    }
    if (p.event === 'pot-cash') {
      bannerText('POT CASHED');
      Sfx.win();
      confetti($('#sidepot') || $('#scorebox'), 40, 't3');
      flashScreen(0.2, '#7ee787');
      screenShake(7);
      animateScoreTo(G.round.score);
      floatText($('#sidepot') || $('#scorebox'), '+' + fmt(p.amount), 'fx-total');
      setTimeout(done, 420 * spd());
      return;
    }
    if (p.event === 'reshuffle') {
      Sfx.deal();
      const st = $('#stock');
      if (st) { st.classList.remove('reshuffled'); void st.offsetWidth; st.classList.add('reshuffled'); }
      floatText(st || $('#scorebox'), 'RESHUFFLED', 'fx-flash');
      setTimeout(done, 120 * spd());
      return;
    }
    if (p.event === 'cash') {
      const a = anchorEl(p.anchor);
      floatText(a, '+$' + p.amount, 'fx-money big');
      floatText(a, p.label, 'fx-cashlabel');
      Sfx.money();
      burst(a, 8, '#ffd166');
      renderHud();
      renderControls();
      setTimeout(done, 130 * spd());
      return;
    }
    if (p.event === 'bust') {
      const a = anchorEl(p.anchor);
      Sfx.lose();
      bannerText(p.label);
      floatText(a, p.label, 'fx-shatter');
      flashScreen(0.22, '#ff5a5a');
      screenShake(9);
      renderHud();
      renderBounty();
      setTimeout(done, 320 * spd());
      return;
    }
    if (p.event === 'recycle') { Sfx.deal(); flashScreen(0.10, '#4cc9f0'); done(); return; }
    if (p.event === 'draw') {
      Sfx.deal();
      const w = $('#waste');
      if (w) { w.classList.remove('dealt'); void w.offsetWidth; w.classList.add('dealt'); }
      done();
      return;
    }
    if (p.event === 'curioFlash') { flashCurioById(p.curio); done(); return; }
    if (p.event === 'replay') {
      floatText(anchorEl(p.anchor), 'ALREADY PAID', 'fx-flash');
      setTimeout(done, 100 * spd());
      return;
    }
    if (p.event === 'shatter') {
      Sfx.shatter();
      const n = document.querySelector('[data-id="' + p.card.id + '"]');
      if (n) { n.classList.add('shattering'); burst(n, 14, '#9fe8ff'); }
      floatText(n || $('#scorebox'), 'SHATTERED', 'fx-shatter');
      toast(quip('shatter'));
      setTimeout(done, 210 * spd());
      return;
    }

    const box = $('#scorebox');
    box.classList.add('live');
    let chips = 0, mult = 1;
    setScoreBox(0, 1);
    if (p.label) bannerText(p.label);

    const trigs = p.triggers.filter(t => t.kind !== 'flash' || true);
    let ti = 0;
    const step = () => {
      if (ti >= trigs.length) {
        setScoreBox(p.chips, p.mult);
        setTimeout(() => {
          slam(p);
          setTimeout(() => { box.classList.remove('live'); done(); }, 170 * spd());
        }, 45 * spd());
        return;
      }
      /* the more there is to show, the faster each beat of it goes by */
      const stepMs = Math.max(16, 52 - trigs.length * 1.6);
      const t = trigs[ti++];
      const src = resolveSrc(t.src, p);
      if (t.kind === 'chips') { chips += t.amount; setScoreBox(chips, mult); floatText(src, '+' + t.amount, 'fx-chips'); Sfx.chip(ti); }
      else if (t.kind === 'mult') { mult += t.amount; setScoreBox(chips, mult); floatText(src, '+' + t.amount + ' Mult', 'fx-mult'); Sfx.mult(ti); }
      else if (t.kind === 'xmult') { mult *= t.amount; setScoreBox(chips, mult); floatText(src, 'X' + t.amount, 'fx-xmult'); Sfx.mult(ti + 6); }
      else if (t.kind === 'money') { floatText(src, '+$' + t.amount, 'fx-money'); Sfx.money(); renderHud(); }
      else if (t.kind === 'flash') { floatText(src, '!', 'fx-flash'); }
      else if (t.kind === 'retrigger') { floatText(src, 'AGAIN!', 'fx-again'); }
      if (src) {
        src.classList.add('trigger');
        setTimeout(() => src.classList.remove('trigger'), 260);
        if (t.kind === 'xmult' || t.kind === 'retrigger') spark(src);
      }
      setTimeout(step, (t.kind === 'flash' ? stepMs * 0.5 : stepMs) * spd());
    };
    step();
  }

  function resolveSrc(src, p) {
    if (!src) return $('#scorebox');
    if (src.type === 'card') {
      const n = src.id ? document.querySelector('[data-id="' + src.id + '"]') : null;
      if (n) return n;
      return anchorEl(p.anchor);
    }
    if (src.type === 'curio') return document.querySelector('.mslot[data-idx="' + src.index + '"]');
    return $('#scorebox');
  }

  function anchorEl(a) {
    if (!a) return $('#scorebox');
    if (a.zone === 'stash') return $('#stash') || $('#scorebox');
    if (a.zone === 'bounty') return $('#bounty') || $('#scorebox');
    if (a.zone === 'stock') return $('#stock') || $('#scorebox');
    if (a.zone === 'foundation') return $('#f-' + a.suit);
    if (a.zone === 'tableau') return $$('#tableau .tab-pile')[a.col] || $('#scorebox');
    return $('#scorebox');
  }

  function setScoreBox(chips, mult) {
    const total = Math.round(chips * mult);
    $('#sb-chips').textContent = fmt(Math.round(chips));
    $('#sb-mult').textContent = (Math.round(mult * 100) / 100);
    $('#sb-total').textContent = fmt(total);
    const heat = Math.min(1, total / 6000);
    const box = $('#scorebox');
    box.style.setProperty('--heat', heat.toFixed(2));
    box.style.setProperty('--swell', (1 + Math.min(0.22, total / 60000)).toFixed(3));
    const t = tierFor(total);
    box.className = 'live' + (t ? ' ' + t.cls : '');
    bumpEl($('#sb-total'));
  }

  function bumpEl(n) {
    if (!n) return;
    n.classList.remove('bump');
    void n.offsetWidth;
    n.classList.add('bump');
  }

  /* TEMPO -- rewards playing fast, never punishes thinking */
  function momentumMult() {
    const m = G.round ? (G.round.momentum || 0) : 0;
    return +(1 + (m / 100) * TUNE.momentumMaxMult).toFixed(2);
  }

  let lastMomentumPaint = -1;
  function renderMomentum(force) {
    const bar = $('#tempo-fill');
    if (!bar || !G.round) return;
    const m = G.round.momentum || 0;
    /* the loop runs at 60fps -- only touch the DOM when it actually moved */
    if (!force && Math.abs(m - lastMomentumPaint) < 0.8) return;
    lastMomentumPaint = m;
    bar.style.width = m + '%';
    const wrap = $('#tempo');
    wrap.classList.toggle('hot', m > 55);
    wrap.classList.toggle('max', m > 88);
    const lab = $('#tempo-mult');
    if (lab) lab.textContent = 'X' + momentumMult();
  }

  /* one loop drives the decay, the bar and the music intensity */
  function startMomentumLoop() {
    const tick = () => {
      if (G.phase === 'play' && G.round && !Overlays.isOpen()) {
        Game.decayMomentum();
        renderMomentum();
      }
      const heat = G.round ? (G.round.heat || 0) : 0;
      const mo = G.round ? (G.round.momentum || 0) : 0;
      Sfx.setIntensity(Math.min(1, mo / 100 * 0.7 + Math.min(heat, 5) / 5 * 0.5));
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  /* the persistent combo readout inside the score box */
  function renderCombo() {
    const m = $('#combo-meter');
    if (!m || !G.round) return;
    const bits = [];
    if (G.round.cascade > 1) bits.push('<span class="cm cascade">CASCADE <b>X' + G.round.cascade + '</b></span>');
    if (G.round.suitRun > 1) bits.push('<span class="cm suitrun">' + SUITS[G.round.lastSuit].sym + ' RUN <b>X' + G.round.suitRun + '</b></span>');
    if (G.round.heat > 0) bits.push('<span class="cm heat">HEAT <b>X' + Game.heatMult() + '</b></span>');
    if ((G.round.momentum || 0) > 20) bits.push('<span class="cm tempo">TEMPO <b>X' + momentumMult() + '</b></span>');
    m.innerHTML = bits.join('');
    m.classList.toggle('active', bits.length > 0);
    if (bits.length) { m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop'); }
  }

  function slam(p) {
    const box = $('#scorebox');
    const mag = p.total;
    const tier = tierFor(mag);
    box.classList.add('slam');
    setTimeout(() => box.classList.remove('slam'), 450);

    Sfx.score(Math.log10(Math.max(10, mag)) * 20);

    const big = el('div', 'fx-total ' + (tier ? tier.cls : ''), '+' + fmt(mag));
    positionAt(big, box, 0, -46);
    $('#fxlayer').appendChild(big);
    setTimeout(() => big.remove(), 1100);

    shockwave(box, tier);
    bumpEl($('#round-score'));

    if (tier) {
      tierBanner(tier);
      screenShake(tier.shake);
      confetti(box, tier.parts, tier.cls);
      flashScreen(0.34 - SCORE_TIERS.indexOf(tier) * 0.05, tierColor(tier));
      if (mag >= 8000) Sfx.big();
      if (mag >= 25000) toast(quip('bigScore'), 2400);
      document.body.classList.add('hot');
      clearTimeout(hotTimer);
      hotTimer = setTimeout(() => document.body.classList.remove('hot'), 900);
    } else {
      burst(box, 8, '#7ee787');
    }
    animateScoreTo(G.round.score);
  }

  let hotTimer = null;
  function tierColor(t) {
    return { t1: '#7ee787', t2: '#ffd166', t3: '#ff8f3f', t4: '#ff4d6d', t5: '#b07cff' }[t.cls] || '#ffd166';
  }

  function tierBanner(tier) {
    const n = el('div', 'fx-tier ' + tier.cls, tier.name + (tier.cls === 't5' ? '!!!!' : tier.cls === 't4' ? '!!!' : tier.cls === 't3' ? '!!' : '!'));
    $('#fxlayer').appendChild(n);
    setTimeout(() => n.remove(), 1000);
  }

  function shockwave(ref, tier) {
    const r = ref.getBoundingClientRect();
    const w = el('div', 'shockwave' + (tier ? ' ' + tier.cls : ''));
    w.style.left = (r.left + r.width / 2) + 'px';
    w.style.top = (r.top + r.height / 2) + 'px';
    $('#fxlayer').appendChild(w);
    setTimeout(() => w.remove(), 700);
  }

  function flashScreen(alpha, color) {
    const f = $('#flash');
    if (!f) return;
    f.style.background = color || '#fff';
    f.style.opacity = Math.min(0.45, alpha);
    f.classList.remove('go');
    void f.offsetWidth;
    f.classList.add('go');
    setTimeout(() => { f.style.opacity = 0; }, 30);
  }

  /* confetti with a bit of gravity so it feels physical */
  function confetti(ref, count, cls) {
    const r = ref.getBoundingClientRect();
    const colors = ['#ffd166', '#ff4d6d', '#4cc9f0', '#7ee787', '#b07cff', '#fff'];
    for (let i = 0; i < count; i++) {
      const p = el('div', 'confetti ' + (cls || ''));
      p.style.left = (r.left + Math.random() * r.width) + 'px';
      p.style.top = (r.top + r.height / 2) + 'px';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', (Math.random() * 460 - 230) + 'px');
      p.style.setProperty('--dy', (-120 - Math.random() * 220) + 'px');
      p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
      p.style.setProperty('--dur', (0.9 + Math.random() * 0.7) + 's');
      if (Math.random() < 0.4) p.style.borderRadius = '50%';
      $('#fxlayer').appendChild(p);
      setTimeout(() => p.remove(), 1800);
    }
  }

  function animateScoreTo(target) {
    const start = displayScore, t0 = performance.now(), dur = 240;
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur);
      displayScore = start + (target - start) * (1 - Math.pow(1 - k, 3));
      $('#round-score').textContent = fmt(Math.round(displayScore));
      renderQuotaOnly();
      if (k < 1) requestAnimationFrame(tick);
      else { displayScore = target; }
    };
    requestAnimationFrame(tick);
  }

  function renderQuotaOnly() {
    const q = Engine.quotaFor(G.run);
    const total = G.run.anteScore + Math.round(displayScore);
    $('#quota-fill').style.width = Math.max(0, Math.min(100, total / q * 100)) + '%';
    $('#quota-text').textContent = fmt(total) + ' / ' + fmt(q);
    $('#quota-bar').classList.toggle('met', total >= q);
  }

  function syncScore() {
    if (!G.round) return;
    animateScoreTo(G.round.score);
    renderHud();
  }

  function afterFx() {
    render();
    checkStuck();
  }

  /* ---------------- AUTOPLAY ----------------
     AUTO plays the board a move at a time, taking whatever a decent player would
     take next and flying the card across so you can see it happen. Press it again
     to stop. It stops by itself when the round ends, when the board starts
     repeating, or when there is genuinely nothing left to do.                    */
  let autoTimer = null, autoSeen = null, autoWait = 0, autoMoves = 0;

  function autoRunning() { return autoTimer !== null; }

  function autoLabel() {
    const btn = $('#btn-collect');
    if (!btn) return;
    btn.textContent = autoRunning() ? 'STOP' : 'AUTO';
    btn.classList.toggle('running', autoRunning());
  }

  function stopAuto(msg) {
    if (autoTimer === null && autoSeen === null) return;   // was not running
    clearTimeout(autoTimer);
    autoTimer = null;
    autoSeen = null;
    autoLabel();
    if (msg) toast(msg);
    checkStuck();
  }

  function toggleAuto() {
    if (autoRunning()) { stopAuto(); return; }
    if (G.phase !== 'play') { checkStuck(); return; }
    autoSeen = new Set();
    autoWait = 0;
    autoMoves = 0;
    autoTimer = setTimeout(autoTick, 40);
    autoLabel();
  }

  function autoTick() {
    autoTimer = null;
    if (G.phase !== 'play' || Overlays.isOpen()) { stopAuto(); return; }

    /* let the fireworks land, but do not sit through them forever */
    if (fxBusy) {
      autoWait += 90;
      if (autoWait > 600) rushFx();
      autoTimer = setTimeout(autoTick, 90);
      autoLabel();
      return;
    }
    autoWait = 0;

    const plan = Game.autoPlan();
    if (!plan) {
      if (!autoMoves) stopAuto('Nothing can be played right now.');
      else if (Engine.anyMoveAvailable(G, G.run)) stopAuto('Autoplay is out of good moves — the rest is your call.');
      else stopAuto('Nothing left to play — cash out.');
      return;
    }

    /* the same move on the same board twice means it is chasing its own tail */
    const key = plan.kind + ':' + (plan.cardId || '') + ':' + Game.boardKey();
    if (autoSeen.has(key)) { stopAuto('That is as far as autoplay can take it — over to you.'); return; }
    autoSeen.add(key);

    const node = plan.cardId ? document.querySelector('[data-id="' + plan.cardId + '"]') : $('#stock');
    const from = node ? node.getBoundingClientRect() : null;

    if (!Game.autoPlay(plan)) { stopAuto('Autoplay hit a move it could not make.'); return; }
    autoMoves++;
    if (plan.kind === 'draw') Sfx.deal(); else Sfx.place();
    clearSelection();
    render();
    if (plan.cardId && from) flyCard(plan.cardId, from);
    drainFx();

    if (G.phase !== 'play') { stopAuto(); return; }
    autoTimer = setTimeout(autoTick, plan.kind === 'draw' ? 190 : 250);
    autoLabel();
  }

  /* slide a card in from wherever it just came from -- and bring its run with it */
  function flyCard(id, from) {
    const head = document.querySelector('[data-id="' + id + '"]');
    if (!head) return;
    const r = head.getBoundingClientRect();
    const dx = Math.round(from.left - r.left), dy = Math.round(from.top - r.top);
    if (!dx && !dy) return;
    const nodes = [head];
    let n = head.nextElementSibling;
    while (n && n.classList && n.classList.contains('card')) { nodes.push(n); n = n.nextElementSibling; }
    nodes.forEach((el2, i) => {
      el2.style.setProperty('--dx', dx + 'px');
      el2.style.setProperty('--dy', dy + 'px');
      el2.classList.remove('autofly');
      void el2.offsetWidth;
      el2.style.animationDelay = (i * 18) + 'ms';
      el2.classList.add('autofly');
      setTimeout(() => { el2.classList.remove('autofly'); el2.style.animationDelay = ''; }, 340 + i * 18);
    });
  }

  function checkStuck() {
    /* the engine ends the round by itself when the board is cleared -- show the summary */
    if (G.phase === 'roundEnd') { if (!Overlays.isOpen()) Overlays.roundEnd(); return; }
    if (G.phase !== 'play') return;
    if (!Engine.anyMoveAvailable(G, G.run)) {
      G.round.stuck = true;
      renderControls();
      toast('No moves left — cash out! <span class="quip">' + quip('stuck') + '</span>', 3400);
    }
  }

  /* ============ little visual helpers ============ */
  function positionAt(node, ref, dx, dy) {
    const r = (ref || $('#scorebox')).getBoundingClientRect();
    node.style.left = (r.left + r.width / 2 + (dx || 0)) + 'px';
    node.style.top = (r.top + (dy || 0)) + 'px';
  }

  function floatText(ref, text, cls) {
    const n = el('div', 'fx-float ' + (cls || ''), text);
    positionAt(n, ref, (Math.random() * 30 - 15), -8);
    $('#fxlayer').appendChild(n);
    setTimeout(() => n.remove(), 900);
  }

  function bannerText(text) {
    const n = el('div', 'fx-banner', text);
    $('#fxlayer').appendChild(n);
    setTimeout(() => n.remove(), 1100);
  }

  function burst(ref, count, color) {
    const r = ref.getBoundingClientRect();
    for (let i = 0; i < count; i++) {
      const p = el('div', 'particle');
      p.style.left = (r.left + r.width / 2) + 'px';
      p.style.top = (r.top + r.height / 2) + 'px';
      p.style.background = color || '#ffd166';
      const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 120;
      p.style.setProperty('--dx', Math.cos(a) * d + 'px');
      p.style.setProperty('--dy', Math.sin(a) * d + 'px');
      p.style.animationDelay = (Math.random() * 0.08) + 's';
      $('#fxlayer').appendChild(p);
      setTimeout(() => p.remove(), 900);
    }
  }

  /* a couple of embers flying from a trigger toward the score box */
  function spark(from) {
    const a = from.getBoundingClientRect(), b = $('#scorebox').getBoundingClientRect();
    for (let i = 0; i < 5; i++) {
      const p = el('div', 'ember');
      p.style.left = (a.left + a.width / 2) + 'px';
      p.style.top = (a.top + a.height / 2) + 'px';
      p.style.setProperty('--tx', (b.left + b.width / 2 - a.left - a.width / 2) + 'px');
      p.style.setProperty('--ty', (b.top + b.height / 2 - a.top - a.height / 2) + 'px');
      p.style.animationDelay = (i * 0.04) + 's';
      $('#fxlayer').appendChild(p);
      setTimeout(() => p.remove(), 700);
    }
  }

  function screenShake(power) {
    const app = $('#app');
    app.style.setProperty('--shake', (power || 6) + 'px');
    app.classList.remove('shaking');
    void app.offsetWidth;
    app.classList.add('shaking');
    setTimeout(() => app.classList.remove('shaking'), 400);
  }

  function shake(node) {
    if (!node) return;
    node.classList.remove('nope');
    void node.offsetWidth;
    node.classList.add('nope');
    setTimeout(() => node.classList.remove('nope'), 400);
  }

  function flashCurioById(id) {
    const i = G.run.mantel.findIndex(c => c.id === id);
    const n = document.querySelector('.mslot[data-idx="' + i + '"]');
    if (n) { n.classList.add('trigger'); setTimeout(() => n.classList.remove('trigger'), 300); }
  }

  /* ---------------- hints ---------------- */
  let hintTimer = null;
  function clearHints() {
    $$('.hinted,.hinted-dst').forEach(n => n.classList.remove('hinted', 'hinted-dst'));
    $$('.hint-label').forEach(n => n.remove());
    clearTimeout(hintTimer);
  }

  function showHint(srcNode, dstNode, label) {
    clearHints();
    if (srcNode) srcNode.classList.add('hinted');
    if (dstNode) dstNode.classList.add('hinted-dst');
    const anchor = srcNode || dstNode;
    if (anchor && label) {
      const tag = el('div', 'hint-label', label);
      const r = anchor.getBoundingClientRect();
      tag.style.left = (r.left + r.width / 2) + 'px';
      tag.style.top = (r.top - 26) + 'px';
      $('#fxlayer').appendChild(tag);
    }
    if (!srcNode && !dstNode) toast(label || 'Try that.');
    hintTimer = setTimeout(clearHints, 2600);
  }

  /* ---------------- the deal ----------------
     Every card flies out of the deck to its seat, in the order it was dealt. */
  function dealAnimation() {
    const stock = $('#stock');
    if (!stock) return;
    const from = stock.getBoundingClientRect();
    const cards = [];
    $$('#tableau .tab-pile').forEach((pile, col) => {
      Array.from(pile.children).forEach(n => {
        if (!n.classList.contains('card')) return;
        cards.push({ n, col, row: +(n.dataset.index || 0) });
      });
    });
    /* klondike deals across the columns, one row at a time */
    cards.sort((a, b) => (a.row - b.row) || (a.col - b.col));
    cards.forEach((c, i) => {
      const r = c.n.getBoundingClientRect();
      c.n.style.setProperty('--dx', Math.round(from.left - r.left) + 'px');
      c.n.style.setProperty('--dy', Math.round(from.top - r.top) + 'px');
      c.n.style.animationDelay = (i * 26) + 'ms';
      c.n.classList.add('dealing');
      setTimeout(() => Sfx.deal(), i * 26);
    });
    const last = cards.length * 26 + 260;
    setTimeout(() => { $$('.card.dealing').forEach(n => {
      n.classList.remove('dealing');
      n.style.animationDelay = '';
    }); }, last);
    return last;
  }

  let toastTimer = null;
  function toast(msg, ms) {
    const t = $('#toast');
    t.innerHTML = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms || 1800);
  }

  /* tooltips */
  function showTip(ref, html) {
    const t = $('#tooltip');
    t.innerHTML = html;
    t.classList.add('show');
    t.style.left = '-9999px';
    t.style.top = '0px';
    /* measure first, then place it wherever it actually fits */
    const r = ref.getBoundingClientRect();
    const tw = t.offsetWidth || 270;
    const th = t.offsetHeight || 160;
    let left = r.left + r.width / 2 - tw / 2;
    left = Math.max(8, Math.min(window.innerWidth - tw - 8, left));
    let top = r.bottom + 8;
    if (top + th > window.innerHeight - 8) {
      top = r.top - th - 8;                       // flip above
      if (top < 8) top = Math.max(8, window.innerHeight - th - 8);
    }
    t.style.left = left + 'px';
    t.style.top = top + 'px';
  }
  function hideTip() { const t = $('#tooltip'); if (t) t.classList.remove('show'); }

  /* curio drag-to-reorder */
  function makeCurioDraggable(node, index) {
    let start = null;
    node.addEventListener('pointerdown', e => {
      start = { x: e.clientX, index };
      node.setPointerCapture && node.setPointerCapture(e.pointerId);
    });
    node.addEventListener('pointerup', e => {
      if (!start) return;
      const dx = e.clientX - start.x;
      start = null;
      if (Math.abs(dx) < 25) return;
      const slotW = node.getBoundingClientRect().width + 8;
      const shift = Math.round(dx / slotW);
      const to = Math.max(0, Math.min(G.run.mantel.length - 1, index + shift));
      if (to !== index) { Game.reorderCurio(index, to); Sfx.click(); render(); }
    });
  }

  function resetDisplayScore() { displayScore = G.round ? G.round.score : 0; }

  return {
    render, renderHud, renderMantel, renderBoard, renderControls, cardEl, el, $, $$,
    drainFx, toast, shake, screenShake, burst, fmt, clearSelection, bindPileTargets,
    showTip, hideTip, resetDisplayScore, checkStuck, doMove, floatText, bannerText,
    toggleAuto, autoRunning, stopAuto,
    renderCombo, flashScreen, confetti, rushFx, renderReshuffle, showHint, clearHints,
    installDragHandlers, cancelDrag, sweepGhosts, attachInspect, renderCut,
    startMomentumLoop, renderMomentum, momentumMult, dealAnimation,
    get busy() { return fxBusy; }
  };
})();

/* ===== js/overlays.js ===== */
/* ============================================================
   PILE-DRIVER  ::  overlays.js
   Round summary, the Curio Shop, deck viewer, run end, help.
   ============================================================ */

const Overlays = (() => {

  /* ---------------- round end ---------------- */

    const payLines = pay.lines.map(l =>
      '<div class="pay-line' + (l.big ? ' hero' : '') + '"><span>' + l.label + '</span><b>+$' + l.amount + '</b></div>').join('');

    open(
      '<div class="panel round-panel">' +
        '<div class="panel-flag ' + (r.won ? 'good' : '') + '">' + headline + '</div>' +
        '<div class="big-score">' + UI.fmt(r.score) + '</div>' +
        '<div class="sub">chips banked this round</div>' +
        '<div class="quip panel-quip">' + quip(r.won ? 'roundWon' : (r.score < Engine.quotaFor(run) / 6 ? 'roundBad' : 'roundWon')) + '</div>' +
        '<div class="quota-block ' + (met ? 'met' : '') + '">' +
          '<div class="qb-row"><span>Ante ' + run.ante + ' progress</span><b>' + UI.fmt(total) + ' / ' + UI.fmt(quota) + '</b></div>' +
          '<div class="qb-bar"><div style="width:' + Math.min(100, total / quota * 100) + '%"></div></div>' +
          '<div class="qb-note">' + (met
            ? 'QUOTA MET — the rest is gravy.'
            : (last ? 'You needed ' + UI.fmt(quota - total) + ' more.' : 'Need ' + UI.fmt(quota - total) + ' more across ' + (TUNE.roundsPerAnte - run.round) + ' more round' + (TUNE.roundsPerAnte - run.round > 1 ? 's' : '') + '.')) +
          '</div>' +
        '</div>' +

        (met && !last && Game.earlyFinishBonus()

          : '') +
        '<button class="btn big" id="ov-continue">' + (last && !met ? 'FACE THE MUSIC' : 'TO THE SHOP →') + '</button>' +
        (met && !last && Game.earlyFinishBonus()
          ? (function () {
              const b2 = Game.earlyFinishBonus();
              return '<div class="bank-note"><b>Early Finish Bonus:</b> $' + b2.base + ' for the ' + b2.skipped +
                ' round' + (b2.skipped > 1 ? 's' : '') + ' you are skipping' +
                (b2.over ? ', plus $' + b2.over + ' for finishing ' + b2.overshootPct + '% over quota' : '') +
                ' = <b>$' + b2.total + '</b>.<br>Or keep playing this ante for more rounds, more cash and more shops.</div>';
            })()

    $('#ov-continue').onclick = () => {

  /* ---------------- shop ---------------- */
  const SHELF_META = {

          '<div class="shelf-head"><h3>' + SHELF_META.plain.title + '</h3><span>' + SHELF_META.plain.sub + '</span></div>' +
          '<div class="shelf-row plain-row" id="shelf-plain"></div>' +

    $('#bandit-pull').disabled = true;
    Sfx.click();

    reels.forEach((r, i) => {
      r.classList.add('spinning');
      let ticks = 0;
      const iv = setInterval(() => {
        r.textContent = REEL_SYMBOLS[Math.floor(Math.random() * REEL_SYMBOLS.length)].s;
        Sfx.chip(ticks % 6);
        if (++ticks > 12 + i * 7) {
          clearInterval(iv);
          const sym = res.reels[i];
          const meta = REEL_SYMBOLS.find(s => s.s === sym);
          r.textContent = sym;
          r.className = 'reel landed ' + meta.cls;
          setTimeout(() => r.classList.remove('landed'), 400);
          if (i === 2) finishSpin(res);
        }
      }, 55);
    });
  }

  function finishSpin(res) {
    const out = $('#bandit-result');
    const r = res.result;
    out.className = 'bandit-result ' + r.kind;
    const flavour = r.kind === 'jackpot' ? (r.symbol === '☠' ? quip('banditLose') : quip('banditJackpot'))
                  : r.kind === 'pair' ? quip('banditPair') : quip('banditLose');
    out.innerHTML = '<b>' + r.name + '</b> — ' + r.text + (r.lines.length ? '<br>' + r.lines.join('<br>') : '') +
      '<br><span class="quip">' + flavour + '</span>';
    if (r.kind === 'jackpot') {
      if (r.symbol === '☠') { Sfx.lose(); UI.screenShake(14); UI.flashScreen(0.3, '#ff4d6d'); }
      else { Sfx.win(); UI.screenShake(12); UI.confetti($('#bandit'), 70, 't4'); UI.flashScreen(0.3, '#ffd166'); }
    } else if (r.kind === 'pair') { Sfx.money(); UI.burst($('#bandit'), 12, '#7ee787'); }
    else Sfx.error();
    $('#bandit-pull').disabled = false;
    refreshShop();
    UI.render();
  }

  function shopCard(item, index, shelf) {
    const run = G.run;
    let def, rarity = '', badge = '', preview = '';

    if (shelf === 'plain') {
      const price0 = Game.priceOf(item);
      const n0 = el('div', 'shop-item sh-plain' + (item.bought ? ' bought' : '') + (run.money < price0 ? ' broke' : ''));
      const c0 = UI.cardEl({ id: 'p' + index, rank: item.rank, suit: item.suit, faceUp: true,
                             enhancement: 'none', finish: 'none', seal: 'none' });
      c0.classList.add('mini');
      n0.innerHTML =
        '<div class="si-preview">' + c0.outerHTML + '</div>' +
        '<div class="si-name">Spare ' + RANK_NAMES[item.rank] + SUITS[item.suit].sym + '</div>' +
        '<div class="si-text">A second copy of an ordinary card. Duplicates stack on each other in the tableau, ' +
        'and can be laid on their twin once the foundation has passed that rank.</div>' +
        '<div class="si-badge add">+1 CARD TO YOUR DECK</div>' +
        '<div class="si-price">' + (item.bought ? 'SOLD' : '$' + price0) + '</div>';
      if (!item.bought) {
        n0.onclick = () => {
          const res = Game.buy('plain', index);
          if (!res.ok) { Sfx.error(); UI.toast(res.reason); UI.shake(n0); return; }
          Sfx.money(); UI.burst(n0, 12, '#ffd166');
          UI.toast('Added a second ' + RANK_NAMES[item.rank] + SUITS[item.suit].sym + ' to your deck');
          refreshShop(); UI.render();
        };
      }
      return n0;
    }

    if (shelf === 'curio') {
      def = CURIO_BY_ID[item.id];
      rarity = def.rarity;
      const seats = Game.effectiveSlots();
      badge = '<div class="si-badge seat">TAKES A SEAT · ' + run.mantel.length + '/' + seats + ' used</div>';
    } else if (shelf === 'house') {
      def = HOUSE_BY_ID[item.id];
      const owned = run.houseRules[item.id] || 0;
      badge = '<div class="si-badge rule">PERMANENT' + (def.max > 1 ? ' · owned ' + owned + '/' + def.max : '') + '</div>';
    } else {
      def = SHOP_BY_ID[item.id];
      if (shelf === 'mod') {
        badge = '<div class="si-badge mark">MARKS 1 CARD YOU OWN</div>';
      } else {
        badge = '<div class="si-badge add">+1 CARD TO YOUR DECK</div>';
        preview = '<div class="si-preview">' + previewCard(def, item.spec) + '</div>';
      }
    }

    const price = Game.priceOf(item);
    const n = el('div', 'shop-item sh-' + shelf + (rarity ? ' r-' + rarity : '') +
      (item.bought ? ' bought' : '') +
      (item.finish && item.finish !== 'none' ? ' ' + FINISHES[item.finish].cls : '') +
      (run.money < price ? ' broke' : ''));
    n.innerHTML =
      '<div class="si-art">' + icon(def.icon) + '</div>' +
      preview +
      '<div class="si-name">' + def.name + '</div>' +
      (item.finish && item.finish !== 'none' ? '<div class="si-fin">' + FINISHES[item.finish].name + '</div>' : '') +
      '<div class="si-text">' + def.text + '</div>' +
      badge +
      '<div class="si-price">' + (item.bought ? 'SOLD' : '$' + price) + '</div>';

    if (!item.bought) {
      n.onclick = () => {
        const res = Game.buy(shelf, index);
        if (!res.ok) { Sfx.error(); UI.toast(res.reason || 'Cannot buy that.'); UI.shake(n); return; }
        if (res.kind === 'select') { deckView(res.def); return; }
        Sfx.money();
        UI.burst(n, 14, '#ffd166');
        if (res.kind === 'card') UI.toast('Added ' + RANK_NAMES[res.card.rank] + SUITS[res.card.suit].sym + ' to your deck');
        refreshShop();
        UI.render();
      };
    }
    return n;
  }

  /* a face-up sample of what a New Card slot puts in your deck */
  function previewCard(def, spec) {
    if ((spec && spec.oddity) || def.kind === 'oddity') {
      const odd = (spec && spec.oddity) || ODDITY_KEYS[0];
      const c = UI.cardEl({ id: 'prevodd', rank: 0, suit: 'S', faceUp: true, oddity: odd,
                            enhancement: 'none', finish: 'none', seal: 'none' });
      c.classList.add('mini');
      return c.outerHTML + '<div class="odd-blurb">' + ODDITIES[odd].text + '</div>';
    }
    if (def.kind === 'duplicate') {
      return '<div class="mini-pair">' + UI.cardEl({ id: 'p1', rank: 12, suit: 'H', enhancement: 'none', finish: 'none', seal: 'none', faceUp: true }).outerHTML +
             UI.cardEl({ id: 'p2', rank: 12, suit: 'H', enhancement: 'none', finish: 'none', seal: 'none', faceUp: true }).outerHTML + '</div>';
    }
    spec = spec || def.build();
    const c = UI.cardEl({
      id: 'prev', rank: spec.rank, suit: spec.suit, faceUp: true,
      enhancement: spec.enhancement || 'none', finish: spec.finish || 'none', seal: spec.seal || 'none'
    });
    c.classList.add('mini');
    return c.outerHTML;
  }

  /* ---------------- deck viewer / card picker ---------------- */
  function deckView(pickDef) {
    const run = G.run;
    const bySuit = {};
    SUIT_KEYS.forEach(s => { bySuit[s] = []; });
    run.deck.forEach(c => { (bySuit[c.suit] = bySuit[c.suit] || []).push(c); });
    SUIT_KEYS.forEach(s => bySuit[s].sort((a, b) => a.rank - b.rank));

    const rows = SUIT_KEYS.map(s =>
      '<div class="deck-row"><div class="deck-suit ' + SUITS[s].color + '">' + SUITS[s].sym + '</div>' +
      '<div class="deck-cards" data-suit="' + s + '"></div></div>').join('');

    open(
      '<div class="panel deck-panel">' +
        '<div class="panel-flag">' + (pickDef ? 'CHOOSE A CARD — ' + pickDef.name.toUpperCase() : 'YOUR DECK (' + run.deck.length + ')') + '</div>' +
        (pickDef ? '<div class="sub">' + pickDef.text + '</div>' : '<div class="sub">Every mark you buy lives here for the rest of the run.</div>') +
        '<div class="deck-grid">' + rows + '</div>' +
        '<button class="btn ghost" id="deck-close">' + (pickDef ? 'CANCEL' : 'CLOSE') + '</button>' +
      '</div>', 'centered wide');

    SUIT_KEYS.forEach(s => {
      const holder = $('.deck-cards[data-suit="' + s + '"]');
      bySuit[s].forEach(card => {
        const c = UI.cardEl(Object.assign({}, card, { faceUp: true }));
        c.classList.add('mini');
        if ((run.stash || []).some(x => x.id === card.id)) c.classList.add('in-stash');
        c.addEventListener('pointerenter', e => UI.showTip(e.currentTarget, cardTip(card)));
        c.addEventListener('pointerleave', UI.hideTip);
        if (pickDef) {
          c.classList.add('pickable');
          c.onclick = () => {
            if (Game.applyPending(card.id)) {
              Sfx.money();
              close();
              shop();
              UI.render();
              UI.toast(pickDef.name + ' applied!');
            }
          };
        }
        holder.appendChild(c);
      });
    });

    $('#deck-close').onclick = () => {
      Sfx.click();
      if (pickDef) Game.cancelPending();
      close();
      if (G.phase === 'shop') shop();
      else if (G.phase === 'play') UI.render();
    };
  }

  /* full value breakdown for a card, used on the deck screen */
  function cardTip(card) {
    /* Oddities are not rank-and-suit cards, so they get their own readout */
    if (card.oddity) {
      const od = ODDITIES[card.oddity];
      if (!od) return '<div class="tip-title">Unknown Oddity</div>';
      let o = '<div class="tip-title">' + icon(od.icon, 'tip-ico') + ' ' + od.name + '</div>';
      o += '<div class="tip-kind odd-kind">ODDITY — not a card from a deck of 52</div>';
      o += '<div class="tip-rows">' +
             '<div class="tip-row"><span>Base value</span><i>+' + od.chips + ' Chips</i></div>' +
             (card.oddCount ? '<div class="tip-row"><span>Scored so far</span><i>' + card.oddCount + ' time' + (card.oddCount > 1 ? 's' : '') + '</i></div>' : '') +
           '</div>';
      o += '<div class="tip-text hot">' + od.text + '</div>';
      if (od.long) o += '<div class="tip-detail hot"><b>How it works</b>' + od.long + '</div>';
      o += '<div class="tip-detail"><b>Where it can go</b>' +
(card.oddity === 'joker'
             ? 'It has no rank and no suit, so it <b>stacks onto any card in the tableau and any card stacks on top of it</b> — use it to bridge two runs together. On the foundations it is the exception: it becomes whatever card a pile is waiting for and <b>advances it like a real card</b>.'
             : 'It has no rank and no suit, so it <b>stacks onto any card in the tableau and any card stacks on top of it</b> — that is why a 10 will happily sit on it. Use it to bridge two runs together or to unstick a dead column. On the foundations it can be laid onto <b>any pile that has been started</b>, which scores its ability in full without advancing that pile.') +
           '</div>';
      return o;
    }

    const base = rankChips(card.rank);
    let chips = base, mult = 1, xmult = 1, cash = 0;
    const rows = [];
    rows.push(row('Base rank value', '+' + base + ' Chips'));

    const details = [];
    const e = ENHANCEMENTS[card.enhancement];
    if (card.enhancement !== 'none') {
      rows.push(row(e.name, e.text, 'hot'));
      if (e.long) details.push({ name: e.name, long: e.long, cls: 'hot' });
      if (card.enhancement === 'gilded') chips += 50;
      if (card.enhancement === 'voltaic') mult += 4;
      if (card.enhancement === 'glass') xmult *= 2;
      if (card.enhancement === 'phantom') mult += 2;
      if (card.enhancement === 'bomb') chips += 30;
      if (card.enhancement === 'bullion') cash += 4;
      if (card.enhancement === 'steel') xmult *= 1.5;
    }
    const f = FINISHES[card.finish];
    if (card.finish !== 'none') {
      rows.push(row(f.name, f.text, 'fin'));
      if (f.long) details.push({ name: f.name, long: f.long, cls: 'fin' });
      if (card.finish === 'foil') chips += 60;
      if (card.finish === 'holo') mult += 12;
      if (card.finish === 'poly') xmult *= 1.5;
    }
    const sl = SEALS[card.seal];
    if (card.seal !== 'none') {
      rows.push(row(sl.name, sl.text, 'seal'));
      if (sl.long) details.push({ name: sl.name, long: sl.long, cls: 'seal' });
      if (card.seal === 'blue') chips += 30;
      if (card.seal === 'gold') cash += 4;
    }

    const totalMult = mult * xmult;
    const alone = Math.round(chips * totalMult);
    const retrig = card.seal === 'red' ? 2 : 1;

    let out = '<div class="tip-title">' + RANK_NAMES[card.rank] + ' ' +
      (card.enhancement === 'wild' ? '✿ (every suit)' : SUITS[card.suit].sym) + '</div>';
    out += '<div class="tip-kind card-kind">CARD — lives in your deck</div>';
    out += '<div class="tip-rows">' + rows.join('') + '</div>';
    out += '<div class="tip-total">' +
      '<span>On its own</span><b>' + chips + ' X ' + (Math.round(totalMult * 100) / 100) + ' = ' +
      UI.fmt(alone * retrig) + '</b></div>';
    if (retrig > 1) out += '<div class="tip-foot">Red Seal: scored twice.</div>';
    if (cash) out += '<div class="tip-cash">Pays $' + cash + ' when scored.</div>';
    details.forEach(d => {
      out += '<div class="tip-detail ' + d.cls + '"><b>' + d.name + '</b>' + d.long + '</div>';
    });
    out += '<div class="tip-foot">Curios, Cascade and your Column Stack multiply this further.</div>';
    return out;
  }
