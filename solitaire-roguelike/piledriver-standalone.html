<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- PILEDRIVER - single-file build. Save it anywhere and open it in any browser. -->
<title>PILEDRIVER — a roguelike solitaire</title>
<style>
/* ============================================================
   PILEDRIVER — stylesheet
   dark felt, hot neon, chunky cards
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;600;700&display=swap');

:root{
  --cw: 76px;
  --ch: 106px;
  --felt:#0d1b16;
  --felt2:#123024;
  --ink:#06110d;
  --paper:#f7f3e6;
  --gold:#ffd166;
  --hot:#ff4d6d;
  --cool:#4cc9f0;
  --lime:#7ee787;
  --violet:#b07cff;
  --line:rgba(255,255,255,.13);
  --shadow: 0 10px 24px rgba(0,0,0,.5);
  --font: 'Space Grotesk', system-ui, sans-serif;
  --display: 'Bungee', 'Space Grotesk', system-ui, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; }
body{
  font-family:var(--font);
  color:var(--paper);
  background:
    radial-gradient(1200px 700px at 50% -10%, #1d4736 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 100%, #2a1140 0%, transparent 55%),
    var(--felt);
  overflow:hidden;
  user-select:none;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
  background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  opacity:.35;
}

#app{ position:relative; z-index:2; height:100%; display:flex; flex-direction:column; }
#app.shaking{ animation: shake .38s ease; }
@keyframes shake{
  0%,100%{ transform:translate(0,0) }
  20%{ transform:translate(calc(var(--shake) * -1), calc(var(--shake)/2)) rotate(-.4deg) }
  40%{ transform:translate(var(--shake), calc(var(--shake) / -2)) rotate(.4deg) }
  60%{ transform:translate(calc(var(--shake) / -1.6), 0) }
  80%{ transform:translate(calc(var(--shake) / 2), var(--shake)) }
}

/* ---------------- HUD ---------------- */
#hud{
  display:flex; align-items:center; gap:12px; padding:8px 14px;
  background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.15));
  border-bottom:2px solid var(--line);
}
.hud-group{ display:flex; align-items:center; gap:8px; }
.hud-group.right{ margin-left:auto; }
.badge{
  font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  background:rgba(255,255,255,.06); border:1px solid var(--line);
  padding:5px 10px; border-radius:8px; white-space:nowrap;
}
.badge b{ font-size:15px; margin-left:5px; font-family:var(--display); }
.badge.ante b{ color:var(--violet); }
.badge.round b{ color:var(--cool); }
.badge.score b{ color:var(--gold); }
.badge.cash{ font-family:var(--display); font-size:17px; color:var(--gold); padding:4px 12px;
  border-color:rgba(255,209,102,.45); background:rgba(255,209,102,.1); text-shadow:0 0 12px rgba(255,209,102,.5); }
.icon{
  width:34px; height:32px; border-radius:8px; cursor:pointer; position:relative;
  background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--paper);
  font-size:15px; display:flex; align-items:center; justify-content:center;
}
.icon:hover{ background:rgba(255,255,255,.14); }
.icon.off{ opacity:.45; }
#deck-count{ position:absolute; bottom:-2px; right:1px; font-size:9px; font-weight:700; color:var(--cool); }

.hud-quota{ flex:1; min-width:120px; max-width:460px; }
.quota-cap{ font-size:9px; letter-spacing:.18em; opacity:.55; margin-bottom:3px; }
.quota-bar{
  position:relative; height:20px; border-radius:10px; overflow:hidden;
  background:rgba(0,0,0,.45); border:1px solid var(--line);
}
.quota-fill{
  position:absolute; inset:0 auto 0 0; width:0%;
  background:linear-gradient(90deg, var(--hot), var(--gold));
  transition:width .35s cubic-bezier(.2,.9,.25,1);
  box-shadow:0 0 18px rgba(255,209,102,.55);
}
.quota-bar.met .quota-fill{ background:linear-gradient(90deg, var(--lime), var(--cool)); }
.quota-bar.met{ animation:pulseGlow 1.4s infinite; }
@keyframes pulseGlow{ 50%{ box-shadow:0 0 22px rgba(126,231,135,.6) } }
.quota-text{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; letter-spacing:.06em; text-shadow:0 1px 3px #000;
}

/* ---------------- MANTEL ---------------- */
#mantel{
  display:flex; align-items:center; gap:8px; padding:8px 14px; min-height:82px;
  background:linear-gradient(180deg, rgba(80,40,120,.25), transparent);
  border-bottom:1px dashed var(--line);
}
.mslot{
  position:relative; width:74px; height:66px; border-radius:10px; cursor:pointer;
  background:linear-gradient(160deg,#2b2140,#1a1226);
  border:2px solid rgba(255,255,255,.18);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:3px; text-align:center; transition:transform .12s, box-shadow .15s;
  box-shadow:var(--shadow);
}
.mslot:hover{ transform:translateY(-4px) rotate(-1deg); }
.mslot.empty{ background:rgba(255,255,255,.03); border-style:dashed; box-shadow:none; cursor:default; }
.mslot.empty:hover{ transform:none; }
.slot-mark{ opacity:.25; font-size:20px; }
.mslot .c-art{ font-size:24px; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
.mslot .c-name{ font-size:8px; line-height:1.05; margin-top:3px; text-transform:uppercase; letter-spacing:.03em; opacity:.9; }
.mslot .c-counter{
  position:absolute; bottom:-7px; right:-6px; font-family:var(--display); font-size:11px;
  background:var(--hot); color:#fff; padding:1px 5px; border-radius:7px; border:2px solid #1a1226;
}
.mslot.r-common{ border-color:#6d7f8c; }
.mslot.r-uncommon{ border-color:var(--cool); box-shadow:0 0 14px rgba(76,201,240,.28), var(--shadow); }
.mslot.r-rare{ border-color:var(--hot); box-shadow:0 0 16px rgba(255,77,109,.35), var(--shadow); }
.mslot.r-legendary{ border-color:var(--violet); box-shadow:0 0 22px rgba(176,124,255,.5), var(--shadow); animation:legend 2.6s infinite; }
@keyframes legend{ 50%{ box-shadow:0 0 34px rgba(176,124,255,.85), var(--shadow) } }
.mslot.trigger{ animation:curioPop .3s ease; }
@keyframes curioPop{ 0%{ transform:scale(1) } 40%{ transform:scale(1.22) rotate(-4deg) } 100%{ transform:scale(1) } }
.mantel-label{ margin-left:auto; font-size:9px; letter-spacing:.2em; opacity:.5; }
.mantel-label b{ color:var(--gold); }

/* ---------------- TABLE ---------------- */
#table{ flex:1; display:flex; flex-direction:column; gap:10px; padding:12px 14px 4px; min-height:0; }
#top-row{ display:flex; align-items:flex-start; gap:10px; }
.pile{ position:relative; width:var(--cw); height:var(--ch); border-radius:9px; }
#top-row .pile{ border:2px dashed rgba(255,255,255,.14); }
.waste-pile{ width:calc(var(--cw) + 28px); border-style:dashed; }
.foundations{ display:flex; gap:8px; margin-left:auto; }
.foundation{ box-shadow:inset 0 0 22px rgba(0,0,0,.5); }
.pile-ghost{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:30px; opacity:.2; font-family:var(--display);
}
.pile-ghost.suit-red{ color:var(--hot); opacity:.35; }
.pile-count{
  position:absolute; bottom:-8px; right:-4px; font-size:10px; font-weight:700;
  background:#000a; border:1px solid var(--line); border-radius:8px; padding:0 5px; z-index:99;
}
.stock-pile{ cursor:pointer; }
.stock-pile:hover{ border-color:var(--gold); }
.drop-ok{ box-shadow:0 0 0 3px var(--lime), 0 0 26px rgba(126,231,135,.6) !important; border-color:var(--lime) !important; }
.drop-no{ box-shadow:0 0 0 3px var(--hot) !important; border-color:var(--hot) !important; }

@keyframes hintPulse{ 0%,100%{ filter:brightness(1) } 50%{ filter:brightness(1.5) } }

#tableau{
  flex:1; display:grid; gap:10px; justify-content:center; align-content:start;
  grid-template-columns:repeat(var(--cols,7), var(--cw)); min-height:0;
}
.tab-pile{ height:100%; min-height:var(--ch); border-radius:9px; border:2px dashed rgba(255,255,255,.09); }

/* ---------------- CARDS ---------------- */
.card{
  position:absolute; left:0; top:0; width:var(--cw); height:var(--ch);
  border-radius:8px; background:var(--paper); color:#1a1a1a;
  box-shadow:0 3px 0 rgba(0,0,0,.45), 0 8px 16px rgba(0,0,0,.45);
  border:2px solid #1a1a1a; overflow:hidden;
  transition:transform .1s ease, box-shadow .12s ease, filter .12s;
}
.card.grabbable{ cursor:grab; }
.card.grabbable:active{ cursor:grabbing; }
.card .face{ position:absolute; inset:0; padding:4px; }
.card .corner{ position:absolute; display:flex; flex-direction:column; align-items:center; line-height:.92; }
.card .corner.tl{ top:3px; left:4px; }
.card .corner.br{ bottom:3px; right:4px; transform:rotate(180deg); }
.card .rk{ font-family:var(--display); font-size:15px; }
.card .st{ font-size:12px; }
.card .mid{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:34px; opacity:.9;
}
.card.red{ color:#d92b4b; }
.card.black{ color:#16181d; }
.card .shine{
  position:absolute; inset:0; pointer-events:none; opacity:0;
  background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.8) 50%, transparent 65%);
}
.card:hover .shine{ opacity:.5; transform:translateX(6px); }
.card.down{ background:linear-gradient(135deg,#2b1b4d,#402266); border-color:#0b0713; }
.card .back{
  position:absolute; inset:3px; border-radius:5px; display:flex; align-items:center; justify-content:center;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.09) 0 6px, transparent 6px 12px),
    linear-gradient(160deg,#5b2ea8,#2a1152);
  border:1px solid rgba(255,255,255,.22); color:rgba(255,255,255,.5); font-size:20px;
}
.card.down.peek{ background:var(--paper); }
.card.peek{ filter:saturate(.5) brightness(.78); }
.card.peek::after{
  content:''; position:absolute; inset:0; background:repeating-linear-gradient(45deg,rgba(0,0,0,.25) 0 5px,transparent 5px 10px);
  pointer-events:none;
}
.card.under{ filter:brightness(.8); }
.card.sel{ transform:translateY(-10px); box-shadow:0 0 0 3px var(--gold), 0 12px 22px rgba(0,0,0,.6); z-index:900 !important; }
.card.lifted{ opacity:.28; }
.card.trigger{ animation:cardPop .28s ease; z-index:950 !important; }
@keyframes cardPop{ 0%{ transform:scale(1) } 45%{ transform:scale(1.18) translateY(-8px) } 100%{ transform:scale(1) } }
.card.nope, .nope{ animation:nope .35s ease; }
@keyframes nope{ 0%,100%{ transform:translateX(0) } 25%{ transform:translateX(-7px) rotate(-2deg) } 75%{ transform:translateX(7px) rotate(2deg) } }
.card.shattering{ animation:shatterOut .4s forwards; }
@keyframes shatterOut{ to{ transform:scale(1.3) rotate(12deg); opacity:0; filter:blur(3px) } }
.card.mini{ position:relative; width:46px; height:64px; }
.card.mini .rk{ font-size:11px; } .card.mini .st{ font-size:9px; } .card.mini .mid{ font-size:20px; }
.card.pickable{ cursor:pointer; }
.card.pickable:hover{ transform:translateY(-6px) scale(1.06); box-shadow:0 0 0 3px var(--gold); }

.enh-badge{
  position:absolute; top:2px; right:3px; font-size:11px; line-height:1;
  background:#000c; color:#fff; border-radius:6px; padding:2px 4px;
}
.seal-dot{ position:absolute; bottom:4px; left:4px; width:11px; height:11px; border-radius:50%; border:2px solid #0007; }
.seal-red .seal-dot{ background:#e63946; }
.seal-gold .seal-dot{ background:var(--gold); }
.seal-blue .seal-dot{ background:var(--cool); }

/* enhancements */
.enh-gilded{ background:linear-gradient(150deg,#fff6d8,#ffe9a8); border-color:#b8860b; box-shadow:0 0 14px rgba(255,209,102,.55), 0 6px 14px rgba(0,0,0,.5); }
.enh-voltaic{ background:linear-gradient(150deg,#fff,#ffd9e2); border-color:var(--hot); box-shadow:0 0 14px rgba(255,77,109,.5), 0 6px 14px rgba(0,0,0,.5); }
.enh-glass{ background:linear-gradient(150deg, rgba(210,245,255,.9), rgba(160,225,255,.75)); border-color:#8fd8f5; backdrop-filter:blur(2px); box-shadow:0 0 16px rgba(140,220,255,.6); }
.enh-wild{ background:linear-gradient(150deg,#ffd9f4,#d9f4ff,#e2ffd9); border-color:var(--violet); animation:wildShift 5s linear infinite; }
@keyframes wildShift{ 50%{ filter:hue-rotate(60deg) } }
.enh-phantom{ background:linear-gradient(150deg,#e9e6ff,#cfc6ff); border-color:#8a7bd8; opacity:.93; box-shadow:0 0 18px rgba(150,120,255,.5); }
.enh-lucky{ background:linear-gradient(150deg,#e8ffe9,#c9f7cd); border-color:#3aa84a; }
.enh-steel{ background:linear-gradient(150deg,#dfe5ea,#aeb9c4); border-color:#7c8894; }
.enh-bomb{ background:linear-gradient(150deg,#ffe2cf,#ffbe9b); border-color:#ff7a2f; animation:fuse 1.6s infinite; }
@keyframes fuse{ 50%{ box-shadow:0 0 20px rgba(255,122,47,.75) } }
.enh-bullion{ background:linear-gradient(150deg,#ffeaa0,#e0b950); border-color:#8a6d1a; }

/* finishes */
.fin-foil{ box-shadow:0 0 0 2px #9fe8ff inset, 0 0 16px rgba(76,201,240,.6), 0 6px 14px rgba(0,0,0,.5); }
.fin-holo{ box-shadow:0 0 0 2px #ff9ff3 inset, 0 0 18px rgba(255,120,220,.6), 0 6px 14px rgba(0,0,0,.5); }
.fin-poly{ animation:poly 3s linear infinite; }
@keyframes poly{ 0%{ filter:hue-rotate(0) saturate(1.3) } 100%{ filter:hue-rotate(360deg) saturate(1.3) } }
.fin-neg{ filter:invert(1) hue-rotate(180deg); }

/* ---------------- SCOREBOX ---------------- */
#scorebox{
  --heat:0; --swell:1;
  flex:1; min-width:210px; height:var(--ch); margin:0 6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  border-radius:12px; border:2px solid var(--line); position:relative;
  background:linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,.25));
  box-shadow:inset 0 0 30px rgba(255,77,109, calc(var(--heat) * .6));
  transition:box-shadow .2s, border-color .2s;
}
.sb-eq-row{ display:flex; align-items:center; gap:7px; transform:scale(var(--swell)); transition:transform .18s; }
.sb-side{
  position:relative; font-family:var(--display); font-size:clamp(15px,2.4vw,27px);
  padding:3px 12px; border-radius:9px; min-width:62px; text-align:center;
}
.sb-side::after{
  content:attr(data-cap); position:absolute; left:0; right:0; bottom:-13px;
  font-family:var(--font); font-size:7.5px; letter-spacing:.22em; opacity:.5;
}
.sb-side.chips{ background:rgba(76,201,240,.16); color:var(--cool); border:2px solid rgba(76,201,240,.4); text-shadow:0 0 14px rgba(76,201,240,.7); }
.sb-side.mult{ background:rgba(255,77,109,.16); color:var(--hot); border:2px solid rgba(255,77,109,.45); text-shadow:0 0 14px rgba(255,77,109,.7); }
.sb-side.total{ background:rgba(255,209,102,.16); color:var(--gold); border:2px solid rgba(255,209,102,.5); text-shadow:0 0 16px rgba(255,209,102,.75); min-width:78px; }
.sb-op{ font-family:var(--display); opacity:.5; font-size:14px; }
.sb-op.eq{ opacity:.8; color:var(--gold); }
.sb-legend{ font-size:8.5px; letter-spacing:.1em; opacity:.42; margin-top:11px; }
.sb-legend b{ color:var(--gold); }
.bump{ animation:bump .22s ease; display:inline-block; }
@keyframes bump{ 0%{ transform:scale(1) } 45%{ transform:scale(1.28) } 100%{ transform:scale(1) } }

#scorebox.live{ border-color:var(--gold); }
#scorebox.t1{ border-color:var(--lime); }
#scorebox.t2{ border-color:var(--gold); box-shadow:inset 0 0 34px rgba(255,209,102,.4), 0 0 20px rgba(255,209,102,.25); }
#scorebox.t3{ border-color:#ff8f3f; box-shadow:inset 0 0 40px rgba(255,143,63,.5), 0 0 28px rgba(255,143,63,.4); }
#scorebox.t4{ border-color:var(--hot); box-shadow:inset 0 0 46px rgba(255,77,109,.6), 0 0 36px rgba(255,77,109,.5); }
#scorebox.t5{ border-color:var(--violet); box-shadow:inset 0 0 52px rgba(176,124,255,.7), 0 0 46px rgba(176,124,255,.6); animation:t5pulse .5s infinite alternate; }
@keyframes t5pulse{ to{ filter:brightness(1.25) } }
#scorebox.slam{ animation:slam .42s cubic-bezier(.2,1.6,.3,1); }
@keyframes slam{ 0%{ transform:scale(1) } 25%{ transform:scale(1.11) rotate(-.5deg) } 100%{ transform:scale(1) } }

/* live combo readout */
#combo-meter{
  position:absolute; top:-11px; left:50%; transform:translateX(-50%);
  display:flex; gap:6px; opacity:0; transition:opacity .15s; pointer-events:none;
}
#combo-meter.active{ opacity:1; }
#combo-meter.pop{ animation:comboPop .3s cubic-bezier(.2,1.7,.3,1); }
@keyframes comboPop{ 0%{ transform:translateX(-50%) scale(.6) } 55%{ transform:translateX(-50%) scale(1.2) } 100%{ transform:translateX(-50%) scale(1) } }
.cm{
  font-family:var(--display); font-size:10px; padding:3px 9px; border-radius:9px;
  border:2px solid; white-space:nowrap;
}
.cm b{ font-size:12px; }
.cm.cascade{ background:#2a0e18; color:var(--hot); border-color:var(--hot); box-shadow:0 0 14px rgba(255,77,109,.6); }
.cm.suitrun{ background:#0d2230; color:var(--cool); border-color:var(--cool); box-shadow:0 0 14px rgba(76,201,240,.6); }

/* ---------------- CONTROLS ---------------- */
#controls{
  display:flex; align-items:center; gap:10px; padding:8px 14px 12px;
  border-top:1px solid var(--line); background:linear-gradient(0deg, rgba(0,0,0,.5), transparent);
}
.ctl-mid{ display:flex; gap:8px; margin:0 auto; }
.ctl-right{ margin-left:auto; }
.chip{ font-size:10px; letter-spacing:.12em; opacity:.75; }
.chip b{ font-family:var(--display); color:var(--cool); font-size:14px; margin-left:4px; }
.btn{
  font-family:var(--display); font-size:13px; letter-spacing:.05em; cursor:pointer;
  padding:9px 16px; border-radius:10px; color:#12100f;
  background:linear-gradient(180deg, var(--gold), #e0a93b);
  border:2px solid #0006; box-shadow:0 4px 0 #8a651c, 0 8px 18px rgba(0,0,0,.45);
  transition:transform .08s, box-shadow .08s, filter .12s;
}
.btn:hover{ filter:brightness(1.08); }
.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #8a651c; }
.btn:disabled{ opacity:.35; cursor:not-allowed; box-shadow:none; }
.btn.ghost{ background:rgba(255,255,255,.08); color:var(--paper); border:2px solid var(--line); box-shadow:0 4px 0 rgba(0,0,0,.4); }
.btn.ghost b{ color:var(--gold); }
.btn.big{ font-size:17px; padding:13px 26px; }
.btn.danger{ background:linear-gradient(180deg,#ff6b81,#c92a45); color:#fff; box-shadow:0 4px 0 #7d1225; }
.cash-btn{ background:linear-gradient(180deg,#7ee787,#39a04a); color:#062210; box-shadow:0 4px 0 #1d5c2a, 0 8px 18px rgba(0,0,0,.45); }
.cash-btn.urgent{ animation:urgent 1s infinite; }
@keyframes urgent{ 50%{ filter:brightness(1.35); box-shadow:0 4px 0 #1d5c2a, 0 0 26px rgba(126,231,135,.8) } }

/* ---------------- FX ---------------- */
#fxlayer,#draglayer{ position:fixed; inset:0; pointer-events:none; z-index:5000; }
.ghost-stack{ position:absolute; top:0; left:0; will-change:transform; filter:drop-shadow(0 18px 22px rgba(0,0,0,.6)); }
.ghost-stack .card{ transform:rotate(0); }
body.dragging-now{ cursor:grabbing; }

.fx-float{
  position:fixed; transform:translate(-50%,0); font-family:var(--display); font-size:15px;
  text-shadow:0 2px 6px #000; animation:floatUp .9s ease-out forwards; white-space:nowrap;
}
@keyframes floatUp{ 0%{ opacity:0; transform:translate(-50%,10px) scale(.7) } 20%{ opacity:1; transform:translate(-50%,-4px) scale(1.1) } 100%{ opacity:0; transform:translate(-50%,-52px) scale(1) } }
.fx-chips{ color:var(--cool); }
.fx-mult{ color:var(--hot); }
.fx-xmult{ color:#ff9ff3; font-size:19px; }
.fx-money{ color:var(--gold); }
.fx-flash{ color:#fff; }
.fx-again{ color:var(--lime); }
.fx-shatter{ color:#9fe8ff; }
.fx-total{
  position:fixed; transform:translate(-50%,0); font-family:var(--display);
  font-size:44px; color:var(--gold); text-shadow:0 0 24px rgba(255,209,102,.9), 0 4px 0 #7a5410;
  animation:totalPop 1s ease-out forwards;
}
@keyframes totalPop{ 0%{ opacity:0; transform:translate(-50%,20px) scale(.5) } 25%{ opacity:1; transform:translate(-50%,-6px) scale(1.2) } 100%{ opacity:0; transform:translate(-50%,-70px) scale(1) } }
.fx-banner{
  position:fixed; left:50%; top:34%; transform:translate(-50%,-50%);
  font-family:var(--display); font-size:clamp(22px,5vw,44px); letter-spacing:.05em;
  color:#fff; text-shadow:0 0 30px var(--hot), 0 4px 0 #6c1024;
  animation:bannerIn 1.1s ease-out forwards;
}

.odd-credit .odd-art, .odd-credit .odd-head span, .odd-credit .odd-mini{ color:#2c3444; }
.odd-business{ background:linear-gradient(165deg,#fdfdfd,#e2e2e2); border-color:#333; }
.odd-business .odd-art, .odd-business .odd-head span, .odd-business .odd-mini{ color:#222; }
.odd-jail{ background:linear-gradient(165deg,#fff2e2,#ffd7ad); border-color:#b8600b; }
.odd-jail .odd-art, .odd-jail .odd-head span, .odd-jail .odd-mini{ color:#7d4108; }
.odd-birthday{ background:linear-gradient(165deg,#ffeef8,#ffd6ec); border-color:#d1479a; }
.odd-birthday .odd-art, .odd-birthday .odd-head span, .odd-birthday .odd-mini{ color:#8e2c66; }
.odd-punch{ background:linear-gradient(165deg,#eafff9,#c2f0e4); border-color:#2f8f83; }
.odd-punch .odd-art, .odd-punch .odd-head span, .odd-punch .odd-mini{ color:#1d635a; }

/* ============================================================
   twins fan out behind the pile so the top card stays readable
   ============================================================ */
.card.twin-card{
  transform:translate(calc(var(--tw) * 7px), calc(var(--tw) * -5px)) rotate(calc(var(--tw) * 4deg));
  filter:brightness(.8) saturate(.85);
  box-shadow:0 0 0 2px rgba(176,124,255,.7), 0 6px 12px rgba(0,0,0,.5);
}
.twin-count{
  position:absolute; top:-9px; left:-8px; z-index:60;
  font-family:var(--display); font-size:8px; letter-spacing:.06em;
  background:var(--violet); color:#fff; padding:1px 5px; border-radius:6px; border:2px solid #1a1226;
}
.run-badge.solo{ background:#0b140dfa; }

/* ============================================================
   THE SIDE POT -- the corner gamble
   ============================================================ */
.sidepot{
  display:flex; flex-direction:column; gap:2px; align-items:center;
  padding:6px 12px; border-radius:12px; margin-right:12px; min-width:172px;
  border:2px solid var(--line); background:linear-gradient(165deg, rgba(0,0,0,.5), rgba(0,0,0,.25));
  cursor:help; transition:box-shadow .2s, border-color .2s;
}
.sp-cap{ font-size:8px; letter-spacing:.2em; opacity:.55; display:flex; gap:6px; align-items:center; }
.sp-streak{ background:var(--hot); color:#fff; border-radius:6px; padding:0 5px; letter-spacing:.06em; font-size:7px; }
.sp-amount{ font-family:var(--display); font-size:22px; color:var(--paper); line-height:1; opacity:.4; }
.sp-sub{ font-size:8px; opacity:.5; }
.sp-btns{ display:flex; gap:5px; margin-top:3px; }
.sp-btn{
  font-family:var(--display); font-size:9px; padding:4px 8px; border-radius:7px; cursor:pointer;
  border:2px solid; background:rgba(255,255,255,.05); color:var(--paper);
}
.sp-cash{ border-color:var(--lime); color:var(--lime); }
.sp-cash:hover{ background:rgba(126,231,135,.24); }
.sp-flip{ border-color:var(--hot); color:#ff8fa3; }
.sp-flip:hover{ background:rgba(255,77,109,.28); }
.sp-btn.off{ opacity:.28; cursor:not-allowed; }
.sidepot.live{ border-color:var(--gold); }
.sidepot.live .sp-amount{ opacity:1; color:var(--gold); text-shadow:0 0 16px rgba(255,209,102,.7); }
.sidepot.ready{ box-shadow:0 0 22px rgba(255,143,63,.5); border-color:#ff8f3f; }
.sidepot.ready .sp-amount{ color:#ff8f3f; text-shadow:0 0 20px rgba(255,143,63,.9); }
.sidepot.blazing{ border-color:var(--hot); animation:heatGlow .7s infinite alternate; }
.sidepot.blazing .sp-amount{ color:var(--hot); }
@media (max-width:860px){ .sidepot{ min-width:0; padding:4px 8px; margin-right:6px; } .sp-amount{ font-size:16px; } }

/* the flip card reuses the old cut styling */
.cut-flip{
  position:fixed; left:50%; top:40%; transform:translate(-50%,-50%);
  width:240px; padding:14px; border-radius:14px; text-align:center; z-index:5200;
  background:linear-gradient(165deg,#1b1020,#0c0a12); border:3px solid var(--gold);
  box-shadow:0 0 40px rgba(255,209,102,.5), 0 20px 44px rgba(0,0,0,.7);
  animation:cutIn .4s cubic-bezier(.2,1.6,.3,1);
}
@keyframes cutIn{ 0%{ opacity:0; transform:translate(-50%,-40%) scale(.6) rotateY(80deg) } 100%{ opacity:1 } }
.cut-flip.hit{ border-color:var(--lime); box-shadow:0 0 50px rgba(126,231,135,.6), 0 20px 44px rgba(0,0,0,.7); }
.cut-flip.miss{ border-color:var(--hot); box-shadow:0 0 50px rgba(255,77,109,.6), 0 20px 44px rgba(0,0,0,.7); }
.cut-flip.out{ animation:wishOut .4s ease forwards; }
.cf-call{ font-size:8.5px; letter-spacing:.2em; opacity:.5; }
.cf-card{
  font-family:var(--display); font-size:40px; line-height:1.15; margin:3px 0 5px;
  background:var(--paper); border-radius:9px; border:2px solid #1a1a1a; padding:6px 0;
}
.cf-card.red{ color:#d92b4b; } .cf-card.black{ color:#16181d; }
.cf-verdict{ font-family:var(--display); font-size:11px; }
.cut-flip.hit .cf-verdict{ color:var(--lime); }
.cut-flip.miss .cf-verdict{ color:var(--hot); }

/* plain-card shelf */
.sh-plain .shelf-head h3{ color:#e8dcc0; }
.shop-item.sh-plain{ border-color:#8d8264; background:linear-gradient(170deg,#23200f,#16140c); }
.shelf-row.plain-row{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.odd-blurb{ font-size:9px; opacity:.7; margin-top:4px; line-height:1.35; }

/* the deal: every card flies out of the deck to its seat */
.card.dealing{
  animation:dealFly .3s cubic-bezier(.2,.9,.3,1) backwards;
}
@keyframes dealFly{
  0%{ transform:translate(var(--dx), var(--dy)) rotate(-16deg) scale(.9); opacity:0 }
  35%{ opacity:1 }
  100%{ transform:none; opacity:1 }
}

/* ============================================================
   THE WHEEL
   ============================================================ */
.wheel-panel{ max-width:430px; }
.wheel-stake{ font-size:12px; opacity:.8; margin-bottom:10px; }
.wheel-stake b{ font-family:var(--display); color:var(--gold); font-size:17px; }
.wheel-wrap{ position:relative; width:220px; height:220px; margin:0 auto 14px; }
.rw-wheel{
  position:absolute; inset:0; border-radius:50%;
  border:6px solid #3a2a16;
  box-shadow:0 0 0 3px #7a5a2a, inset 0 0 30px rgba(0,0,0,.65), 0 16px 34px rgba(0,0,0,.6);
}
.rw-nums{ position:absolute; inset:0; }
.rw-num{
  position:absolute; left:50%; top:50%; width:20px; height:14px; margin:-7px 0 0 -10px;
  font-family:var(--display); font-size:9px; text-align:center; color:#fff;
  text-shadow:0 1px 2px #000; pointer-events:none;
}
.rw-hub{
  position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px;
  border-radius:50%; background:radial-gradient(circle at 40% 35%, #d8b26a, #6b4a1c);
  border:3px solid #3a2a16; box-shadow:inset 0 0 14px rgba(0,0,0,.6);
}
.rw-pointer{
  position:absolute; left:50%; top:-12px; margin-left:-9px; z-index:10;
  width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent;
  border-top:18px solid var(--gold); filter:drop-shadow(0 3px 5px rgba(0,0,0,.7));
}
.rw-ball{
  position:absolute; left:50%; top:50%; width:13px; height:13px; margin:-6.5px 0 0 -6.5px; z-index:9;
  border-radius:50%; background:radial-gradient(circle at 34% 28%, #fff, #cfcfd8 55%, #8d8d99);
  box-shadow:0 3px 7px rgba(0,0,0,.75), inset 0 -2px 3px rgba(0,0,0,.3);
  transform:translate(0,-96px); will-change:transform;
}
.rw-ball.live{ box-shadow:0 3px 10px rgba(0,0,0,.8), 0 0 12px rgba(255,255,255,.35); }
.rw-ball.settled{ animation:ballSettle .45s cubic-bezier(.2,1.6,.3,1); }
@keyframes ballSettle{ 0%{ filter:brightness(1.6) } 100%{ filter:none } }

.wheel-bets{ display:flex; gap:8px; justify-content:center; margin-bottom:10px; }
.rw-bet{
  flex:1; display:flex; flex-direction:column; gap:2px; align-items:center; cursor:pointer;
  padding:9px 6px; border-radius:11px; border:2px solid; background:rgba(255,255,255,.05); color:var(--paper);
  transition:transform .1s, box-shadow .14s;
}
.rw-bet:hover:not(:disabled){ transform:translateY(-3px); }
.rw-bet:disabled{ opacity:.4; cursor:default; }
.rw-bet.chosen{ opacity:1; box-shadow:0 0 0 3px var(--gold), 0 0 22px rgba(255,209,102,.6); }
.rw-red{ border-color:#c62b45; background:rgba(198,43,69,.2); }
.rw-black{ border-color:#8b93a7; background:rgba(27,28,34,.6); }
.rw-green{ border-color:#1f9d55; background:rgba(31,157,85,.2); }
.rw-bl{ font-family:var(--display); font-size:12px; }
.rw-bo{ font-size:8.5px; opacity:.55; letter-spacing:.08em; }
.rw-bp{ font-family:var(--display); font-size:11px; color:var(--gold); }
.wheel-warn{ font-size:10px; opacity:.6; margin-bottom:8px; }
.wheel-warn b{ color:var(--hot); }
.wheel-result{ min-height:44px; font-size:12.5px; margin-bottom:10px; line-height:1.5; }
.wheel-result b{ font-family:var(--display); font-size:15px; }
.wheel-result.win{ color:var(--lime); }
.wheel-result.lose{ color:#ff8fa3; }
.rw-note{ font-size:10.5px; opacity:.75; }
.rw-spinning{ opacity:.5; font-style:italic; }
.tip-kind.odd-kind{ background:rgba(255,209,102,.16); color:#ffdf9c; }
.quip{ font-size:10.5px; opacity:.55; font-style:italic; }
.panel-quip{ margin:-8px 0 14px; }
#toast .quip{ opacity:.7; }

/* LET IT RIDE */
.ride-btn{
  display:block; margin:0 auto 6px;
  background:linear-gradient(180deg,#ff8f3f,#c9541a); color:#fff;
  box-shadow:0 4px 0 #7d3410, 0 0 26px rgba(255,143,63,.55);
  animation:rideGlow .9s infinite alternate;
}
@keyframes rideGlow{ to{ box-shadow:0 4px 0 #7d3410, 0 0 38px rgba(255,143,63,.95) } }
.ride-btn:disabled{ animation:none; opacity:.6; }
.ride-note{ font-size:10.5px; opacity:.6; margin-bottom:10px; }

/* wheel: pot vs cash */
.rw-modes{ display:flex; gap:8px; justify-content:center; margin-bottom:8px; }
.rw-mode{
  flex:1; display:flex; flex-direction:column; gap:1px; align-items:center; cursor:pointer;
  font-family:var(--display); font-size:10px; padding:6px 8px; border-radius:9px;
  border:2px solid var(--line); background:rgba(255,255,255,.05); color:var(--paper);
}
.rw-mode span{ font-family:var(--font); font-size:11px; opacity:.6; }
.rw-mode:hover:not(:disabled){ background:rgba(255,255,255,.12); }
.rw-mode.on{ border-color:var(--gold); background:rgba(255,209,102,.16); color:var(--gold); }
.rw-mode.on span{ opacity:.9; color:var(--paper); }
.rw-mode:disabled{ opacity:.32; cursor:not-allowed; }
.rw-chips{ display:flex; gap:6px; justify-content:center; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
.rw-chip{
  font-family:var(--display); font-size:10px; cursor:pointer;
  padding:4px 10px; border-radius:14px; border:2px solid var(--line);
  background:rgba(255,255,255,.05); color:var(--paper);
}
.rw-chip:hover{ background:rgba(255,255,255,.14); }
.rw-chip.on{ border-color:var(--gold); background:var(--gold); color:#12100f; }
.rw-broke{ font-size:10px; opacity:.5; }
.rw-bet.off{ opacity:.3; cursor:not-allowed; }
.odd-scratch{ background:linear-gradient(165deg,#fff1cf,#ffd98a); border-color:#a8730b; }
.odd-scratch .odd-art, .odd-scratch .odd-head span, .odd-scratch .odd-mini{ color:#6d4a06; }
.odd-lottery{ background:linear-gradient(165deg,#ffe6ee,#ffbcd2); border-color:#c2185b; }
.odd-lottery .odd-art, .odd-lottery .odd-head span, .odd-lottery .odd-mini{ color:#8c0f42; }
.odd-cookie{ background:linear-gradient(165deg,#fff3e0,#ffddb0); border-color:#a86a1b; }
.odd-cookie .odd-art, .odd-cookie .odd-head span, .odd-cookie .odd-mini{ color:#734813; }

/* ---------------- THE BOUNTY ----------------
   A wanted poster nailed to the table. Always one card posted, always worth
   chasing, and RAISE turns it into a bet against a twelve-move clock.        */
.bounty{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:5px 7px 6px; border-radius:4px; min-width:96px; min-height:var(--ch);
  border:2px solid rgba(214,171,106,.55);
  background:
    linear-gradient(165deg, rgba(214,171,106,.16), rgba(30,20,10,.55)),
    repeating-linear-gradient(92deg, rgba(255,255,255,.02) 0 3px, transparent 3px 7px);
  box-shadow:inset 0 0 20px rgba(0,0,0,.5);
}
.bounty::before,.bounty::after{
  content:''; position:absolute; top:4px; width:5px; height:5px; border-radius:50%;
  background:#d6ab6a; box-shadow:0 1px 2px #000;
}
.bounty::before{ left:5px; } .bounty::after{ right:5px; }
.bounty.hot{ border-color:var(--hot); animation:bountyPulse .8s ease-in-out infinite; }
@keyframes bountyPulse{
  0%,100%{ box-shadow:inset 0 0 20px rgba(0,0,0,.5), 0 0 0 rgba(255,90,90,0); }
  50%{ box-shadow:inset 0 0 20px rgba(0,0,0,.5), 0 0 26px rgba(255,90,90,.55); }
}
.bnt-title{
  font-family:var(--display); font-size:10px; letter-spacing:.22em; color:#e8c489;
  text-shadow:0 1px 0 #000;
}
.bnt-face{
  width:38px; height:52px; border-radius:5px; background:#f4efe2; color:#111;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:var(--display); line-height:1; box-shadow:0 2px 6px rgba(0,0,0,.6);
  filter:sepia(.35) contrast(1.05);
}
.bnt-face .r{ font-size:17px; font-weight:800; }
.bnt-face .s{ font-size:15px; }
.bnt-face.red{ color:#a3202a; }
.bnt-reward{ font-size:10px; font-weight:800; color:var(--gold); letter-spacing:.04em; }
.bnt-clock{ font-size:9px; font-weight:800; color:var(--hot); letter-spacing:.1em; }
.bnt-raise{
  font-family:var(--display); font-size:8px; letter-spacing:.14em; padding:2px 7px;
  border-radius:5px; cursor:pointer; color:#1a1206;
  background:linear-gradient(180deg,#f0c674,#c99a3d); border:none;
  box-shadow:0 2px 0 #7d5c1c;
}
.bnt-raise:hover{ filter:brightness(1.12); }
.bnt-raise:disabled{ opacity:.4; cursor:default; box-shadow:none; }
.bnt-empty{ font-size:9px; opacity:.5; text-align:center; padding-top:14px; }

/* ---------------- AUTOPLAY ----------------
   The card slides in from wherever it just came from, so you can actually see
   the move rather than the board teleporting between states.                  */
.card.autofly{
  animation:autoFly .32s cubic-bezier(.22,.9,.28,1) backwards;
  z-index:400;
}
@keyframes autoFly{
  0%{ transform:translate(var(--dx), var(--dy)) scale(1.05); box-shadow:0 14px 26px rgba(0,0,0,.6); }
  70%{ box-shadow:0 8px 18px rgba(0,0,0,.45); }
  100%{ transform:none; }
}
#btn-collect.running{
  background:linear-gradient(180deg,#ff8a5c,#e0562c);
  color:#fff; border-color:#ff8a5c; box-shadow:0 3px 0 #8a2f12;
  animation:autoPulse .9s ease-in-out infinite;
}
@keyframes autoPulse{
  0%,100%{ filter:brightness(1); }
  50%{ filter:brightness(1.22); }
}

<div id="app">

      <div class="badge whim" id="whim-badge" style="display:none"></div>
    </div>

    <div class="tempo" id="tempo" title="TEMPO - play fast and every score is worth more">
      <div class="tempo-cap">TEMPO</div>
      <div class="tempo-bar"><div class="tempo-fill" id="tempo-fill"></div></div>
      <div class="tempo-mult" id="tempo-mult">X1</div>
    </div>

    <div class="hud-quota">
      <div class="quota-cap">QUOTA — ante total</div>
      <div id="quota-bar" class="quota-bar">
        <div id="quota-fill" class="quota-fill"></div>
        <span id="quota-text" class="quota-text">0 / 0</span>
      </div>
    </div>

    <div class="hud-group right">
      <div class="badge score">SCORE <b id="round-score">0</b></div>
      <div class="badge cash" id="money">$0</div>
      <button class="icon" id="btn-deck" title="View deck (D)">🂠<span id="deck-count">52</span></button>
      <button class="icon" id="btn-help" title="How to play">?</button>
      <button class="icon" id="btn-almanac" title="The Almanac - every ability (K)">📖</button>
      <button class="icon" id="btn-sound" title="Sound effects">🔊</button>
      <button class="icon" id="btn-music" title="Music">♪</button>
      <button class="icon" id="btn-menu" title="Menu (Esc)">☰</button>
    </div>
  </header>

  <div id="mantel"></div>

  <main id="table">
    <div id="top-row">
      <div class="pile stock-pile" id="stock" data-zone="stock"></div>
      <div class="pile waste-pile" id="waste" data-zone="waste"></div>
      <div class="stash-pile" id="stash" data-zone="stash" title="Hold cards back and play them whenever they help - they survive between rounds"></div>
      <div class="bounty" id="bounty" data-zone="bounty"></div>

      <div id="scorebox">

          <div class="sb-op">X</div>
          <div class="sb-side mult" data-cap="MULT"><span id="sb-mult">1</span></div>
          <div class="sb-op eq">=</div>
          <div class="sb-side total" data-cap="POINTS"><span id="sb-total">0</span></div>
        </div>
        <div class="sb-legend">Chips <b>X</b> Mult = the points added to your round score</div>
      </div>

      <div class="foundations">
        <div class="pile foundation" id="f-S" data-zone="foundation" data-suit="S"></div>
        <div class="pile foundation" id="f-H" data-zone="foundation" data-suit="H"></div>
        <div class="pile foundation" id="f-D" data-zone="foundation" data-suit="D"></div>
        <div class="pile foundation" id="f-C" data-zone="foundation" data-suit="C"></div>
      </div>
    </div>

    <div id="tableau"></div>
  </main>

  <footer id="controls">
    <div class="ctl-left">
      <div class="chip" id="passes">PASSES <b>3</b></div>
      <div class="reshuffle-bar" id="reshuffle-bar"></div>
    </div>
    <div class="ctl-mid">
      <button class="btn ghost" id="btn-undo">UNDO <b>3</b></button>
      <button class="btn ghost" id="btn-hint">HINT</button>
      <button class="btn ghost" id="btn-collect">AUTO</button>
    </div>
    <div class="ctl-right">
      <div class="sidepot" id="sidepot"></div>
      <button class="btn cash-btn" id="btn-cash" title="Bank this round and collect">CASH OUT <b id="cash-preview">$0</b></button>
    </div>
  </footer>

</div>

<div id="flash"></div>
<div id="fxlayer"></div>
<div id="draglayer"></div>
<div id="tooltip"></div>
<div id="toast"></div>
<div id="overlay"></div>

/* the icon renderer -- everything goes through this so the whole set stays uniform */
function icon(name, cls) {
  const body = ICONS[name] || ICONS.unknown;
  return '<svg class="ico ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
         'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
}

function rankChips(rank) {
  if (rank === 1) return 11;
  if (rank >= 11) return 10;
  return rank;
}

function rndRank() {
  let total = 0;
  for (let r = 1; r <= 13; r++) total += RANK_WEIGHTS[r];
  let x = Math.random() * total;
  for (let r = 1; r <= 13; r++) { x -= RANK_WEIGHTS[r]; if (x <= 0) return r; }
  return 1;
}

function counterPrice(run, id) {
  const def = COUNTER_BY_ID[id];
  const owned = (run.counterBought && run.counterBought[id]) || 0;
  return Math.max(1, Math.ceil((def.base + def.step * owned) * (1 - Math.min(0.75, run.discount))));
}

/* ============================================================
   PILE-DRIVER  ::  engine.js
   Run state, deck construction, the deal, and every solitaire rule.
   ============================================================ */

const Engine = (() => {
  let uid = 1;
  const nextId = () => 'c' + (uid++);

  function newCard(rank, suit, extra) {
    return Object.assign({
      id: nextId(), rank, suit,
      enhancement: 'none', finish: 'none', seal: 'none',
      faceUp: false
    }, extra || {});
  }

  function standardDeck() {
    const d = [];
    for (const s of SUIT_KEYS) for (let r = 1; r <= 13; r++) d.push(newCard(r, s));
    return d;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /* ---------------- run creation ---------------- */
  function newRun() {
    return {
      ante: 1,
      round: 1,
      anteScore: 0,
      money: 8,
      deck: standardDeck(),
      mantel: [],
      mantelSlots: TUNE.startingMantelSlots,
      houseRules: {},
      bonusPasses: 0,
      bonusUndos: 0,
      bonusMoney: 0,
      interestCap: TUNE.interestCap,
      discount: 0,
      markedDeck: false,
      headStart: 0,
      columns: 7,
      curioBonusMult: 0,
      luck: 1,
      quotaScale: 1,
      drawReduce: 0,
      counterBought: {},
      bonusStash: 0,
      stash: [],
      daresDone: 0,
      bonusReshuffles: 0,
      permaMult: 0,
      whim: null,
      banditPulls: 0,
      finalAnte: TUNE.finalAnte,
      shop: null,
      rerollCount: 0,
      history: [],
      stats: { roundsPlayed: 0, cardsScored: 0, best: 0, suitsDone: 0 }
    };
  }

  function quotaFor(run) {
    return Math.round(TUNE.baseQuota * Math.pow(TUNE.quotaGrowth, run.ante - 1) * run.quotaScale / 25) * 25;
  }

  /* ---------------- mantel helpers ---------------- */
  function mods(run) {
    const m = {
      cascadeMult: 1, suitRunMult: 1, stockPasses: 0, undos: 0,
      xray: false, anyIntoEmpty: false, firstRetrigger: 0,
      infinitePasses: false, wrapAround: false, noInterest: false, copyLeft: false,
      drawReduce: 0,
      counterBought: {},
      bonusStash: 0,
      stash: [],
      daresDone: 0,
      bonusReshuffles: 0,
      permaMult: 0,
      whim: null,
      banditPulls: 0, wasteAll: false, stackMult: 1,
      twinMult: 1, noRevealScore: false, banditLuck: false,
      reshuffles: 0, heatPer: 0,
      stashSlots: 0, stashCash: 0, stashPlayMult: 0, dareBonus: false, firstFlipSafe: false,
      potShare: 0,
      bountyMult: 0, bountyBonus: false
    };
    const merge = src => {
      if (!src) return;
      for (const k in src) {
        const v = src[k];
        if (typeof v === 'number') m[k] = (k === 'stackMult' || k === 'twinMult' || k === 'cascadeMult' || k === 'suitRunMult')
          ? m[k] * v : m[k] + v;
        else m[k] = m[k] || v;
      }
    };
    run.mantel.forEach(inst => {
      const def = CURIO_BY_ID[inst.id];
      if (def) merge(def.mods);
    });
    if (run.whim && WHIM_BY_ID[run.whim]) merge(WHIM_BY_ID[run.whim].mods);
    return m;
  }

  function stashCapacity(run) {
    return TUNE.stashSlots + (run.bonusStash || 0) + mods(run).stashSlots;
  }

  /* how many cards come off the stock per draw (House Rules and Curios can lower it) */
  function drawCount(run) {
    const m = mods(run);
    return Math.max(1, TUNE.drawCount - (run.drawReduce || 0) - m.drawReduce);
  }

  /* the maximal face-up ordered run sitting at the bottom of a column */
  function runStart(board, col, m) {
    const pile = board.tableau[col];
    let i = pile.length - 1;
    if (i < 0 || !pile[i].faceUp) return -1;
    while (i > 0 && pile[i - 1].faceUp && canStack(pile[i - 1], pile[i], m)) i--;
    return i;
  }
  function runLength(board, col, m) {
    const s = runStart(board, col, m);
    return s < 0 ? 0 : board.tableau[col].length - s;
  }
  function runCards(board, col, m) {
    const s = runStart(board, col, m);
    return s < 0 ? [] : board.tableau[col].slice(s);
  }

  /* ---------------- the deal ---------------- */
  function deal(run) {
    /* whatever is in the Stash is being held back, so it is not dealt */
    const held = new Set((run.stash || []).map(c => c.id));
    const deck = shuffle(run.deck.filter(c => !held.has(c.id)).map(c => Object.assign({}, c, { faceUp: false })));
    const cols = run.columns;
    const tableau = [];
    let i = 0;
    for (let c = 0; c < cols; c++) tableau.push([]);
    for (let c = 0; c < cols; c++) {
      for (let r = c; r < cols; r++) {
        if (i >= deck.length) break;
        tableau[r].push(deck[i++]);
      }
    }
    tableau.forEach(p => { if (p.length) p[p.length - 1].faceUp = true; });
    const stock = deck.slice(i);
    stock.forEach(c => { c.faceUp = false; });

    const m = mods(run);
    return {
      tableau,
      foundations: { S: [], H: [], D: [], C: [] },
      twins: { S: [], H: [], D: [], C: [] },
      stock,
      waste: [],
      passesLeft: TUNE.startingStockPasses + run.bonusPasses + m.stockPasses,
      undos: TUNE.startingUndos + run.bonusUndos + m.undos,
      freeReshuffles: (run.bonusReshuffles || 0) + m.reshuffles,
      paidReshuffles: 0
    };
  }

  function newRound(run) {
    run.mantel.forEach(inst => {
      const def = CURIO_BY_ID[inst.id];
      if (def && def.hooks && def.hooks.roundStart) def.hooks.roundStart(run, inst);
    });
    return {
      board: deal(run),
      round: {
        score: run.headStart,
        moves: 0,
        cascade: 0,
        suitRun: 0,
        lastSuit: null,
        scoredCards: 0,
        scoreEvents: 0,
        illegal: 0,
        money: 0,
        paidClears: [],
        wellMult: 0,
        blessing: 0,
        heat: 0,
        momentum: 0,
        reveals: 0,
        clears: 0,
        bigCashes: 0,
        bestSuitRun: 0,
        stashPlays: 0,
        pot: 0,
        potStreak: 0,
        usedSafeFlip: false,
        cuts: 0,
        cutsHit: 0,
        bounty: null,
        bountiesCollected: 0,
        over: false,
        won: false
      }
    };
  }

  /* ---------------- rules ---------------- */
  const isRed = c => c.enhancement === 'wild' ? true : (SUITS[c.suit].color === 'red');
  const isBlack = c => c.enhancement === 'wild' ? true : (SUITS[c.suit].color === 'black');
  const suitsOf = c => c.enhancement === 'wild' ? SUIT_KEYS.slice() : [c.suit];

  function altColor(under, over) {
    // over goes on top of under -> colours must differ (chameleons satisfy anything)
    if (under.enhancement === 'wild' || over.enhancement === 'wild') return true;
    return SUITS[under.suit].color !== SUITS[over.suit].color;
  }

  function canStack(under, over, m) {
    /* Oddities are not real cards, so the rank ladder does not apply to them */
    if (over.oddity || under.oddity) return true;
    if (over.enhancement === 'phantom') return true;
    if (under.enhancement === 'phantom') return true;
    /* an exact duplicate sits on its twin -- two 2 of Clubs stack */
    if (under.rank === over.rank && under.suit === over.suit) return true;
    if (!altColor(under, over)) return false;
    if (under.rank === over.rank + 1) return true;
    if (m && m.wrapAround && under.rank === 1 && over.rank === 13) return true;
    return false;
  }

  function canPlaceOnFoundation(board, card, suit) {
    const f = board.foundations[suit];
    /* the Joker becomes whatever the pile is waiting for */
    if (card.oddity === 'joker') return f.length < 13;
    if (card.oddity) return false;
    if (!suitsOf(card).includes(suit)) return false;
    const need = f.length + 1;
    return card.rank === need;
  }

  function foundationTargetFor(board, card) {
    for (const s of suitsOf(card)) if (canPlaceOnFoundation(board, card, s)) return s;
    return null;
  }

  /* A duplicate card -- one whose rank the foundation has already passed --
     can be laid on top of its twin. It scores in full but does not advance
     the pile, so extra Aces and copied cards are never dead weight. */
  function canTwin(board, card, suit) {
    const f = board.foundations[suit];
    if (!f.length) return false;
    /* an Oddity can be laid on any started pile to cash its ability */
    if (card.oddity) return card.oddity !== 'joker';
    if (!suitsOf(card).includes(suit)) return false;
    return card.rank <= f.length;
  }
  function twinTargetFor(board, card) {
    for (const s of suitsOf(card)) if (canTwin(board, card, s)) return s;
    return null;
  }
  /* either kind of foundation play */
  function foundationAccepts(board, card, suit) {
    return canPlaceOnFoundation(board, card, suit) || canTwin(board, card, suit);
  }

  function canPlaceOnColumn(board, col, card, m) {
    const pile = board.tableau[col];
    if (!pile.length) return (card.rank === 13 || card.oddity || card.enhancement === 'phantom' || (m && m.anyIntoEmpty));
    const top = pile[pile.length - 1];
    if (!top.faceUp) return false;
    return canStack(top, card, m);
  }

  /* is the run starting at index i in column col a legal moveable sequence? */
  function isRunFrom(board, col, index, m) {
    const pile = board.tableau[col];
    if (index < 0 || index >= pile.length) return false;
    if (!pile[index].faceUp) return false;
    for (let i = index; i < pile.length - 1; i++) {
      if (!canStack(pile[i], pile[i + 1], m)) return false;
    }
    return true;
  }

  /* which waste cards the player may grab */
  function playableWaste(board, m) {
    if (!board.waste.length) return [];
    if (m && m.wasteAll) {
      const n = Math.min(board.waste.length, 3);
      return board.waste.slice(board.waste.length - n).map((c, k) => ({ card: c, index: board.waste.length - n + k }));
    }
    return [{ card: board.waste[board.waste.length - 1], index: board.waste.length - 1 }];
  }

  /* ---------------- move enumeration ---------------- */
  function anyMoveAvailable(state, run) {
    const b = state.board, m = mods(run);
    /* stashing, playing from the stash and reshuffling are all real moves */
    const stashRoom = (run.stash || []).length < stashCapacity(run);
    if (stashRoom && (b.waste.length || b.tableau.some(p => p.length && p[p.length - 1].faceUp))) return true;
    for (const c of (run.stash || [])) {
      if (foundationTargetFor(b, c) || twinTargetFor(b, c)) return true;
      for (let i = 0; i < b.tableau.length; i++) if (canPlaceOnColumn(b, i, c, m)) return true;
    }
    if ((b.stock.length || b.waste.length) && (b.freeReshuffles > 0 || b.passesLeft > 0)) return true;
    if (b.stock.length) return true;
    if (b.waste.length && (b.passesLeft > 0 || m.infinitePasses)) return true;
    for (const w of playableWaste(b, m)) {
      if (foundationTargetFor(b, w.card) || twinTargetFor(b, w.card)) return true;
      for (let c = 0; c < b.tableau.length; c++) if (canPlaceOnColumn(b, c, w.card, m)) return true;
    }
    for (let c = 0; c < b.tableau.length; c++) {
      const pile = b.tableau[c];
      if (!pile.length) continue;
      const top = pile[pile.length - 1];
      if (top.faceUp && (foundationTargetFor(b, top) || twinTargetFor(b, top))) return true;
      for (let i = 0; i < pile.length; i++) {
        if (!pile[i].faceUp) continue;
        if (!isRunFrom(b, c, i, m)) continue;
        const head = pile[i];
        // moving a whole face-up column to another empty column is pointless
        const movingWholePile = (i === 0);
        for (let d = 0; d < b.tableau.length; d++) {
          if (d === c) continue;
          if (!b.tableau[d].length && movingWholePile) continue;
          if (canPlaceOnColumn(b, d, head, m)) return true;
        }
      }
    }
    return false;
  }

  function isWon(state) {
    return SUIT_KEYS.every(s => state.board.foundations[s].length >= 13);
  }

  return {
    newCard, standardDeck, shuffle, newRun, quotaFor, mods, deal, newRound,
    isRed, isBlack, suitsOf, canStack, canPlaceOnFoundation, foundationTargetFor,
    canPlaceOnColumn, isRunFrom, anyMoveAvailable, isWon, nextId,
    drawCount, runStart, runLength, runCards, playableWaste, stashCapacity,
    canTwin, twinTargetFor, foundationAccepts
  };
})();

/* ===== js/score.js ===== */
/* ============================================================
   PILE-DRIVER  ::  score.js
   The Chips x Mult pipeline. Every scoring event walks through
   card -> enhancement -> finish -> seal -> combo -> curios.
   ============================================================ */

const Score = (() => {

  function makeCtx(G, ev) {
    const run = G.run, board = G.board, round = G.round;
    const ctx = {
      event: ev.event,
      card: ev.card || null,
      fromZone: ev.fromZone || null,
      run, board, round,
      chips: 0, mult: 1,
      triggers: [],
      _src: null,

      addChips(n) {
        if (!n) return;
        ctx.chips += n;
        ctx.triggers.push({ kind: 'chips', amount: n, src: ctx._src });
      },
      addMult(n) {
        if (!n) return;
        ctx.mult += n;
        ctx.triggers.push({ kind: 'mult', amount: n, src: ctx._src });
      },
      xMult(n) {
        if (n === 1 || n == null) return;
        ctx.mult *= n;
        ctx.triggers.push({ kind: 'xmult', amount: n, src: ctx._src });
      },
      money(n) {
        if (!n) return;
        run.money += n;
        round.money += n;
        ctx.triggers.push({ kind: 'money', amount: n, src: ctx._src });
      },
      flash() {
        ctx.triggers.push({ kind: 'flash', src: ctx._src });
      },
      chance(n) {
        return Math.random() < (run.luck || 1) / n;
      },
      /* --- board queries used by curios --- */
      isRed: c => c && Engine.isRed(c),
      hasSuit: (c, s) => !!c && Engine.suitsOf(c).includes(s),
      faceDownCount: () => board.tableau.reduce((a, p) => a + p.filter(c => !c.faceUp).length, 0),
      emptyColumns: () => board.tableau.filter(p => !p.length).length,
      wasteCount: () => board.waste.length,
      stockCount: () => board.stock.length,
      foundationCount: s => board.foundations[s].length,
      completedSuits: () => SUIT_KEYS.filter(s => board.foundations[s].length >= 13).length,
      shortestFoundation: () => Math.min.apply(null, SUIT_KEYS.map(s => board.foundations[s].length)),
      tallestColumn: () => board.tableau.reduce((a, p) => Math.max(a, p.length), 0),
      self: null
    };
    return ctx;
  }

  /* run one pass of card-intrinsic effects */
  function cardPass(ctx) {
    const card = ctx.card;
    if (!card) return;
    ctx._src = { type: 'card', id: card.id };

    if (card.oddity) {
      const od = ODDITIES[card.oddity];
      if (od) {
        if (ctx.event !== 'stash') ctx.addChips(od.chips + TUNE.chipsPerDepth * (ctx.depth || 0));
        if (od.score) od.score(ctx);
      }
    } else if (ctx.event !== 'stash') {
      ctx.addChips(rankChips(card.rank) + TUNE.chipsPerDepth * (ctx.depth || 0));
    }

    switch (card.enhancement) {
      case 'gilded':  ctx.addChips(50); break;
      case 'voltaic': ctx.addMult(4); break;
      case 'glass':   ctx.xMult(2); break;
      case 'phantom': ctx.addMult(2); break;
      case 'riffle':  ctx.addMult(2); break;
      case 'bomb':    ctx.addChips(30); break;
      case 'bullion': ctx.money(4); break;
      case 'steel':   if (ctx.fromZone === 'tableau') ctx.xMult(1.5); break;
      case 'lucky':
        if (ctx.chance(4)) { ctx.addMult(20); ctx.flash(); }
        if (ctx.chance(8)) { ctx.money(3); }
        break;
    }
    switch (card.finish) {
      case 'foil': ctx.addChips(60); break;
      case 'holo': ctx.addMult(12); break;
      case 'poly': ctx.xMult(1.5); break;
    }
    switch (card.seal) {
      case 'gold': ctx.money(4); break;
      case 'blue': ctx.addChips(30); break;
    }
    ctx._src = null;
  }

  /* run every curio's score hook, honouring Copycat */
  function curioPass(ctx) {
    const run = ctx.run;
    run.mantel.forEach((inst, idx) => {
      let def = CURIO_BY_ID[inst.id];
      let self = inst;
      if (def && def.mods && def.mods.copyLeft) {
        const left = run.mantel[idx - 1];
        if (!left) return;
        def = CURIO_BY_ID[left.id];
        self = left;
        if (!def) return;
      }
      if (!def) return;
      ctx._src = { type: 'curio', index: idx };
      ctx.self = self;
      if (def.hooks && def.hooks.score) def.hooks.score(ctx);
      // finishes on the curio itself
      if (inst.finish === 'foil') ctx.addChips(60);
      if (inst.finish === 'holo') ctx.addMult(12);
      if (inst.finish === 'poly') ctx.xMult(1.5);
      if (run.curioBonusMult) ctx.addMult(run.curioBonusMult);
      ctx._src = null;
      ctx.self = null;
    });
  }

  /* the round's Whim scores alongside the Curios */
  function whimPass(ctx) {
    const w = ctx.run.whim && WHIM_BY_ID[ctx.run.whim];
    if (!w || !w.hooks || !w.hooks.score) return;
    ctx._src = { type: 'whim' };
    w.hooks.score(ctx);
    ctx._src = null;
  }

  /* permanent Mult bought or won during the run */
  function permaPass(ctx) {
    ctx._src = { type: 'combo' };
    if (ctx.run.permaMult) ctx.addMult(ctx.run.permaMult);
    if (ctx.round.wellMult) ctx.addMult(ctx.round.wellMult);
    if (ctx.round.blessing && ctx.event === 'foundation') ctx.xMult(ctx.round.blessing);
    if (ctx.round.heat) {
      const per = TUNE.heatMultPer + Engine.mods(ctx.run).heatPer;
      ctx.xMult(+(1 + per * ctx.round.heat).toFixed(2));
    }
    /* TEMPO: play quickly and everything is worth more. Never a penalty. */
    if (ctx.round.momentum > 4) {
      ctx.xMult(+(1 + (ctx.round.momentum / 100) * TUNE.momentumMaxMult).toFixed(2));
    }
    ctx._src = null;
  }

  /* combo layer: Cascade + Suit Run + the Column Stack you scored off */
  function comboPass(ctx) {
    const m = Engine.mods(ctx.run);
    ctx._src = { type: 'combo' };
    if (ctx.round.cascade > 1) ctx.addMult(ctx.round.cascade * m.cascadeMult);
    if (ctx.round.suitRun > 1) ctx.addMult(ctx.round.suitRun * 2 * m.suitRunMult);
    /* the longer and richer the face-up run you built, the bigger the cash-in */
    if (ctx.stack && ctx.stack.length > 1) {
      ctx.addChips(Math.round(ctx.stack.value * TUNE.stackChipScale));
      ctx.addMult((ctx.stack.length - 1) * TUNE.stackMultPer * m.stackMult);
    }
    /* the payoff for holding a card back until the moment was right */
    if (ctx.fromStash) {
      ctx.addMult(TUNE.stashPlayMult);
      const spm = Engine.mods(ctx.run).stashPlayMult;
      if (spm) ctx.xMult(spm);
    }
    /* dropping a duplicate onto its twin */
    if (ctx.twin) {
      ctx.addMult(TUNE.twinMultBonus);
      if (m.twinMult !== 1) ctx.xMult(m.twinMult);
    }
    ctx._src = null;
  }

  /*
    Score one event.
    ev = { event:'foundation'|'reveal'|'clear'|'suit', card, fromZone, depth, label }
  */
  function event(G, ev) {
    const ctx = makeCtx(G, ev);
    ctx.depth = ev.depth || 0;
    ctx.stack = ev.stack || null;
    ctx.twin = !!ev.twin;
    ctx.fromStash = !!ev.fromStash;
    const m = Engine.mods(G.run);

    G.round.scoreEvents++;

    let base = { chips: 0, mult: 1 };
    if (ev.event === 'reveal') base = { chips: m.noRevealScore ? 0 : TUNE.revealChips, mult: m.noRevealScore ? 0 : 1 };
    if (ev.event === 'clear')  base = { chips: TUNE.clearChips, mult: TUNE.clearMult };
    if (ev.event === 'suit')   base = { chips: TUNE.suitDoneChips, mult: TUNE.suitDoneMult };
    if (ev.event === 'stash')  base = { chips: ev.baseChips || 0, mult: 1 };
    if (ev.event === 'bounty') base = { chips: ev.baseChips || 0, mult: 1 };
    ctx.chips = base.chips;
    ctx.mult = base.mult;

    let retriggers = 1;
    if (ev.card && ev.card.seal === 'red') retriggers += 1;
    if (ev.event === 'foundation' && G.round.scoredCards === 1 && m.firstRetrigger) retriggers += m.firstRetrigger;

    for (let t = 0; t < retriggers; t++) {
      cardPass(ctx);
      if (ev.event === 'foundation') comboPass(ctx);
      permaPass(ctx);
      whimPass(ctx);
      curioPass(ctx);
      if (t > 0) ctx.triggers.push({ kind: 'retrigger', src: { type: 'card', id: ev.card ? ev.card.id : null } });
    }

    ctx.mult = Math.max(0, ctx.mult);
    const total = Math.round(ctx.chips * ctx.mult);
    G.round.score += total;
    G.run.stats.best = Math.max(G.run.stats.best, total);

    return {
      event: ev.event,
      label: ev.label || labelFor(ev),
      card: ev.card || null,
      chips: Math.round(ctx.chips),
      mult: +ctx.mult.toFixed(2),
      total,
      triggers: ctx.triggers,
      anchor: ev.anchor || null
    };
  }

  function labelFor(ev) {
    if (ev.event === 'reveal') return 'FLIP!';
    if (ev.event === 'clear') return 'COLUMN CLEARED!';
    if (ev.event === 'suit') return SUITS[ev.suit].name.toUpperCase() + ' COMPLETE!';
    return null;
  }

  /* end-of-round payout. Called live during play for the CASH OUT preview too. */
  function payout(G) {
    const run = G.run, b = G.board;
    const m = Engine.mods(run);
    const lines = [];
    let total = 0;

    const base = TUNE.baseMoney + run.bonusMoney;
    lines.push({ label: 'Round played', amount: base }); total += base;

    /* the big one: you get paid for how hard you actually scored, measured
       against this ante's quota so it stays meaningful at every ante */
    const quota = Engine.quotaFor(run);
    const commission = Math.min(TUNE.commissionCap, Math.floor(G.round.score / (quota / TUNE.commissionDivisor)));
    if (commission > 0) {
      lines.push({
        label: 'Scoring commission (' + Math.round(G.round.score / quota * 100) + '% of quota)',
        amount: commission, big: true
      });
      total += commission;
    }

    const empties = b.tableau.filter(p => !p.length).length;
    if (empties) { const a = empties * TUNE.moneyPerEmptyColumn; lines.push({ label: empties + ' empty column' + (empties > 1 ? 's' : ''), amount: a }); total += a; }

    const suits = SUIT_KEYS.filter(s => b.foundations[s].length >= 13).length;
    if (suits) { const a = suits * TUNE.moneyPerSuitDone; lines.push({ label: suits + ' finished suit' + (suits > 1 ? 's' : ''), amount: a }); total += a; }

    if (G.round.won) { lines.push({ label: 'BOARD CLEARED', amount: 8 }); total += 8; }

    run.mantel.forEach((inst, i) => {
      const def = CURIO_BY_ID[inst.id];
      if (def && def.hooks && def.hooks.roundEnd) {
        const a = def.hooks.roundEnd(run, inst) || 0;
        if (a) { lines.push({ label: def.name, amount: a }); total += a; }
      }
    });

    const whim = run.whim && WHIM_BY_ID[run.whim];
    if (whim && whim.hooks && whim.hooks.roundEnd) {
      const a = whim.hooks.roundEnd(run) || 0;
      if (a) { lines.push({ label: whim.name, amount: a }); total += a; }
    }

    if (!m.noInterest) {
      const interest = Math.min(run.interestCap, Math.floor(run.money / TUNE.interestPer));
      if (interest > 0) { lines.push({ label: 'Interest ($1 per $' + TUNE.interestPer + ')', amount: interest }); total += interest; }
    }

    return { lines, total };
  }

  return { event, payout };
})();

/* ===== js/game.js ===== */
/* ============================================================
   PILE-DRIVER  ::  game.js
   Move execution, round lifecycle, the shop, saves.
   Pushes visual events onto G.fx for ui.js to animate.
   ============================================================ */

const Game = (() => {
  const SAVE_KEY = 'piledriver.save.v2';

  const G = {
    run: null, board: null, round: null,
    phase: 'menu',            // menu | play | roundEnd | shop | gameOver | victory
    fx: [],                   // score packets waiting to be animated
    undoStack: [],
    pending: null,            // a tincture waiting for a card choice
    payout: null,
    lastResult: null
  };

  const push = p => { G.fx.push(p); return p; };

  /* ---------------- lifecycle ---------------- */
  function startRun() {
    G.run = Engine.newRun();
    G.undoStack = [];
    startRound();
  }

  function startRound() {
    /* from Ante 2 the table starts having opinions */
    G.run.whim = G.run.ante >= TUNE.whimsFromAnte ? WHIMS[Math.floor(Math.random() * WHIMS.length)].id : null;
    const s = Engine.newRound(G.run);
    G.board = s.board;
    G.round = s.round;
    G.undoStack = [];
    G.phase = 'play';
    G.payout = null;
    postBounty();
    save();
  }

  function quota() { return Engine.quotaFor(G.run); }
  function anteTotal() { return G.run.anteScore + (G.round ? G.round.score : 0); }

  /* ---------------- undo ---------------- */
  function snapshot() {
    G.undoStack.push(JSON.stringify({
      board: G.board,
      round: G.round,
      money: G.run.money,
      counters: G.run.mantel.map(c => c.counter)
    }));
    if (G.undoStack.length > 60) G.undoStack.shift();
  }

  function undo() {
    if (!G.undoStack.length || G.board.undos <= 0) return false;
    const s = JSON.parse(G.undoStack.pop());
    const undos = G.board.undos;
    G.board = s.board;
    G.round = s.round;
    G.board.undos = undos - 1;
    G.run.money = s.money;
    s.counters.forEach((v, i) => { if (G.run.mantel[i]) G.run.mantel[i].counter = v; });
    G.round.over = false;
    save();
    return true;
  }

  /* ---------------- scoring plumbing ---------------- */
  function bumpMomentum(amount) {
    G.round.momentum = Math.min(100, (G.round.momentum || 0) + (amount || TUNE.momentumPerMove));
    G.round.momentumAt = Date.now();
  }

  function decayMomentum() {
    if (G.phase !== 'play' || !G.round) return 0;
    const now = Date.now();
    const last = G.round.momentumAt || now;
    const dt = (now - last) / 1000;
    if (dt > 0) {
      G.round.momentum = Math.max(0, (G.round.momentum || 0) - TUNE.momentumDecay * dt);
      G.round.momentumAt = now;
    }
    return G.round.momentum;
  }

  function scoreEvent(ev) {
    const packet = Score.event(G, ev);
    if (packet.total > 0) addToPot(packet.total);
    push(packet);
    if (ev.card && ev.card.enhancement === 'glass' && Math.random() < (G.run.luck || 1) / 5) {
      shatter(ev.card);
    }
    return packet;
  }

  function shatter(card) {
    const i = G.run.deck.findIndex(c => c.id === card.id);
    if (i >= 0) G.run.deck.splice(i, 1);
    card.shattered = true;
    push({ event: 'shatter', label: 'SHATTERED', card, chips: 0, mult: 0, total: 0, triggers: [] });
  }

  function breakCascade() {
    G.round.cascade = 0;
    G.round.suitRun = 0;
    G.round.lastSuit = null;
  }

  /* flip the newly exposed card of a column, score reveals + clears */
  function settleColumn(col) {
    const pile = G.board.tableau[col];
    if (pile.length) {
      const top = pile[pile.length - 1];
      if (!top.faceUp) {
        top.faceUp = true;
        G.round.reveals++;
        scoreEvent({ event: 'reveal', card: null, anchor: { zone: 'tableau', col } });
      }
    } else if (!G.round.paidClears.includes(col)) {
      G.round.paidClears.push(col);
      G.round.clears++;
      scoreEvent({ event: 'clear', anchor: { zone: 'tableau', col } });
    }
  }

  function checkSuitComplete(suit, anchor) {
    if (G.board.foundations[suit].length === 13) {
      G.run.stats.suitsDone++;
      scoreEvent({ event: 'suit', suit, anchor });
    }
  }

  /* ---------------- moves ---------------- */
  function drawStock() {
    if (G.phase !== 'play') return false;
    const b = G.board;
    const m = Engine.mods(G.run);
    if (!b.stock.length) {
      if (!b.waste.length) return false;
      if (b.passesLeft <= 0 && !m.infinitePasses) return false;
      snapshot();
      if (!m.infinitePasses) b.passesLeft--;
      b.stock = b.waste.reverse();
      b.stock.forEach(c => { c.faceUp = false; });
      b.waste = [];
      breakCascade();
      G.round.moves++;
      push({ event: 'recycle', label: 'RESHUFFLE', chips: 0, mult: 0, total: 0, triggers: [] });
      tickBounty();
      save();
      return true;
    }
    snapshot();
    const n = Math.min(Engine.drawCount(G.run), b.stock.length);
    const turned = [];
    for (let i = 0; i < n; i++) {
      const c = b.stock.pop();
      c.faceUp = true;
      b.waste.push(c);
      turned.push(c);
    }
    breakCascade();
    G.round.moves++;
    push({ event: 'draw', count: n, cards: turned, chips: 0, mult: 0, total: 0, triggers: [] });
    tickBounty();
    save();
    return true;
  }

  /*
    src: {zone:'waste'} | {zone:'tableau', col, index} | {zone:'foundation', suit}
    dst: {zone:'tableau', col} | {zone:'foundation', suit?}
  */
  function tryMove(src, dst) {
    if (G.phase !== 'play') return false;
    const b = G.board, m = Engine.mods(G.run);
    const cards = grab(src, m);
    if (!cards || !cards.length) return illegal();

    if (dst.zone === 'foundation') {
      if (cards.length !== 1) return illegal();
      const card = cards[0];
      let suit = dst.suit && Engine.canPlaceOnFoundation(b, card, dst.suit)
        ? dst.suit : Engine.foundationTargetFor(b, card);
      let twin = false;
      if (!suit) {
        suit = dst.suit && Engine.canTwin(b, card, dst.suit) ? dst.suit : Engine.twinTargetFor(b, card);
        twin = !!suit;
      }
      if (!suit) return illegal();
      snapshot();
      let stack = null;
      if (src.zone === 'tableau') {
        const runCards = Engine.runCards(b, src.col, m);
        stack = { length: runCards.length, value: runCards.reduce((a, c) => a + rankChips(c.rank), 0) };
      }
      removeFrom(src, 1);
      const depth = b.foundations[suit].length;
      if (twin) {
        if (!b.twins) b.twins = { S: [], H: [], D: [], C: [] };
        b.twins[suit].push(card);
      } else {
        b.foundations[suit].push(card);
      }
      G.round.moves++;
      G.round.scoredCards++;
      G.run.stats.cardsScored++;
      bumpMomentum();
      G.round.cascade++;
      if (G.round.cascade > 0 && G.round.cascade % TUNE.cascadeCashEvery === 0) {
        G.run.money += 1;
        G.round.money += 1;
        push({ event: 'cash', label: 'CASCADE X' + G.round.cascade, amount: 1,
               anchor: { zone: 'foundation', suit }, chips: 0, mult: 0, total: 0, triggers: [] });
      }
      if (stack && stack.length >= 4) G.round.bigCashes++;
      if (stack && stack.length >= TUNE.stackCashAt) {
        const amt = stack.length >= TUNE.stackCashBigAt ? 2 : 1;
        G.run.money += amt;
        G.round.money += amt;
        push({ event: 'cash', label: 'RUN OF ' + stack.length, amount: amt,
               anchor: { zone: 'tableau', col: src.col }, chips: 0, mult: 0, total: 0, triggers: [] });
      }
      const cardSuits = Engine.suitsOf(card);
      if (G.round.lastSuit && cardSuits.includes(G.round.lastSuit)) G.round.suitRun++;
      else G.round.suitRun = 1;
      G.round.bestSuitRun = Math.max(G.round.bestSuitRun || 0, G.round.suitRun);
      G.round.lastSuit = suit;

      const anchor = { zone: 'foundation', suit };
      const replay = !!card.scoredRound;
      if (replay) {
        G.round.scoredCards--;
        G.round.cascade--;
        push({ event: 'replay', label: 'ALREADY PAID', card, chips: 0, mult: 0, total: 0, triggers: [], anchor });
      } else {
        card.scoredRound = true;
        scoreEvent({ event: 'foundation', card, fromZone: src.zone, depth: twin ? Math.max(0, depth - 1) : depth,
                     anchor, stack, twin, label: twin ? 'TWIN!' : null });
        G.round.blessing = 0;
      }

      /* Fuse cards detonate the card they were sitting on */
      if (card.enhancement === 'bomb' && src.zone === 'tableau') {
        const pile = b.tableau[src.col];
        const below = pile[pile.length - 1];
        if (below) {
          if (!below.faceUp) below.faceUp = true;
          scoreEvent({ event: 'foundation', card: below, fromZone: 'tableau', depth: 0,
                       label: 'BOOM!', anchor: { zone: 'tableau', col: src.col } });
        }
      }

      if (G.round.flipAllPending) {
        G.round.flipAllPending = false;
        b.tableau.forEach((pile, col) => {
          for (let i = pile.length - 1; i >= 0; i--) {
            if (!pile[i].faceUp) {
              pile[i].faceUp = true;
              G.round.reveals++;
              scoreEvent({ event: 'reveal', card: null, anchor: { zone: 'tableau', col } });
              break;
            }
          }
        });
      }
      if (card.enhancement === 'riffle' && !replay) {
        doReshuffle();
        push({ event: 'cash', label: 'RIFFLE — STOCK RESHUFFLED', amount: 0,
               anchor: { zone: 'stock' }, chips: 0, mult: 0, total: 0, triggers: [] });
      }
      collectBounty(card, anchor);
      if (src.zone === 'tableau') settleColumn(src.col);
      if (!twin) checkSuitComplete(suit, anchor);
      afterMove();
      return true;
    }

    if (dst.zone === 'tableau') {
      const col = dst.col;
      if (src.zone === 'tableau' && src.col === col) return illegal();
      /* shuffling a whole column into another empty column changes nothing and used to
         re-trigger the cleared-column bonus, so it is not a legal move */
      if (src.zone === 'tableau' && src.index === 0 && !b.tableau[col].length) {
        push({ event: 'nudge', label: 'THAT CHANGES NOTHING', chips: 0, mult: 0, total: 0, triggers: [] });
        return false;
      }
      if (!Engine.canPlaceOnColumn(b, col, cards[0], m)) return illegal();
      snapshot();
      removeFrom(src, cards.length);
      cards.forEach(c => { c.faceUp = true; b.tableau[col].push(c); });
      G.round.moves++;
      breakCascade();
      if (src.zone === 'tableau') settleColumn(src.col);
      afterMove();
      return true;
    }
    return illegal();
  }

  function illegal() {
    G.round.illegal++;
    const sunk = G.run.mantel.find(c => c.id === 'sunk_cost');
    if (sunk) { sunk.counter = (sunk.counter || 0) + 2; push({ event: 'curioFlash', curio: 'sunk_cost' }); }
    push({ event: 'illegal', label: 'NOPE', chips: 0, mult: 0, total: 0, triggers: [] });
    return false;
  }

  function grab(src, m) {
    const b = G.board;
    if (src.zone === 'waste') {
      const allowed = Engine.playableWaste(b, m);
      const idx = src.index != null ? src.index : b.waste.length - 1;
      const hit = allowed.find(w => w.index === idx);
      return hit ? [hit.card] : null;
    }
    if (src.zone === 'foundation') {
      const f = b.foundations[src.suit];
      const c = f[f.length - 1];
      return c ? [c] : null;
    }
    if (src.zone === 'tableau') {
      const pile = b.tableau[src.col];
      const idx = src.index != null ? src.index : pile.length - 1;
      if (!Engine.isRunFrom(b, src.col, idx, m)) return null;
      return pile.slice(idx);
    }
    return null;
  }

  function removeFrom(src, n) {
    const b = G.board;
    if (src.zone === 'waste') b.waste.splice(src.index != null ? src.index : b.waste.length - n, n);
    else if (src.zone === 'foundation') b.foundations[src.suit].splice(b.foundations[src.suit].length - n, n);
    else if (src.zone === 'tableau') b.tableau[src.col].splice(b.tableau[src.col].length - n, n);
  }

  function afterMove() {
    tickBounty();
    save();
    if (Engine.isWon(G)) {
      G.round.won = true;
      endRound(true);
      return;
    }
    if (!Engine.anyMoveAvailable(G, G.run)) {
      G.round.stuck = true;
    } else {
      G.round.stuck = false;
    }
  }

  /* Put actual money on the wheel. Cash uses honest casino payouts - red or
     black returns double your stake, the zero returns eighteen times - and
     losing costs you the stake and nothing else.                              */
  function spinRouletteCash(colour, stake) {
    stake = Math.floor(stake || 0);
    if (G.phase !== 'play' && G.phase !== 'shop') return { ok: false, reason: 'Not now.' };
    if (!ROULETTE_ODDS[colour]) return { ok: false, reason: 'Pick a colour.' };
    if (stake <= 0) return { ok: false, reason: 'Pick an amount to stake.' };
    if (stake > G.run.money) return { ok: false, reason: 'You do not have that much.' };
    snapshot();
    const m = Engine.mods(G.run);

    let index = Math.floor(Math.random() * ROULETTE.length);
    let guaranteed = false;
    if (m.firstFlipSafe && !G.round.usedSafeFlip) {
      const winners = ROULETTE.map((p, i) => i).filter(i => ROULETTE[i].c === colour);
      index = winners[Math.floor(Math.random() * winners.length)];
      guaranteed = true;
      G.round.usedSafeFlip = true;
    }
    const pocket = ROULETTE[index];
    const win = pocket.c === colour;
    const pay = colour === 'green' ? TUNE.cashPayGreen : TUNE.cashPayEven;

    G.run.money -= stake;
    let payout = 0;
    if (win) {
      payout = stake * pay;
      G.run.money += payout;
      G.round.money += payout - stake;
      if (m.dareBonus) { G.run.money += 5; G.round.money += 5; }
    }
    save();
    return { ok: true, mode: 'cash', win, guaranteed, pocket, index, colour, pay,
             staked: stake, payout, money: G.run.money };
  }

  /* Take the pot to the wheel. Red or black triples it, the zero pays twenty.
     Lose and the pot is gone AND the same amount comes off your ante total, so
     a bad spin genuinely costs you quota progress.                             */
  function spinRoulette(colour) {
    const pot = Math.round(G.round.pot || 0);
    if (pot < TUNE.potMinFlip) return { ok: false, reason: 'The pot needs at least ' + TUNE.potMinFlip + ' to take to the wheel.' };
    if (!ROULETTE_ODDS[colour]) return { ok: false, reason: 'Pick a colour.' };
    snapshot();
    const m = Engine.mods(G.run);

    let index = Math.floor(Math.random() * ROULETTE.length);
    let guaranteed = false;
    if (m.firstFlipSafe && !G.round.usedSafeFlip) {
      const winners = ROULETTE.map((p, i) => i).filter(i => ROULETTE[i].c === colour);
      index = winners[Math.floor(Math.random() * winners.length)];
      guaranteed = true;
      G.round.usedSafeFlip = true;
    }
    const pocket = ROULETTE[index];
    const win = pocket.c === colour;
    const pay = roulettePay(colour);

    let anteHit = 0;
    if (win) {
      G.round.pot = pot * pay;
      G.round.potStreak = (G.round.potStreak || 0) + 1;
      G.round.heat += (colour === 'green' ? 3 : 1);
      if (m.dareBonus) { G.run.money += 5; G.round.money += 5; }
      bumpMomentum();
    } else {
      G.round.pot = 0;
      G.round.potStreak = 0;
      G.round.heat = 0;
      anteHit = pot;
      spendAnteScore(pot);          /* this round's score first, then banked rounds */
    }
    save();
    return { ok: true, win, guaranteed, pocket, index, colour, pay,
             pot: G.round.pot, staked: pot, anteHit, heat: G.round.heat };
  }

  /* ---------------- THE BOUNTY ----------------
     The table always has one card posted WANTED. Send that exact card home from
     anywhere and it pays out on the spot, then a fresh one goes up. RAISE doubles
     the payout but starts a clock: miss it and the escape costs you ante score.
     ------------------------------------------------------------------------- */
  function bountyPool() {
    const b = G.board, out = [];
    if (!b) return out;
    b.tableau.forEach(pile => pile.forEach(c => out.push(c)));
    b.waste.forEach(c => out.push(c));
    b.stock.forEach(c => out.push(c));
    (G.run.stash || []).forEach(c => out.push(c));
    return out.filter(c => !c.oddity && !c.scoredRound);
  }

  function bountyReward(raises) {
    const m = Engine.mods(G.run);
    const growth = 1 + TUNE.bountyGrowth * (G.round.bountiesCollected || 0);
    const base = quota() / TUNE.bountyDivisor;
    return Math.max(40, Math.round(base * growth * (1 + m.bountyMult) * Math.pow(2, raises || 0)));
  }

  function postBounty() {
    if (!G.round) return;
    const pool = bountyPool();
    if (!pool.length) { G.round.bounty = null; return; }
    const c = pool[Math.floor(Math.random() * pool.length)];
    G.round.bounty = {
      cardId: c.id, rank: c.rank, suit: c.suit,
      raises: 0, deadline: null, staked: 0, reward: 0
    };
    G.round.bounty.reward = bountyReward(0);
  }

  function bountyCard() {
    const bn = G.round && G.round.bounty;
    if (!bn) return null;
    return { id: bn.cardId, rank: bn.rank, suit: bn.suit, faceUp: true };
  }

  /* double the payout and start the clock */
  function raiseBounty() {
    const bn = G.round && G.round.bounty;
    if (G.phase !== 'play' || !bn) return { ok: false, reason: 'Nothing is posted right now.' };
    if (bn.raises >= TUNE.bountyMaxRaises) return { ok: false, reason: 'The table will not go any higher.' };
    snapshot();
    bn.raises++;
    bn.reward = bountyReward(bn.raises);
    bn.deadline = TUNE.bountyDeadline;
    bn.staked = Math.round(bn.reward * TUNE.bountyStake);
    push({ event: 'cash', label: 'BOUNTY RAISED — ' + TUNE.bountyDeadline + ' MOVES', amount: 0,
           anchor: { zone: 'bounty' }, chips: 0, mult: 0, total: 0, triggers: [] });
    save();
    return { ok: true, bounty: bn };
  }

  function tickBounty() {
    const bn = G.round && G.round.bounty;
    if (!bn || bn.deadline == null) return;
    bn.deadline--;
    if (bn.deadline <= 0) bountyEscaped();
  }

  function bountyEscaped() {
    const bn = G.round.bounty;
    const lost = bn.staked || 0;
    if (lost) spendAnteScore(lost);
    breakCascade();
    G.round.bountyEscapes = (G.round.bountyEscapes || 0) + 1;
    push({ event: 'bust', label: 'THE BOUNTY GOT AWAY  −' + lost, chips: 0, mult: 0, total: 0,
           triggers: [], anchor: { zone: 'bounty' } });
    push({ event: 'nudge', label: quip('bountyMiss'), chips: 0, mult: 0, total: 0, triggers: [] });
    postBounty();
  }

  function collectBounty(card, anchor) {
    const bn = G.round && G.round.bounty;
    if (!bn || !card || card.id !== bn.cardId) return;
