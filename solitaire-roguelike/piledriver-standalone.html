    if (!G.pending) return false;
    const { shelf, index, def } = G.pending;
    const item = G.run.shop[SHELVES[shelf]][index];
    if (!item || item.bought) { G.pending = null; return false; }
    const price = priceOf(item);
    if (G.run.money < price) { G.pending = null; return false; }
    const idx = G.run.deck.findIndex(c => c.id === cardId);
    if (idx < 0) return false;
    const card = G.run.deck[idx];

    if (def.kind === 'enhance') card.enhancement = def.value;
    else if (def.kind === 'finish') card.finish = def.value;
    else if (def.kind === 'seal') card.seal = def.value;
    else if (def.kind === 'remove') G.run.deck.splice(idx, 1);
    else if (def.kind === 'duplicate') {
      G.run.deck.push(Engine.newCard(card.rank, card.suit, {
        enhancement: card.enhancement, finish: card.finish, seal: card.seal
      }));
    }
    G.run.money -= price;
    item.bought = true;
    G.pending = null;
    save();
    return true;
  }

  function cancelPending() { G.pending = null; }

  function sellCurio(index) {
    const inst = G.run.mantel[index];
    if (!inst) return false;
    const def = CURIO_BY_ID[inst.id];
    const value = def.sellsFull ? (inst.paid || def.cost) : Math.max(1, Math.floor((inst.paid || def.cost) / 2));
    G.run.money += value;
    G.run.mantel.splice(index, 1);
    save();
    return value;
  }

  function reorderCurio(from, to) {
    if (from === to || from < 0 || to < 0) return;
    const arr = G.run.mantel;
    if (from >= arr.length || to >= arr.length) return;
    const [x] = arr.splice(from, 1);
    arr.splice(to, 0, x);
    save();
  }

  function leaveShop() {
    G.run.shop = null;
    startRound();
  }

  /* what CASH OUT would pay right now -- drives the live button label */
  function payoutPreview() {
    if (!G.board || !G.round) return { lines: [], total: 0 };
    return Score.payout(G);
  }

  /* ---------------- persistence ---------------- */
  function save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        run: G.run, board: G.board, round: G.round, phase: G.phase, payout: G.payout
      }));
    } catch (e) { /* private mode, whatever */ }
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const s = JSON.parse(raw);
      if (!s || !s.run) return false;
      G.run = s.run; G.board = s.board; G.round = s.round;
      G.phase = s.phase === 'menu' ? 'play' : s.phase;
      G.payout = s.payout || null;
      // keep new fields alive across versions
      const fresh = Engine.newRun();
      for (const k in fresh) if (G.run[k] === undefined) G.run[k] = fresh[k];
      return true;
    } catch (e) { return false; }
  }

  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  return {
    G, startRun, startRound, quota, anteTotal, drawStock, tryMove, autoCollect, hint,
    undo, endRound, advance, openShop, reroll, rerollCost, buy, applyPending, cancelPending,
    sellCurio, reorderCurio, leaveShop, priceOf, effectiveSlots, save, load, clearSave, snapshot,
    bankAnte, clearAnte, payoutPreview, SHELVES
  };
})();

/* ===== js/audio.js ===== */
/* ============================================================
   PILE-DRIVER  ::  audio.js   tiny web-audio noise box
   ============================================================ */
const Sfx = (() => {
  let ctx = null, on = true, master = null;

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.22;
    master.connect(ctx.destination);
  }

  function beep(freq, dur, type, vol, slide) {
    if (!on) return;
    init();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), ctx.currentTime + dur);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, ctx.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ctx.currentTime + dur + 0.02);
  }

  function noise(dur, vol) {
    if (!on) return;
    init();
    if (!ctx) return;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ctx.createBufferSource();
    s.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = vol || 0.2;
    const f = ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 1200;
    s.connect(f); f.connect(g); g.connect(master);
    s.start();
  }

  const api = {
    toggle(v) { on = v == null ? !on : v; return on; },
    isOn: () => on,
    click: () => beep(420, 0.05, 'square', 0.15),
    flip:  () => { noise(0.06, 0.12); beep(700, 0.05, 'triangle', 0.12); },
    place: () => beep(520, 0.07, 'triangle', 0.2, 780),
    deal:  () => noise(0.05, 0.08),
    error: () => beep(150, 0.14, 'sawtooth', 0.18, 90),
    money: () => { beep(880, 0.06, 'square', 0.16); setTimeout(() => beep(1320, 0.09, 'square', 0.14), 60); },
    chip: (i) => beep(340 + Math.min(24, i) * 42, 0.05, 'square', 0.13),
    mult: (i) => beep(520 + Math.min(24, i) * 55, 0.06, 'sawtooth', 0.11),
    score: (mag) => {
      const base = 300 + Math.min(900, mag * 6);
      beep(base, 0.12, 'square', 0.22, base * 2);
      setTimeout(() => beep(base * 1.5, 0.16, 'triangle', 0.18, base * 3), 90);
    },
    big: () => {
      [0, 90, 180, 300].forEach((t, i) => setTimeout(() => beep(440 * Math.pow(1.26, i), 0.2, 'square', 0.2), t));
    },
    shatter: () => { noise(0.3, 0.3); beep(1800, 0.2, 'sawtooth', 0.12, 200); },
    win: () => [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'triangle', 0.22), i * 110)),
    lose: () => [400, 330, 260, 180].forEach((f, i) => setTimeout(() => beep(f, 0.35, 'sawtooth', 0.2), i * 150))
  };
  return api;
})();

/* ===== js/ui.js ===== */
/* ============================================================
   PILE-DRIVER  ::  ui.js
   Board rendering, pointer drag & drop, and the score fireworks.
   ============================================================ */

const UI = (() => {
  const G = Game.G;
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  let displayScore = 0;
  let fxBusy = false;
  let rush = false;          // player acted mid-animation: burn through what's left
  let selection = null;      // {zone, col, index, suit}
  let hintCells = [];

  /* ============ CARD ELEMENT ============ */
  function cardEl(card, opts) {
    opts = opts || {};
    const suit = SUITS[card.suit];
    const xray = Engine.mods(G.run).xray;
    const marked = G.run.markedDeck;
    const n = el('div', 'card');
    n.dataset.id = card.id;
    if (!card.faceUp) {
      n.classList.add('down');
      if (xray || opts.marked || (marked && opts.topDown)) n.classList.add('peek');
      if (!(xray || opts.marked || (marked && opts.topDown))) {
        n.innerHTML = '<div class="back"><span>✦</span></div>';
        return n;
      }
    }
    n.classList.add(Engine.isRed(card) && !Engine.isBlack(card) ? 'red' : (suit.color === 'red' ? 'red' : 'black'));
    if (card.enhancement && card.enhancement !== 'none') n.classList.add(ENHANCEMENTS[card.enhancement].cls);
    if (card.finish && card.finish !== 'none') n.classList.add(FINISHES[card.finish].cls);
    if (card.seal && card.seal !== 'none') n.classList.add(SEALS[card.seal].cls);

    const r = RANK_NAMES[card.rank];
    const s = card.enhancement === 'wild' ? '✿' : suit.sym;
    n.innerHTML =
      '<div class="face">' +
        '<div class="corner tl"><span class="rk">' + r + '</span><span class="st">' + s + '</span></div>' +
        '<div class="mid">' + s + '</div>' +
        '<div class="corner br"><span class="rk">' + r + '</span><span class="st">' + s + '</span></div>' +
        (card.enhancement && card.enhancement !== 'none' && ENHANCEMENTS[card.enhancement].glyph
          ? '<div class="enh-badge">' + ENHANCEMENTS[card.enhancement].glyph + '</div>' : '') +
        (card.seal && card.seal !== 'none' ? '<div class="seal-dot"></div>' : '') +
        '<div class="shine"></div>' +
      '</div>';
    return n;
  }

  /* ============ FULL RENDER ============ */
  function render() {
    if (!G.run) return;
    renderHud();
    renderMantel();
    renderBoard();
    renderControls();
  }

  function renderHud() {
    const run = G.run;
    if (!fxBusy && G.round && Math.round(displayScore) !== G.round.score) displayScore = G.round.score;
    const q = Engine.quotaFor(run);
    const total = Game.anteTotal();
    const pct = Math.max(0, Math.min(100, total / q * 100));
    $('#ante-num').textContent = run.ante;
    $('#round-num').textContent = run.round + '/' + TUNE.roundsPerAnte;
    $('#quota-fill').style.width = pct + '%';
    $('#quota-text').textContent = fmt(total) + ' / ' + fmt(q);
    $('#quota-bar').classList.toggle('met', total >= q);
    $('#money').textContent = '$' + run.money;
    $('#round-score').textContent = fmt(Math.round(displayScore));
  }

  function renderMantel(target) {
    const m = target || $('#mantel');
    if (!m) return;
    m.innerHTML = '';
    const slots = Game.effectiveSlots();
    const shown = Math.max(slots, G.run.mantel.length);
    for (let i = 0; i < shown; i++) {
      const inst = G.run.mantel[i];
      if (!inst) {
        const empty = el('div', 'mslot curio empty', '<span class="slot-mark">◇</span>');
        empty.dataset.idx = i;
        m.appendChild(empty);
        continue;
      }
      const def = CURIO_BY_ID[inst.id];
      const c = el('div', 'mslot curio r-' + def.rarity + (inst.finish && inst.finish !== 'none' ? ' ' + FINISHES[inst.finish].cls : ''));
      c.dataset.idx = i;
      c.draggable = false;
      c.innerHTML =
        '<div class="c-art">' + icon(def.icon) + '</div>' +
        '<div class="c-name">' + def.name + '</div>' +
        (inst.counter != null && def.counterLabel
          ? '<div class="c-counter">' + (def.counterLabel === 'X' ? 'X' + inst.counter : '+' + inst.counter) + '</div>' : '');
      c.addEventListener('pointerenter', e => showTip(e.currentTarget, curioTip(inst, def, i)));
      c.addEventListener('pointerleave', hideTip);
      c.addEventListener('click', () => {
        if (G.phase === 'shop') {
          const v = Game.sellCurio(i);
          if (v) { Sfx.money(); toast('Sold for $' + v); Overlays.refreshShop(); }
        }
      });
      makeCurioDraggable(c, i);
      m.appendChild(c);
    }
    const label = el('div', 'mantel-label', 'THE MANTEL <b>' + G.run.mantel.length + '/' + slots + '</b>');
    m.appendChild(label);
  }

  function curioTip(inst, def, i) {
    let s = '<div class="tip-title r-' + def.rarity + '">' + icon(def.icon, 'tip-ico') + ' ' + def.name + '</div>';
    s += '<div class="tip-kind curio-kind">CURIO — takes a mantel seat</div>';
    if (inst.finish && inst.finish !== 'none') s += '<div class="tip-fin">' + FINISHES[inst.finish].name + ' — ' + FINISHES[inst.finish].text + '</div>';
    s += '<div class="tip-text">' + def.text + '</div>';
    s += '<div class="tip-foot">' + def.rarity.toUpperCase() +
         (G.phase === 'shop' ? ' • click to sell for $' + (def.sellsFull ? (inst.paid || def.cost) : Math.max(1, Math.floor((inst.paid || def.cost) / 2))) : '') +
         '</div>';
    return s;
  }

  function renderControls() {
    $('#btn-undo').innerHTML = 'UNDO <b>' + (G.board ? G.board.undos : 0) + '</b>';
    $('#btn-undo').disabled = !G.board || G.board.undos <= 0 || !Game.G.undoStack.length;
    const passes = Engine.mods(G.run).infinitePasses ? '∞' : (G.board ? G.board.passesLeft : 0);
    $('#passes').innerHTML = 'PASSES <b>' + passes + '</b>';
    $('#deck-count').textContent = G.run.deck.length;
    $('#btn-cash').classList.toggle('urgent', !!(G.round && G.round.stuck));
    const pv = $('#cash-preview');
    if (pv && G.phase === 'play') {
      const p = Game.payoutPreview();
      pv.textContent = '$' + p.total;
      $('#btn-cash').dataset.breakdown = p.lines.map(l => l.label + '  +$' + l.amount).join('\n');
    }
  }

  function renderBoard() {
    const b = G.board;
    if (!b) return;

    /* stock */
    const stock = $('#stock');
    stock.innerHTML = '';
    if (b.stock.length) {
      const top = el('div', 'card down');
      top.innerHTML = '<div class="back"><span>✦</span></div>';
      stock.appendChild(top);
      stock.appendChild(el('div', 'pile-count', String(b.stock.length)));
    } else {
      stock.appendChild(el('div', 'pile-ghost', (b.passesLeft > 0 || Engine.mods(G.run).infinitePasses) ? '↻' : '∅'));
    }

    /* waste */
    const waste = $('#waste');
    waste.innerHTML = '';
    const mm = Engine.mods(G.run);
    const show = Math.min(b.waste.length, 3);
    const from = b.waste.length - show;
    const playable = Engine.playableWaste(b, mm).map(w => w.index);
    for (let k = 0; k < show; k++) {
      const absIdx = from + k;
      const c = b.waste[absIdx];
      const n = cardEl(c);
      n.style.left = Math.round(k * (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw')) * 0.42)) + 'px';
      n.style.zIndex = k;
      if (playable.includes(absIdx)) {
        n.dataset.zone = 'waste';
        n.classList.add('playable');
        attachDrag(n, { zone: 'waste', index: absIdx });
      } else n.classList.add('under');
      waste.appendChild(n);
    }
    if (b.waste.length > 3) waste.appendChild(el('div', 'pile-count', String(b.waste.length)));

    /* foundations */
    SUIT_KEYS.forEach(s => {
      const f = $('#f-' + s);
      f.innerHTML = '';
      const pile = b.foundations[s];
      if (!pile.length) {
        f.appendChild(el('div', 'pile-ghost suit-' + SUITS[s].color, SUITS[s].sym));
      } else {
        const showFrom = Math.max(0, pile.length - 2);
        pile.slice(showFrom).forEach((c, i) => {
          const n = cardEl(c);
          n.style.zIndex = i;
          if (i === pile.length - showFrom - 1) attachDrag(n, { zone: 'foundation', suit: s });
          f.appendChild(n);
        });
        f.appendChild(el('div', 'pile-count', String(pile.length)));
      }
    });

    /* tableau */
    const t = $('#tableau');
    t.innerHTML = '';
    t.style.setProperty('--cols', b.tableau.length);
    b.tableau.forEach((pile, col) => {
      const p = el('div', 'pile tab-pile');
      p.dataset.zone = 'tableau';
      p.dataset.col = col;
      if (!pile.length) p.appendChild(el('div', 'pile-ghost', 'K'));
      const avail = Math.max(260, t.clientHeight || 420) - 20;
      const need = pile.reduce((a, c) => a + (c.faceUp ? 30 : 15), 0);
      const squeeze = need > avail ? avail / need : 1;
      let y = 0, lastTop = 0;
      let lastDownIdx = -1;
      pile.forEach((c, i) => { if (!c.faceUp) lastDownIdx = i; });
      pile.forEach((c, i) => {
        const n = cardEl(c, { topDown: i === lastDownIdx });
        lastTop = y;
        n.style.top = Math.round(y) + 'px';
        n.style.zIndex = i;
        n.dataset.col = col;
        n.dataset.index = i;
        y += (c.faceUp ? 30 : 15) * squeeze;
        if (c.faceUp) attachDrag(n, { zone: 'tableau', col, index: i });
        p.appendChild(n);
      });
      const runLen = Engine.runLength(b, col, Engine.mods(G.run));
      if (runLen > 1) {
        const runCards = Engine.runCards(b, col, Engine.mods(G.run));
        const val = runCards.reduce((a, c) => a + rankChips(c.rank), 0);
        const badge = el('div', 'run-badge lvl' + Math.min(6, runLen),
          '<span class="rb-n">RUN ' + runLen + '</span><span class="rb-v">+' + val + ' <i>chips</i> · +' +
          ((runLen - 1) * TUNE.stackMultPer * Engine.mods(G.run).stackMult) + ' <i>mult</i></span>');
        /* sit the badge clear of the last card, never on top of it */
        const ch = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ch')) || 106;
        badge.style.top = Math.round(lastTop + ch + 6) + 'px';
        p.appendChild(badge);
      }
      t.appendChild(p);
    });

    applySelectionClasses();
    renderCombo();
  }

  function fmt(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    return Math.round(n).toLocaleString('en-US');
  }

  /* ============ SELECTION + INPUT ============ */
  function sameSrc(a, b) {
    if (!a || !b) return false;
    return a.zone === b.zone && a.col === b.col && a.index === b.index && a.suit === b.suit;
  }

  function applySelectionClasses() {
    $$('.card.sel').forEach(n => n.classList.remove('sel'));
    if (!selection) return;
    const b = G.board;
    if (selection.zone === 'tableau') {
      const pile = $$('#tableau .tab-pile')[selection.col];
      if (!pile) return;
      Array.from(pile.children).forEach(n => {
        if (n.dataset.index != null && +n.dataset.index >= selection.index) n.classList.add('sel');
      });
    } else if (selection.zone === 'waste') {
      const n = $('#waste .card:last-of-type');
      if (n) n.classList.add('sel');
    } else if (selection.zone === 'foundation') {
      const n = document.querySelector('#f-' + selection.suit + ' .card:last-of-type');
      if (n) n.classList.add('sel');
    }
  }

  function clearSelection() { selection = null; applySelectionClasses(); }

  function doMove(src, dst) {
    const ok = Game.tryMove(src, dst);
    if (ok) {
      Sfx.place();
      clearSelection();
      render();
      drainFx();
      checkStuck();
    } else {
      Sfx.error();
      shake($('#table'));
      render();
      G.fx.length = 0;
    }
    return ok;
  }

  function autoTarget(src) {
    const cards = src.zone === 'tableau'
      ? G.board.tableau[src.col].slice(src.index)
      : (src.zone === 'waste' ? G.board.waste.slice(-1) : G.board.foundations[src.suit].slice(-1));
    if (!cards.length) return null;
    if (cards.length === 1 && Engine.foundationTargetFor(G.board, cards[0])) return { zone: 'foundation' };
    const m = Engine.mods(G.run);
    for (let d = 0; d < G.board.tableau.length; d++) {
      if (src.zone === 'tableau' && d === src.col) continue;
      if (!G.board.tableau[d].length && src.zone === 'tableau' && src.index === 0) continue;
      if (Engine.canPlaceOnColumn(G.board, d, cards[0], m)) return { zone: 'tableau', col: d };
    }
    return null;
  }

  /* --- pointer drag --- */
  let drag = null;
  function attachDrag(node, src) {
    node.classList.add('grabbable');
    node.addEventListener('pointerdown', e => {
      if (G.phase !== 'play') return;
      rushFx();
      if (e.button != null && e.button !== 0) return;
      const cards = src.zone === 'tableau'
        ? (Engine.isRunFrom(G.board, src.col, src.index, Engine.mods(G.run)) ? G.board.tableau[src.col].slice(src.index) : null)
        : (src.zone === 'waste' ? G.board.waste.slice(-1) : G.board.foundations[src.suit].slice(-1));
      if (!cards || !cards.length) { Sfx.error(); shake(node); return; }
      drag = { src, cards, x0: e.clientX, y0: e.clientY, moved: false, node, ghost: null, t: Date.now() };
      node.setPointerCapture && node.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    node.addEventListener('pointermove', e => {
      if (!drag || drag.node !== node) return;
      const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
      if (!drag.moved && Math.hypot(dx, dy) > 6) {
        drag.moved = true;
        buildGhost(e);
        document.body.classList.add('dragging-now');
      }
      if (drag.moved && drag.ghost) {
        drag.ghost.style.transform = 'translate(' + (e.clientX - drag.ox) + 'px,' + (e.clientY - drag.oy) + 'px) rotate(' + Math.max(-8, Math.min(8, dx * 0.05)) + 'deg)';
        highlightDrop(e.clientX, e.clientY);
      }
    });
    const finish = e => {
      if (!drag || drag.node !== node) return;
      const d = drag; drag = null;
      document.body.classList.remove('dragging-now');
      clearDropHighlights();
      if (d.ghost) d.ghost.remove();
      $$('.card.lifted').forEach(n => n.classList.remove('lifted'));
      if (d.moved) {
        const dst = dropTargetAt(e.clientX, e.clientY);
        if (dst) doMove(d.src, dst);
        else { render(); }
      } else {
        onTap(d.src, e);
      }
    };
    node.addEventListener('pointerup', finish);
    node.addEventListener('pointercancel', () => { if (drag) { document.body.classList.remove('dragging-now'); if (drag.ghost) drag.ghost.remove(); clearDropHighlights(); drag = null; render(); } });
    node.addEventListener('dblclick', e => {
      if (G.phase !== 'play') return;
      e.preventDefault();
      const t = autoTarget(src);
      if (t) doMove(src, t); else { Sfx.error(); shake(node); }
    });
  }

  function buildGhost(e) {
    const layer = $('#draglayer');
    const rect = drag.node.getBoundingClientRect();
    drag.ox = e.clientX - rect.left;
    drag.oy = e.clientY - rect.top;
    const g = el('div', 'ghost-stack');
    drag.cards.forEach((c, i) => {
      const n = cardEl(c);
      n.style.top = (i * 30) + 'px';
      g.appendChild(n);
    });
    g.style.transform = 'translate(' + rect.left + 'px,' + rect.top + 'px)';
    layer.appendChild(g);
    drag.ghost = g;
    /* fade the originals */
    if (drag.src.zone === 'tableau') {
      const pile = $$('#tableau .tab-pile')[drag.src.col];
      Array.from(pile.children).forEach(n => { if (n.dataset.index != null && +n.dataset.index >= drag.src.index) n.classList.add('lifted'); });
    } else drag.node.classList.add('lifted');
  }

  function dropTargetAt(x, y) {
    const stack = document.elementsFromPoint(x, y);
    for (const n of stack) {
      const pile = n.closest && n.closest('[data-zone]');
      if (!pile) continue;
      const z = pile.dataset.zone;
      if (z === 'tableau') return { zone: 'tableau', col: +pile.dataset.col };
      if (z === 'foundation') return { zone: 'foundation', suit: pile.dataset.suit };
    }
    return null;
  }

  function highlightDrop(x, y) {
    clearDropHighlights();
    const t = dropTargetAt(x, y);
    if (!t || !drag) return;
    const m = Engine.mods(G.run);
    let ok = false, node = null;
    if (t.zone === 'tableau') {
      node = $$('#tableau .tab-pile')[t.col];
      ok = !(drag.src.zone === 'tableau' && drag.src.col === t.col) && Engine.canPlaceOnColumn(G.board, t.col, drag.cards[0], m);
    } else {
      node = $('#f-' + t.suit);
      ok = drag.cards.length === 1 && Engine.canPlaceOnFoundation(G.board, drag.cards[0], t.suit);
    }
    if (node) node.classList.add(ok ? 'drop-ok' : 'drop-no');
  }

  function clearDropHighlights() {
    $$('.drop-ok,.drop-no').forEach(n => n.classList.remove('drop-ok', 'drop-no'));
  }

  function onTap(src, e) {
    if (selection && sameSrc(selection, src)) { clearSelection(); Sfx.click(); return; }
    if (selection) {
      const dst = src.zone === 'foundation' ? { zone: 'foundation', suit: src.suit } : { zone: 'tableau', col: src.col };
      if (src.zone === 'waste') { selection = src; applySelectionClasses(); Sfx.click(); return; }
      const held = selection;
      clearSelection();
      if (!doMove(held, dst)) { selection = src; applySelectionClasses(); }
      return;
    }
    selection = src;
    applySelectionClasses();
    Sfx.click();
  }

  function bindPileTargets() {
    document.addEventListener('click', e => {
      if (G.phase !== 'play') return;
      const pile = e.target.closest && e.target.closest('[data-zone]');
      if (!pile || !selection) return;
      if (e.target.classList && e.target.classList.contains('card')) return;
      const z = pile.dataset.zone;
      if (z === 'tableau') { const held = selection; clearSelection(); doMove(held, { zone: 'tableau', col: +pile.dataset.col }); }
      else if (z === 'foundation') { const held = selection; clearSelection(); doMove(held, { zone: 'foundation', suit: pile.dataset.suit }); }
    });
  }

  /* ============ SCORE FX ============ */
  function drainFx() {
    if (fxBusy) return;
    const q = G.fx.splice(0, G.fx.length);
    if (!q.length) { syncScore(); return; }
    fxBusy = true;
    runPackets(q, 0);
  }

  function runPackets(q, i) {
    if (i >= q.length) {
      fxBusy = false;
      syncScore();
      if (G.fx.length) { drainFx(); }
      else { rush = false; afterFx(); }
      return;
    }
    const base = q.length > 4 ? 0.35 : 1;
    const speed = () => base * (rush ? 0.08 : 1);
    animatePacket(q[i], speed, () => runPackets(q, i + 1));
  }

  /* the player did something while the fireworks were still going -- don't
     swallow their input, just finish the show immediately */
  function rushFx() { if (fxBusy) rush = true; }

  function animatePacket(p, spd, done) {
    if (p.event === 'illegal') { done(); return; }
    if (p.event === 'nudge') { floatText($('#table'), p.label, 'fx-flash'); done(); return; }
    if (p.event === 'cash') {
      const a = anchorEl(p.anchor);
      floatText(a, '+$' + p.amount, 'fx-money big');
      floatText(a, p.label, 'fx-cashlabel');
      Sfx.money();
      burst(a, 8, '#ffd166');
      renderHud();
      renderControls();
      setTimeout(done, 220 * spd());
      return;
    }
    if (p.event === 'recycle') { Sfx.deal(); flashScreen(0.10, '#4cc9f0'); done(); return; }
    if (p.event === 'draw') {
      Sfx.deal();
      const w = $('#waste');
      if (w) { w.classList.remove('dealt'); void w.offsetWidth; w.classList.add('dealt'); }
      done();
      return;
    }
    if (p.event === 'curioFlash') { flashCurioById(p.curio); done(); return; }
    if (p.event === 'replay') {
      floatText(anchorEl(p.anchor), 'ALREADY PAID', 'fx-flash');
      setTimeout(done, 160 * spd());
      return;
    }
    if (p.event === 'shatter') {
      Sfx.shatter();
      const n = document.querySelector('[data-id="' + p.card.id + '"]');
      if (n) { n.classList.add('shattering'); burst(n, 14, '#9fe8ff'); }
      floatText(n || $('#scorebox'), 'SHATTERED', 'fx-shatter');
      setTimeout(done, 350 * spd());
      return;
    }

    const box = $('#scorebox');
    box.classList.add('live');
    let chips = 0, mult = 1;
    setScoreBox(0, 1);
    if (p.label) bannerText(p.label);

    const trigs = p.triggers.filter(t => t.kind !== 'flash' || true);
    let ti = 0;
    const step = () => {
      if (ti >= trigs.length) {
        setScoreBox(p.chips, p.mult);
        setTimeout(() => {
          slam(p);
          setTimeout(() => { box.classList.remove('live'); done(); }, 380 * spd());
        }, 90 * spd());
        return;
      }
      const t = trigs[ti++];
      const src = resolveSrc(t.src, p);
      if (t.kind === 'chips') { chips += t.amount; setScoreBox(chips, mult); floatText(src, '+' + t.amount, 'fx-chips'); Sfx.chip(ti); }
      else if (t.kind === 'mult') { mult += t.amount; setScoreBox(chips, mult); floatText(src, '+' + t.amount + ' Mult', 'fx-mult'); Sfx.mult(ti); }
      else if (t.kind === 'xmult') { mult *= t.amount; setScoreBox(chips, mult); floatText(src, 'X' + t.amount, 'fx-xmult'); Sfx.mult(ti + 6); }
      else if (t.kind === 'money') { floatText(src, '+$' + t.amount, 'fx-money'); Sfx.money(); renderHud(); }
      else if (t.kind === 'flash') { floatText(src, '!', 'fx-flash'); }
      else if (t.kind === 'retrigger') { floatText(src, 'AGAIN!', 'fx-again'); }
      if (src) {
        src.classList.add('trigger');
        setTimeout(() => src.classList.remove('trigger'), 260);
        if (t.kind === 'xmult' || t.kind === 'retrigger') spark(src);
      }
      setTimeout(step, (t.kind === 'flash' ? 60 : 105) * spd());
    };
    step();
  }

  function resolveSrc(src, p) {
    if (!src) return $('#scorebox');
    if (src.type === 'card') {
      const n = src.id ? document.querySelector('[data-id="' + src.id + '"]') : null;
      if (n) return n;
      return anchorEl(p.anchor);
    }
    if (src.type === 'curio') return document.querySelector('.mslot[data-idx="' + src.index + '"]');
    return $('#scorebox');
  }

  function anchorEl(a) {
    if (!a) return $('#scorebox');
    if (a.zone === 'foundation') return $('#f-' + a.suit);
    if (a.zone === 'tableau') return $$('#tableau .tab-pile')[a.col] || $('#scorebox');
    return $('#scorebox');
  }

  function setScoreBox(chips, mult) {
    const total = Math.round(chips * mult);
    $('#sb-chips').textContent = fmt(Math.round(chips));
    $('#sb-mult').textContent = (Math.round(mult * 100) / 100);
    $('#sb-total').textContent = fmt(total);
    const heat = Math.min(1, total / 6000);
    const box = $('#scorebox');
    box.style.setProperty('--heat', heat.toFixed(2));
    box.style.setProperty('--swell', (1 + Math.min(0.22, total / 60000)).toFixed(3));
    const t = tierFor(total);
    box.className = 'live' + (t ? ' ' + t.cls : '');
    bumpEl($('#sb-total'));
  }

  function bumpEl(n) {
    if (!n) return;
    n.classList.remove('bump');
    void n.offsetWidth;
    n.classList.add('bump');
  }

  /* the persistent combo readout inside the score box */
  function renderCombo() {
    const m = $('#combo-meter');
    if (!m || !G.round) return;
    const bits = [];
    if (G.round.cascade > 1) bits.push('<span class="cm cascade">CASCADE <b>X' + G.round.cascade + '</b></span>');
    if (G.round.suitRun > 1) bits.push('<span class="cm suitrun">' + SUITS[G.round.lastSuit].sym + ' RUN <b>X' + G.round.suitRun + '</b></span>');
    m.innerHTML = bits.join('');
    m.classList.toggle('active', bits.length > 0);
    if (bits.length) { m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop'); }
  }

  function slam(p) {
    const box = $('#scorebox');
    const mag = p.total;
    const tier = tierFor(mag);
    box.classList.add('slam');
    setTimeout(() => box.classList.remove('slam'), 450);

    Sfx.score(Math.log10(Math.max(10, mag)) * 20);

    const big = el('div', 'fx-total ' + (tier ? tier.cls : ''), '+' + fmt(mag));
    positionAt(big, box, 0, -46);
    $('#fxlayer').appendChild(big);
    setTimeout(() => big.remove(), 1100);

    shockwave(box, tier);
    bumpEl($('#round-score'));

    if (tier) {
      tierBanner(tier);
      screenShake(tier.shake);
      confetti(box, tier.parts, tier.cls);
      flashScreen(0.34 - SCORE_TIERS.indexOf(tier) * 0.05, tierColor(tier));
      if (mag >= 8000) Sfx.big();
      document.body.classList.add('hot');
      clearTimeout(hotTimer);
      hotTimer = setTimeout(() => document.body.classList.remove('hot'), 900);
    } else {
      burst(box, 8, '#7ee787');
    }
    animateScoreTo(G.round.score);
  }

  let hotTimer = null;
  function tierColor(t) {
    return { t1: '#7ee787', t2: '#ffd166', t3: '#ff8f3f', t4: '#ff4d6d', t5: '#b07cff' }[t.cls] || '#ffd166';
  }

  function tierBanner(tier) {
    const n = el('div', 'fx-tier ' + tier.cls, tier.name + (tier.cls === 't5' ? '!!!!' : tier.cls === 't4' ? '!!!' : tier.cls === 't3' ? '!!' : '!'));
    $('#fxlayer').appendChild(n);
    setTimeout(() => n.remove(), 1000);
  }

  function shockwave(ref, tier) {
    const r = ref.getBoundingClientRect();
    const w = el('div', 'shockwave' + (tier ? ' ' + tier.cls : ''));
    w.style.left = (r.left + r.width / 2) + 'px';
    w.style.top = (r.top + r.height / 2) + 'px';
    $('#fxlayer').appendChild(w);
    setTimeout(() => w.remove(), 700);
  }

  function flashScreen(alpha, color) {
    const f = $('#flash');
    if (!f) return;
    f.style.background = color || '#fff';
    f.style.opacity = Math.min(0.45, alpha);
    f.classList.remove('go');
    void f.offsetWidth;
    f.classList.add('go');
    setTimeout(() => { f.style.opacity = 0; }, 30);
  }

  /* confetti with a bit of gravity so it feels physical */
  function confetti(ref, count, cls) {
    const r = ref.getBoundingClientRect();
    const colors = ['#ffd166', '#ff4d6d', '#4cc9f0', '#7ee787', '#b07cff', '#fff'];
    for (let i = 0; i < count; i++) {
      const p = el('div', 'confetti ' + (cls || ''));
      p.style.left = (r.left + Math.random() * r.width) + 'px';
      p.style.top = (r.top + r.height / 2) + 'px';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', (Math.random() * 460 - 230) + 'px');
      p.style.setProperty('--dy', (-120 - Math.random() * 220) + 'px');
      p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
      p.style.setProperty('--dur', (0.9 + Math.random() * 0.7) + 's');
      if (Math.random() < 0.4) p.style.borderRadius = '50%';
      $('#fxlayer').appendChild(p);
      setTimeout(() => p.remove(), 1800);
    }
  }

  function animateScoreTo(target) {
    const start = displayScore, t0 = performance.now(), dur = 420;
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur);
      displayScore = start + (target - start) * (1 - Math.pow(1 - k, 3));
      $('#round-score').textContent = fmt(Math.round(displayScore));
      renderQuotaOnly();
      if (k < 1) requestAnimationFrame(tick);
      else { displayScore = target; }
    };
    requestAnimationFrame(tick);
  }

  function renderQuotaOnly() {
    const q = Engine.quotaFor(G.run);
    const total = G.run.anteScore + Math.round(displayScore);
    $('#quota-fill').style.width = Math.max(0, Math.min(100, total / q * 100)) + '%';
    $('#quota-text').textContent = fmt(total) + ' / ' + fmt(q);
    $('#quota-bar').classList.toggle('met', total >= q);
  }

  function syncScore() {
    if (!G.round) return;
    animateScoreTo(G.round.score);
    renderHud();
  }

  function afterFx() {
    render();
    if (G.phase === 'play') checkStuck();
  }

  function checkStuck() {
    /* the engine ends the round by itself when the board is cleared -- show the summary */
    if (G.phase === 'roundEnd') { if (!Overlays.isOpen()) Overlays.roundEnd(); return; }
    if (G.phase !== 'play') return;
    if (!Engine.anyMoveAvailable(G, G.run)) {
      G.round.stuck = true;
      renderControls();
      toast('No moves left — cash out!', 2600);
    }
  }

  /* ============ little visual helpers ============ */
  function positionAt(node, ref, dx, dy) {
    const r = (ref || $('#scorebox')).getBoundingClientRect();
    node.style.left = (r.left + r.width / 2 + (dx || 0)) + 'px';
    node.style.top = (r.top + (dy || 0)) + 'px';
  }

  function floatText(ref, text, cls) {
    const n = el('div', 'fx-float ' + (cls || ''), text);
    positionAt(n, ref, (Math.random() * 30 - 15), -8);
    $('#fxlayer').appendChild(n);
    setTimeout(() => n.remove(), 900);
  }

  function bannerText(text) {
    const n = el('div', 'fx-banner', text);
    $('#fxlayer').appendChild(n);
    setTimeout(() => n.remove(), 1100);
  }

  function burst(ref, count, color) {
    const r = ref.getBoundingClientRect();
    for (let i = 0; i < count; i++) {
      const p = el('div', 'particle');
      p.style.left = (r.left + r.width / 2) + 'px';
      p.style.top = (r.top + r.height / 2) + 'px';
      p.style.background = color || '#ffd166';
      const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 120;
      p.style.setProperty('--dx', Math.cos(a) * d + 'px');
      p.style.setProperty('--dy', Math.sin(a) * d + 'px');
      p.style.animationDelay = (Math.random() * 0.08) + 's';
      $('#fxlayer').appendChild(p);
      setTimeout(() => p.remove(), 900);
    }
  }

  /* a couple of embers flying from a trigger toward the score box */
  function spark(from) {
    const a = from.getBoundingClientRect(), b = $('#scorebox').getBoundingClientRect();
    for (let i = 0; i < 5; i++) {
      const p = el('div', 'ember');
      p.style.left = (a.left + a.width / 2) + 'px';
      p.style.top = (a.top + a.height / 2) + 'px';
      p.style.setProperty('--tx', (b.left + b.width / 2 - a.left - a.width / 2) + 'px');
      p.style.setProperty('--ty', (b.top + b.height / 2 - a.top - a.height / 2) + 'px');
      p.style.animationDelay = (i * 0.04) + 's';
      $('#fxlayer').appendChild(p);
      setTimeout(() => p.remove(), 700);
    }
  }

  function screenShake(power) {
    const app = $('#app');
    app.style.setProperty('--shake', (power || 6) + 'px');
    app.classList.remove('shaking');
    void app.offsetWidth;
    app.classList.add('shaking');
    setTimeout(() => app.classList.remove('shaking'), 400);
  }

  function shake(node) {
    if (!node) return;
    node.classList.remove('nope');
    void node.offsetWidth;
    node.classList.add('nope');
    setTimeout(() => node.classList.remove('nope'), 400);
  }

  function flashCurioById(id) {
    const i = G.run.mantel.findIndex(c => c.id === id);
    const n = document.querySelector('.mslot[data-idx="' + i + '"]');
    if (n) { n.classList.add('trigger'); setTimeout(() => n.classList.remove('trigger'), 300); }
  }

  let toastTimer = null;
  function toast(msg, ms) {
    const t = $('#toast');
    t.innerHTML = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms || 1800);
  }

  /* tooltips */
  function showTip(ref, html) {
    const t = $('#tooltip');
    t.innerHTML = html;
    t.classList.add('show');
    const r = ref.getBoundingClientRect();
    const w = 250;
    t.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
    t.style.top = (r.bottom + 8) + 'px';
  }
  function hideTip() { $('#tooltip').classList.remove('show'); }

  /* curio drag-to-reorder */
  function makeCurioDraggable(node, index) {
    let start = null;
    node.addEventListener('pointerdown', e => {
      start = { x: e.clientX, index };
      node.setPointerCapture && node.setPointerCapture(e.pointerId);
    });
    node.addEventListener('pointerup', e => {
      if (!start) return;
      const dx = e.clientX - start.x;
      start = null;
      if (Math.abs(dx) < 25) return;
      const slotW = node.getBoundingClientRect().width + 8;
      const shift = Math.round(dx / slotW);
      const to = Math.max(0, Math.min(G.run.mantel.length - 1, index + shift));
      if (to !== index) { Game.reorderCurio(index, to); Sfx.click(); render(); }
    });
  }

  function resetDisplayScore() { displayScore = G.round ? G.round.score : 0; }

  return {
    render, renderHud, renderMantel, renderBoard, renderControls, cardEl, el, $, $$,
    drainFx, toast, shake, screenShake, burst, fmt, clearSelection, bindPileTargets,
    showTip, hideTip, resetDisplayScore, checkStuck, doMove, floatText, bannerText,
    renderCombo, flashScreen, confetti, rushFx,
    get busy() { return fxBusy; }
  };
})();

/* ===== js/overlays.js ===== */
/* ============================================================
   PILE-DRIVER  ::  overlays.js
   Round summary, the Curio Shop, deck viewer, run end, help.
   ============================================================ */

const Overlays = (() => {
  const G = Game.G;
  const $ = UI.$, $$ = UI.$$, el = UI.el;
  const ov = () => $('#overlay');

  function open(html, cls) {
    const o = ov();
    o.className = 'show ' + (cls || '');
    o.innerHTML = html;
    return o;
  }
  function close() { ov().className = ''; ov().innerHTML = ''; }
  function isOpen() { return ov().classList.contains('show'); }

  /* ---------------- round end ---------------- */
  function roundEnd() {
    const run = G.run, r = G.round, pay = G.payout;
    const quota = Engine.quotaFor(run);
    const total = run.anteScore;              // already includes this round
    const met = total >= quota;
    const last = run.round >= TUNE.roundsPerAnte;
    const headline = r.won ? 'BOARD CLEARED!' : (r.stuck ? 'OUT OF MOVES' : 'ROUND BANKED');

    const payLines = pay.lines.map(l =>
      '<div class="pay-line' + (l.big ? ' hero' : '') + '"><span>' + l.label + '</span><b>+$' + l.amount + '</b></div>').join('');
    const midRound = r.money > 0
      ? '<div class="pay-line earned"><span>Earned during the round (already banked)</span><b>+$' + r.money + '</b></div>'
      : '';

    open(
      '<div class="panel round-panel">' +
        '<div class="panel-flag ' + (r.won ? 'good' : '') + '">' + headline + '</div>' +
        '<div class="big-score">' + UI.fmt(r.score) + '</div>' +
        '<div class="sub">chips banked this round</div>' +
        '<div class="quota-block ' + (met ? 'met' : '') + '">' +
          '<div class="qb-row"><span>Ante ' + run.ante + ' progress</span><b>' + UI.fmt(total) + ' / ' + UI.fmt(quota) + '</b></div>' +
          '<div class="qb-bar"><div style="width:' + Math.min(100, total / quota * 100) + '%"></div></div>' +
          '<div class="qb-note">' + (met
            ? 'QUOTA MET — the rest is gravy.'
            : (last ? 'You needed ' + UI.fmt(quota - total) + ' more.' : 'Need ' + UI.fmt(quota - total) + ' more across ' + (TUNE.roundsPerAnte - run.round) + ' more round' + (TUNE.roundsPerAnte - run.round > 1 ? 's' : '') + '.')) +
          '</div>' +
        '</div>' +
        '<div class="payout"><div class="pay-title">PAYOUT</div>' + midRound + payLines +
          '<div class="pay-line total"><span>Total</span><b>+$' + pay.total + '</b></div></div>' +
        (met && !last
          ? '<button class="btn bank" id="ov-bank">BANK THE ANTE NOW +$' + ((TUNE.roundsPerAnte - run.round) * TUNE.skipBonus) + '</button>'
          : '') +
        '<button class="btn big" id="ov-continue">' + (last && !met ? 'FACE THE MUSIC' : 'TO THE SHOP →') + '</button>' +
        (met && !last ? '<div class="bank-note">Bank it to skip straight to Ante ' + (run.ante + 1) + ', or keep playing this ante for more cash and Curios.</div>' : '') +
      '</div>', 'centered');

    $('#ov-continue').onclick = () => {
      Sfx.click();
      Game.advance();
      if (G.phase === 'shop') shop();
      else if (G.phase === 'gameOver') gameOver();
      else if (G.phase === 'victory') victory();
    };
    const bank = $('#ov-bank');
    if (bank) bank.onclick = () => {
      const gain = Game.bankAnte();
      Sfx.money();
      UI.toast('Ante banked — +$' + gain);
      if (G.phase === 'shop') shop();
      else if (G.phase === 'victory') victory();
    };
    if (r.won) Sfx.win();
  }

  /* ---------------- shop ---------------- */
  const SHELF_META = {
    curio: { title: 'CURIOS', sub: 'objects — each one takes a seat on your mantel', cls: 'sh-curio' },
    mod:   { title: 'CARD MODS', sub: 'permanently mark a card already in your deck — no seat needed', cls: 'sh-mod' },
    card:  { title: 'NEW CARDS', sub: 'adds a brand new card into your deck and the piles', cls: 'sh-card' },
    house: { title: 'HOUSE RULES', sub: 'permanent rules for the rest of the run', cls: 'sh-house' }
  };

  function shop() {
    const run = G.run;
    const shelves = ['curio', 'mod', 'card', 'house'].map(k =>
      '<section class="shelf ' + SHELF_META[k].cls + '">' +
        '<div class="shelf-head"><h3>' + SHELF_META[k].title + '</h3><span>' + SHELF_META[k].sub + '</span></div>' +
        '<div class="shelf-row" id="shelf-' + k + '"></div>' +
      '</section>').join('');

    open(
      '<div class="shop">' +
        '<div class="shop-head">' +
          '<div class="shop-title">THE BACK ROOM</div>' +
          (run.anteCleared ? '<div class="shop-flag">ANTE ' + (run.ante - 1) + ' CLEARED — welcome to Ante ' + run.ante + '</div>' : '') +
          '<div class="shop-cash">$<b id="shop-money">' + run.money + '</b></div>' +
        '</div>' +
        '<div class="mantel-wrap">' +
          '<div class="mantel-cap">YOUR MANTEL <span>click a Curio to sell it · drag sideways to reorder · they fire left to right</span></div>' +
          '<div class="mantel-inline" id="shop-mantel"></div>' +
        '</div>' +
        '<div class="shop-body">' + shelves + '</div>' +
        '<div class="shop-foot">' +
          '<button class="btn ghost" id="shop-reroll">REROLL $<b>' + Game.rerollCost() + '</b></button>' +
          '<button class="btn ghost" id="shop-deck">VIEW DECK (' + run.deck.length + ')</button>' +
          '<button class="btn big" id="shop-next">NEXT ROUND →</button>' +
        '</div>' +
      '</div>', 'shop-open');

    refreshShop();
    $('#shop-reroll').onclick = () => {
      if (Game.reroll()) { Sfx.money(); refreshShop(); }
      else { Sfx.error(); UI.toast('Not enough cash to reroll.'); }
    };
    $('#shop-deck').onclick = () => deckView();
    $('#shop-next').onclick = () => {
      Sfx.click();
      close();
      Game.leaveShop();
      UI.resetDisplayScore();
      UI.render();
      UI.toast('Ante ' + G.run.ante + ' · Round ' + G.run.round, 1400);
    };
  }

  function refreshShop() {
    if (!$('#shelf-curio')) return;
    const run = G.run;
    $('#shop-money').textContent = run.money;
    const rr = $('#shop-reroll');
    if (rr) rr.innerHTML = 'REROLL $<b>' + Game.rerollCost() + '</b>';

    ['curio', 'mod', 'card', 'house'].forEach(shelf => {
      const row = $('#shelf-' + shelf);
      row.innerHTML = '';
      (run.shop[Game.SHELVES[shelf]] || []).forEach((item, i) => row.appendChild(shopCard(item, i, shelf)));
    });
    UI.renderMantel($('#shop-mantel'));
    UI.renderMantel($('#mantel'));
  }

  function shopCard(item, index, shelf) {
    const run = G.run;
    let def, rarity = '', badge = '', preview = '';

    if (shelf === 'curio') {
      def = CURIO_BY_ID[item.id];
      rarity = def.rarity;
      const seats = Game.effectiveSlots();
      badge = '<div class="si-badge seat">TAKES A SEAT · ' + run.mantel.length + '/' + seats + ' used</div>';
    } else if (shelf === 'house') {
      def = HOUSE_BY_ID[item.id];
      const owned = run.houseRules[item.id] || 0;
      badge = '<div class="si-badge rule">PERMANENT' + (def.max > 1 ? ' · owned ' + owned + '/' + def.max : '') + '</div>';
    } else {
      def = SHOP_BY_ID[item.id];
      if (shelf === 'mod') {
        badge = '<div class="si-badge mark">MARKS 1 CARD YOU OWN</div>';
      } else {
        badge = '<div class="si-badge add">+1 CARD TO YOUR DECK</div>';
        preview = '<div class="si-preview">' + previewCard(def) + '</div>';
      }
    }

    const price = Game.priceOf(item);
    const n = el('div', 'shop-item sh-' + shelf + (rarity ? ' r-' + rarity : '') +
      (item.bought ? ' bought' : '') +
      (item.finish && item.finish !== 'none' ? ' ' + FINISHES[item.finish].cls : '') +
      (run.money < price ? ' broke' : ''));
    n.innerHTML =
      '<div class="si-art">' + icon(def.icon) + '</div>' +
      preview +
      '<div class="si-name">' + def.name + '</div>' +
      (item.finish && item.finish !== 'none' ? '<div class="si-fin">' + FINISHES[item.finish].name + '</div>' : '') +
      '<div class="si-text">' + def.text + '</div>' +
      badge +
      '<div class="si-price">' + (item.bought ? 'SOLD' : '$' + price) + '</div>';

    if (!item.bought) {
      n.onclick = () => {
        const res = Game.buy(shelf, index);
        if (!res.ok) { Sfx.error(); UI.toast(res.reason || 'Cannot buy that.'); UI.shake(n); return; }
        if (res.kind === 'select') { deckView(res.def); return; }
        Sfx.money();
        UI.burst(n, 14, '#ffd166');
        if (res.kind === 'card') UI.toast('Added ' + RANK_NAMES[res.card.rank] + SUITS[res.card.suit].sym + ' to your deck');
        refreshShop();
        UI.render();
      };
    }
    return n;
  }

  /* a face-up sample of what a New Card slot puts in your deck */
  function previewCard(def) {
    if (def.kind === 'duplicate') {
      return '<div class="mini-pair">' + UI.cardEl({ id: 'p1', rank: 12, suit: 'H', enhancement: 'none', finish: 'none', seal: 'none', faceUp: true }).outerHTML +
             UI.cardEl({ id: 'p2', rank: 12, suit: 'H', enhancement: 'none', finish: 'none', seal: 'none', faceUp: true }).outerHTML + '</div>';
    }
    const spec = def.sample || def.build();
    const c = UI.cardEl({
      id: 'prev', rank: spec.rank, suit: spec.suit, faceUp: true,
      enhancement: spec.enhancement || 'none', finish: spec.finish || 'none', seal: spec.seal || 'none'
    });
    c.classList.add('mini');
    return c.outerHTML;
  }

  /* ---------------- deck viewer / card picker ---------------- */
  function deckView(pickDef) {
    const run = G.run;
    const bySuit = {};
    SUIT_KEYS.forEach(s => { bySuit[s] = []; });
    run.deck.forEach(c => { (bySuit[c.suit] = bySuit[c.suit] || []).push(c); });
    SUIT_KEYS.forEach(s => bySuit[s].sort((a, b) => a.rank - b.rank));

    const rows = SUIT_KEYS.map(s =>
      '<div class="deck-row"><div class="deck-suit ' + SUITS[s].color + '">' + SUITS[s].sym + '</div>' +
      '<div class="deck-cards" data-suit="' + s + '"></div></div>').join('');

    open(
      '<div class="panel deck-panel">' +
        '<div class="panel-flag">' + (pickDef ? 'CHOOSE A CARD — ' + pickDef.name.toUpperCase() : 'YOUR DECK (' + run.deck.length + ')') + '</div>' +
        (pickDef ? '<div class="sub">' + pickDef.text + '</div>' : '<div class="sub">Every mark you buy lives here for the rest of the run.</div>') +
        '<div class="deck-grid">' + rows + '</div>' +
        '<button class="btn ghost" id="deck-close">' + (pickDef ? 'CANCEL' : 'CLOSE') + '</button>' +
      '</div>', 'centered wide');

    SUIT_KEYS.forEach(s => {
      const holder = $('.deck-cards[data-suit="' + s + '"]');
      bySuit[s].forEach(card => {
        const c = UI.cardEl(Object.assign({}, card, { faceUp: true }));
        c.classList.add('mini');
        if (pickDef) {
          c.classList.add('pickable');
          c.onclick = () => {
            if (Game.applyPending(card.id)) {
              Sfx.money();
              close();
              shop();
              UI.render();
              UI.toast(pickDef.name + ' applied!');
            }
          };
        } else {
          c.addEventListener('pointerenter', e => UI.showTip(e.currentTarget, cardTip(card)));
          c.addEventListener('pointerleave', UI.hideTip);
        }
        holder.appendChild(c);
      });
    });

    $('#deck-close').onclick = () => {
      Sfx.click();
      if (pickDef) Game.cancelPending();
      close();
      if (G.phase === 'shop') shop();
      else if (G.phase === 'play') UI.render();
    };
  }

  function cardTip(card) {
    let s = '<div class="tip-title">' + RANK_NAMES[card.rank] + ' ' + SUITS[card.suit].sym + '</div>';
    s += '<div class="tip-kind card-kind">CARD — lives in your deck</div>';
    s += '<div class="tip-text">Base ' + rankChips(card.rank) + ' Chips</div>';
    if (card.enhancement !== 'none') s += '<div class="tip-text hot">' + ENHANCEMENTS[card.enhancement].name + ' — ' + ENHANCEMENTS[card.enhancement].text + '</div>';
    if (card.finish !== 'none') s += '<div class="tip-text hot">' + FINISHES[card.finish].name + ' — ' + FINISHES[card.finish].text + '</div>';
    if (card.seal !== 'none') s += '<div class="tip-text hot">' + SEALS[card.seal].name + ' — ' + SEALS[card.seal].text + '</div>';
    return s;
  }

  /* ---------------- run over ---------------- */
  function gameOver() {
    const run = G.run;
    Sfx.lose();
    open(
      '<div class="panel over-panel">' +
        '<div class="panel-flag bad">THE TABLE WINS</div>' +
        '<div class="big-score bad">' + UI.fmt(run.anteScore) + '</div>' +
        '<div class="sub">you needed ' + UI.fmt(Engine.quotaFor(run)) + ' by the end of Ante ' + run.ante + '</div>' +
        '<div class="stats">' +
          stat('Antes cleared', run.ante - 1) +
          stat('Rounds played', run.stats.roundsPlayed) +
          stat('Cards sent home', run.stats.cardsScored) +
          stat('Suits finished', run.stats.suitsDone) +
          stat('Best single score', UI.fmt(run.stats.best)) +
          stat('Curios owned', run.mantel.length) +
        '</div>' +
        '<button class="btn big" id="ov-again">DEAL ME IN AGAIN</button>' +
      '</div>', 'centered');
    $('#ov-again').onclick = () => { Sfx.click(); close(); Game.clearSave(); Game.startRun(); UI.resetDisplayScore(); UI.render(); };
  }

  function victory() {
    const run = G.run;
    Sfx.win();
    setTimeout(() => UI.screenShake(10), 200);
    open(
      '<div class="panel win-panel">' +
        '<div class="panel-flag good">YOU BEAT THE HOUSE</div>' +
        '<div class="logo small">ANTE ' + (run.finalAnte || TUNE.finalAnte) + ' CLEARED</div>' +
        '<div class="sub">every quota met. the little objects on your mantel did their job.</div>' +
        '<div class="stats">' +
          stat('Rounds played', run.stats.roundsPlayed) +
          stat('Cards sent home', run.stats.cardsScored) +
          stat('Suits finished', run.stats.suitsDone) +
          stat('Best single score', UI.fmt(run.stats.best)) +
          stat('Cash on hand', '$' + run.money) +
          stat('Curios owned', run.mantel.length) +
        '</div>' +
        '<div class="menu-btns">' +
          '<button class="btn big" id="ov-endless">KEEP GOING (ENDLESS)</button>' +
          '<button class="btn ghost" id="ov-again">NEW RUN</button>' +
        '</div>' +
      '</div>', 'centered');
    $('#ov-endless').onclick = () => {
      Sfx.click();
      G.run.finalAnte = (G.run.finalAnte || TUNE.finalAnte) + 8;
      Game.openShop(true);
      shop();
    };
    $('#ov-again').onclick = () => { Sfx.click(); close(); Game.clearSave(); Game.startRun(); UI.resetDisplayScore(); UI.render(); };
  }

  function stat(k, v) { return '<div class="stat"><span>' + k + '</span><b>' + v + '</b></div>'; }

  /* ---------------- menus ---------------- */
  function help() {
    open(
      '<div class="panel help-panel">' +
        '<div class="panel-flag">HOW TO PLAY</div>' +
        '<div class="help-body">' +

          '<h4>The solitaire part</h4>' +
          '<p>Klondike. Build the four foundations up from Ace to King, stack the tableau ' +
          'downward in alternating colours. The stock deals <b>' + TUNE.drawCount + ' cards at a time</b> and only the ' +
          '<b>top one is playable</b> — the two beneath it are buried until you use it. ' +
          'Drag cards, or click one then click where it goes. Double-click sends a card home.</p>' +

          '<h4>What are Chips and Mult?</h4>' +
          '<p class="formula"><span class="c">CHIPS</span> <b>X</b> <span class="m">MULT</span> <b>=</b> <span class="p">POINTS</span></p>' +
          '<p>Chips are the base value, Mult is the multiplier, and their <i>product</i> is what actually ' +
          'gets added to your round score. Chips on their own do nothing — a thousand Chips at 1 Mult is a ' +
          'thousand points, but the same thousand Chips at 20 Mult is twenty thousand. That is the whole game: ' +
          'grow both, but grow Mult harder. Watch the readout on the table resolve it live.</p>' +

          '<h4>What scores</h4>' +
          '<ul>' +
            '<li><b>A card reaching a foundation</b> — its rank in Chips, plus ' + TUNE.chipsPerDepth + ' for every card already on that pile. Kings are worth a fortune.</li>' +
            '<li><b>Flipping a face-down card</b> — ' + TUNE.revealChips + ' Chips.</li>' +
            '<li><b>Emptying a column</b> — ' + TUNE.clearChips + ' Chips X ' + TUNE.clearMult + ' (once per column, per round).</li>' +
            '<li><b>Completing a suit</b> — ' + TUNE.suitDoneChips + ' Chips X ' + TUNE.suitDoneMult + '.</li>' +
          '</ul>' +

          '<h4>The three combos</h4>' +
          '<ul>' +
            '<li><b>Cascade</b> — foundation plays back to back. Each one adds Mult. Drawing from the stock resets it.</li>' +
            '<li><b>Suit Run</b> — consecutive cards of the same suit going home, stacked on top of the Cascade.</li>' +
            '<li><b>Column Stack</b> — the big one. When you send a card home <i>off a column</i>, the face-up run ' +
            'you built underneath it pays out: <b>+Chips equal to the ranks sitting in that run</b>, and ' +
            '<b>+' + TUNE.stackMultPer + ' Mult for every extra card in it</b>. A column reading K-Q-J-10-9 is worth far more ' +
            'than a lone King. Watch the <span class="rb-demo">RUN X5</span> badge on each column — that is your live payout.</li>' +
          '</ul>' +

          '<h4>How you make money</h4>' +
          '<p>The <b>CASH OUT</b> button always shows exactly what this round would pay you right now. It goes up when you:</p>' +
          '<ul>' +
            '<li>finish the round at all — <b>$' + TUNE.baseMoney + '</b> flat</li>' +
            '<li><b>score hard</b> — a commission of $1 for every <i>quota/' + TUNE.commissionDivisor + '</i> points you put up, ' +
            'to a maximum of $' + TUNE.commissionCap + '. Because it is measured against the quota it stays worth chasing at every Ante. ' +
            'This is usually the biggest line on your payout.</li>' +
            '<li><b>combo mid-round</b> — every Cascade X' + TUNE.cascadeCashEvery + ' pays <b>$1</b> on the spot, and cashing a card off a ' +
            'run of ' + TUNE.stackCashAt + '+ pays <b>$1</b> (' + TUNE.stackCashBigAt + '+ pays <b>$2</b>). You will see the cash pop off the table.</li>' +
            '<li>leave a column empty — <b>$' + TUNE.moneyPerEmptyColumn + '</b> each</li>' +
            '<li>complete a suit — <b>$' + TUNE.moneyPerSuitDone + '</b> each</li>' +
            '<li>clear the whole board — <b>$8</b> bonus</li>' +
            '<li>hold savings — <b>$1 interest per $' + TUNE.interestPer + '</b> you have banked, up to $' + TUNE.interestCap + '. Spending everything every shop costs you.</li>' +
          '</ul>' +
          '<p>Cards and Curios pay out mid-round too — anything Gold-Sealed or Bullion, and Curios like ' +
          'Midas Touch or Shop Vac. Those land the instant they trigger.</p>' +

          '<h4>The quota</h4>' +
          '<p>' + TUNE.roundsPerAnte + ' rounds per Ante, and your scores <b>add up across all ' + TUNE.roundsPerAnte + '</b>. Beat the quota by the end of ' +
          'round ' + TUNE.roundsPerAnte + ' or the run ends. Beat it early and you can bank the Ante for cash instead.</p>' +

          '<h4>Curios vs Card Mods vs New Cards</h4>' +
          '<ul>' +
            '<li><b>Curios</b> are objects. Each one takes a seat on your Mantel — you only have 3 (up to 5). They fire left to right, so put +Mult before XMult.</li>' +
            '<li><b>Card Mods</b> mark one card already in your deck. No seat, permanent, unlimited.</li>' +
            '<li><b>New Cards</b> add a whole extra card to the deck — chameleons, phantoms, fuses. They change the piles themselves.</li>' +
          '</ul>' +

          '<p class="keys"><b>Keys:</b> Space = deal &nbsp; A = auto-collect &nbsp; U = undo &nbsp; H = hint &nbsp; D = deck &nbsp; Esc = menu</p>' +
        '</div>' +
        '<button class="btn ghost" id="help-close">GOT IT</button>' +
      '</div>', 'centered wide');
    $('#help-close').onclick = () => { Sfx.click(); close(); };
  }

  function menu() {
    open(
      '<div class="panel menu-panel">' +
        '<div class="panel-flag">PAUSED</div>' +
        '<div class="menu-btns">' +
          '<button class="btn" id="m-resume">RESUME</button>' +
          '<button class="btn ghost" id="m-help">HOW TO PLAY</button>' +
          '<button class="btn ghost" id="m-deck">VIEW DECK</button>' +
          '<button class="btn danger" id="m-new">ABANDON RUN</button>' +
        '</div>' +
        '<div class="menu-foot">Ante ' + G.run.ante + ' · Round ' + G.run.round + ' · $' + G.run.money + '</div>' +
      '</div>', 'centered');
    $('#m-resume').onclick = () => { Sfx.click(); close(); };
    $('#m-help').onclick = () => { Sfx.click(); help(); };
    $('#m-deck').onclick = () => { Sfx.click(); deckView(); };
    $('#m-new').onclick = () => {
      if (!confirm('Abandon this run and start fresh?')) return;
      Sfx.click(); close(); Game.clearSave(); Game.startRun(); UI.resetDisplayScore(); UI.render();
    };
  }

  function title() {
    open(
      '<div class="panel title-panel">' +
        '<div class="logo">PILE<span>DRIVER</span></div>' +
        '<div class="tagline">a roguelike game of solitaire, greed and small strange objects</div>' +
        '<div class="menu-btns">' +
          '<button class="btn big" id="t-new">NEW RUN</button>' +
          '<button class="btn ghost" id="t-cont" style="display:none">CONTINUE RUN</button>' +
          '<button class="btn ghost" id="t-help">HOW TO PLAY</button>' +
        '</div>' +
      '</div>', 'centered title-screen');
    return {
      onNew: fn => { $('#t-new').onclick = fn; },
      showContinue: fn => { const b = $('#t-cont'); b.style.display = ''; b.onclick = fn; },
      onHelp: fn => { $('#t-help').onclick = fn; }
    };
  }

  return { open, close, isOpen, roundEnd, shop, refreshShop, deckView, gameOver, victory, help, menu, title };
})();

/* ===== js/main.js ===== */
/* ============================================================
   PILE-DRIVER  ::  main.js   boot + input wiring
   ============================================================ */
(function () {
  const G = Game.G;
  const $ = UI.$;

  function boot() {
    const t = Overlays.title();
    t.onNew(() => {
      Sfx.click();
      Game.clearSave();
      Game.startRun();
      Overlays.close();
      UI.resetDisplayScore();
      UI.render();
      UI.toast('Ante 1 · Round 1 — hit ' + UI.fmt(Engine.quotaFor(G.run)) + ' across 3 rounds. Chips <b>X</b> Mult = points.', 4200);
      setTimeout(() => { if (G.phase === 'play') UI.toast('Build long face-up runs, then cash them home — the <b>RUN</b> badge shows the bonus.', 4200); }, 4600);
    });
    if (Game.load()) {
      t.showContinue(() => {
        Sfx.click();
        Overlays.close();
        UI.resetDisplayScore();
        UI.render();
        if (G.phase === 'shop') Overlays.shop();
        else if (G.phase === 'roundEnd') Overlays.roundEnd();
        else if (G.phase === 'gameOver') Overlays.gameOver();
        else if (G.phase === 'victory') Overlays.victory();
      });
    }
    t.onHelp(() => { Sfx.click(); Overlays.help(); });
    wire();
  }

  function cashOut() {
    if (G.phase !== 'play') return;
    UI.rushFx();
    Sfx.click();
    Game.endRound(false);
    Overlays.roundEnd();
  }

  function draw() {
    if (G.phase !== 'play') return;
    UI.rushFx();
    if (Game.drawStock()) { Sfx.deal(); UI.clearSelection(); UI.render(); UI.drainFx(); UI.checkStuck(); }
    else { Sfx.error(); UI.shake($('#stock')); }
  }

  function hint() {
    if (G.phase !== 'play') return;
    const h = Game.hint();
    if (!h) { Sfx.error(); UI.toast('Nothing left. Cash out.'); return; }
    Sfx.click();
    if (h.src.zone === 'stock') { flashNode($('#stock')); return; }
    const srcNode = h.src.zone === 'waste'
      ? document.querySelector('#waste .card:last-of-type')
      : (h.src.zone === 'tableau'
        ? UI.$$('#tableau .tab-pile')[h.src.col].querySelector('[data-index="' + h.src.index + '"]')
        : null);
    flashNode(srcNode);
    if (h.dst) {
      const dstNode = h.dst.zone === 'foundation'
        ? $('#f-' + (h.dst.suit || Engine.foundationTargetFor(G.board, cardOf(h.src))))
        : UI.$$('#tableau .tab-pile')[h.dst.col];
      flashNode(dstNode);
    }
  }

  function cardOf(src) {
    if (src.zone === 'waste') return G.board.waste[G.board.waste.length - 1];
    if (src.zone === 'tableau') return G.board.tableau[src.col][src.index];
    return null;
  }

  function flashNode(n) {
    if (!n) return;
    n.classList.add('hinted');
    setTimeout(() => n.classList.remove('hinted'), 1400);
  }

  function auto() {
    if (G.phase !== 'play') return;
    UI.rushFx();
    const n = Game.autoCollect();
    if (n) { UI.render(); UI.drainFx(); }
    else { Sfx.error(); UI.toast('Nothing can go home right now.'); }
  }

  function undo() {
    if (G.phase !== 'play') return;
    UI.rushFx();
    if (Game.undo()) { Sfx.flip(); UI.clearSelection(); UI.resetDisplayScore(); UI.render(); }
    else { Sfx.error(); UI.toast('No undos left.'); }
  }

  function wire() {
    $('#stock').addEventListener('click', draw);
    $('#btn-cash').onclick = cashOut;
    $('#btn-hint').onclick = hint;
    $('#btn-collect').onclick = auto;
    $('#btn-undo').onclick = undo;
    $('#btn-deck').onclick = () => { if (G.run) { Sfx.click(); Overlays.deckView(); } };
    $('#btn-menu').onclick = () => { if (G.run) { Sfx.click(); Overlays.menu(); } };
    $('#btn-help').onclick = () => { Sfx.click(); Overlays.help(); };
    $('#btn-sound').onclick = e => {
      const on = Sfx.toggle();
      e.currentTarget.textContent = on ? '\u{1F50A}' : '\u{1F507}';
      e.currentTarget.classList.toggle('off', !on);
    };
    UI.bindPileTargets();

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      const k = e.key.toLowerCase();
      if (k === 'escape') { if (Overlays.isOpen() && G.phase === 'play') Overlays.close(); else if (G.phase === 'play') Overlays.menu(); return; }
      if (Overlays.isOpen()) return;
      if (k === ' ') { e.preventDefault(); draw(); }
      else if (k === 'a') auto();
      else if (k === 'u') undo();
      else if (k === 'h') hint();
      else if (k === 'd') { if (G.run) Overlays.deckView(); }
      else if (k === 'c') cashOut();
    });

    let rt = null;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => { if (G.run && G.board) UI.renderBoard(); }, 120);
    });

    document.addEventListener('pointerdown', () => { Sfx.toggle(Sfx.isOn()); }, { once: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
