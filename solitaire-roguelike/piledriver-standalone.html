    const m = Engine.mods(G.run);
    const mult = Math.pow(2, bn.raises);
    G.round.bountiesCollected = (G.round.bountiesCollected || 0) + 1;
    G.run.stats.bounties = (G.run.stats.bounties || 0) + 1;
    const cash = TUNE.bountyCash + (m.bountyBonus ? TUNE.bountyCash : 0);
    G.run.money += cash;
    G.round.money += cash;
    if (m.bountyBonus) G.round.heat = (G.round.heat || 0) + 1;
    const spot = anchor || { zone: 'bounty' };
    scoreEvent({ event: 'bounty', card: null, baseChips: bn.reward, anchor: spot,
                 label: 'BOUNTY COLLECTED' + (mult > 1 ? '  x' + mult : '') });
    push({ event: 'cash', label: 'BOUNTY — $' + cash, amount: cash, anchor: spot,
           chips: 0, mult: 0, total: 0, triggers: [] });
    if (Math.random() < 0.5) push({ event: 'nudge', label: quip('bountyGot'), chips: 0, mult: 0, total: 0, triggers: [] });
    postBounty();
  }

  /* ---------------- THE STASH ----------------
     Hold cards back out of the deal and play them whenever they help. The Stash
     survives rounds and antes, so a spare Ace or a Gilded King can be saved for
     the exact moment your multipliers are highest.                             */
  function stashCapacity() { return Engine.stashCapacity(G.run); }

  function canStash(src) {
    if (G.phase !== 'play') return false;
    if ((G.run.stash || []).length >= stashCapacity()) return false;
    const b = G.board;
    if (src.zone === 'waste') {
      const allowed = Engine.playableWaste(b, Engine.mods(G.run));
      const idx = src.index != null ? src.index : b.waste.length - 1;
      return allowed.some(w => w.index === idx);
    }
    if (src.zone === 'tableau') {
      const pile = b.tableau[src.col];
      return pile.length > 0 && src.index === pile.length - 1 && pile[src.index].faceUp;
    }
    return false;
  }

  function stash(src) {
    if (!canStash(src)) { illegal(); return false; }
    const cards = grab(src, Engine.mods(G.run));
    if (!cards || cards.length !== 1) { illegal(); return false; }
    snapshot();
    const card = cards[0];
    removeFrom(src, 1);
    if (!G.run.stash) G.run.stash = [];
    G.run.stash.push(Object.assign({}, card, { faceUp: true, scoredRound: false }));
    G.round.moves++;
    bumpMomentum(TUNE.momentumPerMove * 0.5);

    const m = Engine.mods(G.run);
    if (m.stashCash) { G.run.money += m.stashCash; G.round.money += m.stashCash; }
    scoreEvent({ event: 'stash', card, baseChips: rankChips(card.rank) * TUNE.stashChipsPerRank,
                 label: 'POCKETED', anchor: { zone: 'stash' } });
    if (src.zone === 'tableau') settleColumn(src.col);
    afterMove();
    return true;
  }

  /* play a held card back onto the board */
  function stashPlay(index, dst) {
    if (G.phase !== 'play') return false;
    const card = (G.run.stash || [])[index];
    if (!card) return false;
    const b = G.board, m = Engine.mods(G.run);

    if (dst.zone === 'foundation') {
      let suit = dst.suit && Engine.canPlaceOnFoundation(b, card, dst.suit) ? dst.suit : Engine.foundationTargetFor(b, card);
      let twin = false;
      if (!suit) { suit = dst.suit && Engine.canTwin(b, card, dst.suit) ? dst.suit : Engine.twinTargetFor(b, card); twin = !!suit; }
      if (!suit) return illegal();
      snapshot();
      G.run.stash.splice(index, 1);
      const depth = b.foundations[suit].length;
      if (twin) b.twins[suit].push(card); else b.foundations[suit].push(card);
      G.round.moves++;
      G.round.stashPlays++;
      G.round.scoredCards++;
      G.round.cascade++;
      bumpMomentum();
      const anchor = { zone: 'foundation', suit };
      card.scoredRound = true;
      scoreEvent({ event: 'foundation', card, fromZone: 'stash', depth: twin ? Math.max(0, depth - 1) : depth,
                   anchor, twin, fromStash: true, label: twin ? 'TWIN FROM THE STASH!' : 'FROM THE STASH!' });
      G.round.blessing = 0;
      collectBounty(card, anchor);
      if (!twin) checkSuitComplete(suit, anchor);
      afterMove();
      return true;
    }

    if (dst.zone === 'tableau') {
      if (!Engine.canPlaceOnColumn(b, dst.col, card, m)) return illegal();
      snapshot();
      G.run.stash.splice(index, 1);
      card.faceUp = true;
      b.tableau[dst.col].push(card);
      G.round.moves++;
      G.round.stashPlays++;
      breakCascade();
      bumpMomentum(TUNE.momentumPerMove * 0.5);
      push({ event: 'cash', label: 'OUT OF THE STASH', amount: 0,
             anchor: { zone: 'tableau', col: dst.col }, chips: 0, mult: 0, total: 0, triggers: [] });
      afterMove();
      return true;
    }
    return illegal();
  }

  /* ---------------- THE SIDE POT ----------------
     A slice of every score also drops into a pot in the corner. Cash it whenever
     you like, or push it: a card is flipped from a freshly shuffled fate deck,
     so there is no order to memorise. Red doubles it and stokes your HEAT.
     Black takes the lot and a pass with it.                                     */
  function addToPot(points) {
    const cut = Math.round(points * (TUNE.potShare + Engine.mods(G.run).potShare));
    if (cut <= 0) return;
    G.round.pot = (G.round.pot || 0) + cut;
  }

  function cashPot() {
    const pot = G.round.pot || 0;
    if (pot <= 0) return { ok: false, reason: 'The pot is empty.' };
    snapshot();
    G.round.score += pot;
    G.round.pot = 0;
    G.round.potStreak = 0;
    push({ event: 'pot-cash', amount: pot, chips: 0, mult: 0, total: pot, triggers: [] });
    bumpMomentum(TUNE.momentumPerMove * 0.5);
    save();
    return { ok: true, amount: pot };
  }

  function pushPot() {
    const pot = G.round.pot || 0;
    if (pot < TUNE.potMinFlip) return { ok: false, reason: 'The pot needs at least ' + TUNE.potMinFlip + ' to gamble.' };
    snapshot();
    const m = Engine.mods(G.run);
    /* a fresh shuffle every single flip: nothing to count, nothing to wait for */
    const fate = Engine.newCard(1 + Math.floor(Math.random() * 13), SUIT_KEYS[Math.floor(Math.random() * 4)], { faceUp: true });
    let win = SUITS[fate.suit].color === 'red';
    let guaranteed = false;
    if (!win && m.firstFlipSafe && !G.round.usedSafeFlip) {
      win = true; guaranteed = true;
      G.round.usedSafeFlip = true;
      fate.suit = Math.random() < 0.5 ? 'H' : 'D';
    }

    let penalty = null;
    if (win) {
      G.round.pot = pot * 2;
      G.round.potStreak = (G.round.potStreak || 0) + 1;
      G.round.heat++;
      if (m.dareBonus) { G.run.money += 5; G.round.money += 5; }
      bumpMomentum();
    } else {
      G.round.pot = 0;
      G.round.potStreak = 0;
      G.round.heat = 0;
      if (G.board.passesLeft > 0) { G.board.passesLeft--; penalty = 'pass'; }
      else penalty = 'none';
    }
    push({ event: 'pot-flip', win, guaranteed, card: fate, pot: G.round.pot,
           streak: G.round.potStreak, penalty, lost: win ? 0 : pot,
           chips: 0, mult: 0, total: 0, triggers: [] });
    save();
    return { ok: true, win, pot: G.round.pot };
  }

  function heatMult() {
    const per = TUNE.heatMultPer + Engine.mods(G.run).heatPer;
    return +(1 + per * G.round.heat).toFixed(2);
  }

  /* ---------------- reshuffles ----------------
     Throws the waste back in with the stock and shuffles. It costs a PASS --
     the same resource that limits how many times you can work the stock -- or
     you can buy one straight out of your ANTE total if you are out of passes.  */
  function reshuffleCost() {
    const n = G.board ? G.board.paidReshuffles : 0;
    return {
      free: G.board ? G.board.freeReshuffles : 0,
      passes: G.board ? G.board.passesLeft : 0,
      points: TUNE.reshufflePoints + TUNE.reshufflePointsStep * n
    };
  }

  /* score spent here comes off the ante bar: this round first, then banked rounds */
  function spendAnteScore(n) {
    let left = n;
    const fromRound = Math.min(G.round.score, left);
    G.round.score -= fromRound;
    left -= fromRound;
    if (left > 0) {
      const fromAnte = Math.min(G.run.anteScore, left);
      G.run.anteScore -= fromAnte;
      left -= fromAnte;
    }
    return left === 0;
  }

  function anteTotalAvailable() {
    return (G.round ? G.round.score : 0) + (G.run ? G.run.anteScore : 0);
  }

  function reshuffle(how) {
    if (G.phase !== 'play') return { ok: false, reason: 'Not now.' };
    const b = G.board;
    if (!b.stock.length && !b.waste.length) return { ok: false, reason: 'Nothing to shuffle.' };
    const cost = reshuffleCost();
    if (how === 'free') {
      if (b.freeReshuffles <= 0) return { ok: false, reason: 'No free reshuffles left.' };
      b.freeReshuffles--;
    } else if (how === 'pass') {
      if (b.passesLeft <= 0) return { ok: false, reason: 'Out of passes — nothing left to spend.' };
      b.passesLeft--;
    } else if (how === 'points') {
      if (anteTotalAvailable() < cost.points) return { ok: false, reason: 'Not enough banked score in the ante.' };
      spendAnteScore(cost.points);
      b.paidReshuffles++;
    } else return { ok: false, reason: 'nope' };

    doReshuffle();
    return { ok: true, how };
  }

  function doReshuffle() {
    const b = G.board;
    snapshot();
    const all = b.stock.concat(b.waste);
    all.forEach(c => { c.faceUp = false; });
    b.stock = Engine.shuffle(all);
    b.waste = [];
    breakCascade();
    G.round.moves++;
    push({ event: 'reshuffle', label: 'RESHUFFLED', chips: 0, mult: 0, total: 0, triggers: [] });
    save();
  }

  /* ---------------- AUTOPLAY ----------------
     autoPlan picks the single best move a decent Klondike player would make and
     hands it back WITHOUT playing it, so the UI can animate the card travelling.
     The order is: collect the bounty, free the aces, dig out face-down cards,
     build with the waste, send home what is safe to send, open a column for a
     King, and only then turn the stock. It never spends a pass or ante score on
     your behalf, and it never offers a move that changes nothing.
     ------------------------------------------------------------------------- */

  /* A card is safe to send home when nothing left on the board could still need
     it: both opposite-colour foundations have already passed the rank below it. */
  function safeToSendHome(card) {
    const b = G.board;
    if (card.oddity) return true;
    if (card.rank <= 2) return true;
    const buried = b.tableau.some(p => p.some(c => !c.faceUp));
    if (!buried && !b.stock.length && !b.waste.length) return true;
    const opp = Engine.isRed(card) ? ['S', 'C'] : ['H', 'D'];
    const low = Math.min(b.foundations[opp[0]].length, b.foundations[opp[1]].length);
    return card.rank <= low + 1;
  }

  /* a stable fingerprint of the board, so autoplay can notice it is going in circles */
  function boardKey() {
    const b = G.board;
    return b.tableau.map(p => p.map(c => (c.faceUp ? '' : 'x') + c.id).join(',')).join('|') +
           '#' + SUIT_KEYS.map(s => b.foundations[s].length + '/' + (b.twins ? b.twins[s].length : 0)).join(',') +
           '#' + b.waste.map(c => c.id).join(',') + '#' + b.stock.length;
  }

  function autoPlan(opts) {
    if (G.phase !== 'play') return null;
    const b = G.board, m = Engine.mods(G.run);
    const relaxed = !!(opts && opts.relaxed);
    const homeable = c => !!(Engine.foundationTargetFor(b, c) || Engine.twinTargetFor(b, c));
    const waste = Engine.playableWaste(b, m);
    const tops = [];
    for (let c = 0; c < b.tableau.length; c++) {
      const pile = b.tableau[c];
      if (!pile.length) continue;
      const top = pile[pile.length - 1];
      if (top.faceUp) tops.push({ card: top, src: { zone: 'tableau', col: c, index: pile.length - 1 } });
    }
    const home = (src, card, label, kind) =>
      ({ kind: kind || 'home', label, cardId: card.id, src, dst: { zone: 'foundation' } });

    /* 1. the wanted card, if it can go home right now -- always worth it */
    const bn = G.round.bounty;
    if (bn) {
      for (const t of tops) if (t.card.id === bn.cardId && homeable(t.card)) return home(t.src, t.card, 'Collecting the bounty', 'bounty');
      for (const w of waste) if (w.card.id === bn.cardId && homeable(w.card))
        return home({ zone: 'waste', index: w.index }, w.card, 'Collecting the bounty', 'bounty');
      for (let i = 0; i < (G.run.stash || []).length; i++) {
        const c = G.run.stash[i];
        if (c.id === bn.cardId && homeable(c))
          return { kind: 'bounty', label: 'Collecting the bounty from the Stash', cardId: c.id,
                   src: { zone: 'stash', index: i }, dst: { zone: 'foundation' } };
      }
    }

    /* 2. aces and twos always go home */
    for (const t of tops) if (t.card.rank <= 2 && homeable(t.card)) return home(t.src, t.card, 'Aces first');
    for (const w of waste) if (w.card.rank <= 2 && homeable(w.card))
      return home({ zone: 'waste', index: w.index }, w.card, 'Aces first');

    /* 3. tableau moves that turn a face-down card over -- the whole game, really */
    let dig = null;
    for (let c = 0; c < b.tableau.length; c++) {
      const pile = b.tableau[c];
      for (let i = 0; i < pile.length; i++) {
        if (!pile[i].faceUp || !Engine.isRunFrom(b, c, i, m)) continue;
        if (i === 0 || pile[i - 1].faceUp) continue;          // nothing buried underneath
        const buried = pile.slice(0, i).filter(x => !x.faceUp).length;
        for (let d = 0; d < b.tableau.length; d++) {
          if (d === c || !b.tableau[d].length) continue;      // empty columns are handled below
          if (!Engine.canPlaceOnColumn(b, d, pile[i], m)) continue;
          const score = buried * 10 + Engine.runLength(b, d, m);
          if (!dig || score > dig.score) {
            dig = { score, plan: { kind: 'dig', label: 'Uncovers a face-down card', cardId: pile[i].id,
                                   src: { zone: 'tableau', col: c, index: i }, dst: { zone: 'tableau', col: d } } };
          }
        }
      }
    }
    if (dig) return dig.plan;

    /* 4. the waste card onto the tableau -- prefer landing on the longest run */
    let build = null;
    for (const w of waste) {
      for (let d = 0; d < b.tableau.length; d++) {
        if (!b.tableau[d].length) continue;
        if (!Engine.canPlaceOnColumn(b, d, w.card, m)) continue;
        const score = Engine.runLength(b, d, m);
        if (!build || score > build.score) {
          build = { score, plan: { kind: 'build', label: 'Builds a column run', cardId: w.card.id,
                                   src: { zone: 'waste', index: w.index }, dst: { zone: 'tableau', col: d } } };
        }
      }
    }
    if (build) return build.plan;

    /* 5. send home whatever is safe to send. A card is only held back while
          something on the board could still need it to build on. */
    for (const t of tops) {
      if (!homeable(t.card)) continue;
      if (relaxed || safeToSendHome(t.card)) return home(t.src, t.card, 'Sends it home');
    }
    for (const w of waste) {
      if (!homeable(w.card)) continue;
      if (relaxed || safeToSendHome(w.card)) return home({ zone: 'waste', index: w.index }, w.card, 'Sends it home');
    }

    /* 6. fill an empty column -- only with something that frees a card or the waste */
    const empty = b.tableau.findIndex(p => !p.length);
    if (empty >= 0) {
      for (let c = 0; c < b.tableau.length; c++) {
        const pile = b.tableau[c];
        for (let i = 0; i < pile.length; i++) {
          if (!pile[i].faceUp || !Engine.isRunFrom(b, c, i, m)) continue;
          if (i === 0 || pile[i - 1].faceUp) continue;        // moving a whole column gains nothing
          if (!Engine.canPlaceOnColumn(b, empty, pile[i], m)) continue;
          return { kind: 'dig', label: 'Opens the column and frees a card', cardId: pile[i].id,
                   src: { zone: 'tableau', col: c, index: i }, dst: { zone: 'tableau', col: empty } };
        }
      }
      for (const w of waste) {
        if (!Engine.canPlaceOnColumn(b, empty, w.card, m)) continue;
        return { kind: 'build', label: 'Fills the empty column', cardId: w.card.id,
                 src: { zone: 'waste', index: w.index }, dst: { zone: 'tableau', col: empty } };
      }
    }

    /* 7. nothing on the felt -- turn the stock */
    if (b.stock.length) return { kind: 'draw', label: 'Turning the stock' };
    if (b.waste.length && (b.passesLeft > 0 || m.infinitePasses)) return { kind: 'draw', label: 'Running the stock again' };

    /* 8. out of ideas while still holding a safety rule -- drop it and try again */
    if (!relaxed) return autoPlan({ relaxed: true });

    /* 9. a free reshuffle costs nothing, so it is worth taking before giving up */
    if (b.freeReshuffles > 0 && (b.stock.length || b.waste.length)) return { kind: 'reshuffle', label: 'Free reshuffle' };
    return null;
  }

  /* Play one planned move. The UI calls autoPlan first so it can animate. */
  function autoPlay(plan) {
    if (!plan || G.phase !== 'play') return false;
    if (plan.kind === 'draw') return drawStock();
    if (plan.kind === 'reshuffle') return reshuffle('free').ok;
    if (plan.src.zone === 'stash') return stashPlay(plan.src.index, plan.dst);
    return tryMove(plan.src, plan.dst);
  }

  /* auto-play every card that can go straight home */
  function autoCollect() {
    let moved = 0, guard = 0;
    let again = true;
    while (again && guard++ < 300) {
      again = false;
      const b = G.board;
      for (let c = 0; c < b.tableau.length; c++) {
        const pile = b.tableau[c];
        if (!pile.length) continue;
        const top = pile[pile.length - 1];
        if (top.faceUp && (Engine.foundationTargetFor(b, top) || Engine.twinTargetFor(b, top))) {
          if (tryMove({ zone: 'tableau', col: c, index: pile.length - 1 }, { zone: 'foundation' })) { moved++; again = true; }
        }
      }
      const w = G.board.waste[G.board.waste.length - 1];
      if (w && (Engine.foundationTargetFor(G.board, w) || Engine.twinTargetFor(G.board, w))) {
        if (tryMove({ zone: 'waste' }, { zone: 'foundation' })) { moved++; again = true; }
      }
      if (G.phase !== 'play') break;
    }
    return moved;
  }

  /* Ranked advice. Returns { src, dst, cardId, kind, label } or null only when
     there is genuinely nothing left to do -- including wishes and reshuffles. */
  function hint() {
    const b = G.board, m = Engine.mods(G.run);
    const homeable = c => !!(Engine.foundationTargetFor(b, c) || Engine.twinTargetFor(b, c));
    const waste = Engine.playableWaste(b, m);

    /* 0. the wanted card, if it can go home right now */
    const bn = G.round && G.round.bounty;
    if (bn) {
      for (let c = 0; c < b.tableau.length; c++) {
        const pile = b.tableau[c];
        if (!pile.length) continue;
        const top = pile[pile.length - 1];
        if (top.faceUp && top.id === bn.cardId && homeable(top)) {
          return { src: { zone: 'tableau', col: c, index: pile.length - 1 }, dst: { zone: 'foundation' },
                   cardId: top.id, kind: 'bounty', label: 'That is the bounty — collect it' };
        }
      }
      for (const w of waste) {
        if (w.card.id === bn.cardId && homeable(w.card)) {
          return { src: { zone: 'waste', index: w.index }, dst: { zone: 'foundation' },
                   cardId: w.card.id, kind: 'bounty', label: 'That is the bounty — collect it' };
        }
      }
    }

    /* 1. anything that can go home */
    for (let c = 0; c < b.tableau.length; c++) {
      const pile = b.tableau[c];
      if (!pile.length) continue;
      const top = pile[pile.length - 1];
      if (top.faceUp && homeable(top)) {
        return { src: { zone: 'tableau', col: c, index: pile.length - 1 }, dst: { zone: 'foundation' },
                 cardId: top.id, kind: 'home', label: 'Send it home' };
      }
    }
    for (const w of waste) {
      if (homeable(w.card)) {
        return { src: { zone: 'waste', index: w.index }, dst: { zone: 'foundation' },
                 cardId: w.card.id, kind: 'home', label: 'Send it home' };
      }
    }

    /* 2. tableau moves that uncover a face-down card */
    for (let c = 0; c < b.tableau.length; c++) {
      const pile = b.tableau[c];
      for (let i = 0; i < pile.length; i++) {
        if (!pile[i].faceUp || !Engine.isRunFrom(b, c, i, m)) continue;
        const uncovers = i > 0 && !pile[i - 1].faceUp;
        if (!uncovers) continue;
        for (let d = 0; d < b.tableau.length; d++) {
          if (d === c) continue;
          if (Engine.canPlaceOnColumn(b, d, pile[i], m)) {
            return { src: { zone: 'tableau', col: c, index: i }, dst: { zone: 'tableau', col: d },
                     cardId: pile[i].id, kind: 'dig', label: 'Uncovers a face-down card' };
          }
        }
      }
    }

    /* 3. waste onto the tableau -- prefer landing on a longer run */
    let best = null;
    for (const w of waste) {
      for (let d = 0; d < b.tableau.length; d++) {
        if (!Engine.canPlaceOnColumn(b, d, w.card, m)) continue;
        const score = Engine.runLength(b, d, m);
        if (!best || score > best.score) {
          best = { score, hint: { src: { zone: 'waste', index: w.index }, dst: { zone: 'tableau', col: d },
                                  cardId: w.card.id, kind: 'build', label: 'Builds your column run' } };
        }
      }
    }
    if (best) return best.hint;

    /* 4. tableau moves that actually gain something. Sliding a run from one
       column into an empty one when nothing is buried underneath changes
       nothing, so it is never suggested. */
    for (let c = 0; c < b.tableau.length; c++) {
      const pile = b.tableau[c];
      for (let i = 0; i < pile.length; i++) {
        if (!pile[i].faceUp || !Engine.isRunFrom(b, c, i, m)) continue;
        const uncovers = i > 0 && !pile[i - 1].faceUp;
        const emptiesColumn = i === 0;
        /* A tableau move is only worth suggesting if it turns a card over or
           frees a whole column. Sliding a 9 off one black 10 onto a different
           black 10 changes nothing at all, so it is never offered. */
        if (!uncovers && !emptiesColumn) continue;
        for (let d = 0; d < b.tableau.length; d++) {
          if (d === c) continue;
          const intoEmpty = !b.tableau[d].length;
          if (intoEmpty && !uncovers) continue;   // shuffling furniture between empty slots
          if (!Engine.canPlaceOnColumn(b, d, pile[i], m)) continue;
          return { src: { zone: 'tableau', col: c, index: i }, dst: { zone: 'tableau', col: d },
                   cardId: pile[i].id, kind: 'build',
                   label: uncovers ? 'Uncovers a face-down card' : 'Frees up a whole column' };
        }
      }
    }

    /* 5. a card held in the stash that can go somewhere useful */
    for (let i = 0; i < (G.run.stash || []).length; i++) {
      const c = G.run.stash[i];
      if (Engine.foundationTargetFor(b, c) || Engine.twinTargetFor(b, c)) {
        return { src: { zone: 'stash', index: i }, dst: { zone: 'foundation' },
                 cardId: c.id, kind: 'stash', label: 'Play it out of your stash' };
      }
    }

    /* 6. deal */
    if (b.stock.length) return { src: { zone: 'stock' }, kind: 'draw', label: 'Deal three more' };
    if (b.waste.length && (b.passesLeft > 0 || m.infinitePasses)) {
      return { src: { zone: 'stock' }, kind: 'draw', label: 'Turn the waste back over' };
    }

    /* 7. a reshuffle re-orders what draw-3 buried */
    const rc = reshuffleCost();
    if ((b.stock.length || b.waste.length) && (rc.free > 0 || rc.passes > 0 || anteTotalAvailable() >= rc.points)) {
      return { src: { zone: 'reshuffle' }, kind: 'reshuffle',
               label: rc.free > 0 ? 'Use a free reshuffle' : 'Reshuffle the stock (costs a pass)' };
    }

    /* 8. nothing moves -- pocket a card you cannot place */
    if ((G.run.stash || []).length < stashCapacity()) {
      for (let c = 0; c < b.tableau.length; c++) {
        const pile = b.tableau[c];
        if (!pile.length) continue;
        const top = pile[pile.length - 1];
        if (top.faceUp) {
          return { src: { zone: 'tableau', col: c, index: pile.length - 1 }, dst: { zone: 'stash' },
                   cardId: top.id, kind: 'stash', label: 'Nothing else moves — pocket it for later' };
        }
      }
      for (const w of waste) {
        return { src: { zone: 'waste', index: w.index }, dst: { zone: 'stash' },
                 cardId: w.card.id, kind: 'stash', label: 'Nothing else moves — pocket it for later' };
      }
    }
    return null;
  }

  /* ---------------- round end ---------------- */
  function endRound(won) {
    if (G.phase !== 'play') return;
    G.round.over = true;
    G.round.won = !!won || Engine.isWon(G);
    G.phase = 'roundEnd';
    G.payout = Score.payout(G);
    G.run.money += G.payout.total;
    G.run.anteScore += G.round.score;
    G.run.stats.roundsPlayed++;
    save();
  }

  function clearAnte() {
    const run = G.run;
    run.ante++;
    run.round = 1;
    run.anteScore = 0;
    run.mantel.forEach(inst => { if (inst.id === 'perpetual') inst.counter = 0; });
    if (run.ante > (run.finalAnte || TUNE.finalAnte)) { G.phase = 'victory'; save(); return; }
    openShop(true);
  }

  /* called from the round-end screen */
  function advance() {
    const run = G.run;
    if (run.round >= TUNE.roundsPerAnte) {
      if (run.anteScore >= Engine.quotaFor(run)) clearAnte();
      else { G.phase = 'gameOver'; save(); }
    } else {
      run.round++;
      openShop(false);
    }
  }

  /* quota already met with rounds to spare -- bank it and take the cash.
     Skipping a round costs you its payout and its shop, so the bonus has to be
     worth more than the round you are giving up. */
  function earlyFinishBonus() {
    const run = G.run;
    const quota = Engine.quotaFor(run);
    if (!quota || run.anteScore < quota) return null;
    const skipped = Math.max(0, TUNE.roundsPerAnte - run.round);
    if (!skipped) return null;
    const base = skipped * TUNE.skipBonus;
    const overshootPct = (run.anteScore - quota) / quota * 100;
    const over = Math.min(TUNE.skipOvershootCap, Math.floor(overshootPct / TUNE.skipOvershootPer));
    return { skipped, base, over, overshootPct: Math.round(overshootPct), total: base + over };
  }

  function bankAnte() {
    const b2 = earlyFinishBonus();
    if (!b2) return false;
    G.run.money += b2.total;
    clearAnte();
    return b2;
  }

  /* ---------------- the shop ---------------- */
  /* Four clearly separated shelves:
       curios  -> take a seat on the mantel
       mods    -> permanently mark a card you already own
       cards   -> add a brand new card to the deck
       houses  -> permanent run rules, no seat needed              */
  const SHELVES = { curio: 'curios', mod: 'mods', card: 'cards', plain: 'plain', house: 'houses' };

  function weightedCurio(exclude) {
    const pool = CURIOS.filter(c => !exclude.has(c.id));
    if (!pool.length) return null;
    let total = 0;
    pool.forEach(c => { total += RARITY_WEIGHT[c.rarity]; });
    let r = Math.random() * total;
    for (const c of pool) { r -= RARITY_WEIGHT[c.rarity]; if (r <= 0) return c; }
    return pool[0];
  }

  function rollFinish() {
    const r = Math.random();
    if (r < 0.03) return 'neg';
    if (r < 0.07) return 'poly';
    if (r < 0.13) return 'holo';
    if (r < 0.21) return 'foil';
    return 'none';
  }

  function priceOf(item) {
    const base = item.type === 'house' ? HOUSE_BY_ID[item.id].cost
               : item.type === 'curio' ? CURIO_BY_ID[item.id].cost
               : item.type === 'plain' ? item.cost
               : SHOP_BY_ID[item.id].cost;
    let p = base;
    if (item.finish && item.finish !== 'none') p += { foil: 3, holo: 4, poly: 6, neg: 8 }[item.finish];
    return Math.max(1, Math.ceil(p * (1 - Math.min(0.75, G.run.discount))));
  }

  function pickN(pool, n, type) {
    const copy = pool.slice();
    Engine.shuffle(copy);
    return copy.slice(0, n).map(d => {
      const item = { type, id: d.id, cost: d.cost };
      /* roll the real card now, so what the shop shows is what you buy */
      if (d.kind === 'add' || d.kind === 'oddity') item.spec = d.build();
      return item;
    });
  }

  /* Special cards: each slot has a good chance of being an Oddity rather than a
     marked-up ordinary card, because the Oddities are the interesting half. */
  function pickCards(n) {
    const oddityDef = NEW_CARDS.find(c => c.kind === 'oddity');
    const normals = NEW_CARDS.filter(c => c.kind !== 'oddity');
    Engine.shuffle(normals);
    const out = [];
    let ni = 0;
    for (let i = 0; i < n; i++) {
      if (oddityDef && Math.random() < 0.5) {
        out.push({ type: 'card', id: oddityDef.id, cost: oddityDef.cost, spec: oddityDef.build() });
      } else {
        const d = normals[ni++ % normals.length];
        const item = { type: 'card', id: d.id, cost: d.cost };
        if (d.kind === 'add') item.spec = d.build();
        out.push(item);
      }
    }
    return out;
  }

  function rollShopItems() {
    const owned = new Set(G.run.mantel.map(c => c.id));
    const used = new Set();
    const curios = [];
    for (let i = 0; i < 2; i++) {
      const c = weightedCurio(new Set([...owned, ...used]));
      if (!c) break;
      used.add(c.id);
      curios.push({ type: 'curio', id: c.id, cost: c.cost, finish: rollFinish() });
    }
    const avail = HOUSE_RULES.filter(h => (G.run.houseRules[h.id] || 0) < h.max);
    /* three plain duplicates: any real card in your deck, offered cheap */
    const plain = [];
    const seen = new Set();
    for (let i = 0; i < 3; i++) {
      const pool = G.run.deck.filter(c => !c.oddity && !seen.has(c.rank + c.suit));
      if (!pool.length) break;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      seen.add(pick.rank + pick.suit);
      plain.push({ type: 'plain', id: 'plain_' + pick.rank + pick.suit,
                   rank: pick.rank, suit: pick.suit,
                   cost: 3 + Math.ceil(rankChips(pick.rank) / 3) });
    }
    return {
      curios,
      mods: pickN(CARD_MODS, 2, 'mod'),
      cards: pickCards(2),
      plain,
      houses: pickN(avail, 2, 'house')
    };
  }

  function openShop(anteCleared) {
    const r = rollShopItems();
    G.run.shop = { curios: r.curios, mods: r.mods, cards: r.cards, plain: r.plain,
                   houses: r.houses, rerolls: 0, pulls: 0 };
    G.run.anteCleared = !!anteCleared;
    G.phase = 'shop';
    save();
  }

  function rerollCost() {
    return Math.max(1, Math.ceil((TUNE.rerollBase + TUNE.rerollStep * G.run.shop.rerolls) * (1 - Math.min(0.75, G.run.discount))));
  }

  function reroll() {
    const cost = rerollCost();
    if (G.run.money < cost) return false;
    G.run.money -= cost;
    const r = rollShopItems();
    const shop = G.run.shop;
    /* keep anything already bought marked as sold so the shelf reads honestly */
    ['curios', 'mods', 'cards', 'plain', 'houses'].forEach(k => { shop[k] = r[k]; });
    shop.rerolls++;
    save();
    return true;
  }

  function effectiveSlots() {
    return G.run.mantelSlots + G.run.mantel.filter(c => c.finish === 'neg').length;
  }

  function buy(shelf, index) {
    const list = G.run.shop[SHELVES[shelf]];
    const item = list && list[index];
    if (!item || item.bought) return { ok: false, reason: 'Already gone.' };
    const price = priceOf(item);
    if (G.run.money < price) return { ok: false, reason: 'Not enough cash for that.' };

    if (item.type === 'curio') {
      const slots = effectiveSlots() + (item.finish === 'neg' ? 1 : 0);
      if (G.run.mantel.length >= slots) return { ok: false, reason: 'Every mantel seat is taken. Sell a Curio first.' };
      const def = CURIO_BY_ID[item.id];
      G.run.money -= price;
      G.run.mantel.push({ id: item.id, finish: item.finish || 'none', counter: def.counter != null ? def.counter : 0, paid: price });
      item.bought = true;
      save();
      return { ok: true, kind: 'curio' };
    }

    if (item.type === 'plain') {
      G.run.money -= price;
      G.run.deck.push(Engine.newCard(item.rank, item.suit));
      item.bought = true;
      save();
      return { ok: true, kind: 'plain', card: { rank: item.rank, suit: item.suit } };
    }

    if (item.type === 'house') {
      G.run.money -= price;
      HOUSE_BY_ID[item.id].apply(G.run);
      G.run.houseRules[item.id] = (G.run.houseRules[item.id] || 0) + 1;
      item.bought = true;
      save();
      return { ok: true, kind: 'house' };
    }

    const def = SHOP_BY_ID[item.id];
    if (def.kind === 'add' || def.kind === 'oddity') {
      G.run.money -= price;
      const spec = item.spec || def.build();
      if (spec.oddity) {
        const card = Engine.newCard(0, 'S', { oddity: spec.oddity });
        G.run.deck.push(card);
        item.bought = true;
        save();
        return { ok: true, kind: 'card', card };
      }
      const card = Engine.newCard(spec.rank, spec.suit, {
        enhancement: spec.enhancement || 'none', finish: spec.finish || 'none', seal: spec.seal || 'none'
      });
      G.run.deck.push(card);
      item.bought = true;
      save();
      return { ok: true, kind: 'card', card };
    }

    /* everything left needs the player to point at a card in their deck */
    G.pending = { shelf, index, def };
    return { ok: true, kind: 'select', def, price };
  }

  function applyPending(cardId) {
    if (!G.pending) return false;
    const { shelf, index, def } = G.pending;
    const item = G.run.shop[SHELVES[shelf]][index];
    if (!item || item.bought) { G.pending = null; return false; }
    const price = priceOf(item);
    if (G.run.money < price) { G.pending = null; return false; }
    const idx = G.run.deck.findIndex(c => c.id === cardId);
    if (idx < 0) return false;
    const card = G.run.deck[idx];

    if (def.kind === 'enhance') card.enhancement = def.value;
    else if (def.kind === 'finish') card.finish = def.value;
    else if (def.kind === 'seal') card.seal = def.value;
    else if (def.kind === 'remove') {
      G.run.deck.splice(idx, 1);
      /* if that card was being held back, it goes with it */
      if (G.run.stash) G.run.stash = G.run.stash.filter(c => c.id !== cardId);
    }
    else if (def.kind === 'duplicate') {
      G.run.deck.push(Engine.newCard(card.rank, card.suit, {
        enhancement: card.enhancement, finish: card.finish, seal: card.seal
      }));
    }
    G.run.money -= price;
    item.bought = true;
    G.pending = null;
    save();
    return true;
  }

  function cancelPending() { G.pending = null; }

  function sellCurio(index) {
    const inst = G.run.mantel[index];
    if (!inst) return false;
    const def = CURIO_BY_ID[inst.id];
    const value = def.sellsFull ? (inst.paid || def.cost) : Math.max(1, Math.floor((inst.paid || def.cost) / 2));
    G.run.money += value;
    G.run.mantel.splice(index, 1);
    save();
    return value;
  }

  function reorderCurio(from, to) {
    if (from === to || from < 0 || to < 0) return;
    const arr = G.run.mantel;
    if (from >= arr.length || to >= arr.length) return;
    const [x] = arr.splice(from, 1);
    arr.splice(to, 0, x);
    save();
  }

  /* ---------------- the counter: permanent, escalating ---------------- */
  function buyCounter(id) {
    const def = COUNTER_BY_ID[id];
    if (!def) return { ok: false, reason: 'No such upgrade.' };
    if (def.soldOut && def.soldOut(G.run)) return { ok: false, reason: 'Maxed out already.' };
    const price = counterPrice(G.run, id);
    if (G.run.money < price) return { ok: false, reason: 'Not enough cash for that.' };
    G.run.money -= price;
    def.apply(G.run);
    G.run.counterBought[id] = (G.run.counterBought[id] || 0) + 1;
    save();
    return { ok: true, price, next: counterPrice(G.run, id) };
  }

  /* ---------------- the one-armed bandit ---------------- */
  function banditPrice() {
    const m = Engine.mods(G.run);
    const pulls = G.run.shop ? (G.run.shop.pulls || 0) : 0;
    const raw = TUNE.banditBase + TUNE.banditStep * pulls - (m.banditLuck ? 3 : 0);
    return Math.max(1, Math.ceil(raw * (1 - Math.min(0.75, G.run.discount))));
  }

  function spinReel(lucky) {
    /* weighted pick; the Magnet curio tilts the reels toward the good stuff */
    const pool = REEL_SYMBOLS.map(s => ({ s: s.s, w: lucky && s.s !== '☠' ? s.w * 2 : s.w }));
    let total = 0;
    pool.forEach(p => { total += p.w; });
    let r = Math.random() * total;
    for (const p of pool) { r -= p.w; if (r <= 0) return p.s; }
    return pool[0].s;
  }

  function pullLever() {
    const price = banditPrice();
    if (G.run.money < price) return { ok: false, reason: 'Not enough cash to pull.' };
    const m = Engine.mods(G.run);
    G.run.money -= price;
    G.run.shop.pulls = (G.run.shop.pulls || 0) + 1;
    G.run.banditPulls = (G.run.banditPulls || 0) + 1;

    const reels = [spinReel(m.banditLuck), spinReel(m.banditLuck), spinReel(m.banditLuck)];
    const result = resolveSpin(reels);
    save();
    return { ok: true, reels, result, price };
  }

  function resolveSpin(reels) {
    const [a, b2, c] = reels;
    const three = a === b2 && b2 === c;
    const two = !three && (a === b2 || b2 === c || a === c);

    if (three) {
      const prize = BANDIT_PRIZES[a];
      const out = { kind: 'jackpot', symbol: a, name: prize.name, text: prize.text, lines: [] };
      if (a === '7') {
        const owned = new Set(G.run.mantel.map(x => x.id));
        const pool = CURIOS.filter(x => !owned.has(x.id));
        if (G.run.mantel.length < effectiveSlots() && pool.length) {
          const pick = pool[Math.floor(Math.random() * pool.length)];
          G.run.mantel.push({ id: pick.id, finish: 'none', counter: pick.counter != null ? pick.counter : 0, paid: pick.cost });
          out.lines.push('A free ' + pick.name + ' appears on your mantel.');
        } else {
          G.run.money += 30;
          out.lines.push('No room on the mantel — the machine pays $30 instead.');
        }
      } else if (a === '★') {
        const pool = G.run.deck.filter(x => x.finish !== 'poly' || x.enhancement !== 'gilded');
        if (pool.length) {
          const card = pool[Math.floor(Math.random() * pool.length)];
          card.finish = 'poly'; card.enhancement = 'gilded';
          out.lines.push('Your ' + RANK_NAMES[card.rank] + SUITS[card.suit].sym + ' is now Gilded and Polychrome.');
        }
      } else if (a === '$') {
        G.run.money += 35;
        out.lines.push('+$35.');
      } else if (a === '♠') {
        G.run.permaMult += 3;
        out.lines.push('+3 Mult on every score, permanently (now +' + G.run.permaMult + ').');
      } else if (a === '♥') {
        G.run.mantelSlots = Math.min(TUNE.maxMantelSlots, G.run.mantelSlots + 1);
        G.run.bonusPasses++;
        out.lines.push('+1 Mantel seat and +1 stock pass, permanently.');
      } else if (a === '☠') {
        const lost = Math.floor(G.run.money / 2);
        G.run.money -= lost;
        out.lines.push('The house takes $' + lost + '.');
      }
      return out;
    }

    if (two) {
      G.run.money += 6;
      return { kind: 'pair', name: 'TWO OF A KIND', text: 'Small mercies.', lines: ['+$6.'] };
    }
    G.run.money += 1;
    return { kind: 'none', name: 'NOTHING', text: 'The reels do not care about you.', lines: ['+$1 consolation.'] };
  }

  function leaveShop() {
    G.run.shop = null;
    startRound();
  }

  /* what CASH OUT would pay right now -- drives the live button label */
  function payoutPreview() {
    if (!G.board || !G.round) return { lines: [], total: 0 };
    return Score.payout(G);
  }

  /* ---------------- persistence ---------------- */
  function save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        run: G.run, board: G.board, round: G.round, phase: G.phase, payout: G.payout
      }));
    } catch (e) { /* private mode, whatever */ }
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const s = JSON.parse(raw);
      if (!s || !s.run) return false;
      G.run = s.run; G.board = s.board; G.round = s.round;
      G.phase = s.phase === 'menu' ? 'play' : s.phase;
      G.payout = s.payout || null;
      // keep new fields alive across versions
      const fresh = Engine.newRun();
      for (const k in fresh) if (G.run[k] === undefined) G.run[k] = fresh[k];
      return true;
    } catch (e) { return false; }
  }

  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  return {
    G, startRun, startRound, quota, anteTotal, drawStock, tryMove, autoCollect, hint,
    undo, endRound, advance, openShop, reroll, rerollCost, buy, applyPending, cancelPending,
    sellCurio, reorderCurio, leaveShop, priceOf, effectiveSlots, save, load, clearSave, snapshot,
    bankAnte, earlyFinishBonus, clearAnte, payoutPreview, SHELVES, buyCounter, banditPrice, pullLever,
    reshuffle, reshuffleCost, anteTotalAvailable, heatMult,
    canStash, stash, stashPlay, stashCapacity,
    autoPlan, autoPlay, boardKey,
    cashPot, spinRoulette, spinRouletteCash,
    raiseBounty, bountyCard, bountyReward, postBounty,
    bumpMomentum, decayMomentum
  };
})();

/* ===== js/audio.js ===== */
/* ============================================================
   PILE-DRIVER  ::  audio.js   tiny web-audio noise box
   ============================================================ */
const Sfx = (() => {
  let ctx = null, on = true, master = null;

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.22;
    master.connect(ctx.destination);
  }

  function beep(freq, dur, type, vol, slide) {
    if (!on) return;
    init();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), ctx.currentTime + dur);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, ctx.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ctx.currentTime + dur + 0.02);
  }

  function noise(dur, vol) {
    if (!on) return;
    init();
    if (!ctx) return;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ctx.createBufferSource();
    s.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = vol || 0.2;
    const f = ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 1200;
    s.connect(f); f.connect(g); g.connect(master);
    s.start();
  }

  /* ---------------- background music ----------------
     A driving little casino-lounge loop, all synthesised so the file stays
     self-contained. It reacts to the game: as your TEMPO and HEAT climb the
     tempo nudges up, a hat layer and an arp come in, and the filter opens.   */
  let musicOn = false, musicTimer = null, step = 0, musicGain = null, musicFilter = null;
  let intensity = 0, targetIntensity = 0;

  const ROOT = 55;                                    // A1
  /* i - VI - III - VII : the four chords every card game runs on */
  const PROG = [
    { deg: 0,  quality: [0, 3, 7, 10] },
    { deg: 8,  quality: [0, 4, 7, 11] },
    { deg: 3,  quality: [0, 4, 7, 11] },
    { deg: 10, quality: [0, 4, 7, 10] }
  ];
  const PENT = [0, 3, 5, 7, 10, 12, 15];
  const semi = n => Math.pow(2, n / 12);

  function mtone(freq, dur, type, vol, when, slide) {
    if (!ctx || !musicGain) return;
    const t = when || ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicFilter);
    o.start(t); o.stop(t + dur + 0.03);
  }

  function kick(when) {
    if (!ctx || !musicGain) return;
    const t = when || ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + 0.2);
  }

  function noiseHit(when, dur, hp, vol) {
    if (!ctx || !musicGain) return;
    const t = when || ctx.currentTime;
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(musicGain);
    src.start(t);
  }

  /* one sixteenth */
  function tick() {
    if (!musicOn || !ctx) return;
    intensity += (targetIntensity - intensity) * 0.08;

    const bar = Math.floor(step / 16) % PROG.length;
    const chord = PROG[bar];
    const s16 = step % 16;
    const t = ctx.currentTime + 0.03;
    const rootHz = ROOT * semi(chord.deg);

    if (musicFilter) musicFilter.frequency.setTargetAtTime(700 + intensity * 4200, ctx.currentTime, 0.25);

    /* backbeat */
    if (s16 === 0 || s16 === 6 || s16 === 10) kick(t);
    if (s16 === 4 || s16 === 12) noiseHit(t, 0.13, 1400, 0.16 + intensity * 0.07);   // snare
    if (s16 % 2 === 0) noiseHit(t, 0.03, 7000, s16 % 4 === 0 ? 0.035 : 0.02);        // hats
    if (intensity > 0.35 && s16 % 2 === 1) noiseHit(t, 0.02, 9000, 0.016);           // driving 16ths

    /* bass: root, fifth, octave walk */
    if (s16 % 4 === 0) mtone(rootHz, 0.2, 'triangle', 0.2, t);
    else if (s16 === 6) mtone(rootHz * semi(7), 0.13, 'triangle', 0.13, t);
    else if (s16 === 14) mtone(rootHz * semi(10), 0.13, 'triangle', 0.12, t);

    /* offbeat chord stabs */
    if (s16 === 2 || s16 === 8 || s16 === 14) {
      chord.quality.forEach(iv => mtone(rootHz * 4 * semi(iv), 0.14, 'sawtooth', 0.028 + intensity * 0.02, t));
    }

    /* the arp only shows up when things are going well */
    if (intensity > 0.5 && s16 % 2 === 0) {
      const n = PENT[(step * 3 + bar) % PENT.length];
      mtone(rootHz * 8 * semi(n + chord.quality[1]), 0.1, 'square', 0.03 + intensity * 0.025, t);
    }
    if (intensity > 0.8 && s16 === 15) {
      mtone(rootHz * 8 * semi(12), 0.18, 'square', 0.05, t, rootHz * 16);
    }

    step++;
    /* 124bpm sixteenths, up to ~15% faster when the table is hot */
    const ms = 121 - intensity * 18;
    clearTimeout(musicTimer);
    musicTimer = setTimeout(tick, ms);
  }

  const api = {
    toggle(v) { on = v == null ? !on : v; return on; },
    music(v) {
      init();
      if (!ctx) return false;
      const want = v == null ? !musicOn : v;
      if (want && !musicOn) {
        if (ctx.state === 'suspended') ctx.resume();
        if (!musicGain) {
          musicGain = ctx.createGain();
          musicGain.gain.value = 0.42;
          musicFilter = ctx.createBiquadFilter();
          musicFilter.type = 'lowpass';
          musicFilter.frequency.value = 900;
          musicFilter.Q.value = 0.7;
          musicFilter.connect(musicGain);
          musicGain.connect(master);
        }
        musicOn = true;
        musicGain.gain.setTargetAtTime(0.42, ctx.currentTime, 0.3);
        clearTimeout(musicTimer);
        tick();
      } else if (!want && musicOn) {
        musicOn = false;
        clearTimeout(musicTimer);
        musicTimer = null;
        if (musicGain) musicGain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.1);
      }
      return musicOn;
    },
    musicOn: () => musicOn,
    /* the game tells the music how excited to be (0..1) */
    setIntensity(v) { targetIntensity = Math.max(0, Math.min(1, v || 0)); },
    /* a sampled one-liner. Returns the element so callers can time off it. */
    voice(key) {
      if (!on) return null;
      const src = (typeof VOICE !== 'undefined') && VOICE[key];
      if (!src) return null;
      try {
        const a = new Audio(src);
        a.volume = 0.85;
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
        return a;
      } catch (e) { return null; }
    },
    stinger() {
      if (!ctx || !musicGain) return;
      const t = ctx.currentTime;
      [0, 4, 7, 12].forEach((iv, i) => mtone(220 * semi(iv), 0.3, 'square', 0.07, t + i * 0.05));
    },
    isOn: () => on,
    click: () => beep(420, 0.05, 'square', 0.15),
    flip:  () => { noise(0.06, 0.12); beep(700, 0.05, 'triangle', 0.12); },
    place: () => beep(520, 0.07, 'triangle', 0.2, 780),
    deal:  () => noise(0.05, 0.08),
    error: () => beep(150, 0.14, 'sawtooth', 0.18, 90),
    money: () => { beep(880, 0.06, 'square', 0.16); setTimeout(() => beep(1320, 0.09, 'square', 0.14), 60); },
    chip: (i) => beep(340 + Math.min(24, i) * 42, 0.05, 'square', 0.13),
    mult: (i) => beep(520 + Math.min(24, i) * 55, 0.06, 'sawtooth', 0.11),
    score: (mag) => {
      const base = 300 + Math.min(900, mag * 6);
      beep(base, 0.12, 'square', 0.22, base * 2);
      setTimeout(() => beep(base * 1.5, 0.16, 'triangle', 0.18, base * 3), 90);
    },
    big: () => {
      [0, 90, 180, 300].forEach((t, i) => setTimeout(() => beep(440 * Math.pow(1.26, i), 0.2, 'square', 0.2), t));
    },
    shatter: () => { noise(0.3, 0.3); beep(1800, 0.2, 'sawtooth', 0.12, 200); },
    win: () => [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'triangle', 0.22), i * 110)),
    lose: () => [400, 330, 260, 180].forEach((f, i) => setTimeout(() => beep(f, 0.35, 'sawtooth', 0.2), i * 150))
  };
  return api;
})();

/* ===== js/ui.js ===== */
/* ============================================================
   PILE-DRIVER  ::  ui.js
   Board rendering, pointer drag & drop, and the score fireworks.
   ============================================================ */

const UI = (() => {
  const G = Game.G;
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  let displayScore = 0;
  let fxBusy = false;
  let rush = false;          // player acted mid-animation: burn through what's left
  let selection = null;      // {zone, col, index, suit}
  let hintCells = [];

  /* ============ CARD ELEMENT ============ */
  function cardEl(card, opts) {
    opts = opts || {};
    const suit = SUITS[card.suit];
    const xray = Engine.mods(G.run).xray;
    const marked = G.run.markedDeck;
    const n = el('div', 'card');
    n.dataset.id = card.id;
    if (!card.faceUp) {
      n.classList.add('down');
      if (xray || opts.marked || (marked && opts.topDown)) n.classList.add('peek');
      if (!(xray || opts.marked || (marked && opts.topDown))) {
        n.innerHTML = '<div class="back"><span>✦</span></div>';
        return n;
      }
    }
    n.classList.add(Engine.isRed(card) && !Engine.isBlack(card) ? 'red' : (suit.color === 'red' ? 'red' : 'black'));
    if (card.enhancement && card.enhancement !== 'none') n.classList.add(ENHANCEMENTS[card.enhancement].cls);
    if (card.finish && card.finish !== 'none') n.classList.add(FINISHES[card.finish].cls);
    if (card.seal && card.seal !== 'none') n.classList.add(SEALS[card.seal].cls);

    if (card.oddity) {
      const od = ODDITIES[card.oddity] || { name: '???', icon: 'unknown', tint: '' };
      n.classList.remove('red', 'black');
      n.classList.add('oddity', od.tint);
      /* the name sits in the top strip so a stacked Oddity is still identifiable
         when only its first 30px is showing */
      n.innerHTML =
        '<div class="face odd-face">' +
          '<div class="odd-head">' + icon(od.icon, 'odd-mini') + '<span>' + od.name + '</span></div>' +
          '<div class="odd-art">' + icon(od.icon) + '</div>' +
          '<div class="odd-foot">ODDITY</div>' +
          (card.oddCount ? '<div class="odd-count">x' + card.oddCount + '</div>' : '') +
          (card.seal && card.seal !== 'none' ? '<div class="seal-dot"></div>' : '') +
          '<div class="shine"></div>' +
        '</div>';
      return n;
    }

    const r = RANK_NAMES[card.rank];
    const s = card.enhancement === 'wild' ? '✿' : suit.sym;
    n.innerHTML =
      '<div class="face">' +
        '<div class="corner tl"><span class="rk">' + r + '</span><span class="st">' + s + '</span></div>' +
        '<div class="mid">' + s + '</div>' +
        '<div class="corner br"><span class="rk">' + r + '</span><span class="st">' + s + '</span></div>' +
        (card.enhancement && card.enhancement !== 'none' && ENHANCEMENTS[card.enhancement].glyph
          ? '<div class="enh-badge">' + ENHANCEMENTS[card.enhancement].glyph + '</div>' : '') +
        (card.seal && card.seal !== 'none' ? '<div class="seal-dot"></div>' : '') +
        '<div class="shine"></div>' +
      '</div>';
    return n;
  }

  /* ============ FULL RENDER ============ */
  function render() {
    if (!G.run) return;
    hideTip();
    clearHints();
    if (drag) cancelDrag(true);
    else sweepGhosts();
    renderHud();
    renderMantel();
    renderBoard();
    renderControls();
    renderBounty();
    renderMomentum(true);
  }

  /* ---------------- THE BOUNTY ----------------
     One card is always posted WANTED. Send that exact card home from anywhere and
     it pays on the spot. RAISE doubles the purse but starts a clock — miss it and
     the escape comes straight off your ante bar.                                */
  function renderBounty() {
    const box = $('#bounty');
    if (!box) return;
    const bn = G.round && G.round.bounty;
    if (!bn) { box.className = 'bounty'; box.innerHTML = '<div class="bnt-empty">NO BOUNTY<br>POSTED</div>'; return; }
    const red = bn.suit === 'H' || bn.suit === 'D';
    const hot = bn.deadline != null;
    box.className = 'bounty' + (hot ? ' hot' : '');
    box.innerHTML =
      '<div class="bnt-title">WANTED</div>' +
      '<div class="bnt-face' + (red ? ' red' : '') + '">' +
        '<span class="r">' + RANK_NAMES[bn.rank] + '</span>' +
        '<span class="s">' + SUITS[bn.suit].sym + '</span>' +
      '</div>' +
      '<div class="bnt-reward">' + fmt(bn.reward) + ' pts</div>' +
      (hot ? '<div class="bnt-clock">' + bn.deadline + ' MOVES</div>' : '');
    const canRaise = bn.raises < TUNE.bountyMaxRaises;
    const btn = el('button', 'bnt-raise', canRaise ? 'RAISE x2' : 'MAXED');
    btn.disabled = !canRaise;
    btn.onclick = () => {
      const res = Game.raiseBounty();
      if (!res.ok) { Sfx.error(); toast(res.reason); return; }
      Sfx.mult();
      flashScreen(0.14, '#f0c674');
      screenShake(5);
      render();
      drainFx();
    };
    box.appendChild(btn);
    box.addEventListener('pointerenter', e => showTip(e.currentTarget, bountyTip(bn)));
    box.addEventListener('pointerleave', hideTip);
  }

  function bountyTip(bn) {
    const stake = bn.staked || Math.round(bountyStakePreview(bn) );
    return '<div class="tip-title">THE BOUNTY</div>' +
      '<div class="tip-text">The table keeps one card posted at all times. Send <b>' +
      RANK_NAMES[bn.rank] + SUITS[bn.suit].sym + '</b> home — off the tableau, out of the waste, ' +
      'or straight from the Stash — and it pays <b>' + fmt(bn.reward) + ' Chips</b> plus <b>$' +
      TUNE.bountyCash + '</b>, then a new face goes up immediately.</div>' +
      '<div class="tip-text">Each bounty you collect this round makes the next one <b>' +
      Math.round(TUNE.bountyGrowth * 100) + '% richer</b>.</div>' +
      '<div class="tip-text"><b>RAISE</b> doubles the purse but gives you only <b>' +
      TUNE.bountyDeadline + ' moves</b> to bring it in. Let it escape and you lose <b>' +
      fmt(stake) + ' points</b> off your ante bar and your cascade breaks.' +
      (bn.deadline != null ? ' <b style="color:var(--hot)">The clock is running: ' + bn.deadline + ' moves.</b>' : '') +
      '</div>';
  }

  function bountyStakePreview(bn) {
    return (bn.raises ? bn.reward : bn.reward * 2) * TUNE.bountyStake;
  }

  function renderHud() {
    const run = G.run;
    if (!fxBusy && G.round && Math.round(displayScore) !== G.round.score) displayScore = G.round.score;
    const q = Engine.quotaFor(run);
    const total = Game.anteTotal();
    const pct = Math.max(0, Math.min(100, total / q * 100));
    $('#ante-num').textContent = run.ante;
    $('#round-num').textContent = run.round + '/' + TUNE.roundsPerAnte;
    $('#quota-fill').style.width = pct + '%';
    $('#quota-text').textContent = fmt(total) + ' / ' + fmt(q);
    $('#quota-bar').classList.toggle('met', total >= q);
    $('#money').textContent = '$' + run.money;
    const wb = $('#whim-badge');
    if (wb) {
      const w = run.whim && WHIM_BY_ID[run.whim];
      wb.style.display = w ? '' : 'none';
      if (w) {
        wb.className = 'badge whim mood-' + w.mood;
        wb.innerHTML = icon(w.icon, 'whim-ico') + '<span>' + w.name + '</span>';
        wb.onpointerenter = e => showTip(e.currentTarget,
          '<div class="tip-title">' + icon(w.icon, 'tip-ico') + ' ' + w.name + '</div>' +
          '<div class="tip-kind whim-kind">THE DEALER\'S WHIM — this round only</div>' +
          '<div class="tip-text">' + w.text + '</div>');
        wb.onpointerleave = hideTip;
      }
    }
    $('#round-score').textContent = fmt(Math.round(displayScore));
  }

  function renderMantel(target) {
    const m = target || $('#mantel');
    if (!m) return;
    m.innerHTML = '';
    const slots = Game.effectiveSlots();
    const shown = Math.max(slots, G.run.mantel.length);
    for (let i = 0; i < shown; i++) {
      const inst = G.run.mantel[i];
      if (!inst) {
        const empty = el('div', 'mslot curio empty', '<span class="slot-mark">◇</span>');
        empty.dataset.idx = i;
        m.appendChild(empty);
        continue;
      }
      const def = CURIO_BY_ID[inst.id];
      const c = el('div', 'mslot curio r-' + def.rarity + (inst.finish && inst.finish !== 'none' ? ' ' + FINISHES[inst.finish].cls : ''));
      c.dataset.idx = i;
      c.draggable = false;
      c.innerHTML =
        '<div class="c-art">' + icon(def.icon) + '</div>' +
        '<div class="c-name">' + def.name + '</div>' +
        (inst.counter != null && def.counterLabel
          ? '<div class="c-counter">' + (def.counterLabel === 'X' ? 'X' + inst.counter : '+' + inst.counter) + '</div>' : '');
      c.addEventListener('pointerenter', e => showTip(e.currentTarget, curioTip(inst, def, i)));
      c.addEventListener('pointerleave', hideTip);
      if (G.phase === 'shop') {
        const value = def.sellsFull ? (inst.paid || def.cost) : Math.max(1, Math.floor((inst.paid || def.cost) / 2));
        c.classList.add('sellable');
        c.appendChild(el('div', 'sell-band', 'SELL $' + value));
        c.addEventListener('click', () => {
          const v = Game.sellCurio(i);
          if (v) {
            Sfx.money();
            floatText(c, '+$' + v, 'fx-money big');
            burst(c, 12, '#ffd166');
            toast('Sold ' + def.name + ' for <b>$' + v + '</b>');
            Overlays.refreshShop();
          }
        });
      }
      makeCurioDraggable(c, i);
      m.appendChild(c);
    }
    const label = el('div', 'mantel-label', 'THE MANTEL <b>' + G.run.mantel.length + '/' + slots + '</b>');
    m.appendChild(label);
  }

  function curioTip(inst, def, i) {
    let s = '<div class="tip-title r-' + def.rarity + '">' + icon(def.icon, 'tip-ico') + ' ' + def.name + '</div>';
    s += '<div class="tip-kind curio-kind">CURIO — takes a mantel seat</div>';
    if (inst.finish && inst.finish !== 'none') s += '<div class="tip-fin">' + FINISHES[inst.finish].name + ' — ' + FINISHES[inst.finish].text + '</div>';
    s += '<div class="tip-text">' + def.text + '</div>';
    s += '<div class="tip-foot">' + def.rarity.toUpperCase() +
         (G.phase === 'shop' ? ' • click to sell for $' + (def.sellsFull ? (inst.paid || def.cost) : Math.max(1, Math.floor((inst.paid || def.cost) / 2))) : '') +
         '</div>';
    return s;
  }

  function renderControls() {
    $('#btn-undo').innerHTML = 'UNDO <b>' + (G.board ? G.board.undos : 0) + '</b>';
    $('#btn-undo').disabled = !G.board || G.board.undos <= 0 || !Game.G.undoStack.length;
    const passes = Engine.mods(G.run).infinitePasses ? '∞' : (G.board ? G.board.passesLeft : 0);
    $('#passes').innerHTML = 'PASSES <b>' + passes + '</b>';
    renderReshuffle();
    renderCut();
    $('#deck-count').textContent = G.run.deck.length;
    $('#btn-cash').classList.toggle('urgent', !!(G.round && G.round.stuck));
    const pv = $('#cash-preview');
    if (pv && G.phase === 'play') {
      const p = Game.payoutPreview();
      pv.textContent = '$' + p.total;
      $('#btn-cash').dataset.breakdown = p.lines.map(l => l.label + '  +$' + l.amount).join('\n');
    }
  }

  function renderReshuffle() {
    const bar = $('#reshuffle-bar');
    if (!bar || !G.board) return;
    const c = Game.reshuffleCost();
    bar.innerHTML = '<span class="rs-cap">RESHUFFLE</span>';
    const add = (how, label, enabled, title) => {
      const btn = el('button', 'rs-btn rs-' + how + (enabled ? '' : ' off'), label);
      if (title) btn.title = title;
      btn.onclick = () => {
        const res = Game.reshuffle(how);
        if (!res.ok) { Sfx.error(); toast(res.reason); return; }
        Sfx.deal();
        flashScreen(0.12, '#4cc9f0');
        clearSelection();
        render();
        drainFx();
      };
      bar.appendChild(btn);
    };
    if (c.free > 0) add('free', 'FREE x' + c.free, true, 'Granted by a Curio or the Counter');
    add('pass', '1 PASS', c.passes > 0, 'Spends one of your passes through the stock');
    add('points', fmt(c.points) + ' pts', Game.anteTotalAvailable() >= c.points,
        'Taken straight off your ANTE total — this round first, then banked rounds');
  }

  /* THE SIDE POT -- the corner gamble. Every score feeds it; you decide
     whether to bank it or flip a freshly shuffled card to double it. */
  function renderCut() {
    const box = $('#sidepot');
    if (!box || !G.round) return;
    const pot = Math.round(G.round.pot || 0);
    const streak = G.round.potStreak || 0;
    const canFlip = pot >= TUNE.potMinFlip;
    const heat = G.round.heat || 0;

    box.className = 'sidepot' + (pot > 0 ? ' live' : '') + (canFlip ? ' ready' : '') + (streak >= 3 ? ' blazing' : '');
    box.innerHTML =
      '<div class="sp-cap">SIDE POT' + (streak ? '<span class="sp-streak">' + streak + ' straight</span>' : '') + '</div>' +
      '<div class="sp-amount">' + fmt(pot) + '</div>' +
      '<div class="sp-sub">' + (heat ? 'HEAT X' + Game.heatMult() + ' · ' : '') +
        (canFlip ? 'red/black pays ' + fmt(pot * TUNE.roulettePayEven) : 'needs ' + fmt(TUNE.potMinFlip)) + '</div>';

    const row = el('div', 'sp-btns');
    const cash = el('button', 'sp-btn sp-cash' + (pot > 0 ? '' : ' off'), 'CASH IT');
    cash.onclick = () => {
      const res = Game.cashPot();
      if (!res.ok) { Sfx.error(); toast(res.reason); return; }
      render(); drainFx();
    };
    const flip = el('button', 'sp-btn sp-flip' + (canFlip ? '' : ' off'), 'SPIN THE WHEEL');
    flip.onclick = () => {
      if (!canFlip) { Sfx.error(); toast('The pot needs at least ' + TUNE.potMinFlip + ' to take to the wheel.'); return; }
      Sfx.click();
      Overlays.roulette();
    };
    row.appendChild(cash);
    row.appendChild(flip);
    box.appendChild(row);
    box.addEventListener('pointerenter', e => showTip(e.currentTarget,
      '<div class="tip-title">The Side Pot</div>' +
      '<div class="tip-kind whim-kind">THE CORNER GAMBLE</div>' +
      '<div class="tip-text">Every score drops ' + Math.round((TUNE.potShare + Engine.mods(G.run).potShare) * 100) +
      '% of itself into the pot. <b>CASH IT</b> adds the pot straight to your score.</div>' +
      '<div class="tip-text"><b>DOUBLE OR NOTHING</b> flips a card from a freshly shuffled deck — there is no order ' +
      'to learn. Red doubles the pot and raises your HEAT (which multiplies every score). Black takes the pot ' +
      'and a pass with it.</div>'));
    box.addEventListener('pointerleave', hideTip);
  }

  function renderBoard() {
    const b = G.board;
    if (!b) return;

    /* stock */
    const stock = $('#stock');
    stock.innerHTML = '';
    if (b.stock.length) {
      const top = el('div', 'card down');
      top.innerHTML = '<div class="back"><span>✦</span></div>';
      stock.appendChild(top);
      stock.appendChild(el('div', 'pile-count', String(b.stock.length)));
    } else {
      stock.appendChild(el('div', 'pile-ghost', (b.passesLeft > 0 || Engine.mods(G.run).infinitePasses) ? '↻' : '∅'));
    }

    /* waste */
    const waste = $('#waste');
    waste.innerHTML = '';
    const mm = Engine.mods(G.run);
    const show = Math.min(b.waste.length, 3);
    const from = b.waste.length - show;
    const playable = Engine.playableWaste(b, mm).map(w => w.index);
    for (let k = 0; k < show; k++) {
      const absIdx = from + k;
      const c = b.waste[absIdx];
      const n = cardEl(c);
      n.style.left = Math.round(k * (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw')) * 0.42)) + 'px';
      n.style.zIndex = k;
      if (playable.includes(absIdx)) {
        n.dataset.zone = 'waste';
        n.classList.add('playable');
        attachDrag(n, { zone: 'waste', index: absIdx });
      } else n.classList.add('under');
      attachInspect(n, c);
      waste.appendChild(n);
    }
    if (b.waste.length > 3) waste.appendChild(el('div', 'pile-count', String(b.waste.length)));

    /* the stash: cards held back, playable whenever */
    const st = $('#stash');
    if (st) {
      st.innerHTML = '';
      const held = G.run.stash || [];
      const cap = Game.stashCapacity();
      const label = el('div', 'stash-label', 'STASH <b>' + held.length + '/' + cap + '</b>');
      st.appendChild(label);
      const row = el('div', 'stash-row');
      for (let i = 0; i < cap; i++) {
        const c = held[i];
        if (!c) { row.appendChild(el('div', 'stash-slot empty', '')); continue; }
        const slot = el('div', 'stash-slot');
        const n = cardEl(Object.assign({}, c, { faceUp: true }));
        n.classList.add('stashed');
        attachInspect(n, c);
        attachStashDrag(n, i);
        slot.appendChild(n);
        row.appendChild(slot);
      }
      st.appendChild(row);
      st.classList.toggle('full', held.length >= cap);
    }

    /* foundations */
    SUIT_KEYS.forEach(s => {
      const f = $('#f-' + s);
      f.innerHTML = '';
      const pile = b.foundations[s];
      if (!pile.length) {
        f.appendChild(el('div', 'pile-ghost suit-' + SUITS[s].color, SUITS[s].sym));
      } else {
        const showFrom = Math.max(0, pile.length - 2);
        pile.slice(showFrom).forEach((c, i) => {
          const n = cardEl(c);
          n.style.zIndex = i;
          if (i === pile.length - showFrom - 1) attachDrag(n, { zone: 'foundation', suit: s });
          if (c.id === landedId) n.classList.add('landed');
          attachInspect(n, c);
          f.appendChild(n);
        });
        f.appendChild(el('div', 'pile-count', String(pile.length)));
      }
      /* twins fan out BEHIND the pile so the real top card stays readable */
      const tw = (b.twins && b.twins[s]) || [];
      tw.slice(-3).forEach((c, i) => {
        const t = cardEl(c);
        t.classList.add('twin-card');
        t.style.setProperty('--tw', (i + 1));
        t.style.zIndex = -10 + i;
        attachInspect(t, c);
        f.insertBefore(t, f.firstChild);
      });
      if (tw.length) f.appendChild(el('div', 'twin-count', 'TWIN x' + tw.length));
    });

    /* tableau */
    const t = $('#tableau');
    t.innerHTML = '';
    t.style.setProperty('--cols', b.tableau.length);
    b.tableau.forEach((pile, col) => {
      const p = el('div', 'pile tab-pile');
      p.dataset.zone = 'tableau';
      p.dataset.col = col;
      if (!pile.length) p.appendChild(el('div', 'pile-ghost', 'K'));
      const avail = Math.max(260, t.clientHeight || 420) - 20;
      const need = pile.reduce((a, c) => a + (c.faceUp ? 30 : 15), 0);
      const squeeze = need > avail ? avail / need : 1;
      let y = 0, lastTop = 0;
      let lastDownIdx = -1;
      pile.forEach((c, i) => { if (!c.faceUp) lastDownIdx = i; });
      pile.forEach((c, i) => {
        const n = cardEl(c, { topDown: i === lastDownIdx });
        if (c.id === landedId) n.classList.add('landed');
        lastTop = y;
        n.style.top = Math.round(y) + 'px';
        n.style.zIndex = i;
        n.dataset.col = col;
        n.dataset.index = i;
        y += (c.faceUp ? 30 : 15) * squeeze;
        if (c.faceUp) { attachDrag(n, { zone: 'tableau', col, index: i }); attachInspect(n, c); }
        p.appendChild(n);
      });
      const runLen = Engine.runLength(b, col, Engine.mods(G.run));
      if (runLen === 1 && pile.length) {
        const only = pile[pile.length - 1];
        if (only.faceUp && (Engine.foundationTargetFor(b, only) || Engine.twinTargetFor(b, only))) {
          const badge = el('div', 'run-badge ready solo',
            '<span class="rb-go">SEND IT HOME</span>');
          const ch2 = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ch')) || 106;
          badge.style.top = Math.round(lastTop + ch2 + 5) + 'px';
          p.appendChild(badge);
        }
      }
      if (runLen > 1) {
        const mm = Engine.mods(G.run);
        const runCards = Engine.runCards(b, col, mm);
        const val = runCards.reduce((a, c) => a + rankChips(c.rank), 0);
        const bonusMult = (runLen - 1) * TUNE.stackMultPer * mm.stackMult;
        const cashCard = pile[pile.length - 1];
        const ready = !!(Engine.foundationTargetFor(b, cashCard) || Engine.twinTargetFor(b, cashCard));
        const badge = el('div', 'run-badge' + (ready ? ' ready' : ''),
          '<span class="rb-n">RUN ' + runLen + '</span>' +
          (ready ? '<span class="rb-go">CASH IN</span>' : ''));
        const ch = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ch')) || 106;
        badge.style.top = Math.round(lastTop + ch + 5) + 'px';
        const cardName = RANK_NAMES[cashCard.rank] + SUITS[cashCard.suit].sym;
        badge.addEventListener('pointerenter', e => showTip(e.currentTarget,
          '<div class="tip-title">Column Stack — run of ' + runLen + '</div>' +
          '<div class="tip-kind combo-kind">CASH-IN BONUS</div>' +
          '<div class="tip-rows">' +
            '<div class="tip-row"><span>Ranks in this run</span><i>+' + val + ' Chips</i></div>' +
            '<div class="tip-row"><span>' + (runLen - 1) + ' extra cards</span><i>+' + bonusMult + ' Mult</i></div>' +
          '</div>' +
          '<div class="tip-text">' + (ready
            ? '<b class="ok">Ready.</b> Send the ' + cardName + ' to a foundation to collect all of it on that one play.'
            : 'Collect it by sending the <b>' + cardName + '</b> home — it needs its foundation to be one rank below.') +
          '</div>' +
          '<div class="tip-foot">The run then shrinks by one and pays again on the next card.</div>'));
        badge.addEventListener('pointerleave', hideTip);
        p.appendChild(badge);
      }
      t.appendChild(p);
    });

    applySelectionClasses();
    renderCombo();
  }

  function fmt(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    return Math.round(n).toLocaleString('en-US');
  }

  /* ============ SELECTION + INPUT ============ */
  function sameSrc(a, b) {
    if (!a || !b) return false;
    return a.zone === b.zone && a.col === b.col && a.index === b.index && a.suit === b.suit;
  }

  function applySelectionClasses() {
    $$('.card.sel').forEach(n => n.classList.remove('sel'));
    if (!selection) return;
    const b = G.board;
    if (selection.zone === 'tableau') {
      const pile = $$('#tableau .tab-pile')[selection.col];
      if (!pile) return;
      Array.from(pile.children).forEach(n => {
        if (n.dataset.index != null && +n.dataset.index >= selection.index) n.classList.add('sel');
      });
    } else if (selection.zone === 'waste') {
      const n = $('#waste .card:last-of-type');
      if (n) n.classList.add('sel');
    } else if (selection.zone === 'foundation') {
      const n = document.querySelector('#f-' + selection.suit + ' .card:last-of-type');
      if (n) n.classList.add('sel');
    }
  }

  function clearSelection() { selection = null; applySelectionClasses(); }

  let landedId = null;
  function doMove(src, dst) {
    stopAuto();                       // a hand on the table always wins
    if (dst.zone === 'stash') {
      const ok2 = Game.stash(src);
      if (ok2) { Sfx.place(); toast(quip('wish'), 1500); clearSelection(); render(); drainFx(); checkStuck(); }
      else { Sfx.error(); shake($('#stash')); render(); G.fx.length = 0; }
      return ok2;
    }
    if (src.zone === 'stash') {
      const ok2 = Game.stashPlay(src.index, dst);
      if (ok2) { Sfx.place(); clearSelection(); render(); drainFx(); checkStuck(); }
      else { Sfx.error(); shake($('#stash')); render(); G.fx.length = 0; }
      return ok2;
    }
    const moving = src.zone === 'tableau' ? (G.board.tableau[src.col] || [])[src.index]
                 : src.zone === 'waste' ? G.board.waste[src.index != null ? src.index : G.board.waste.length - 1]
                 : null;
    const ok = Game.tryMove(src, dst);
    if (ok) {
      landedId = moving ? moving.id : null;
      Sfx.place();
      clearSelection();
      render();
      drainFx();
      checkStuck();
    } else {
      Sfx.error();
      shake($('#table'));
      render();
      G.fx.length = 0;
    }
    return ok;
  }

  function autoTarget(src) {
    const cards = src.zone === 'tableau'
      ? G.board.tableau[src.col].slice(src.index)
      : (src.zone === 'waste' ? G.board.waste.slice(-1) : G.board.foundations[src.suit].slice(-1));
    if (!cards.length) return null;
    if (cards.length === 1 && Engine.foundationTargetFor(G.board, cards[0])) return { zone: 'foundation' };
    const m = Engine.mods(G.run);
    for (let d = 0; d < G.board.tableau.length; d++) {
      if (src.zone === 'tableau' && d === src.col) continue;
      if (!G.board.tableau[d].length && src.zone === 'tableau' && src.index === 0) continue;
      if (Engine.canPlaceOnColumn(G.board, d, cards[0], m)) return { zone: 'tableau', col: d };
    }
    return null;
  }

  /* --- pointer drag ---
     Move/up/cancel live on the window, not on the card. render() destroys and
     rebuilds every card element, so a listener bound to the node dies with it
     and the drag ghost gets stranded on screen forever. */
  let drag = null;

  function cancelDrag(silent) {
    if (drag && drag.ghost) drag.ghost.remove();
    drag = null;
    document.body.classList.remove('dragging-now');
    clearDropHighlights();
    $$('.card.pressed').forEach(n => n.classList.remove('pressed'));
    $$('.card.lifted').forEach(n => n.classList.remove('lifted'));
    sweepGhosts();
    if (!silent) render();
  }

  /* belt and braces: nothing should ever be left in the drag layer */
  function sweepGhosts() {
    const layer = $('#draglayer');
    if (!layer) return;
    Array.from(layer.children).forEach(n => { if (!drag || n !== drag.ghost) n.remove(); });
  }

  /* hover a face-up card for a beat to read exactly what it does */
  let inspectTimer = null;
  function attachInspect(node, card) {
    node.addEventListener('pointerenter', () => {
      clearTimeout(inspectTimer);
      inspectTimer = setTimeout(() => {
        if (drag) return;
        showTip(node, Overlays.cardTip(card));
      }, 340);
    });
    node.addEventListener('pointerleave', () => { clearTimeout(inspectTimer); hideTip(); });
    node.addEventListener('pointerdown', () => { clearTimeout(inspectTimer); hideTip(); });
    /* right-click pins it open for as long as you like */
    node.addEventListener('contextmenu', e => {
      e.preventDefault();
      clearTimeout(inspectTimer);
      showTip(node, Overlays.cardTip(card));
    });
  }

  function attachStashDrag(node, index) {
    node.classList.add('grabbable');
    node.addEventListener('pointerdown', e => {
      if (G.phase !== 'play') return;
      rushFx();
      if (e.button != null && e.button !== 0) return;
      cancelDrag(true);
      node.classList.add('pressed');
      drag = { src: { zone: 'stash', index }, cards: [G.run.stash[index]],
               x0: e.clientX, y0: e.clientY, moved: false, node, ghost: null, id: e.pointerId };
      e.preventDefault();
    });
    node.addEventListener('dblclick', e => {
      if (G.phase !== 'play') return;
      e.preventDefault();
      cancelDrag(true);
      const card = G.run.stash[index];
      if (Engine.foundationTargetFor(G.board, card) || Engine.twinTargetFor(G.board, card)) {
        doMove({ zone: 'stash', index }, { zone: 'foundation' });
      } else {
        const m = Engine.mods(G.run);
        for (let d = 0; d < G.board.tableau.length; d++) {
          if (Engine.canPlaceOnColumn(G.board, d, card, m)) { doMove({ zone: 'stash', index }, { zone: 'tableau', col: d }); return; }
        }
        Sfx.error(); shake(node);
      }
    });
  }

  function attachDrag(node, src) {
    node.classList.add('grabbable');
    node.addEventListener('pointerdown', e => {
      if (G.phase !== 'play') return;
      rushFx();
      if (e.button != null && e.button !== 0) return;
      const cards = src.zone === 'tableau'
        ? (Engine.isRunFrom(G.board, src.col, src.index, Engine.mods(G.run)) ? G.board.tableau[src.col].slice(src.index) : null)
        : (src.zone === 'waste'
            ? (G.board.waste[src.index != null ? src.index : G.board.waste.length - 1] ? [G.board.waste[src.index != null ? src.index : G.board.waste.length - 1]] : null)
            : G.board.foundations[src.suit].slice(-1));
      if (!cards || !cards.length) { Sfx.error(); shake(node); return; }
      cancelDrag(true);
      node.classList.add('pressed');
      drag = { src, cards, x0: e.clientX, y0: e.clientY, moved: false, node, ghost: null, id: e.pointerId };
      e.preventDefault();
    });
    node.addEventListener('dblclick', e => {
      if (G.phase !== 'play') return;
      e.preventDefault();
      cancelDrag(true);
      const t = autoTarget(src);
      if (t) doMove(src, t); else { Sfx.error(); shake(node); }
    });
  }

  function onDragMove(e) {
    if (!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved && Math.hypot(dx, dy) > 6) {
      drag.moved = true;
      buildGhost(e);
      document.body.classList.add('dragging-now');
    }
    if (drag.moved && drag.ghost) {
      drag.ghost.style.transform = 'translate(' + (e.clientX - drag.ox) + 'px,' + (e.clientY - drag.oy) + 'px) rotate(' +
        Math.max(-8, Math.min(8, dx * 0.05)) + 'deg)';
      highlightDrop(e.clientX, e.clientY);
    }
  }

  function onDragEnd(e) {
