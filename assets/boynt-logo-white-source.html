<style>
  @font-face {
    font-family: 'Parisienne';
    src: url('node_modules/@fontsource/parisienne/files/parisienne-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Poppins';
    font-weight: 500;
    src: url('node_modules/@fontsource/poppins/files/poppins-latin-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Poppins';
    font-weight: 600;
    src: url('node_modules/@fontsource/poppins/files/poppins-latin-600-normal.woff2') format('woff2');
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  #logo { display: block; width: 1000px; height: 900px; }
</style>

<svg id="logo" viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <!-- waterline wave -->
    <path id="w1" d="M 190 452 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0" fill="none"/>
    <!-- lens masks: white circle with glare streak cut out -->
    <mask id="lensL">
      <circle cx="351" cy="347" r="100" fill="#fff"/>
      <path d="M 280 322 Q 289 270 362 264" stroke="#000" stroke-width="20" stroke-linecap="round" fill="none"/>
    </mask>
    <mask id="lensR">
      <circle cx="632" cy="334" r="96" fill="#fff"/>
      <path d="M 566 308 Q 576 260 645 255" stroke="#000" stroke-width="19" stroke-linecap="round" fill="none"/>
    </mask>
    <!-- keeps the white waterline outside the lenses -->
    <mask id="waveM">
      <rect x="0" y="0" width="1000" height="900" fill="#fff"/>
      <circle cx="351" cy="347" r="100" fill="#000"/>
      <circle cx="632" cy="334" r="96" fill="#000"/>
    </mask>
  </defs>

  <!-- ESTD 2026 arched -->
  <path id="arc" d="M 320 110 Q 500 52 680 110" fill="none"/>
  <text font-family="Poppins" font-weight="600" font-size="42" letter-spacing="9" fill="#ffffff">
    <textPath href="#arc" startOffset="50%" text-anchor="middle">ESTD 2026</textPath>
  </text>

  <!-- waterline outside lenses -->
  <use href="#w1" stroke="#ffffff" stroke-width="8" stroke-linecap="round" mask="url(#waveM)"/>

  <!-- lenses: solid white with glare + waterline cut out -->
  <circle cx="351" cy="347" r="100" fill="#ffffff" mask="url(#lensL)"/>
  <circle cx="632" cy="334" r="96" fill="#ffffff" mask="url(#lensR)"/>
  <!-- rims -->
  <circle cx="351" cy="347" r="100" stroke="#ffffff" stroke-width="7"/>
  <circle cx="632" cy="334" r="96" stroke="#ffffff" stroke-width="7"/>
  <!-- arched bridge -->
  <path d="M 442 288 Q 492 233 540 276" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- second wave -->
  <path d="M 290 498 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0 q 30 -28 60 0"
        stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Boynt script -->
  <text x="490" y="660" font-family="'Parisienne'" font-size="210" fill="#ffffff" text-anchor="middle">Boynt</text>

  <!-- Tagline -->
  <text x="500" y="830" font-family="Poppins" font-weight="500" font-size="55" letter-spacing="5" fill="#ffffff" text-anchor="middle">SUNGLASSES THAT FLOAT</text>
</svg>
