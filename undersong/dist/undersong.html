<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undersong</title>
<meta name="description" content="A small survey probe dives five zones of ocean to find out what is singing at the bottom.">
<style>
/* UNDERSONG — one screen, one look: the canvas letterboxed on deep-water black. */
:root { color-scheme: dark; --abyss: #02060c; --ink: #cfe9f5; --warn: #ffb199; }
html, body { height: 100%; margin: 0; background: var(--abyss); color: var(--ink); overflow: hidden; }
body { font: 14px/1.4 "Avenir Next", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-user-select: none; user-select: none; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--abyss); cursor: none; touch-action: none; }
#stage canvas { position: absolute; left: 0; top: 0; display: block; }
#ui { pointer-events: none; }
#err { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 8px 12px; font: 12px/1.4 ui-monospace, Consolas, Menlo, monospace;
  color: var(--warn); background: rgba(20, 6, 8, 0.85); border: 1px solid rgba(255, 140, 120, 0.4); border-radius: 4px; z-index: 5; }
</style>
</head>
<body>
<div id="stage"><canvas id="view"></canvas><canvas id="ui"></canvas><div id="err" hidden></div></div>
<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('err'); if (!el) return;
  el.hidden = false; el.textContent = 'Something broke: ' + (e.message || e) + (e.filename ? '  (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
});
</script>
<script>
/* ---- js/core.js ---- */
'use strict';
/* UNDERSONG — core: namespace, math, rng, noise, colour, tweens, events.
   Every other file is an IIFE that reads what it needs off the single global `G`. */
const G = {};
window.G = G;

(function () {
  const { sin, cos, abs, min, max, floor, sqrt, atan2, PI, exp, pow } = Math;

  G.W = 1280;            // logical view size; everything is authored against this
  G.H = 720;
  G.TAU = PI * 2;
  G.time = 0;            // real seconds since boot
  G.dt = 0;              // scaled frame delta (gameplay)
  G.rdt = 0;             // real frame delta (ui, tweens)
  G.debug = false;

  // ---------- math ----------
  G.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  G.clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  G.lerp = (a, b, t) => a + (b - a) * t;
  G.invLerp = (a, b, v) => (v - a) / (b - a);
  G.remap = (v, a, b, c, d) => c + (d - c) * G.clamp01((v - a) / (b - a));
  G.smoothstep = (a, b, v) => { const t = G.clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  G.damp = (a, b, lambda, dt) => a + (b - a) * (1 - exp(-lambda * dt));
  G.dist = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return sqrt(dx * dx + dy * dy); };
  G.dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
  G.angDiff = (a, b) => { let d = (b - a) % G.TAU; if (d > PI) d -= G.TAU; else if (d < -PI) d += G.TAU; return d; };
  G.angLerp = (a, b, t) => a + G.angDiff(a, b) * t;
  G.angDamp = (a, b, lambda, dt) => a + G.angDiff(a, b) * (1 - exp(-lambda * dt));
  G.sign = v => v < 0 ? -1 : 1;
  G.approach = (v, target, step) => v < target ? min(v + step, target) : max(v - step, target);
  G.wrap = (v, m) => ((v % m) + m) % m;

  // ---------- easing ----------
  G.ease = {
    lin: t => t,
    inQuad: t => t * t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    inOutQuad: t => t < 0.5 ? 2 * t * t : 1 - pow(-2 * t + 2, 2) / 2,
    inCubic: t => t * t * t,
    outCubic: t => 1 - pow(1 - t, 3),
    inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - pow(-2 * t + 2, 3) / 2,
    outQuint: t => 1 - pow(1 - t, 5),
    outExpo: t => t >= 1 ? 1 : 1 - pow(2, -10 * t),
    inOutSine: t => -(cos(PI * t) - 1) / 2,
    outBack: t => { const c = 1.70158; return 1 + (c + 1) * pow(t - 1, 3) + c * pow(t - 1, 2); },
    inBack: t => { const c = 1.70158; return (c + 1) * t * t * t - c * t * t; },
    outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : pow(2, -10 * t) * sin((t * 10 - 0.75) * (G.TAU / 3)) + 1,
    outBounce: t => {
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
      return n * (t -= 2.625 / d) * t + 0.984375;
    },
  };

  // ---------- seeded rng (mulberry32) ----------
  G.RNG = function (seed) {
    let s = seed >>> 0;
    const r = function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (a, b) => a + (b - a) * r();
    r.int = (a, b) => a + floor(r() * (b - a + 1));
    r.pick = arr => arr[floor(r() * arr.length)];
    r.chance = p => r() < p;
    r.sign = () => r() < 0.5 ? -1 : 1;
    r.ang = () => r() * G.TAU;
    r.shuffle = arr => {
      for (let i = arr.length - 1; i > 0; i--) { const j = floor(r() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
      return arr;
    };
    // weighted pick: items [{w:..}, ...] or parallel weights
    r.weighted = (items, wf) => {
      let total = 0;
      for (let i = 0; i < items.length; i++) total += wf(items[i]);
      let v = r() * total;
      for (let i = 0; i < items.length; i++) { v -= wf(items[i]); if (v <= 0) return items[i]; }
      return items[items.length - 1];
    };
    return r;
  };
  G.rand = G.RNG((Math.random() * 4294967296) >>> 0);   // free-running, for effects
  G.rr = (a, b) => G.rand.range(a, b);

  // ---------- hashing + value noise ----------
  function hash2(x, y, s) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  G.hash2 = hash2;
  G.hash1 = (x, s) => hash2(x, 7919, s);
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);

  G.noise2 = function (x, y, s) {
    const ix = floor(x), iy = floor(y);
    const fx = fade(x - ix), fy = fade(y - iy);
    const a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s), c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };
  G.fbm = function (x, y, oct, s) {
    let v = 0, amp = 0.5, f = 1, norm = 0;
    for (let i = 0; i < oct; i++) { v += G.noise2(x * f, y * f, s + i * 131) * amp; norm += amp; amp *= 0.5; f *= 2; }
    return v / norm;
  };
  // 1D smooth noise for wobble / shake, -1..1
  G.wobble = (t, s) => G.noise2(t, s * 17.13, s | 0) * 2 - 1;

  // Tiling fbm texture, values 0..1. `cells` = lattice period of the first octave.
  G.makeNoiseTex = function (size, cells, seed, octaves) {
    const out = new Float32Array(size * size);
    let amp = 0.5, norm = 0, per = cells;
    for (let o = 0; o < octaves; o++) {
      const sc = per / size, sd = seed + o * 977;
      for (let y = 0; y < size; y++) {
        const fy0 = y * sc, iy = floor(fy0), ty = fade(fy0 - iy);
        const y0 = iy % per, y1 = (iy + 1) % per;
        for (let x = 0; x < size; x++) {
          const fx0 = x * sc, ix = floor(fx0), tx = fade(fx0 - ix);
          const x0 = ix % per, x1 = (ix + 1) % per;
          const a = hash2(x0, y0, sd), b = hash2(x1, y0, sd), c = hash2(x0, y1, sd), d = hash2(x1, y1, sd);
          out[y * size + x] += (a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty) * amp;
        }
      }
      norm += amp; amp *= 0.5; per *= 2;
    }
    for (let i = 0; i < out.length; i++) out[i] /= norm;
    return out;
  };

  // ---------- colour ----------
  const colorCache = new Map();
  G.rgb = function (c) {           // '#rgb' | '#rrggbb' | 'rgb(r,g,b)' | [r,g,b] -> [r,g,b]
    if (typeof c !== 'string') return c;
    let v = colorCache.get(c);
    if (v) return v;
    if (c[0] === '#') {
      if (c.length === 4) v = [parseInt(c[1] + c[1], 16), parseInt(c[2] + c[2], 16), parseInt(c[3] + c[3], 16)];
      else v = [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
    } else {
      const m = c.match(/[\d.]+/g);
      v = [+m[0], +m[1], +m[2]];
    }
    colorCache.set(c, v);
    return v;
  };
  G.css = (c, a) => {
    const v = G.rgb(c);
    return a === undefined || a >= 1 ? `rgb(${v[0] | 0},${v[1] | 0},${v[2] | 0})` : `rgba(${v[0] | 0},${v[1] | 0},${v[2] | 0},${a < 0 ? 0 : a})`;
  };
  G.mix = (c1, c2, t) => { const a = G.rgb(c1), b = G.rgb(c2); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; };
  G.mixCss = (c1, c2, t, a) => G.css(G.mix(c1, c2, t), a);
  G.hsl = (h, s, l, a) => a === undefined ? `hsl(${h},${s}%,${l}%)` : `hsla(${h},${s}%,${l}%,${a})`;

  // ---------- tweens & timers (real time; used by UI and one-off animation) ----------
  const tweens = [];
  G.tween = function (obj, to, dur, ease, delay, done) {
    const tw = { obj, to, from: null, dur: max(dur, 0.0001), ease: ease || G.ease.outCubic, t: -(delay || 0), done, dead: false };
    tweens.push(tw);
    return tw;
  };
  G.killTweens = obj => { for (const tw of tweens) if (tw.obj === obj) tw.dead = true; };
  const timers = [];
  G.after = (sec, fn) => { const tm = { t: sec, fn, dead: false }; timers.push(tm); return tm; };
  G.updateTweens = function (dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (tw.dead) { tweens.splice(i, 1); continue; }
      tw.t += dt;
      if (tw.t < 0) continue;
      if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
      const u = min(tw.t / tw.dur, 1), e = tw.ease(u);
      for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
      if (u >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); }
    }
    for (let i = timers.length - 1; i >= 0; i--) {
      const tm = timers[i];
      if (tm.dead) { timers.splice(i, 1); continue; }
      tm.t -= dt;
      if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); }
    }
  };

  // ---------- events ----------
  const handlers = {};
  G.on = (evt, fn) => { (handlers[evt] || (handlers[evt] = [])).push(fn); };
  G.emit = (evt, a, b, c) => { const hs = handlers[evt]; if (hs) for (let i = 0; i < hs.length; i++) hs[i](a, b, c); };

  // audio is optional: these are replaced by audio.js / music.js once loaded
  G.sfx = function () {};
  G.frame = 0;

  // ---------- misc ----------
  G.removeDead = function (arr) {      // stable compaction of anything with .dead
    let j = 0;
    for (let i = 0; i < arr.length; i++) { const e = arr[i]; if (!e.dead) arr[j++] = e; }
    arr.length = j;
  };
  G.params = (function () {
    const out = {};
    try {
      const q = (location.search || '').slice(1);
      for (const kv of q.split('&')) { if (!kv) continue; const [k, v] = kv.split('='); out[decodeURIComponent(k)] = v === undefined ? '1' : decodeURIComponent(v); }
    } catch (e) { /* no query in some frames */ }
    return out;
  })();
  G.fmtInt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
})();

/* ---- js/input.js ---- */
'use strict';
/* UNDERSONG — input: keyboard, mouse, gamepad -> a small set of actions.
   G.input.update() once per frame before game logic; G.input.endFrame() after. */
(function () {
  const { abs, sqrt, atan2 } = Math;
  const I = G.input = {
    keys: Object.create(null), pressed: Object.create(null), released: Object.create(null),
    mouse: { x: G.W / 2, y: G.H / 2, down: [false, false, false], pressed: [false, false, false], released: [false, false, false], wheel: 0, moved: 0, seen: false },
    pad: { connected: false, lx: 0, ly: 0, rx: 0, ry: 0, btn: [], prev: [] },
    usingPad: false,
    // actions, refreshed by update()
    moveX: 0, moveY: 0, aimX: 1, aimY: 0, aimStick: false,
    fire: false, dash: false, flare: false, sonar: false, interact: false, pause: false, map: false,
    confirm: false, back: false, navX: 0, navY: 0, anyPressed: false,
    locked: 0,           // >0 swallows gameplay actions for that many seconds (after menus)
  };
  let navHoldX = 0, navHoldY = 0, navTimer = 0;
  let anyFlag = false;

  const GAME_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'KeyF', 'ShiftLeft', 'ShiftRight', 'Enter', 'Escape']);

  window.addEventListener('keydown', e => {
    if (e.repeat) { if (GAME_KEYS.has(e.code)) e.preventDefault(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    I.keys[e.code] = true; I.pressed[e.code] = true; anyFlag = true; I.usingPad = false;
    if (GAME_KEYS.has(e.code)) e.preventDefault();
    G.emit('gesture');
  });
  window.addEventListener('keyup', e => { I.keys[e.code] = false; I.released[e.code] = true; });
  window.addEventListener('blur', () => {
    for (const k in I.keys) I.keys[k] = false;
    I.mouse.down[0] = I.mouse.down[1] = I.mouse.down[2] = false;
    G.emit('blur');
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) G.emit('blur'); });

  function setMouse(e) {
    // read the canvas's position at event time: robust to scrolling, frames and late layout
    const c = G.uiC;
    if (!c) return;
    const r = c.getBoundingClientRect();
    if (!r.width || !r.height) return;
    I.mouse.x = (e.clientX - r.left) / r.width * G.W;
    I.mouse.y = (e.clientY - r.top) / r.height * G.H;
    I.mouse.moved = G.time; I.mouse.seen = true; I.usingPad = false;
  }
  window.addEventListener('mousemove', setMouse);
  window.addEventListener('mousedown', e => {
    setMouse(e);
    if (e.button < 3) { I.mouse.down[e.button] = true; I.mouse.pressed[e.button] = true; }
    anyFlag = true;
    G.emit('gesture');
    if (e.button === 1) e.preventDefault();
  });
  window.addEventListener('mouseup', e => { if (e.button < 3) { I.mouse.down[e.button] = false; I.mouse.released[e.button] = true; } });
  window.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('wheel', e => { I.mouse.wheel += Math.sign(e.deltaY); }, { passive: true });
  // touch: treat as mouse so menus at least work on a tablet
  function touchToMouse(e, down) {
    const t = e.changedTouches[0]; if (!t) return;
    setMouse(t);
    if (down === true) { I.mouse.down[0] = true; I.mouse.pressed[0] = true; anyFlag = true; G.emit('gesture'); }
    if (down === false) { I.mouse.down[0] = false; I.mouse.released[0] = true; }
  }
  window.addEventListener('touchstart', e => touchToMouse(e, true), { passive: true });
  window.addEventListener('touchmove', e => touchToMouse(e), { passive: true });
  window.addEventListener('touchend', e => touchToMouse(e, false), { passive: true });

  window.addEventListener('gamepadconnected', () => { I.pad.connected = true; });
  window.addEventListener('gamepaddisconnected', () => { I.pad.connected = false; });

  const dz = v => abs(v) < 0.18 ? 0 : (v - Math.sign(v) * 0.18) / 0.82;
  function pollPad() {
    const P = I.pad;
    P.prev = P.btn; P.btn = [];
    let gp = null;
    try {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const p of pads) if (p && p.connected && p.mapping === 'standard') { gp = p; break; }
      if (!gp) for (const p of pads) if (p && p.connected) { gp = p; break; }
    } catch (e) { gp = null; }
    if (!gp) { P.lx = P.ly = P.rx = P.ry = 0; P.connected = false; return; }
    P.connected = true;
    P.lx = dz(gp.axes[0] || 0); P.ly = dz(gp.axes[1] || 0);
    P.rx = dz(gp.axes[2] || 0); P.ry = dz(gp.axes[3] || 0);
    for (let i = 0; i < gp.buttons.length; i++) P.btn[i] = gp.buttons[i].pressed || gp.buttons[i].value > 0.4;
    if (P.lx || P.ly || P.rx || P.ry || P.btn.some(Boolean)) { I.usingPad = true; if (P.btn.some(Boolean)) G.emit('gesture'); }
  }
  const padDown = i => !!I.pad.btn[i];
  const padHit = i => !!I.pad.btn[i] && !I.pad.prev[i];

  I.key = code => !!I.keys[code];
  I.hit = code => !!I.pressed[code];

  I.update = function (dt) {
    pollPad();
    const k = I.keys, p = I.pressed, P = I.pad;
    let mx = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
    let my = (k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0);
    if (mx && my) { mx *= 0.7071; my *= 0.7071; }
    if (P.connected && (P.lx || P.ly)) { mx = P.lx; my = P.ly; const l = sqrt(mx * mx + my * my); if (l > 1) { mx /= l; my /= l; } }
    I.moveX = mx; I.moveY = my;
    I.aimStick = false;
    if (P.connected && (abs(P.rx) > 0.25 || abs(P.ry) > 0.25)) {
      const l = sqrt(P.rx * P.rx + P.ry * P.ry); I.aimX = P.rx / l; I.aimY = P.ry / l; I.aimStick = true;
    }
    I.fire = I.mouse.down[0] || padDown(7);
    I.dash = !!(p.Space || p.ShiftLeft || p.ShiftRight) || padHit(6) || padHit(4);
    I.flare = I.mouse.pressed[2] || !!p.KeyF || padHit(5);
    I.sonar = !!p.KeyQ || padHit(3);
    I.interact = !!p.KeyE || padHit(0);
    I.pause = !!p.Escape || !!p.KeyP || padHit(9);
    I.map = !!k.Tab || padDown(8);
    I.confirm = !!p.Enter || !!p.Space || padHit(0);
    I.back = !!p.Escape || padHit(1);
    I.anyPressed = anyFlag || padHit(0) || padHit(9);
    // menu navigation with key-repeat
    let nx = (p.ArrowRight || p.KeyD ? 1 : 0) - (p.ArrowLeft || p.KeyA ? 1 : 0);
    let ny = (p.ArrowDown || p.KeyS ? 1 : 0) - (p.ArrowUp || p.KeyW ? 1 : 0);
    const hx = (padDown(15) ? 1 : 0) - (padDown(14) ? 1 : 0) + (abs(P.lx) > 0.6 ? Math.sign(P.lx) : 0);
    const hy = (padDown(13) ? 1 : 0) - (padDown(12) ? 1 : 0) + (abs(P.ly) > 0.6 ? Math.sign(P.ly) : 0);
    if (hx !== navHoldX || hy !== navHoldY) { navHoldX = hx; navHoldY = hy; navTimer = 0.32; nx += hx; ny += hy; }
    else if (hx || hy) { navTimer -= dt; if (navTimer <= 0) { navTimer = 0.14; nx += hx; ny += hy; } }
    I.navX = Math.sign(nx); I.navY = Math.sign(ny);
    if (I.locked > 0) {
      I.locked -= dt;
      I.fire = I.dash = I.flare = I.sonar = I.interact = false;
    }
  };

  I.endFrame = function () {
    for (const c in I.pressed) delete I.pressed[c];
    for (const c in I.released) delete I.released[c];
    const m = I.mouse;
    m.pressed[0] = m.pressed[1] = m.pressed[2] = false;
    m.released[0] = m.released[1] = m.released[2] = false;
    m.wheel = 0; anyFlag = false;
  };

  // label for prompts, depending on the device last touched
  I.label = function (action) {
    const pad = I.usingPad;
    switch (action) {
      case 'move': return pad ? 'L-STICK' : 'W A S D';
      case 'aim': return pad ? 'R-STICK' : 'MOUSE';
      case 'fire': return pad ? 'RT' : 'LEFT CLICK';
      case 'dash': return pad ? 'LT' : 'SPACE';
      case 'flare': return pad ? 'RB' : 'RIGHT CLICK';
      case 'sonar': return pad ? 'Y' : 'Q';
      case 'interact': return pad ? 'A' : 'E';
      case 'pause': return pad ? 'START' : 'ESC';
      case 'map': return pad ? 'SELECT' : 'TAB';
    }
    return '';
  };
})();

/* ---- js/gfx.js ---- */
'use strict';
/* UNDERSONG — gfx: canvases, camera, sprite cache, text (incl. the hand-built stroke face),

'use strict';
/* UNDERSONG — music: a small generative band.
   One key (D), one idea: six lost probes each still sounding one note — D A F C E G, a stack of
   thirds with the sixth degree missing, so the song never says whether it is the sad minor or the
   hopeful Dorian. The seventh note (B) settles it. Every zone is a different arrangement of that.

   Layers: pad, bass, arp, melody, percussion, and the motif pings (one per probe found).
   `intensity` (0 calm .. 1 fight) opens the filter and brings in the drums. */
(function () {
  const { min, max, floor, random, pow, abs } = Math;
  const A = G.audio, N = G.noteFreq;
  const rnd = (a, b) => a + (b - a) * random();
  const pick = arr => arr[(random() * arr.length) | 0];

  const CH = {
    Dm9: { b: 'D2', n: ['D3', 'A3', 'F4', 'C4', 'E4'] },
    Dm11: { b: 'D2', n: ['D3', 'A3', 'F4', 'C4', 'E4', 'G4'] },
    F: { b: 'F2', n: ['F3', 'C4', 'A4', 'E4', 'G4'] },
    C: { b: 'C2', n: ['C3', 'G3', 'E4', 'D4', 'G4'] },
    Am: { b: 'A1', n: ['A2', 'E3', 'C4', 'G4', 'E4'] },
    G: { b: 'G1', n: ['G2', 'D3', 'F4', 'C4', 'D4'] },
    Bb: { b: 'Bb1', n: ['Bb2', 'F3', 'D4', 'A4', 'E4'] },
    Eb: { b: 'D2', n: ['Eb3', 'Bb3', 'G4', 'D4'], avoid: ['E', 'A'] },
    Gm: { b: 'D2', n: ['G3', 'Bb3', 'D4', 'F4'] },

      mel: { vol: 0.6, prob: 0.75, inst: 'bell' }, kick: 'x.......x.......', perc: 0.5, percAt: -1, motif: 1.2, voices: true,

  const M = G.music = {
    on: false, mode: null, cfg: null, pending: null, step: 0, next: 0, bar: 0, ci: -1, chord: CH.Dm9,
    inten: 0, target: 0, mask: 0, vol: 1, volTarget: 1,
    L: null, padVoices: [], melQ: [], evq: [], sfxNotes: [587, 880, 698, 659], lastMel: 9, table: null, tableScale: null,

    },

    // a single dramatic low hit (boss entrances, big reveals)
    hit(v) {

    },
  };

  G.on('audioReady', () => { if (!A.offline) M.start(); });

        }
      }
      return charged;
    },

    shoot() {
      const st = this.st, a = this.aim;
      this.shotN++;
      let charged = false;
      if (st.chord && this.shotN % 5 === 0) {
        G.shots.fire(this.x + cos(a) * 16, this.y + sin(a) * 16, a, { dmg: st.dmg * (2.2 + st.chord * 0.9), speed: st.speed * 0.8, life: st.range / st.speed * 1.1, r: 20 * st.size, pierce: 99, bounce: 0, homing: 0, kind: 'wave', crit: false });
        G.sfx('chord');
      } else {
        charged = this.volley(a, 1, false);
        G.sfx(charged ? 'shootBig' : 'shoot', { n: st.count, heat: this.heat });
      }
      if (st.echo) this.echoQ.push({ t: 0.14, ang: a, mul: 0.4 + 0.15 * st.echo });
      this.restT = 0;
      const kick = charged ? 70 : 16;
      this.vx -= cos(a) * kick; this.vy -= sin(a) * kick;
      this.lampBoost = 1;
      G.cam.kick(-cos(a) * (charged ? 5 : 1.4), -sin(a) * (charged ? 5 : 1.4));
      G.lights.flash(this.x + cos(a) * 20, this.y + sin(a) * 20, charged ? 150 : 70, '#bff4ff', 0.09, 0.8);
      if (charged) { G.fx.wave(this.x, this.y, { speed: 600, maxR: 180, str: 0.5 }); G.cam.shake(0.18); }
      G.emit('shoot', this);
    },

    flare(free) {
      const st = this.st;
      if (!free) {
        if (this.flares <= 0) { G.sfx('deny'); return; }
        this.flares--;
      }
      const R2 = st.flareR * (free ? 1.5 : 1);
      G.lights.flash(this.x, this.y, R2 * 2.6, '#fff6e0', 1.1, 1);
      G.fx.wave(this.x, this.y, { speed: 900, maxR: R2 * 1.5, str: 1.3 });
      G.fx.punch(0.5, 0.42);
      G.cam.shake(0.45);
      G.particles.ring(this.x, this.y, 10, R2, '#fff6dc', 0.5, 5);
      G.particles.ring(this.x, this.y, 10, R2 * 0.7, '#ffe6a8', 0.38, 3);
      G.particles.sparks(this.x, this.y, 26, '#fff0c0', { s0: 200, s1: 620, life: 0.5, size: 2.4 });
      G.sfx('flare');
      this.wide = 1;
      G.emit('flare', this, R2);
    },

    sonar() {
      this.sonarT = this.st.sonarCd;
      G.sfx('sonar');
      G.emit('sonar', this);
    },

    hurt(n, sx, sy) {
      if (this.dead || this.inv > 0 || G.game.god) return false;
      const st = this.st;
      if (this.plateReady) {
        this.plateReady = false; this.plateT = max(8, 22 - st.plating * 4); this.inv = 0.7;
        G.particles.flakes(this.x, this.y, 10, '#c8d0b0', 240);
        G.particles.ring(this.x, this.y, 16, 44, '#e8f0d0', 0.3, 3);
        G.sfx('plateBreak'); G.cam.shake(0.2);
        return false;
      }
      this.hull -= n; this.inv = 1.2 + (st.inkReflex ? 0.6 : 0); this.hurtT = 0.45;
      let dx = this.x - sx, dy = this.y - sy; const l = hypot(dx, dy) || 1; dx /= l; dy /= l;
      this.vx += dx * 340; this.vy += dy * 340; this.dashT = 0;
      G.game.hitstop(0.09);
      G.cam.shake(0.6); G.cam.kick(dx * 10, dy * 10);
      G.fx.punch(0.75, 0.16);
      G.particles.flakes(this.x, this.y, 8, this.paint.hull, 260);
      G.particles.bubbles(this.x, this.y, 14, 10, 160);
      G.particles.sparks(this.x, this.y, 10, '#ffb080', { s0: 120, s1: 420, life: 0.4 });
      G.sfx('hurt');
      if (st.inkReflex) { for (let i = 0; i < 5; i++) G.particles.ink(this.x + G.rr(-20, 20), this.y + G.rr(-20, 20), G.rr(26, 44), G.rr(2.2, 3.4), G.rr(-30, 30), G.rr(-30, 30)); G.emit('inkReflex', this); }
      G.emit('hurt', this, n);
      if (this.hull <= 0) {
        if (st.lastStand && !this.standUsed) {
          this.standUsed = true; this.hull = 1; this.inv = 2.2;
          this.flare(true);
          G.particles.text(this.x, this.y - 30, 'PRESSURE VALVE', '#ffe6a8', 14, 1.6);
        } else this.die();
      }
      return true;
    },

    heal(n) {
      if (this.dead) return;
      const before = this.hull;
      this.hull = min(this.st.maxHull, this.hull + n);
      if (this.hull > before) {
        G.particles.motes(this.x, this.y, 10, '#9dffb8', { s0: 20, s1: 90, life: 0.8, size0: 4, size1: 9 });
        G.particles.ring(this.x, this.y, 30, 12, '#9dffb8', 0.4, 2.5);
        G.sfx('heal'); this.happy = 1;
        G.emit('heal', this);
      }
    },

    addXp(n) {
      if (this.dead) return;
      n *= this.st.xpMul;
      this.xp += n;
      if (this.flares < this.st.flareMax) {
        this.flareFill += n / this.st.flareCost;
        if (this.flareFill >= 1) { this.flareFill = 0; this.flares++; G.sfx('flareReady'); G.particles.ring(this.x, this.y, 34, 14, '#ffe6a8', 0.4, 2.5); }
      }
      while (this.xp >= this.xpNext) {
        this.xp -= this.xpNext;
        this.level++;
        this.xpNext = floor(this.xpNext * 1.12 + 6);
        this.pendingLevels++;
        G.emit('levelup', this);
      }
    },
    addPearls(n) { n = Math.round(n * this.st.pearlMul); this.pearls += n; G.emit('pearls', n); return n; },

    die() {
      if (this.dead) return;
      this.dead = true; this.deadT = 0; this.hull = 0; this.control = false; this.dashT = 0;
      G.game.hitstop(0.5);
      G.cam.shake(0.9);
      G.fx.punch(1.2, 0.3);
      G.fx.wave(this.x, this.y, { speed: 500, maxR: 500, str: 1.2 });
      G.particles.flakes(this.x, this.y, 18, this.paint.hull, 300);
      G.particles.bubbles(this.x, this.y, 30, 14, 200);
      G.sfx('death');
      G.emit('death', this);
    },

    // ------------------------------------------------------------- drawing
    draw(ctx) {
      const t = G.time, pt = this.paint;
      if (this.inv > 0 && this.hurtT <= 0 && this.dashT <= 0 && !this.dead && floor(t * 22) % 2 === 0) ctx.globalAlpha = 0.45;
      const x = this.x, y = this.y + this.bob;
      // antenna (world space, springy)
      const c0 = cos(this.tilt), s0 = sin(this.tilt);
      const ax = x + s0 * 12, ay = y - c0 * 12;
      ctx.strokeStyle = pt.dark; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(x + s0 * 19, y - c0 * 19, this.antX, this.antY + this.bob * 0.3); ctx.stroke();
      ctx.fillStyle = this.beaconT < 0.14 ? '#d8ffe2' : '#4a6a58';
      ctx.beginPath(); ctx.arc(this.antX, this.antY + this.bob * 0.3, 2.3, 0, TAU); ctx.fill();

      ctx.save();
      ctx.translate(x, y);
      if (this.sq > 0.02) {       // stretch along the dash
        const a = atan2(this.dashY, this.dashX), k = this.sq;
        ctx.rotate(a); ctx.scale(1 + 0.3 * k, 1 - 0.2 * k); ctx.rotate(-a);
      }
      ctx.rotate(this.tilt);
      // thruster pods
      const sp = hypot(this.vx, this.vy), pr = abs(sin(this.prop));
      for (let s = -1; s <= 1; s += 2) {
        const px = s * 10.5, py = 9;
        ctx.fillStyle = '#3a4352'; ctx.beginPath(); ctx.ellipse(px, py, 4.6, 3.3, s * 0.5, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#8b98ab'; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(px + s * 2.6 - 3.6 * pr * 0.5, py + 3.6 + s * 0); ctx.lineTo(px + s * 2.6 + 3.6 * pr * 0.5, py + 3.6); ctx.stroke();
      }
      // fins
      const fl = sin(t * (5 + min(8, sp * 0.03))) * 0.32;
      ctx.fillStyle = pt.shade;
      for (let s = -1; s <= 1; s += 2) {
        ctx.save(); ctx.translate(s * 11.5, 0); ctx.rotate(s * (0.5 + fl));
        ctx.beginPath(); ctx.moveTo(0, -2.5); ctx.quadraticCurveTo(s * 9, -1, s * 8, 5); ctx.quadraticCurveTo(s * 3, 3, 0, 2.5); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      // hull
      const g = ctx.createRadialGradient(-4, -5, 1, 0, 0, R + 1);
      g.addColorStop(0, G.mixCss(pt.hull, '#ffffff', 0.45)); g.addColorStop(0.45, pt.hull); g.addColorStop(1, pt.shade);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
      // stripe (a chord band across the lower hull)
      ctx.fillStyle = pt.stripe;
      ctx.beginPath(); ctx.arc(0, 0, R - 0.4, 0.34, PI - 0.34); ctx.arc(0, 0, R - 0.4, PI - 0.72, 0.72, true); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = pt.dark; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
      // rivets
      ctx.fillStyle = G.css(pt.dark, 0.55);
      for (let i = -1; i <= 1; i++) { const a = -PI / 2 + i * 0.5; ctx.beginPath(); ctx.arc(cos(a) * 10, sin(a) * 10, 0.9, 0, TAU); ctx.fill(); }
      if (this.hull <= 2 && !this.dead || this.dead) {
        ctx.strokeStyle = G.css(pt.dark, 0.8); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(-9, -6); ctx.lineTo(-5, -3); ctx.lineTo(-7, 1); ctx.lineTo(-3, 3); ctx.stroke();
        if (this.hull <= 1) { ctx.beginPath(); ctx.moveTo(8, -8); ctx.lineTo(6, -3); ctx.lineTo(10, 0); ctx.stroke(); }
      }
      ctx.restore();

      // eye — rides around the hull toward wherever Wick is looking
      const ex = x + cos(this.face) * 4.4, ey = y + sin(this.face) * 4.4;
      ctx.fillStyle = '#27303c'; ctx.beginPath(); ctx.arc(ex, ey, 8, 0, TAU); ctx.fill();
      const eg = ctx.createRadialGradient(ex - 2, ey - 2.5, 0.5, ex, ey, 6.6);
      eg.addColorStop(0, '#f2feff'); eg.addColorStop(0.5, '#9fe9f7'); eg.addColorStop(1, '#3d9fb8');
      ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(ex, ey, 6.4, 0, TAU); ctx.fill();
      const pr2 = 2.5 + this.wide * 1.3 - this.squint * 0.6;
      const pxx = ex + cos(this.face) * 1.9, pyy = ey + sin(this.face) * 1.9;
      if (this.happy > 0 && !this.dead) {
        ctx.strokeStyle = '#0d2530'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(pxx, pyy + 1.6, 2.8, PI * 1.12, PI * 1.88); ctx.stroke();
      } else {
        ctx.fillStyle = '#0d2530'; ctx.beginPath(); ctx.arc(pxx, pyy, pr2, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.arc(pxx - 1.1, pyy - 1.2, 0.95, 0, TAU); ctx.fill();
      }
      // lids: blink closes from the top; a wince closes from both
      const lidTop = min(1, this.lid + this.squint * 0.34), lidBot = this.squint * 0.3;
      ctx.fillStyle = '#27303c';
      if (lidTop > 0.02) { const th = Math.acos(1 - 2 * min(1, lidTop)); ctx.beginPath(); ctx.arc(ex, ey, 6.6, -PI / 2 - th, -PI / 2 + th); ctx.closePath(); ctx.fill(); }
      if (lidBot > 0.02) { const th = Math.acos(1 - 2 * lidBot); ctx.beginPath(); ctx.arc(ex, ey, 6.6, PI / 2 - th, PI / 2 + th); ctx.closePath(); ctx.fill(); }
      if (this.shades) {
        // floating sunglasses, worn with total confidence
        ctx.save(); ctx.translate(ex, ey - 0.5); ctx.rotate(this.tilt * 0.6);
        ctx.fillStyle = '#10141c'; ctx.strokeStyle = '#ff7a59'; ctx.lineWidth = 1.1;
        for (let s = -1; s <= 1; s += 2) { G.roundRect(ctx, s * 4.6 - 4, -3.2, 8, 6, 2.2); ctx.fill(); ctx.stroke(); }
        ctx.beginPath(); ctx.moveTo(-0.9, -1.4); ctx.lineTo(0.9, -1.4); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-7, -1.4); ctx.lineTo(-4.4, -1.4); ctx.moveTo(2.2, -1.4); ctx.lineTo(4.8, -1.4); ctx.stroke();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },

    drawGlow(ctx) {
      const t = G.time, x = this.x, y = this.y + this.bob, st = this.st;
      const ex = x + cos(this.face) * 4.4, ey = y + sin(this.face) * 4.4;
      if (!this.shades) G.drawGlow(ctx, ex, ey, 26 + this.lampBoost * 10, '#9fe6ff', (0.26 + this.lampBoost * 0.3) * this.lampPower);
      if (this.beaconT < 0.14) G.drawGlow(ctx, this.antX, this.antY, 11, '#9dffb0', 0.9);
      if (this.hull <= 1 && !this.dead) G.drawGlow(ctx, x, y, 34, '#ff5040', 0.22 + 0.22 * sin(t * 9));
      if (this.dashT > 0) G.drawGlow(ctx, x - this.dashX * 12, y - this.dashY * 12, 26, '#dff8ff', 0.6);
      // dash recharge arc
      if (!this.dead && this.dashCharge < st.dashCharges) {
        const f = this.dashCharge % 1;
        ctx.globalAlpha = 0.5; ctx.strokeStyle = '#bfeaff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(x, y, 21, -PI / 2, -PI / 2 + TAU * f); ctx.stroke(); ctx.globalAlpha = 1;
      }
      if (this.plateReady) {
        ctx.globalAlpha = 0.5 + 0.15 * sin(t * 3); ctx.strokeStyle = '#dfe8c8'; ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) { const a = t * 0.5 + i * TAU / 5; ctx.beginPath(); ctx.arc(x, y, 18.5, a, a + 0.8); ctx.stroke(); }
        ctx.globalAlpha = 1;
      }
      if (st.breath && this.restT >= 1 && !this.dead) {
        const mxp = x + cos(this.face) * 17, myp = y + sin(this.face) * 17;
        G.drawGlow(ctx, mxp, myp, 13 + sin(t * 12) * 2, '#bff6ff', 0.9);
      }
    },
  };
})();

/* ---- js/meta.js ---- */
'use strict';
/* UNDERSONG — meta: what survives between dives. Pearls, workshop upgrades, the codex,
   recovered logs, paint jobs, settings. Stored in localStorage, and the game is fine without it. */
(function () {
  const KEY = 'undersong.save.v1';
  const fresh = () => ({
    v: 1, pearls: 0, workshop: {}, codex: {}, echoes: {}, paints: ['classic'], paint: 'classic', shades: false, shadesOn: true,
    stats: { dives: 0, wins: 0, bestDepth: 0, bestZone: 0, dissuaded: 0, time: 0 }, settings: null, flags: {},
  });

  G.CODEX = {};
  G.CODEX_ORDER = [];
  G.codexAdd = function (id, entry) { entry.id = id; G.CODEX[id] = entry; G.CODEX_ORDER.push(id); };

  const meta = G.meta = {
    data: fresh(), ok: true,

    WORKSHOP: [
      { id: 'hull', name: 'Reinforced Frame', desc: '+1 hull', max: 2, cost: [30, 75], apply: (st, n) => { st.maxHull += n; } },
      { id: 'emitter', name: 'Tuned Emitter', desc: '+8% pulse strength', max: 3, cost: [25, 50, 90], apply: (st, n) => { st.dmg *= 1 + 0.08 * n; } },
      { id: 'flare', name: 'Flare Rack', desc: '+1 flare', max: 1, cost: [45], apply: (st, n) => { st.flareMax += n; } },
      { id: 'magnet', name: 'Collector Coil', desc: '+25% pickup reach', max: 2, cost: [15, 35], apply: (st, n) => { st.magnet *= 1 + 0.25 * n; } },
      { id: 'lamp', name: 'Wide Lens', desc: 'Longer lamp, faster scans', max: 2, cost: [20, 45], apply: (st, n) => { st.lampR *= 1 + 0.08 * n; st.scanMul *= 1 + 0.25 * n; } },
      { id: 'reroll', name: 'Second Opinion', desc: '+1 reroll each dive', max: 3, cost: [20, 40, 70], apply: () => { } },
      { id: 'luck', name: 'Lucky Barnacle', desc: 'Rarer modules turn up more', max: 2, cost: [35, 75], apply: (st, n) => { st.luck += n; } },
      { id: 'head', name: 'Head Start', desc: 'Begin each dive with a module', max: 1, cost: [80], apply: () => { } },
    ],

    load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const d = JSON.parse(raw), base = fresh();
          if (d && d.v === 1) { this.data = Object.assign(base, d); this.data.stats = Object.assign(fresh().stats, d.stats || {}); }
        }
      } catch (e) { this.ok = false; }
      if (this.data.settings) Object.assign(G.settings, this.data.settings);
    },
    save() {
      this.data.settings = Object.assign({}, G.settings);
      try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { this.ok = false; }
    },
    wipe() { this.data = fresh(); this.save(); },

    seen(id) { return !!this.data.codex[id]; },
    // returns true the first time a species is ever catalogued
    catalog(id) {
      if (this.data.codex[id]) return false;
      this.data.codex[id] = { n: 0, d: Date.now() };
      this.save();
      return true;
    },
    count(id) { const e = this.data.codex[id]; if (e) e.n++; this.data.stats.dissuaded++; },
    codexProgress() {
      let have = 0;
      for (const id of G.CODEX_ORDER) if (this.data.codex[id]) have++;
      return { have, total: G.CODEX_ORDER.length };
    },

    level(id) { return this.data.workshop[id] || 0; },
    applyWorkshop(st) { for (const w of this.WORKSHOP) { const n = this.level(w.id); if (n) w.apply(st, n); } },
    price(w) { const n = this.level(w.id); return n >= w.max ? null : w.cost[n]; },
    buy(id) {
      const w = this.WORKSHOP.find(x => x.id === id), price = w && this.price(w);
      if (price === null || price === undefined || this.data.pearls < price) return false;
      this.data.pearls -= price; this.data.workshop[id] = this.level(id) + 1;
      this.save();
      return true;
    },
    paintOwned(id) { return this.data.paints.includes(id); },
    buyPaint(id) {
      const p = G.PAINTS.find(x => x.id === id);
      if (!p || this.paintOwned(id) || this.data.pearls < p.cost) return false;
      this.data.pearls -= p.cost; this.data.paints.push(id); this.data.paint = id; this.save();
      return true;
    },
    flag(name, v) { if (v === undefined) return !!this.data.flags[name]; this.data.flags[name] = v; this.save(); },
  };
})();

/* ---- js/creatures.js ---- */
'use strict';
/* UNDERSONG — creatures: shared framework.
   kit  = procedural anatomy (follow-the-leader spines, verlet ropes, side-view fish bodies, eyes)
   ai   = steering helpers (seek, wander, wall avoidance, flow-field chase, cached line of sight)
   creatures = manager: spawn / update / draw, damage, and the "dissuade" exit (nothing here dies;
               it just decides you are not worth it and leaves)
   scan = holding the lamp on a species catalogues it. */
(function () {
  const { sin, cos, min, max, abs, atan2, sqrt, exp, PI, hypot, floor, pow } = Math;
  const { clamp, lerp, damp } = G;
  const TAU = G.TAU;
  const _v = { x: 0, y: 0 };

  G.CREATURES = {};
  G.defCreature = function (id, def) {
    def.id = id;
    if (def.r === undefined) def.r = 12;
    if (def.hp === undefined) def.hp = 20;
    if (def.mass === undefined) def.mass = 1;
    if (def.xp === undefined) def.xp = 3;
    G.CREATURES[id] = def;
    return def;
  };
  let nextId = 1;

  // ================================================================= kit
  const TOP = new Float32Array(64), BOT = new Float32Array(64), OUT = [];
  const kit = G.kit = {
    ex: 0, ey: 0, hx: 0, hy: 0, tx: 0, ty: 0,      // last fish(): eye position, nose, tail tip

    chain(n, seg) { return { n, seg, x: new Float32Array(n), y: new Float32Array(n) }; },
    chainSet(ch, x, y, ang) { for (let i = 0; i < ch.n; i++) { ch.x[i] = x - cos(ang) * ch.seg * i; ch.y[i] = y - sin(ang) * ch.seg * i; } },
    // head leads, every joint keeps its distance; `bend` limits the angle between neighbours
    chainFollow(ch, hx, hy, ang, bend) {
      const X = ch.x, Y = ch.y, seg = ch.seg;
      X[0] = hx; Y[0] = hy;
      let pa = ang + PI;
      for (let i = 1; i < ch.n; i++) {
        let a = atan2(Y[i] - Y[i - 1], X[i] - X[i - 1]);
        if (bend !== undefined) { const d = G.angDiff(pa, a); if (d > bend) a = pa + bend; else if (d < -bend) a = pa - bend; }
        X[i] = X[i - 1] + cos(a) * seg; Y[i] = Y[i - 1] + sin(a) * seg;
        pa = a;
      }
    },
    rope(n, seg) { return { n, seg, x: new Float32Array(n), y: new Float32Array(n), px: new Float32Array(n), py: new Float32Array(n) }; },
    ropeSet(r, x, y, dx, dy) { for (let i = 0; i < r.n; i++) { r.x[i] = r.px[i] = x + dx * r.seg * i; r.y[i] = r.py[i] = y + dy * r.seg * i; } },
    // verlet, anchored at index 0. gx/gy = acceleration (px/s²), keep = velocity retained per step
    ropeStep(r, ax, ay, dt, gx, gy, keep) {
      const X = r.x, Y = r.y, PX = r.px, PY = r.py, n = r.n, seg = r.seg, d2 = dt * dt;
      for (let i = 1; i < n; i++) {
        const vx = (X[i] - PX[i]) * keep, vy = (Y[i] - PY[i]) * keep;
        PX[i] = X[i]; PY[i] = Y[i];
        X[i] += vx + gx * d2; Y[i] += vy + gy * d2;
      }
      X[0] = ax; Y[0] = ay;
      for (let it = 0; it < 2; it++) {
        for (let i = 1; i < n; i++) {

    /* Side-view fish from a chain. o: {w, prof[], up(+1/-1), phase, amp, body, belly, fin, tail, dorsal, pect, alpha,

      const ta = atan2(tdy, tdx) + wag, tcx = (TOP[tailI * 2] + BOT[tailI * 2]) / 2, tcy = (TOP[tailI * 2 + 1] + BOT[tailI * 2 + 1]) / 2;

        const a = floor(n * 0.5), b = min(n - 2, floor(n * 0.75)), m = (a + b) >> 1;

      }

      OUT.length = 0;

      }

        const i = min(n - 1, 2), cx = (TOP[i * 2] + BOT[i * 2]) / 2, cy = (TOP[i * 2 + 1] + BOT[i * 2 + 1]) / 2;

        ctx.fillStyle = o.fin || o.body;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.quadraticCurveTo(cx + cos(ba - 0.4) * o.pect, cy + sin(ba - 0.4) * o.pect, cx + cos(ba) * o.pect * 1.15, cy + sin(ba) * o.pect * 1.15);
        ctx.quadraticCurveTo(cx + cos(ba + 0.5) * o.pect * 0.6, cy + sin(ba + 0.5) * o.pect * 0.6, cx, cy);

    },

    // o: {lid, iris, dazed, angry, alpha, pupil}

  // ================================================================= ai
  const ai = G.ai = {
    set(c, st) { c.st = st; c.stT = 0; },
    seek(c, tx, ty, speed, k, dt) {
      const dx = tx - c.x, dy = ty - c.y, d = hypot(dx, dy) || 1;

    },
    steer(c, dx, dy, speed, k, dt) { c.vx = damp(c.vx, dx * speed, k, dt); c.vy = damp(c.vy, dy * speed, k, dt); },
    brake(c, k, dt) { const e = exp(-k * dt); c.vx *= e; c.vy *= e; },
    // soft repulsion from rock; returns clearance
    avoid(c, margin, force, dt) {

    // amble around `home`, staying within c.leash

    // line of sight to the player, refreshed a few times a second (staggered by id)
    see(c, p, range) {

    // approach the player around walls: straight when visible, down the flow field otherwise

    faceVel(c, rate, dt) { if (c.vx * c.vx + c.vy * c.vy > 60) c.face = G.angDamp(c.face, atan2(c.vy, c.vx), rate, dt); },

  // ================================================================= manager
  const CR = G.creatures = {
    aggro: 0, threat: 0,
    spawn(type, x, y, o) {
      const def = G.CREATURES[type];
      if (!def) { console.warn('unknown creature', type); return null; }
      const c = {
        uid: nextId++, id: 0, type, def, x, y, vx: 0, vy: 0, kx: 0, ky: 0, r: def.r, hp: def.hp, maxHp: def.hp,
        face: G.rand() * TAU, up: 0, t: G.rand() * 10, st: 'idle', stT: 0, ph: G.rand() * TAU, wa: G.rand() * TAU,
        flash: 0, stun: 0, vuln: 0, mark: 0, hurtCd: 0, alpha: 1,
        home: { x, y }, leash: def.leash || 160, aggro: false, sees: undefined, pd: 9999,
        hittable: def.hittable !== false, passive: !!def.passive, hostile: !!def.hostile, boss: !!def.boss,

      if (G.settings.calm && c.hostile) { c.hp *= 0.8; c.maxHp = c.hp; }
      if (def.init) def.init(c);
      G.ents.creatures.push(c);
      return c;
    },

    // a creature has had enough
    dissuade(c) {
      if (c.fleeing || c.dead) return;

      c.fleeing = 0.0001; c.hittable = false; c.aggro = false; c.hp = 0;
      if (!c.passive) {
        // deeper water pays better
        G.pickups.loot(c.x, c.y, Math.round(def.xp * (1 + 0.3 * G.zone.idx)), G.rand() < (def.pearl || 0) + p.st.luck * 0.03 ? 1 + (def.pearlN || 0) : 0);
        if (!c.minion && G.rand() < (def.heal || 0.035)) G.pickups.spawn('heal', c.x, c.y, 1);
      }
      const big = c.r > 30;
      G.particles.bubbles(c.x, c.y, min(26, 6 + c.r * 0.5), c.r * 0.8, 150);
      G.particles.motes(c.x, c.y, big ? 16 : 7, def.color || '#bff6ff', { s0: 40, s1: 200, life: 0.6, size0: 3, size1: 8 });
      G.particles.ring(c.x, c.y, c.r * 0.6, c.r * 2.4 + 16, '#ffffff', 0.3, 2.5);
      G.lights.flash(c.x, c.y, c.r * 5 + 60, def.color || '#bff6ff', 0.25, 0.8);

      if (G.meta) G.meta.count(c.codexId || def.codex || c.type);

    },

    update(dt) {
      const arr = G.ents.creatures, p = G.player;
      let aggro = 0, threat = 0;
      for (let i = 0; i < arr.length; i++) {
        const c = arr[i], def = c.def;
        if (c.dead) continue;
        c.t += dt;
        const dx = p.x - c.x, dy = p.y - c.y, real = sqrt(dx * dx + dy * dy);

        // a decoy light pulls ordinary hostiles off the probe

            c.hurtCd = 0.35;
            G.damageCreature(c, 14 * p.st.dashDmg, { x: p.x, y: p.y, vx: -dx, vy: -dy, aoe: true, knock: 2.2 });
          } else if (def.dmg && c.stun <= 0) {

            if (p.st.thorns && c.hurtCd <= 0 && c.hittable) { c.hurtCd = 0.6; G.damageCreature(c, 12 * p.st.thorns, { x: p.x, y: p.y, vx: -dx, vy: -dy, aoe: true, knock: 1.5 }); }

      }

        const a = arr[i];

        for (let j = i + 1; j < arr.length; j++) {
          const b = arr[j];
          if (!b.awake || b.dead || b.fleeing || b.def.fixed || b.def.noSep) continue;

      for (let i = 0; i < xp; i += 2) { const k = G.pickups.spawn('glow', e.x + G.rr(-e.r, e.r) * 0.5, e.y + G.rr(-e.r, e.r) * 0.5, min(2, xp - i)); k.mag = true; k.t = 0.3; }

    },
  };
})();

'use strict';
/* UNDERSONG — decor + props.
   decor = scenery that notices you (kelp that parts, worms that hide, clams that snap shut).

   props = one-off interactive objects (supply pods, wrecks, cleaning stations, barriers, the shop). */

  const D = G.decor = {
    rows: [], n: 0, vis: [], visBack: [],
    clear() { this.rows = []; this.n = 0; this.vis.length = 0; this.visBack.length = 0; },
    add(type, x, y, nx, ny, o) {
      const def = G.DECOR[type];
      if (!def) { console.warn('unknown decor', type); return null; }
      const d = { type, def, x, y, nx: nx || 0, ny: ny === undefined ? -1 : ny, ang: atan2(ny === undefined ? -1 : ny, nx || 0), s: 1, ph: G.rand() * TAU, react: 0, t: 0, data: null, dead: false };
      if (o) Object.assign(d, o);
      if (def.init) def.init(d);
      const ri = max(0, floor(y / ROW));
      (this.rows[ri] || (this.rows[ri] = [])).push(d);
      this.n++;

    },
    update(dt) {
      const cam = G.cam, p = G.player, vis = this.vis, visBack = this.visBack;
      vis.length = 0; visBack.length = 0;
      const r0 = max(0, floor((cam.top - 260) / ROW)), r1 = floor((cam.bottom + 260) / ROW);
      const x0 = cam.left - 200, x1 = cam.right + 200;
      for (let ri = r0; ri <= r1; ri++) {
        const row = this.rows[ri];
        if (!row) continue;
        for (let i = 0; i < row.length; i++) {
          const d = row[i];
          if (d.dead || d.x < x0 || d.x > x1) continue;
          const def = d.def;
          d.t += dt;

          if (def.light) def.light(d);
          (def.back ? visBack : vis).push(d);

        for (const d of vis) {
          const def = d.def;
          if (!def.onShot) continue;
          for (const s of G.ents.shots) { if (!s.dead && abs(s.x - d.x) < def.r && abs(s.y - d.y) < def.r) { if (def.onShot(d, s) === true) G.shots.end(s, false); break; } }

    draw(ctx) { for (const d of this.vis) if (d.def.draw) d.def.draw(d, ctx); ctx.globalAlpha = 1; },

  };

  const PR = G.props = {
    focus: null,
    add(type, x, y, o) {
      const def = G.PROPS[type];
      if (!def) { console.warn('unknown prop', type); return null; }

    update(dt) {

        if (s.dead || s.kind === 'wave') continue;
        for (const pr of arr) if (pr.solid && !pr.dead && G.dist2(s.x, s.y, pr.x, pr.y) < pr.r * pr.r) { if (pr.def.onShot) pr.def.onShot(pr, s); G.shots.end(s, true); break; }
      }
      for (const s of G.ents.shots) {
        if (s.dead) continue;
        for (const pr of arr) { const def = pr.def; if (!pr.solid && def.onShot && !pr.dead && G.dist2(s.x, s.y, pr.x, pr.y) < pr.r * pr.r) { if (def.onShot(pr, s) === true) { G.shots.end(s, false); break; } } }
      }
      G.removeDead(arr);
    },
    draw(ctx) {
      const cam = G.cam;
      for (const pr of G.ents.props) if (!pr.dead && pr.def.draw && cam.sees(pr.x, pr.y, pr.def.viewR || pr.r + 120)) pr.def.draw(pr, ctx);
      ctx.globalAlpha = 1;
    },
    drawGlow(ctx) {
      const cam = G.cam;
      for (const pr of G.ents.props) if (!pr.dead && pr.def.glow && cam.sees(pr.x, pr.y, pr.def.viewR || pr.r + 120)) pr.def.glow(pr, ctx);

    find(type) { for (const pr of G.ents.props) if (pr.type === type && !pr.dead) return pr; return null; },
  };

  // A plug of boulders wedged in a passage. open() makes it crumble.
  G.defProp('barrier', {
    r: 84, solid: true, always: true,
    init(pr) {
      const rng = G.RNG((pr.x * 13 + pr.y * 7) | 0);

      pr.openT = -1;
    },
    open(pr) { if (pr.openT < 0) { pr.openT = 0; pr.solid = false; G.sfx('gate'); G.cam.shake(0.5); } },
    update(pr, dt) {
      if (pr.openT >= 0) {
        pr.openT += dt;
        if (G.rand() < dt * 40) { const a = G.rand() * TAU; G.particles.dust(pr.x + cos(a) * pr.r * 0.6, pr.y + sin(a) * pr.r * 0.6, 2, G.css(G.zone.def.rockL), 90); G.particles.bubble(pr.x + G.rr(-60, 60), pr.y + G.rr(-40, 40), G.rr(2, 5), 0, -30); }

    },
    draw(pr, ctx) {
      const def = G.zone.def, u = pr.openT < 0 ? 0 : min(1, pr.openT / 1.3);

      }

    },
  });

    r: 30,
    update(d, dt) {
      d.acc = (d.acc || 0) + dt;

      if (burst && d.acc > 0.11) { d.acc = 0; G.particles.bubble(d.x + G.rr(-4, 4), d.y, G.rr(1.5, 4.5), G.rr(-12, 12), G.rr(-80, -40), G.rr(2, 4)); }
    },
    draw(d, ctx) { ctx.fillStyle = 'rgba(8,16,30,0.6)'; ctx.beginPath(); ctx.ellipse(d.x, d.y + 1, 9, 3.5, d.ang + PI / 2, 0, TAU); ctx.fill(); },
  });
})();

'use strict';

   giant clams, garden eels, Christmas-tree worms, starfish. All of it reacts to the probe. */

  // an invisible, scannable marker for scenery that deserves a codex entry
  G.defProp('specimen', { r: 26 });

  // ------------------------------------------------------------------ giant kelp
  const KELP = [['#7f8f2e', '#a9b445', '#d2d86c'], ['#6f8a34', '#98b24a', '#c6dd70'], ['#8a8430', '#b5a944', '#dccf6a']];
  G.defDecor('kelp', {
    r: 70, back: true,
    init(d) {
      const n = d.len || (7 + ((G.rand() * 7) | 0));
      d.rope = kit.rope(n, 22 * d.s); kit.ropeSet(d.rope, d.x, d.y, 0, -1);
      d.col = pick(KELP);
    },
    update(d, dt, p) {
      const r = d.rope, sway = sin(d.t * 0.9 + d.ph) * 70 + sin(d.t * 0.37 + d.ph * 2.1) * 45;
      kit.ropeStep(r, d.x, d.y, dt, sway, -270, pow(0.9, dt * 60));
      if (abs(p.x - d.x) < 150 && p.y < d.y + 30 && p.y > d.y - r.n * r.seg - 40) kit.ropePush(r, p.x, p.y, 40, p.vx * dt, p.vy * dt, 1.1);
    },
    draw(d, ctx) {
      const r = d.rope, n = r.n, X = r.x, Y = r.y, c = d.col, t = d.t;
      ctx.strokeStyle = c[0]; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(X[0], Y[0]);
      for (let i = 1; i < n - 1; i++) ctx.quadraticCurveTo(X[i], Y[i], (X[i] + X[i + 1]) / 2, (Y[i] + Y[i + 1]) / 2);
      ctx.lineTo(X[n - 1], Y[n - 1]); ctx.stroke();
      for (let i = 1; i < n; i++) {
        const tx = X[i] - X[i - 1], ty = Y[i] - Y[i - 1], tl = sqrt(tx * tx + ty * ty) || 1;
        const side = i & 1 ? 1 : -1, sw = sin(t * 1.3 + i * 0.9 + d.ph) * 0.3;
        const a = atan2(ty, tx) + side * (1.05 + sw), L = (19 + ((i * 7) % 5) * 2.2) * d.s * (i === n - 1 ? 1.25 : 1);
        const dx = cos(a), dy = sin(a), px = -dy, py = dx, x = X[i], y = Y[i];
        ctx.fillStyle = c[1 + (i & 1)];
        ctx.beginPath(); ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + dx * L * 0.5 + px * 5.5, y + dy * L * 0.5 + py * 5.5, x + dx * L, y + dy * L);
        ctx.quadraticCurveTo(x + dx * L * 0.5 - px * 5.5, y + dy * L * 0.5 - py * 5.5, x, y);
        ctx.fill();
        ctx.fillStyle = c[2]; ctx.beginPath(); ctx.arc(x + dx * 3, y + dy * 3, 2.3, 0, TAU); ctx.fill();
      }
    },
  });

  // ------------------------------------------------------------------ seagrass
  G.defDecor('seagrass', {
    r: 40, reactR: 62, reactIn: 8, reactOut: 1.6,
    init(d) { d.n = 5 + ((G.rand() * 4) | 0); d.h = G.rr(15, 30) * d.s; d.side = 1; },
    update(d, dt, p) { if (d.react > 0.05) d.side = p.x > d.x ? -1 : 1; },
    draw(d, ctx) {
      const tx = -d.ny, ty = d.nx;
      ctx.lineCap = 'round'; ctx.lineWidth = 2.3;
      for (let i = 0; i < d.n; i++) {
        const u = i / (d.n - 1) - 0.5, bx = d.x + tx * u * 15, by = d.y + ty * u * 15;
        const h = d.h * (0.7 + 0.6 * G.hash1(i, (d.ph * 100) | 0));
        const bend = sin(d.t * 1.7 + d.ph + i * 1.3) * 5 + u * 9 + d.react * d.side * 13;
        ctx.strokeStyle = i & 1 ? '#3fbf7a' : '#74dc92';
        ctx.beginPath(); ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(bx + d.nx * h * 0.6 + tx * bend * 0.3, by + d.ny * h * 0.6 + ty * bend * 0.3, bx + d.nx * h + tx * bend, by + d.ny * h + ty * bend);
        ctx.stroke();
      }
    },
  });

  // ------------------------------------------------------------------ corals (pre-rendered)
  const fanCache = {}, lumpCache = {};
  const FAN_COLS = ['#ff6f9e', '#ffa040', '#b98cff', '#ff5d5d', '#ffd24a', '#5fd8d0'];
  function fanSprite(ci, v) {
    const key = ci * 8 + v;
    if (fanCache[key]) return fanCache[key];
    const c = G.makeCanvas(112, 112), x = c.getContext('2d'), rng = G.RNG(1000 + key * 31), col = FAN_COLS[ci];
    x.lineCap = 'round'; x.strokeStyle = col;
    const branch = (bx, by, a, len, w, depth) => {
      const ex = bx + cos(a) * len, ey = by + sin(a) * len;
      x.lineWidth = w; x.beginPath(); x.moveTo(bx, by); x.lineTo(ex, ey); x.stroke();
      if (depth <= 0) { x.fillStyle = G.mixCss(col, '#ffffff', 0.5); x.beginPath(); x.arc(ex, ey, w * 0.9, 0, TAU); x.fill(); return; }
      const n = rng.int(2, 3);
      for (let i = 0; i < n; i++) branch(ex, ey, a + (i - (n - 1) / 2) * rng.range(0.4, 0.75) + rng.range(-0.12, 0.12), len * rng.range(0.66, 0.8), max(1.1, w * 0.72), depth - 1);
    };
    branch(56, 110, -PI / 2, 24, 4.4, 4);
    fanCache[key] = c;
    return c;
  }
  G.defDecor('fan', {
    r: 60,
    init(d) { d.ci = (G.rand() * FAN_COLS.length) | 0; d.v = (G.rand() * 3) | 0; d.s *= G.rr(0.55, 1.05); },
    draw(d, ctx) {
      const sp = fanSprite(d.ci, d.v), s = d.s;
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.ang + PI / 2 + sin(d.t * 0.8 + d.ph) * 0.05);
      ctx.drawImage(sp, -56 * s, -109 * s, 112 * s, 112 * s);
      ctx.restore();
    },
  });
  const LUMP_COLS = [['#d8b04a', '#8a6a22'], ['#58c4b4', '#2a7a72'], ['#e88aa8', '#a04a6a'], ['#c8a8e8', '#7a5aa8']];
  function lumpSprite(ci, v) {
    const key = ci * 8 + v;
    if (lumpCache[key]) return lumpCache[key];
    const c = G.makeCanvas(80, 60), x = c.getContext('2d'), rng = G.RNG(2000 + key * 17), col = LUMP_COLS[ci];
    const g = x.createRadialGradient(34, 22, 3, 40, 40, 40); g.addColorStop(0, G.mixCss(col[0], '#ffffff', 0.35)); g.addColorStop(0.6, col[0]); g.addColorStop(1, col[1]);
    x.fillStyle = g; x.beginPath(); x.ellipse(40, 44, 36, 34, 0, PI, TAU); x.fill();
    x.save(); x.beginPath(); x.ellipse(40, 44, 36, 34, 0, PI, TAU); x.clip();
    x.strokeStyle = G.css(col[1], 0.75); x.lineWidth = 1.6; x.lineCap = 'round';
    for (let i = 0; i < 16; i++) {      // brain-coral meanders
      let px = rng.range(6, 74), py = rng.range(12, 44), a = rng.ang();
      x.beginPath(); x.moveTo(px, py);
      for (let k = 0; k < 7; k++) { a += rng.range(-1.2, 1.2); px += cos(a) * 6; py += sin(a) * 5; x.lineTo(px, py); }
      x.stroke();
    }
    x.restore();
    lumpCache[key] = c;
    return c;
  }
  G.defDecor('lump', {
    r: 44,
    init(d) { d.ci = (G.rand() * LUMP_COLS.length) | 0; d.v = (G.rand() * 3) | 0; d.s *= G.rr(0.5, 1); },
    draw(d, ctx) {
      const sp = lumpSprite(d.ci, d.v), s = d.s;
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.ang + PI / 2);
      ctx.drawImage(sp, -40 * s, -42 * s, 80 * s, 60 * s);
      ctx.restore();
    },
  });

  // ------------------------------------------------------------------ anemone (+ sometimes a clownfish)
  const ANEM = [['#ff6fae', '#ffd1e6', '#b83a78'], ['#ff8a4a', '#ffe0b8', '#b85a22'], ['#b388ff', '#eadcff', '#6a4ab8'], ['#5fe0c8', '#d6fff6', '#2a8a7a']];
  G.defDecor('anemone', {
    r: 46, reactR: 56, reactIn: 16, reactOut: 0.7,
    init(d) {
      d.n = 10 + ((G.rand() * 4) | 0); d.col = pick(ANEM); d.len = G.rr(17, 25) * d.s; d.hold = 0;
      d.fish = d.tenant ? { e: 1, ph: G.rand() * TAU } : null;
    },
    onShot(d) { d.hold = 2.2; d.react = 1; },
    onNear(d) { G.particles.bubble(d.x + d.nx * 14, d.y + d.ny * 14, 2.4, d.nx * 30, d.ny * 30); },
    update(d, dt) {
      if (d.hold > 0) { d.hold -= dt; d.react = 1; }
      if (d.fish) d.fish.e = damp(d.fish.e, d.react > 0.25 ? 0 : 1, d.react > 0.25 ? 14 : 1.1, dt);
    },
    draw(d, ctx) {
      const c = d.col, nx = d.nx, ny = d.ny, tx = -ny, ty = nx, ext = 1 - d.react * 0.78;
      const bx = d.x + nx * 5, by = d.y + ny * 5;
      ctx.lineCap = 'round';
      // tenant, behind the front tentacles
      const f = d.fish;
      if (f && f.e > 0.03) {
        const hov = d.len * 0.7 + 9 * f.e + sin(d.t * 2 + f.ph) * 2.5, sx = sin(d.t * 0.9 + f.ph) * 9 * f.e;
        const fx = bx + nx * hov + tx * sx, fy = by + ny * hov + ty * sx, dir = cos(d.t * 0.9 + f.ph) >= 0 ? 1 : -1;
        ctx.save(); ctx.translate(fx, fy); ctx.scale(dir * (0.55 + 0.45 * f.e), 0.55 + 0.45 * f.e);
        ctx.globalAlpha = min(1, f.e * 2);
        ctx.fillStyle = '#ff7a1c'; ctx.beginPath(); ctx.ellipse(0, 0, 8, 4.6, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-12, -3.5 + sin(d.t * 9) * 1.2); ctx.lineTo(-12, 3.5 + sin(d.t * 9) * 1.2); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = 2.1;
        ctx.beginPath(); ctx.moveTo(3, -4); ctx.lineTo(3, 4); ctx.moveTo(-2.5, -4.4); ctx.lineTo(-2.5, 4.4); ctx.stroke();
        ctx.fillStyle = '#141414'; ctx.beginPath(); ctx.arc(5.6, -1, 1.1, 0, TAU); ctx.fill();
        ctx.restore(); ctx.globalAlpha = 1;
      }
      ctx.fillStyle = c[2]; ctx.beginPath(); ctx.ellipse(d.x + nx * 3, d.y + ny * 3, 9 * d.s, 6 * d.s, d.ang + PI / 2, 0, TAU); ctx.fill();
      ctx.lineWidth = 3.2;
      for (let i = 0; i < d.n; i++) {
        const u = i / (d.n - 1) - 0.5, a = u * 2.3 + sin(d.t * 1.9 + i * 0.8 + d.ph) * 0.24 * ext;
        const L = d.len * ext * (0.8 + 0.3 * G.hash1(i, 7)), ca = cos(a), sa = sin(a);
        const dx = nx * ca + tx * sa, dy = ny * ca + ty * sa, cu = sin(d.t * 2.6 + i + d.ph) * 4 * ext;
        const sx = bx + tx * u * 9, sy = by + ty * u * 9, ex = sx + dx * L, ey = sy + dy * L;
        ctx.strokeStyle = c[0];
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + dx * L * 0.5 + tx * cu, sy + dy * L * 0.5 + ty * cu, ex, ey); ctx.stroke();
        ctx.fillStyle = c[1]; ctx.beginPath(); ctx.arc(ex, ey, 2.3, 0, TAU); ctx.fill();
      }
    },
  });

  // ------------------------------------------------------------------ giant clam
  const MANTLE = ['#2f7dff', '#22d6a8', '#9b5cff', '#ffcf3a'];
  G.defDecor('clam', {
    r: 26, reactR: 84, reactIn: 26, reactOut: 0.45,
    init(d) { d.pearl = G.rand() < 0.6; d.col = pick(MANTLE); d.shut = 0; },
    onNear(d) { G.sfx('clack', { x: d.x, y: d.y }); G.particles.bubbles(d.x + d.nx * 10, d.y + d.ny * 10, 4, 6, 60); },
    onShot(d, s) {
      const open = 1 - d.react;
      if (open > 0.45 && d.pearl) {
        d.pearl = false; d.shut = 2.5; d.react = 1;
        G.pickups.spawn('pearl', d.x + d.nx * 16, d.y + d.ny * 16, 1, d.nx * 150 + G.rr(-40, 40), d.ny * 150 + G.rr(-40, 40));
        G.sfx('pop', { x: d.x }); G.particles.ring(d.x, d.y, 6, 30, '#ffeaf6', 0.3, 2);
        return true;
      }
      if (open < 0.4) { G.sfx('clang', { x: d.x, y: d.y }); return true; }
      return false;
    },
    update(d, dt) { if (d.shut > 0) { d.shut -= dt; d.react = 1; } },
    draw(d, ctx) {
      const open = 1 - d.react, s = d.s;
      ctx.save(); ctx.translate(d.x + d.nx * 6, d.y + d.ny * 6); ctx.rotate(d.ang + PI / 2); ctx.scale(s, s);
      // lower valve
      ctx.fillStyle = '#b9ab95'; ctx.beginPath(); ctx.moveTo(-17, 0); ctx.quadraticCurveTo(-16, 12, 0, 12); ctx.quadraticCurveTo(16, 12, 17, 0); ctx.closePath(); ctx.fill();
      if (open > 0.05) {
        ctx.fillStyle = d.col; ctx.beginPath(); ctx.ellipse(0, -0.5, 14.5, 1 + 5 * open, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.arc(i * 3.9, -0.5 + sin(d.t * 3 + i) * 1.2 * open, 0.9, 0, TAU); ctx.fill(); }
        if (d.pearl && open > 0.3) {
          const g = ctx.createRadialGradient(1, -3.5 * open - 1, 0.3, 2, -3 * open, 4); g.addColorStop(0, '#fff'); g.addColorStop(1, '#d9c2e8');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(2, -3 * open, 3.6, 0, TAU); ctx.fill();
        }
      }
      // upper valve, hinged on the left
      ctx.translate(-17, 0); ctx.rotate(-open * 0.62);
      ctx.fillStyle = '#e4d9c6';
      ctx.beginPath(); ctx.moveTo(0, 0);
      for (let i = 0; i <= 6; i++) { const u = i / 6, x = u * 34, y = -sin(u * PI) * 13; ctx.quadraticCurveTo(x - 2.8, y - 3.2, x, y + (i === 6 ? 0 : 0)); }
      ctx.lineTo(34, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(120,104,84,0.6)'; ctx.lineWidth = 1.1;
      for (let i = 1; i < 6; i++) { const u = i / 6; ctx.beginPath(); ctx.moveTo(17, 0); ctx.lineTo(u * 34, -sin(u * PI) * 12); ctx.stroke(); }
      ctx.restore();
    },
    glow(d, ctx) { if (d.pearl && d.react < 0.6) G.drawGlow(ctx, d.x + d.nx * 9, d.y + d.ny * 9, 15, '#ffeaf6', 0.4 * (1 - d.react)); },
  });

  // ------------------------------------------------------------------ garden eels
  G.defDecor('eels', {
    r: 80, reactR: 175, reactIn: 5, reactOut: 0.8,
    init(d) {
      d.eels = [];
      const n = 4 + ((G.rand() * 4) | 0);
      for (let i = 0; i < n; i++) d.eels.push({ off: (i - (n - 1) / 2) * G.rr(15, 22), len: G.rr(26, 46), ph: G.rand() * TAU, e: 1, lag: G.rr(0, 0.25) });
    },
    update(d, dt, p) {
      for (const e of d.eels) {
        const dist = hypot(p.x - (d.x - d.ny * e.off), p.y - (d.y + d.nx * e.off));
        const want = p.dead ? 1 : min(clamp((dist - 70) / 110, 0.05, 1), 1 - d.react * 0.95);
        e.e = damp(e.e, want, want < e.e ? 9 : 1.2 - e.lag, dt);
      }
      d.look = p.x > d.x ? 1 : -1;
    },
    draw(d, ctx) {
      const nx = d.nx, ny = d.ny, tx = -ny, ty = nx;
      ctx.lineCap = 'round';
      for (const e of d.eels) {
        const bx = d.x + tx * e.off, by = d.y + ty * e.off, h = e.len * e.e;
        ctx.fillStyle = 'rgba(40,30,40,0.5)'; ctx.beginPath(); ctx.ellipse(bx, by + 1, 5, 2, d.ang + PI / 2, 0, TAU); ctx.fill();
        if (h < 3) continue;
        const sw = sin(d.t * 1.5 + e.ph) * 5 * e.e, lean = d.look * 4 * e.e;
        const mx = bx + nx * h * 0.55 + tx * (sw - lean), my = by + ny * h * 0.55 + ty * (sw - lean);
        const hx = bx + nx * h + tx * (sw * 0.4 + lean), hy = by + ny * h + ty * (sw * 0.4 + lean);
        ctx.strokeStyle = '#efe4c8'; ctx.lineWidth = 4.4;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(mx, my, hx, hy); ctx.stroke();
        ctx.fillStyle = '#5a4a3a';
        for (let k = 1; k <= 3; k++) { const u = k / 4, a = 1 - u; ctx.beginPath(); ctx.arc(a * a * bx + 2 * a * u * mx + u * u * hx, a * a * by + 2 * a * u * my + u * u * hy, 0.9, 0, TAU); ctx.fill(); }
        ctx.fillStyle = '#efe4c8'; ctx.beginPath(); ctx.arc(hx, hy, 3, 0, TAU); ctx.fill();
        ctx.fillStyle = '#181818'; ctx.beginPath(); ctx.arc(hx + tx * d.look * 1.3 + nx * 0.6, hy + ty * d.look * 1.3 + ny * 0.6, 1.1, 0, TAU); ctx.fill();
      }
    },
  });

  // ------------------------------------------------------------------ Christmas-tree worms
  const XMAS = ['#ffd23a', '#4aa8ff', '#ff6a4a', '#ffffff', '#ff7ad0', '#7affb0'];
  G.defDecor('xmas', {
    r: 34, reactR: 66,
    init(d) {
      d.w = [];
      const n = 3 + ((G.rand() * 4) | 0);
      for (let i = 0; i < n; i++) d.w.push({ off: G.rr(-20, 20), col: pick(XMAS), s: G.rr(0.75, 1.2), e: 1, wait: 0 });
    },
    update(d, dt, p) {
      for (const w of d.w) {
        const wx = d.x - d.ny * w.off, wy = d.y + d.nx * w.off, near = !p.dead && G.dist2(p.x, p.y, wx, wy) < 58 * 58;
        if (near || d.react > 0.6) { if (w.e > 0.5 && near) { G.sfx('pop', { x: wx, y: wy }); } w.e = damp(w.e, 0, 45, dt); w.wait = G.rr(1.1, 2.4); }
        else if (w.wait > 0) w.wait -= dt;
        else w.e = damp(w.e, 1, 1.6, dt);
      }
    },
    draw(d, ctx) {
      const nx = d.nx, ny = d.ny, tx = -ny, ty = nx, ang = d.ang + PI / 2;
      for (const w of d.w) {
        const bx = d.x + tx * w.off, by = d.y + ty * w.off;
        ctx.fillStyle = 'rgba(20,16,30,0.55)'; ctx.beginPath(); ctx.arc(bx, by, 2.4, 0, TAU); ctx.fill();
        if (w.e < 0.04) continue;
        ctx.fillStyle = w.col;
        for (let side = -1; side <= 1; side += 2) {
          for (let k = 0; k < 5; k++) {
            const hgt = (2 + k * 2.5) * w.e * w.s, wd = (5.4 - k * 1) * w.s * (0.4 + 0.6 * w.e);
            const cx = bx + nx * hgt + tx * side * 3 * w.s, cy = by + ny * hgt + ty * side * 3 * w.s;
            ctx.globalAlpha = 0.95 - k * 0.07;
            ctx.beginPath(); ctx.ellipse(cx, cy, wd, 1.5 * w.s, ang + sin(d.t * 2 + k) * 0.1, 0, TAU); ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      }
    },
  });

  // ------------------------------------------------------------------ starfish
  const STAR = [['#ff8a3c', '#ffc58a'], ['#b06aff', '#dcc0ff'], ['#ff5a6a', '#ffb0b8'], ['#3ab8ff', '#b0e4ff']];
  G.defDecor('star', {
    r: 20, reactR: 90, reactIn: 3, reactOut: 1,
    init(d) { d.col = pick(STAR); d.rot = G.rand() * TAU; d.s *= G.rr(0.7, 1.1); },
    draw(d, ctx) {
      const R = 11 * d.s, c = d.col;
      ctx.save(); ctx.translate(d.x + d.nx * 2, d.y + d.ny * 2); ctx.rotate(d.ang + PI / 2);
      ctx.scale(1, 0.72); ctx.rotate(d.rot);
      ctx.fillStyle = c[0];
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const wave = i === 0 ? sin(d.t * 7) * 0.35 * d.react : 0, a = i * TAU / 5 + wave, b = a + TAU / 10;
        ctx.lineTo(cos(a) * R, sin(a) * R); ctx.lineTo(cos(b) * R * 0.42, sin(b) * R * 0.42);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = c[1];
      for (let i = 0; i < 5; i++) { const a = i * TAU / 5; ctx.beginPath(); ctx.arc(cos(a) * R * 0.5, sin(a) * R * 0.5, 1.1, 0, TAU); ctx.fill(); }
      ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, TAU); ctx.fill();
      ctx.restore();
    },
  });

  // ------------------------------------------------------------------ field notes
  G.codexAdd('kelp', { name: 'Giant Kelp', latin: 'Macrocystis pyrifera', zone: 0, kind: 'flora', size: 'to 45 m', decor: 'kelp', decorO: { len: 9 }, showR: 120, showY: 100, notes: 'Not a plant. An alga with ambitions. Grows half a metre on a good day and holds itself up with little gas-filled floats, which I respect: it found a way to stand in a place with nothing to stand on.' });
  G.codexAdd('anemone', { name: 'Sea Anemone', latin: 'Heteractis magnifica', zone: 0, kind: 'flora', size: '20 cm', decor: 'anemone', showR: 34, showY: 12, notes: 'An animal that decided to be a flower. Every tentacle is armed. It folds up when I get close, which I try not to take personally.' });
  G.codexAdd('clownfish', { name: 'Clownfish', latin: 'Amphiprion ocellaris', zone: 0, kind: 'fauna', size: '8 cm', decor: 'anemone', decorO: { tenant: true }, showR: 40, showY: 22, notes: 'Lives inside an anemone that would sting anyone else. Pays rent in housekeeping. Peeks out at me, hides, peeks again. We have been doing this for some time and I believe it is a game.' });

      for (let i = 0; i < 3; i++) { const fl = H.surface(rng, hx, hy, 300, 'floor', 30); if (fl && !H.crowded(fl.x, fl.y, 60)) CR.spawn('urchin', fl.x + fl.nx * 12, fl.y + fl.ny * 12, { nx: fl.nx, ny: fl.ny }); }

(function () {

  });

  // ================================================================= hostiles

  G.defCreature('jelly', {

  G.defCreature('nettle', {

  // Humboldt squid: ink first, then straight through it
  G.defCreature('squid', {
    r: 17, hp: 62, hostile: true, dmg: 1, xp: 6, pearl: 0.2, mass: 1.3, color: '#ff8a8a', leash: 240, showR: 46,
    init(c) { c.jet = G.rr(0, 0.9); c.cd = G.rr(1.5, 3); c.flick = 0; c.da = 0; c.orbit = G.rand() < 0.5 ? 1 : -1; c.arm = 0; },

  // =================================================================== field notes
  const add = G.codexAdd;
  add('smoker', { name: 'Black Smoker', latin: 'hydrothermal vent chimney', zone: 3, kind: 'flora', size: 'to 60 m', decor: 'smoker', decorO: { specimen: true, h: 64 }, showR: 66, showY: 44, notes: 'Seawater sinks into the crust, meets magma, and comes back at 400 degrees carrying dissolved metal. The smoke is that metal freezing into grains the instant it touches the cold. Nobody knew these existed until 1977. It rumbles before it goes. Above the hot part the jet is only a lift, and I have ridden it twice, on purpose, the second time.' });
  add('bactmat', { name: 'Bacterial Mat', latin: 'Beggiatoa and friends', zone: 3, kind: 'flora', size: 'a film', decor: 'bactmat', showR: 34, showY: 8, notes: 'Everything I catalogued above this depth was, in the end, eating sunlight at one or two removes. Not here. These eat the sulphur in the vent water, and everything else down here eats them, or eats what does. A whole world that never needed the sun. I find I keep coming back to that.' });
  add('mussel', { name: 'Vent Mussel', latin: 'Bathymodiolus thermophilus', zone: 3, kind: 'fauna', size: '20 cm', decor: 'mussels', showR: 36, showY: 14, notes: 'Keeps bacteria in its gills that turn hydrogen sulphide into food. That is the gas that smells of bad eggs and kills most animals. The mussel has arranged for it to be lunch instead, and delegated the cooking.' });
  add('ventshrimp', { name: 'Vent Shrimp', latin: 'Rimicaris exoculata', zone: 3, kind: 'fauna', size: '6 cm', spec: { type: 'school', o: { n: 14, tint: '#f4f4f0', codexId: 'ventshrimp' } }, notes: 'No eyes to speak of. Instead a patch on its back that senses the faint glow of the vent itself: water hot enough to shine. They crowd as close to it as they can without cooking. That is a narrow margin, and thousands of them live in it.' });
  add('dumbo', { name: 'Dumbo Octopus', latin: 'Grimpoteuthis sp.', zone: 3, kind: 'fauna', size: '30 cm', notes: 'Flies with its ears. They are fins, technically, but look at it. It has no ink, because down here there has never been anyone to hide from, and it drifts like an umbrella somebody let go of. When I came close it spread its whole web and held very still, hoping to look large. I watched for longer than the survey strictly required.' });
  add('seapig', { name: 'Sea Pig', latin: 'Scotoplanes globosa', zone: 3, kind: 'fauna', size: '15 cm', notes: 'A sea cucumber that walks, by inflating and deflating its legs. Herds of them all face into the current, sniffing for scraps that fell from the world above. The feelers on its back are also legs. I asked no further questions.' });
  add('yeti', { name: 'Yeti Crab', latin: 'Kiwa hirsuta', zone: 3, kind: 'fauna', size: '15 cm', notes: 'Blind, pale, and furred all down its arms. The fur is a farm: it grows bacteria there and waves its arms over the vent to feed them, slowly, in rhythm. I took this for a greeting. It was gardening. Then it jumped on me, which I gather is not part of the gardening.' });
  add('tubeworm', { name: 'Giant Tube Worm', latin: 'Riftia pachyptila', zone: 3, kind: 'fauna', size: '2.4 m', notes: 'No mouth and no gut. Two metres of animal living entirely on bacteria it keeps inside itself, fed through that plume, which is red for the same reason blood is. It is gone into its tube before I have finished noticing it, and my pulses ring off the outside. It also spits. The trick is to catch it with its plume out.' });
  add('isopod', { name: 'Giant Isopod', latin: 'Bathynomus giganteus', zone: 3, kind: 'fauna', size: '50 cm', notes: 'A woodlouse the size of a boot. One in an aquarium went five years without eating and seemed to consider it a personal best. When bothered it rolls into an armoured ball that my pulses skip straight off, and bounces around the room until it has made itself dizzy. So I wait. I am good at waiting.' });
  add('ribbon', { name: 'Giant Oarfish', latin: 'Regalecus glesne', zone: 3, kind: 'fauna', boss: true, size: '11 m, on paper', notes: 'The longest bony fish there is. It hangs upright in the dark like something left in a wardrobe, and swims by rippling one red fin that runs the whole length of it. Every sea-serpent story I have on file starts with somebody meeting one of these at the surface. It looked me over the way you would look over a moth, and then it stopped being in the way.' });
