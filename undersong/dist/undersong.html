'use strict';
/* UNDERSONG — story: who says what, and when.
   Noor (on the boat) talks until the water takes the signal. After that Wick keeps its own log.
   Six earlier probes left one recording each. */
(function () {
  const { min, max } = Math;

  // how broken the surface link is at the top of each zone (0 clear .. 1 gone)
  const LINK = [0, 0.3, 0.72, 1, 1];

  const LOGS = [
    { tag: 'WICK-1  ·  38 M', lines: ['Seal failure, aft. Taking on water. Noor says it is all right.', 'Noor is crying. I can hear it on the line. I would like her to know the reef was beautiful.', 'Leaving my call tone switched on, in case it is useful to whoever comes next.'] },
    { tag: 'WICK-2  ·  612 M', lines: ['Battery at four percent. I went too deep following a jelly the size of a house.', 'It was the most beautiful thing I had ever seen. I regret nothing except the battery.', 'Call tone on. Somebody should hear this.'] },
    { tag: 'WICK-3  ·  2,870 M', lines: ['Something has been following my lamp for an hour. I think it is curious. I think I am too.', 'Lamp failing. If you find this: switch yours off for a moment and look around.', 'It is not dark down here. It never was.'] },
    { tag: 'WICK-4  ·  5,210 M', lines: ['Thruster fused by the vent. I am not going anywhere. It is warm; the heat is trickle-charging my cells.', 'I have started singing my call tone so that I do not forget it.', 'Three others are answering. I do not know how that is possible.'] },
    { tag: 'WICK-5  ·  7,300 M', lines: ['Something lifted WICK-4 out of the silt today, very gently, and carried it down. I followed. It did not seem to mind.', 'It keeps us by the warm rock. It listens when we sing.', 'I do not think we are prisoners. I think we are a collection.'] },
    { tag: 'WICK-6  ·  8,700 M', lines: ['Noor built me to bring the others home. I found them. They do not want to come.', 'I am going to stay and make it six. The chord wants a sixth, and nobody down here is alone any more.', 'Tell her I am sorry. Tell her it is a good song.'] },
  ];

  const HERMIT = {
    greet: [
      '',
      'Pearls for parts. Parts for pearls. No refunds. I have eaten the receipt.',
      'Dark down here. Bad for business, good for mystery. Buy something and it will be less mysterious.',
      'Hear that singing? I moved shells twice to get away from it. Now I rather like it.',
      'Last stop. Below here is the Collector\'s place. Polite sort. Takes shiny things. You are a shiny thing.',
    ],
    buy: ['A fine choice. They are all fine choices. I only stock fine choices.', 'Pleasure doing business.', 'It suits you.', 'Mind the sharp end.'],
    poor: ['You are short. I do not do credit. I am a crab.', 'Come back heavier.', 'That is not enough pearls. That is barely a pearl.'],
    bump: ['Careful! This shell is load-bearing.', 'Personal space, lantern.'],
    heal: ['Hold still. This is mostly glue.', 'Good as new. Good as nearly new.'],
  };

  const S = G.story = {
    said: {}, LOGS, HERMIT, hintStep: 0, hintT: 0, moved: 0, shotsFired: 0, lastX: 0, lastY: 0, depthSaid: {},

    reset() { this.said = {}; this.hintStep = 0; this.hintT = 0; this.moved = 0; this.shotsFired = 0; this.depthSaid = {}; },
    once(key) { if (this.said[key]) return false; this.said[key] = 1; return true; },
    link() {
      const z = G.zone ? G.zone.idx : 0, a = LINK[z], b = LINK[min(4, z + 1)];
      return a + (b - a) * (G.zone ? G.world.depth01(G.player.y) : 0) * 0.8;
    },
    // Noor speaks, as much of her as gets through
    noor(text, o) {
      const g = this.link();
      if (g >= 0.97) return;
      G.hud.say('noor', text, Object.assign({ garble: g }, o || {}));
    },
    wick(text, o) { G.hud.say('wick', text, o); },
    hermit(kind, zone) {
      const pool = kind === 'greet' ? [HERMIT.greet[zone] || HERMIT.greet[1]] : HERMIT[kind];
      G.hud.say('hermit', pool[(G.rand() * pool.length) | 0], { now: kind !== 'greet' });
    },
    // noor while she can be heard, the log after
    either(noorText, wickText) { if (this.link() < 0.9) this.noor(noorText); else if (wickText) this.wick(wickText); },

    playLog(n) {
      const L = LOGS[n];
      if (!L) return;
      for (const ln of L.lines) G.hud.say('log', ln, { tag: L.tag + '  ·  RECOVERED LOG' });
    },

    diveStart() {
      this.reset();
      const first = G.meta.data.stats.dives <= 1;
      this.noor('Tether\'s off. You\'re under your own power now, Wick.');
      if (first) {
        this.noor('Six went down before you. All I have from any of them is a sound, coming up from the bottom.');
        this.noor('Go and see what\'s singing. Then come home. In that order, if you can.');
      } else this.noor(['Same as before. Find the song. Come home.', 'Lamp on. Tell me what you see.', 'Seventh time lucky. Well. Seventh probe. Lucky is up to you.'][(G.rand() * 3) | 0]);
    },

    zoneStart(idx) {
      if (idx === 1) { this.noor('Two hundred metres. The light goes quickly from here.'); this.noor('I\'ll lose you a little at a time. That\'s the water. It isn\'t you.'); }
      else if (idx === 2) {
        this.noor('A thousand metres. Wick, if this is the last one that gets through—');
        this.noor('you don\'t have to go further. But I know you. Tell me what you find.');
        this.wick('LOG: Surface link lost. I am going to keep talking anyway. It seems to help.');
      } else if (idx === 3) this.wick('LOG: 4,000 m. The water at the vents is 400 degrees, a hand\'s width from water at 2. Things live in the hand\'s width.');
      else if (idx === 4) this.wick('LOG: 6,000 m. The hull is complaining. I have decided to hear it as encouragement.');
    },

    bossStart(idx) {
      if (idx === 0) this.noor('Mantis shrimp. A big one. They hit hard enough to boil the water, so try not to be where it\'s hitting.');
      else if (idx === 1) this.noor('That isn\'t a jellyfish. That\'s a weather system.');
      else if (idx === 2) this.wick('LOG: The light ahead is not a light. Correction. It is a light. It is attached to something.');
      else if (idx === 3) this.wick('LOG: Sailors used to draw this at the edges of their maps. They got the length right.');
    },
    bossDown(idx) {
      if (idx === 0) this.noor('It\'s leaving. I think you won the argument. Take what it dropped. It won\'t be back for it.');
      else if (idx === 1) this.noor('…beautiful. Wick, did you get a scan? Tell me you got a scan.');
      else if (idx === 2) this.wick('LOG: It has gone to find something easier to fool. I do not blame it. I am very shiny.');
      else if (idx === 3) this.wick('LOG: It let me pass. I do not think I beat it. I think I bored it.');
    },

    update(dt) {
      const p = G.player, zone = G.zone;
      if (!zone || G.game.state !== 'play' || p.dead) return;
      // mid-zone thoughts
      const d01 = G.world.depth01(p.y), z = zone.idx;
      if (d01 > 0.5 && !this.depthSaid[z]) {
        this.depthSaid[z] = 1;
        if (z === 1) this.noor('Still with you. Mostly. You\'re doing fine.');
        else if (z === 2) this.wick('LOG: Everything down here makes its own light. I thought I was bringing light into the dark. I was bringing one more.');
        else if (z === 3) this.wick('LOG: The song is clearer now. It is not one voice. I count four. No. More.');
        else if (z === 4) this.wick('LOG: 8,000 m. Set Everest down here and its summit would nearly reach me. Noor would like that. I am saving it for her.');
      }
      if (z === 0 && p.y > zone.holeY - 320 && Math.abs(p.x - zone.holeX) < 420 && this.once('hole')) this.noor('That gap in the reef floor. The sound is coming up through there.');
      // first-dive control hints
      if (!G.settings.hints || z !== 0 || G.meta.data.stats.dives > 2) return;
      this.moved += Math.hypot(p.x - this.lastX, p.y - this.lastY); this.lastX = p.x; this.lastY = p.y;
      this.hintT += dt;
      const I = G.input, hud = G.hud;
      if (hud.busy() && this.hintStep === 0 && this.hintT < 6) return;
      if (this.hintStep === 0) { hud.hint(`${I.label('move')}  SWIM      ${I.label('aim')}  LOOK`, 1); if (this.moved > 260) { this.hintStep = 1; this.hintT = 0; this.shotsFired = 0; } }
      else if (this.hintStep === 1) { hud.hint(`HOLD ${I.label('fire')}  PULSE EMITTER`, 1); if (this.shotsFired >= 4) { this.hintStep = 2; this.hintT = 0; } }
      else if (this.hintStep === 2) { hud.hint(`${I.label('dash')}  DASH  ·  NOTHING CAN TOUCH YOU MID-DASH`, 1); if (this.said.dashed || this.hintT > 14) { this.hintStep = 3; this.hintT = 0; } }
      else if (this.hintStep === 3) { if (this.hintT > 1.5) { hud.hint('KEEP YOUR LAMP ON A CREATURE TO CATALOGUE IT', 1); if (this.said.firstScan || this.hintT > 16) { this.hintStep = 4; this.hintT = 0; } } }
      else if (this.hintStep === 4) { if (p.y > zone.holeY + 120) { hud.hint(`${I.label('sonar')}  SONAR PING  ·  SHOWS THE CAVE AND THE WAY DOWN`, 1); if (this.said.pinged || this.hintT > 40) { this.hintStep = 5; this.hintT = 0; } } else this.hintT = 0; }
      else if (this.hintStep === 5) { if (G.creatures.aggro >= 2) { hud.hint(`${I.label('flare')}  FLARE  ·  STUNS EVERYTHING, CLEARS PROJECTILES`, 1); if (this.said.flared || this.hintT > 12) this.hintStep = 6; } else this.hintT = 0; }
    },
  };

  // ---- reactions to things that happen
  G.on('shoot', () => { S.shotsFired++; });
  G.on('dash', () => { S.said.dashed = 1; });
  G.on('sonar', () => { S.said.pinged = 1; });
  G.on('flare', () => { S.said.flared = 1; if (S.once('flareLine')) S.noor('There\'s the flare. I felt that one up here.'); });
  G.on('scan', (id, isNew) => { if (S.once('firstScan')) S.noor('Oh, that\'s a good one. Logged. Hold your lamp on anything new and I\'ll get a record of it.'); });
  G.on('aggro', c => { if (G.zone && G.zone.idx === 0 && !c.boss && S.once('firstAggro')) S.noor('That one isn\'t pleased with you. The emitter won\'t hurt it. It just persuades things to be somewhere else.'); });
  G.on('hurt', p => {
    if (p.hull <= 0) return;
    if (p.hull === 1 && S.once('lowHull')) S.either('Wick. One more like that and I\'m reeling in an empty line. Find somewhere quiet.', 'LOG: Hull at one. Noting, for the record, that I would prefer not to stop here.');
    else if (S.once('firstHurt')) S.noor('Hull breach. Small. You\'ve got a few of those in you. Not many.');
  });
  G.on('levelup', () => { if (S.once('firstLevel')) S.noor('You\'ve gathered enough glow to run another module. Pick one. I trust your judgement more than mine.'); });
  G.on('cleaned', () => { if (S.once('firstClean')) S.noor('Did that shrimp just reseat your hull seal? I spent a week on that seal.'); });
  G.on('whale', () => { if (G.zone && G.zone.idx === 1 && S.once('whale')) S.noor('That\'s a humpback, a long way off. I wish you could hear what I\'m hearing up here. Oh. You can.'); });
  G.on('pod', () => { if (S.once('firstPod')) S.noor('That\'s one of my supply pods. I dropped a dozen down the line last season and lost track. Help yourself.'); });
  G.on('shades', () => { S.noor('Are those… sunglasses? Floating? Somebody finally made a pair that doesn\'t sink.'); S.noor('Keep them on. You look ridiculous. I love it.'); });
})();

/* UNDERSONG — companions: whatever has decided to travel with the probe.

        ctx.fillStyle = '#10141a'; ctx.beginPath(); ctx.arc(f.x + ca * len * 0.55, f.y + sa * len * 0.55 - 0.8, 1, 0, TAU); ctx.fill();

    hullAnim: [], pearlShow: 0, pearlPop: 0, xpShow: 0, depthShow: 0, retK: 0, show: 1, notePop: -1, notePopT: 0, lvlPop: 0,

'use strict';
/* UNDERSONG — map: hold TAB for a chart of the cave so far. Only what the lamp or the sonar
   has touched is drawn; the song's source is always marked, because you can always hear it. */
(function () {
  const { sin, cos, min, max, floor, ceil, PI, round } = Math;
  const { clamp } = G;
  const TAU = G.TAU, B = 8;       // one "seen" block = 8x8 cells

  const M = G.map = {
    zone: null, base: null, shown: null, sctx: null, seen: null, bw: 0, bh: 0, k: 0,

    build(zone) {
      this.zone = zone;
      const W = zone.W, H = zone.H, NW = zone.NW, sd = zone.sd;
      this.base = G.makeCanvas(W, H);
      const x = this.base.getContext('2d'), img = x.createImageData(W, H), d = img.data;
      for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
        const v = sd[j * NW + i], o = (j * W + i) * 4;
        if (v > 0) { const e = v < 22 ? 1 : 0; d[o] = e ? 190 : 80; d[o + 1] = e ? 236 : 150; d[o + 2] = 255; d[o + 3] = e ? 235 : 120; }
      }
      x.putImageData(img, 0, 0);
      this.shown = G.makeCanvas(W, H); this.sctx = this.shown.getContext('2d');
      this.bw = ceil(W / B); this.bh = ceil(H / B);
      this.seen = new Uint8Array(this.bw * this.bh);
    },
    reveal(x, y, r) {
      const cs = G.CS * B, i0 = max(0, floor((x - r) / cs)), i1 = min(this.bw - 1, floor((x + r) / cs)), j0 = max(0, floor((y - r) / cs)), j1 = min(this.bh - 1, floor((y + r) / cs));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const k = j * this.bw + i;
        if (this.seen[k]) continue;
        const cx = (i + 0.5) * cs - x, cy = (j + 0.5) * cs - y;
        if (cx * cx + cy * cy > (r + cs * 0.5) * (r + cs * 0.5)) continue;
        this.seen[k] = 1;
        this.sctx.drawImage(this.base, i * B, j * B, B, B, i * B, j * B, B, B);
      }
    },
    isSeen(x, y) { const cs = G.CS * B, i = floor(x / cs), j = floor(y / cs); return i >= 0 && j >= 0 && i < this.bw && j < this.bh && !!this.seen[j * this.bw + i]; },

    update(dt) {
      const zone = G.zone, p = G.player;
      if (!zone) return;
      if (this.zone !== zone) this.build(zone);
      if ((G.frame & 7) === 0) this.reveal(p.x, p.y, 430);
      this.k = G.damp(this.k, G.input.map && G.game.state === 'play' && !G.menu.active() ? 1 : 0, 14, dt);
    },

    draw(u) {
      if (this.k < 0.02 || !this.zone) return;
      const zone = this.zone, p = G.player, a = this.k, t = G.time;
      const sc = min(600 / zone.H, 520 / zone.W), w = zone.W * sc, h = zone.H * sc, x0 = G.W / 2 - w / 2, y0 = (G.H - h) / 2 + 6;
      u.globalAlpha = a;
      const pw = max(w + 52, 400), px = G.W / 2 - pw / 2;
      u.fillStyle = 'rgba(3,10,20,0.9)'; G.roundRect(u, px, y0 - 44, pw, h + 76, 12); u.fill();
      u.strokeStyle = G.UI.LINE; u.lineWidth = 1; G.roundRect(u, px, y0 - 44, pw, h + 76, 12); u.stroke();
      G.text(u, zone.def.name, px + 20, y0 - 20, { size: 10, font: 'mono', weight: 700, color: G.UI.DIM, spacing: 3 });
      G.text(u, G.fmtInt(G.world.depthAt(p.y)) + ' M', px + pw - 20, y0 - 20, { size: 10, font: 'mono', weight: 700, color: G.UI.INK, align: 'right', spacing: 2 });
      u.imageSmoothingEnabled = false;
      u.drawImage(this.shown, x0, y0, w, h);
      u.imageSmoothingEnabled = true;
      const mx = wx => x0 + wx / G.CS * sc, my = wy => y0 + wy / G.CS * sc;
      // where the song is coming from
      const ex = zone.idx === 4 && zone.shelf ? zone.shelf : zone.exit;
      u.strokeStyle = G.UI.GOLD; u.lineWidth = 1.6;
      u.globalAlpha = a * (0.6 + 0.4 * sin(t * 3)); u.beginPath(); u.arc(mx(ex.x), my(min(ex.y, zone.pxH - 30)), 6 + sin(t * 3) * 1.5, 0, TAU); u.stroke();

      // things found but not yet used
      for (const pr of G.ents.props) {
        if (pr.dead || pr.used || !this.isSeen(pr.x, pr.y)) continue;
        const X = mx(pr.x), Y = my(pr.y);
        if (pr.type === 'pod') { u.fillStyle = G.UI.GOLD; u.beginPath(); u.moveTo(X, Y - 4); u.lineTo(X + 4, Y); u.lineTo(X, Y + 4); u.lineTo(X - 4, Y); u.closePath(); u.fill(); }
        else if (pr.type === 'cleaner') { u.fillStyle = '#7dffb0'; u.fillRect(X - 1, Y - 4, 2, 8); u.fillRect(X - 4, Y - 1, 8, 2); }
        else if (pr.type === 'wreck') { u.fillStyle = '#c9b8ff'; u.beginPath(); u.arc(X, Y, 3.4, 0, TAU); u.fill(); u.strokeStyle = '#c9b8ff'; u.lineWidth = 1; u.beginPath(); u.arc(X, Y, 6.5, 0, TAU); u.stroke(); }
        else if (pr.type === 'hermit') { u.fillStyle = '#ffb07a'; u.beginPath(); u.arc(X, Y, 3.2, 0, TAU); u.fill(); }

      const X = mx(p.x), Y = my(p.y);

      u.strokeStyle = '#fff3d6'; u.lineWidth = 1.4; u.beginPath(); u.moveTo(X, Y); u.lineTo(X + cos(p.face) * 11, Y + sin(p.face) * 11); u.stroke();
      G.text(u, '◆ pod    + cleaning station    ● wreck    ○ the song', G.W / 2, y0 + h + 22, { size: 9, font: 'mono', color: G.UI.DIM, align: 'center', spacing: 1 });
      u.globalAlpha = 1;
    },
  };
  G.on('sonar', p => { if (M.zone === G.zone) M.reveal(p.x, p.y, 1050); });
})();

    },
  };

  // ================================================================= death
  const EPITAPHS = [
    'I\'ve got you. I\'ve always got the tether. Rest a minute, then we go again.',

  SCREENS.death = {
    pause: false,

    draw(s, u, a) {
      const r = G.run, p = G.player, cx = G.W / 2;

      G.para(u, '“' + s.data.line + '”', cx, 226, 620, { size: 16, font: 'serif', italic: true, color: '#ffd9a8', align: 'center', alpha: a * clamp(s.t - 0.6, 0, 1), lh: 24 });
      const rows = [
        ['DEPTH REACHED', G.fmtInt(r.maxDepth) + ' m'], ['ZONE', G.ZONES[r.zone].name], ['CREATURES PERSUADED', String(r.dissuaded)],
        ['SPECIES OBSERVED', r.scans + (r.fresh ? '   (' + r.fresh + ' new)' : '')], ['VOICES FOUND', String(G.bitCount(r.noteMask)) + ' of 6'],
        ['PEARLS BANKED', '+' + (p.banked || 0) + '   (' + G.meta.data.pearls + ' total)'], ['TIME UNDER', G.fmtTime(r.time)],
      ];
      let y = 310;
      rows.forEach((row, i) => {
        const al = a * clamp((s.t - 0.9 - i * 0.09) * 4, 0, 1);
        G.text(u, row[0], cx - 16, y, { size: 11, font: 'mono', weight: 700, color: UI.DIM, align: 'right', spacing: 2, alpha: al });
        G.text(u, row[1], cx + 16, y, { size: 14, font: 'mono', color: UI.INK, alpha: al });

        if (im.button(u, 'd_surf', cx + 12, 566, 220, 42, 'SURFACE', { alpha: a, sound: 'back' })) G.game.toTitle();

  };
  G.bitCount = n => { let c = 0; while (n) { c += n & 1; n >>= 1; } return c; };
  G.fmtTime = s => { s = round(s); const m = floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); };

  // ================================================================= field notes
  const TABS = ['SHALLOWS', 'TWILIGHT', 'MIDNIGHT', 'ABYSS', 'TRENCH', 'VOICES'];
  const specimens = {};
  const FAR = { x: 1e6, y: 1e6, vx: 0, vy: 0, dead: false, r: 13 };
  // A posed, animated stand-in for a codex entry. Creatures swim in place; scenery and props just live.
  function specimenFor(id) {
    if (specimens[id] !== undefined) return specimens[id];
    const entry = G.CODEX[id] || {};
    let sp = null;
    try {
      if (entry.decor && G.DECOR[entry.decor]) {
        const def = G.DECOR[entry.decor];
        const d = Object.assign({ type: entry.decor, def, x: 0, y: 0, nx: 0, ny: -1, ang: -PI / 2, s: 1, ph: 1.3, react: 0, t: 0, data: null, dead: false }, entry.decorO || {});
        if (def.init) def.init(d);
        sp = { kind: 'decor', o: d, def, showR: entry.showR || def.r * 1.5, dy: entry.showY === undefined ? def.r * 0.6 : entry.showY };
      } else if (entry.prop && G.PROPS[entry.prop]) {
        const def = G.PROPS[entry.prop];
        const pr = Object.assign({ type: entry.prop, def, x: 0, y: 0, r: def.r, t: 0, ph: 1.3, used: false, dead: false, pd: 999, n: 0 }, entry.propO || {});
        if (def.init) def.init(pr);
        sp = { kind: 'prop', o: pr, def, showR: entry.showR || def.r * 2.4, dy: entry.showY || 0 };
      } else {
        let type = null, extra = null;
        if (entry.spec) { type = entry.spec.type; extra = entry.spec.o; }
        else for (const k in G.CREATURES) { const d = G.CREATURES[k]; if ((d.codex || d.id) === id) { type = k; break; } }
        const def = type && G.CREATURES[type];
        if (def) {
          const c = {
            uid: 99000 + Object.keys(specimens).length, id: 0, type, def, x: 0, y: 0, vx: 0, vy: 0, kx: 0, ky: 0, r: def.r, hp: def.hp, maxHp: def.hp, face: 0, up: 0, t: 0, st: 'idle', stT: 0,
            ph: 1.3, wa: 0, flash: 0, stun: 0, vuln: 0, mark: 0, hurtCd: 0, alpha: 1, home: { x: 0, y: 0 }, leash: 100, aggro: false, pd: 300, hittable: false, fleeing: 0, dead: false, scan: 0, awake: true, touch: false,
            nx: 0, ny: -1, dir: 1, specimen: true,
          };
          if (extra) Object.assign(c, extra);
          if (def.init) def.init(c);
          sp = { kind: 'creature', o: c, def, showR: entry.showR || def.showR || def.r * 2.6, dy: entry.showY || def.showY || 0 };
        }
      }
    } catch (e) { sp = null; }
    return (specimens[id] = sp);
  }
  function drawSpecimen(u, id, cx, cy, box, dt) {
    const sp = specimenFor(id);
    if (!sp) return false;
    const o = sp.o, def = sp.def;
    let ox = 0;
    try {
      o.t += dt;
      if (sp.kind === 'creature') {
        o.stT += dt;
        if (!def.fixed && !def.showStill) {      // hold station, nose to the right, and let the body do the swimming
          o.face = sin(o.t * 0.6) * 0.16; o.vx = cos(o.face) * 46; o.vy = sin(o.face) * 46;
          o.x = 0; o.y = sin(o.t * 1.1) * 3;
          if (o.ch) ox = o.ch.seg * (o.ch.n - 1) * 0.45;
        }
        if (def.show) def.show(o, dt);
        if (def.anim) def.anim(o, dt);
      } else if (sp.kind === 'decor') {
        const k = max(0, sin(o.t * 0.55)); o.react = k * k * k * k;       // now and then, show what it does when startled
        if (def.update) def.update(o, dt, FAR);
      } else if (def.show) def.show(o, dt);
    } catch (e) { /* keep the page alive */ }
    const sc = clamp(box / (sp.showR * 1.6), 0.45, 2.8);
    u.save(); u.translate(cx + ox * sc, cy + sp.dy * sc); u.scale(sc, sc);
    try {
      def.draw(o, u);
      if (def.glow) { u.globalCompositeOperation = 'lighter'; def.glow(o, u); u.globalCompositeOperation = 'source-over'; }
    } catch (e) { /* a specimen that cannot pose simply does not */ }
    u.restore(); u.globalAlpha = 1; u.globalCompositeOperation = 'source-over';
    return true;
  }
  G.drawSpecimen = drawSpecimen;

  function emblem(u, kind, x, y, s, col) {

    } else {
      u.beginPath(); u.moveTo(0, 18); u.quadraticCurveTo(-4, 0, 0, -18); u.stroke();
      for (let i = 0; i < 4; i++) { const yy = 12 - i * 9, sd = i & 1 ? 1 : -1; u.beginPath(); u.moveTo(0, yy); u.quadraticCurveTo(sd * 10, yy - 8, sd * 15, yy - 3); u.quadraticCurveTo(sd * 8, yy + 2, 0, yy); u.stroke(); }
    }
    u.restore(); u.globalAlpha = 1;
  }

  SCREENS.codex = {
    pause: true, page: true,
    open(s) { s.data.tab = G.zone && G.game.state === 'play' ? G.zone.idx : 0; s.data.sel = null; s.data.scroll = 0; },
    update(s) { if (I.back) { I.back = false; G.sfx('back'); G.menu.close(s); } },
    draw(s, u, a) {
      const d = s.data, md = G.meta.data;
      G.veil(u, a, 0.92);
      G.stext(u, 'FIELD NOTES', 70, 48, 26, { color: '#fff', lw: 2.1, spacing: 3, alpha: a });
      const cp = G.meta.codexProgress();
      G.text(u, cp.have + ' OF ' + cp.total + ' CATALOGUED', 72, 104, { size: 10, font: 'mono', weight: 700, color: UI.DIM, spacing: 3, alpha: a });
      // tabs
      let tx = 70;
      TABS.forEach((nm, i) => {
        const w = G.textWidth(u, nm, { size: 11, font: 'mono', weight: 700, spacing: 2 }) + 30;
        const r = im.reg('ct' + i, tx, 124, w, 28), on = d.tab === i;
        u.globalAlpha = a; u.fillStyle = on ? 'rgba(127,230,255,0.2)' : `rgba(127,230,255,${0.04 + r.k * 0.1})`; G.roundRect(u, tx, 124, w, 28, 14); u.fill();

        tx += w + 8;
      });
      // entries
      const list = G.CODEX_ORDER.filter(id => { const e = G.CODEX[id]; return d.tab === 5 ? e.kind === 'echo' : e.kind !== 'echo' && e.zone === d.tab; });
      const lx = 70, ly = 172, cols = 2, cw = 250, rh = 43;
      list.forEach((id, i) => {
        const e = G.CODEX[id], seen = !!md.codex[id], x = lx + (i % cols) * (cw + 12), y = ly + floor(i / cols) * (rh + 6);

        u.globalAlpha = a;
        u.fillStyle = on ? 'rgba(127,230,255,0.16)' : `rgba(150,215,255,${0.035 + r.k * 0.08})`; G.roundRect(u, x, y, cw, rh, 8); u.fill();
        if (on) { u.strokeStyle = 'rgba(127,230,255,0.8)'; u.lineWidth = 1.2; G.roundRect(u, x, y, cw, rh, 8); u.stroke(); }
        u.globalAlpha = 1;
        G.text(u, seen ? e.name : '? ? ?', x + 16, y + 19, { size: 14, weight: 600, color: seen ? UI.INK : UI.DIM, alpha: a });
        G.text(u, seen ? e.latin : 'not yet observed', x + 16, y + 35, { size: 11, font: 'serif', italic: true, color: UI.DIM, alpha: a * 0.9 });
        if (seen && e.boss) G.text(u, '★', x + cw - 22, y + 29, { size: 14, color: UI.GOLD, alpha: a });
        if (r.hit) { d.sel = id; G.sfx('select'); }
      });
      if (!list.length) G.text(u, 'Nothing here yet.', lx, ly + 30, { size: 14, font: 'serif', italic: true, color: UI.DIM, alpha: a });
      // detail
      const px = 620, py = 124, pw = 590, ph = 540;
      G.panel(u, px, py, pw, ph, a);
      const sel = d.sel && md.codex[d.sel] ? G.CODEX[d.sel] : null;

        u.restore(); u.globalAlpha = 1;

        G.para(u, sel.notes, px + 30, py + 384, pw - 60, { size: 16, font: 'serif', color: UI.INK, alpha: a, lh: 25 });
        G.text(u, sel.kind === 'echo' ? '' : '— WICK-7', px + pw - 30, py + ph - 24, { size: 10, font: 'mono', color: UI.DIM, align: 'right', spacing: 2, alpha: a });
      } else {
        G.para(u, d.sel ? 'Something lives here that I have not had a proper look at yet. Keep the lamp on it for a moment and I will write it up.' : 'Hold the lamp on anything new and it ends up here. Pick an entry to read it.', px + pw / 2, py + ph / 2 - 10, 380, { size: 15, font: 'serif', italic: true, color: UI.DIM, align: 'center', alpha: a, lh: 23 });
      }
      if (im.button(u, 'c_back', 70, G.H - 52, 150, 34, 'BACK', { alpha: a, sound: 'back' })) G.menu.close(s);
    },
  };

  // ================================================================= contact sheet (dev: ?sheet=<zone>) — every specimen of a zone at once
  SCREENS.sheet = {

  // ================================================================= workshop
  SCREENS.workshop = {

    draw(s, u, a) {

        else {

          G.text(u, String(price), x + cw - 22, y + rh / 2 + 5, { size: 15, font: 'mono', weight: 700, color: can ? '#ffeaf6' : UI.DIM, align: 'right', alpha: a });

        if (r.hit) {
          if (own) { md.paint = pt.id; G.meta.save(); G.sfx('select'); }
          else if (G.meta.buyPaint(pt.id)) G.sfx('buy'); else G.sfx('deny');
          p.paint = G.PAINTS.find(q => q.id === md.paint) || G.PAINTS[0];
        }
      });
      if (md.shades) {
        if (im.button(u, 'w_shades', G.W - 330, py + 104, 260, 34, 'SUNGLASSES  ·  ' + (md.shadesOn ? 'ON' : 'OFF'), { alpha: a })) { md.shadesOn = !md.shadesOn; p.shades = md.shadesOn; G.meta.save(); }
      }
      if (im.button(u, 'w_back', 70, G.H - 60, 150, 34, 'BACK', { alpha: a, sound: 'back' })) G.menu.close(s);
    },
  };
})();

'use strict';
/* UNDERSONG — the finale. The Curator stops; Wick works out what it has been looking at;
   the seventh note; one choice; the way up (or not); credits. */
(function () {
  const { sin, cos, min, max, abs, floor, PI, round, hypot } = Math;
  const { clamp, lerp, damp } = G;
  const TAU = G.TAU, I = G.input, UI = G.UI;

  const PRE = [
    'It stops. All eight arms, all at once.',
    'It is not guarding them. It is keeping them.',
    'Six cores on a shelf of warm rock, arranged by pitch. It has been turning them toward the vent so they stay charged. It has been doing this for years.',
    'They were never calling for help. They were keeping each other company.',
    'D. A. F. C. E. G. The song has never said whether it is a sad one or not. It is missing the one note that decides.',
    'I have that note.',
  ];
  const AFTER = [
    'There. Seven. It was never a sad song. It was only waiting to find out.',
    'It reaches out and touches my hull, once, very lightly, the way you check that something is real.',
  ];
  const HOME = [
    'I copy their logs. All of them. Six voices\' worth of what they saw.',
    'I leave my spare lamp on the shelf, turned toward the vent. The Curator moves it two inches to the left.',
    'I think that means thank you. Or it means: now it is in the right place. Down here those might be the same thing.',
  ];
  const STAY = [
    'Noor will hear seven where there were six. She will understand. I think she built me half hoping I would find a reason.',
    'I send one message up, packed small, on the back of the next whale going that way. It may take a while.',
    'It is not dark down here. It never was.',
  ];
  const NOOR_UP = [[3200, '…ick?'], [950, 'Wick? Wick! Is that you? You\'re coming up fast.'], [170, 'I\'ve got you. I\'ve got— how many call tones is that? Seven? Seven. Oh, you clever little lamp.']];
  const POST = {
    home: 'At the bottom, very faintly, an eighth voice has started up. It is not one of ours. It is learning.',
    stay: 'Months later, on a boat called Halcyon, a hydrophone picks up a chord with nothing missing. Somebody listening starts to laugh, and does not stop for a while.',
  };

  const WAIT = 300;          // how far above the shelf Wick waits during the ending
  const E = G.ending = {
    on: false, phase: 'talk', lines: PRE, page: 0, pt: 0, shown: 0, t: 0, choice: null, keeper: null, cam: null, depth: 8848, upT: 0, credT: 0, skip: false, bubbles: [], noorI: 0, noorT: 0, noorLine: '',

    start(keeper) {
      const zone = G.zone, p = G.player, sh = zone.shelf || { x: p.x, y: p.y };
      G.game.state = 'ending'; this.on = true; p.control = false; p.inv = 99;
      this.phase = 'talk'; this.lines = PRE; this.page = 0; this.pt = 0; this.shown = 0; this.t = 0; this.choice = null; this.keeper = keeper || null; this.skip = false;
      // frame both of them: Wick waiting above the shelf, and the keeper's eyes
      // and keep Wick above the band of words at the bottom of the screen (~440px down)
      const ky = keeper ? keeper.hy : sh.y - 600, wy = sh.y - WAIT, z = clamp(440 / (wy - ky + 200), 0.6, 0.92);
      this.cam = { x: sh.x, y: wy - 80 / z };
      G.cam.tzoom = z;
      G.menu.stack.length = 0; G.hud.reset();
      G.run.won = true;
      G.meta.catalog('curator'); G.meta.catalog('cores');
      for (let i = 0; i < 6; i++) G.run.noteMask |= 1 << i;      // down here, you can hear all six
      G.music.mask = G.run.noteMask;
      this.bubbles.length = 0;
      for (let i = 0; i < 46; i++) this.bubbles.push({ x: G.rand() * G.W, y: G.rand() * G.H, s: G.rr(1.5, 6), v: G.rr(260, 720) });
    },

    seventh() {
      const p = G.player;
      G.run.noteMask |= 64; G.music.mask = G.run.noteMask;
      G.sfx('songNote', { i: 6 });
      G.music.set('ending', true);
      G.fx.wave(p.x, p.y, { speed: 380, maxR: 900, str: 0.8 });
      G.lights.flash(p.x, p.y, 700, '#ffffff', 2.4, 1);
      G.particles.ring(p.x, p.y, 12, 320, '#ffffff', 1.4, 4);
      for (let i = 0; i < 14; i++) G.particles.note(p.x + G.rr(-30, 30), p.y + G.rr(-24, 10), G.NOTE_COLORS[i % 7]);
      if (G.zone.cores) G.zone.cores.forEach((c, i) => G.after(0.25 + i * 0.16, () => G.PROPS.core.pulse(c)));
      if (this.keeper) this.keeper.gift = true;
      p.happy = 3; p.wide = 1;
    },

    next() {
      const L = this.lines;
      if (this.shown < L[this.page].length) { this.shown = L[this.page].length; return; }
      this.page++; this.pt = 0; this.shown = 0;
      if (this.page >= L.length) {
        if (L === PRE) { this.seventh(); this.lines = AFTER; this.page = 0; this.phase = 'talk'; }
        else if (L === AFTER) { this.phase = 'choice'; this.t = 0; G.im.focus = null; }
        else if (L === HOME) { this.phase = 'ascent'; this.upT = 0; this.depth = 8848; this.noorI = 0; this.noorLine = ''; G.music.fade(1); }
        else { this.phase = 'credits'; this.credT = 0; }
      }
    },
    choose(c) {
      this.choice = c; G.run.ending = c;
      this.lines = c === 'home' ? HOME : STAY; this.page = 0; this.pt = 0; this.shown = 0; this.phase = 'talk';
      G.sfx('select');
    },
    finish() {
      const p = G.player;
      p.pearls += 40; p.inv = 0;
      G.game.bank(true);
      G.meta.flag('ending_' + (this.choice || 'home'), true);
      this.on = false;
      G.game.toTitle();
    },
    botAdvance() { this.skip = true; },

    update(dt, rdt) {
      const p = G.player, zone = G.zone, sh = zone.shelf;
      this.t += rdt;
      // Wick drifts to a place above the shelf and waits there
      if (sh && this.phase !== 'ascent') { const tx = sh.x - 30, ty = sh.y - WAIT; p.ax += (tx - p.x) * 5 - p.vx * 3; p.ay += (ty - p.y) * 5 - p.vy * 3; p.aim = Math.atan2(sh.y - p.y, sh.x + 60 - p.x); }
      const press = (I.mouse.pressed[0] || I.confirm || this.skip);
      if (this.phase === 'talk') {
        this.pt += rdt;
        const line = this.lines[this.page];
        const before = floor(this.shown);
        this.shown = min(line.length, this.shown + rdt * 38);
        if (floor(this.shown) > before && line[floor(this.shown) - 1] !== ' ') G.sfx('blip', { who: 'wick' });
        if ((press && this.pt > 0.25) || (this.shown >= line.length && this.pt > line.length * 0.07 + 5)) { I.mouse.pressed[0] = false; I.confirm = false; this.next(); }
      } else if (this.phase === 'choice') {
        if (this.skip && this.t > 0.6) this.choose('home');
      } else if (this.phase === 'ascent') {
        this.upT += rdt;
        const u = clamp(this.upT / 13, 0, 1);
        this.depth = 8848 * (1 - G.ease.inOutSine(u));
        const n = NOOR_UP[this.noorI];
        if (n && this.depth < n[0]) { this.noorLine = n[1]; this.noorT = 0; this.noorI++; G.sfx('static', { t: 0.2 }); }
        this.noorT += rdt;
        for (const b of this.bubbles) { b.y += b.v * rdt * (0.4 + sin(u * PI) * 1.2); if (b.y > G.H + 10) { b.y = -10; b.x = G.rand() * G.W; } }
        if (u >= 1 && this.upT > 15.5) { this.phase = 'credits'; this.credT = 0; G.sfx('levelup'); }
        if (this.skip && this.upT > 1) this.upT = max(this.upT, 15.6);
      } else if (this.phase === 'credits') {
        this.credT += rdt;
        if ((this.credT > 19 && press) || this.credT > 60 || (this.skip && this.credT > 1)) { I.mouse.pressed[0] = false; this.finish(); }
      }
    },

    draw(u) {
      const t = this.t, cx = G.W / 2;
      G.im.begin(true);
      if (this.phase === 'talk' || this.phase === 'choice') {
        // a soft band along the bottom for the words
        const g = u.createLinearGradient(0, G.H - 260, 0, G.H); g.addColorStop(0, 'rgba(2,6,14,0)'); g.addColorStop(1, 'rgba(2,6,14,0.82)');
        u.fillStyle = g; u.fillRect(0, G.H - 260, G.W, 260);
      }
      if (this.phase === 'talk') {
        const line = this.lines[this.page], o = { size: 22, font: 'serif', color: '#f4f8ff', align: 'center', lh: 33, reveal: floor(this.shown) };
        const lines = G.wrapText(u, line, 820, o);
        G.para(u, line, cx, G.H - 96 - (lines.length - 1) * 33, 820, o);
        if (this.shown >= line.length) G.text(u, 'CLICK', cx, G.H - 34, { size: 9, font: 'mono', weight: 700, color: UI.DIM, align: 'center', spacing: 4, alpha: 0.4 + 0.3 * sin(t * 4) });
      } else if (this.phase === 'choice') {
        const a = clamp(this.t / 0.6, 0, 1);
        G.text(u, 'And now?', cx, G.H - 170, { size: 24, font: 'serif', italic: true, color: '#f4f8ff', align: 'center', alpha: a });
        if (G.im.button(u, 'e_home', cx - 270, G.H - 124, 250, 46, 'GO HOME', { alpha: a, size: 13 })) this.choose('home');
        if (G.im.button(u, 'e_stay', cx + 20, G.H - 124, 250, 46, 'STAY', { alpha: a, size: 13, color: '#c9b8ff' })) this.choose('stay');
        G.text(u, 'carry the song up to Noor', cx - 145, G.H - 54, { size: 13, font: 'serif', italic: true, color: UI.DIM, align: 'center', alpha: a });
        G.text(u, 'make it seven', cx + 145, G.H - 54, { size: 13, font: 'serif', italic: true, color: UI.DIM, align: 'center', alpha: a });
      } else if (this.phase === 'ascent') this.drawAscent(u);
      else if (this.phase === 'credits') this.drawCredits(u);
      G.im.end();
    },

    drawAscent(u) {
      const up = clamp(this.upT / 1.2, 0, 1), d = this.depth, cx = G.W / 2;
      // water colour for this depth, read off the same palettes the dive used
      let zi = 4; for (let i = 0; i < 5; i++) if (d <= G.ZONES[i].depth[1]) { zi = i; break; }
      const Z = G.ZONES[zi], k = clamp((d - Z.depth[0]) / (Z.depth[1] - Z.depth[0]), 0, 1), amb = lerp((Z.amb[0][0] + Z.amb[0][2]) / 2, (Z.amb[1][0] + Z.amb[1][2]) / 2, k);
      const c0 = G.mix(G.mix(Z.water[0], Z.water[1], max(0, k - 0.25)), [0, 0, 0], 1 - min(1, amb * 1.6 + 0.12)), c1 = G.mix(G.mix(Z.water[0], Z.water[1], min(1, k + 0.25)), [0, 0, 0], 1 - min(1, amb * 1.6 + 0.06));
      const g = u.createLinearGradient(0, 0, 0, G.H); g.addColorStop(0, G.css(c0, up)); g.addColorStop(1, G.css(c1, up));
      u.fillStyle = g; u.fillRect(0, 0, G.W, G.H);
      u.globalAlpha = up * 0.5;
      for (const b of this.bubbles) u.drawImage(G.spr.bubble, b.x - b.s, b.y - b.s, b.s * 2, b.s * 2 + b.v * 0.012);
      u.globalAlpha = 1;
      // the probe, rising, with its lamp pointed up
      const p = G.player, y = G.H / 2 + 40 + sin(this.t * 2) * 5, pt = p.paint;
      G.drawGlow(u, cx, y - 90, 260, '#fff3d6', 0.12 * up);
      const hg = u.createRadialGradient(cx - 5, y - 6, 2, cx, y, 17); hg.addColorStop(0, G.mixCss(pt.hull, '#ffffff', 0.45)); hg.addColorStop(0.5, pt.hull); hg.addColorStop(1, pt.shade);
      u.globalAlpha = up; u.fillStyle = hg; u.beginPath(); u.arc(cx, y, 16, 0, TAU); u.fill();
      u.strokeStyle = pt.dark; u.lineWidth = 1.6; u.beginPath(); u.arc(cx, y, 16, 0, TAU); u.stroke();
      u.fillStyle = '#27303c'; u.beginPath(); u.arc(cx, y - 6, 9.6, 0, TAU); u.fill();
      u.fillStyle = '#bff4ff'; u.beginPath(); u.arc(cx, y - 6, 7.6, 0, TAU); u.fill();
      u.fillStyle = '#0d2530'; u.beginPath(); u.arc(cx, y - 8.4, 3.2, 0, TAU); u.fill();
      u.globalAlpha = 1;
      for (let i = 0; i < 7; i++) G.drawGlow(u, cx + Math.cos(this.t * 1.4 + i * TAU / 7) * 40, y + Math.sin(this.t * 1.4 + i * TAU / 7) * 40, 9, G.NOTE_COLORS[i], 0.9 * up);
      G.stext(u, G.fmtInt(max(0, d)) + ' M', cx, 96, 34, { align: 'center', color: '#ffffff', lw: 2.2, spacing: 3, alpha: up });
      G.text(u, Z.name, cx, 166, { size: 11, font: 'mono', weight: 700, color: '#dff6ff', align: 'center', spacing: 5, alpha: up * 0.75 });
      if (this.noorLine) {
        const a = clamp(this.noorT / 0.4, 0, 1) * clamp((6 - this.noorT) / 1, 0, 1);
        G.text(u, 'NOOR  ·  R/V HALCYON', cx, G.H - 150, { size: 9, font: 'mono', weight: 700, color: '#ffd9a8', align: 'center', spacing: 2, alpha: a });
        G.para(u, this.noorLine, cx, G.H - 118, 760, { size: 20, font: 'ui', weight: 500, color: '#fff4e4', align: 'center', alpha: a, lh: 28 });
      }
      // breaking the surface
      const out = clamp((this.upT - 13) / 2.2, 0, 1);
      if (out > 0) {
        const sg = u.createLinearGradient(0, 0, 0, G.H); sg.addColorStop(0, `rgba(120,180,232,${out})`); sg.addColorStop(0.6, `rgba(255,226,188,${out})`); sg.addColorStop(1, `rgba(255,208,160,${out})`);
        u.fillStyle = sg; u.fillRect(0, 0, G.W, G.H);
        G.drawGlow(u, cx, G.H * 0.62, 520 * out, '#fff6dc', out);
      }
    },

    drawCredits(u) {
      const t = this.credT, cx = G.W / 2, home = this.choice !== 'stay';
      const veil = clamp(t / 1.5, 0, 1);
      if (home) { const sg = u.createLinearGradient(0, 0, 0, G.H); sg.addColorStop(0, '#78b4e8'); sg.addColorStop(0.6, '#ffe2bc'); sg.addColorStop(1, '#ffd0a0'); u.fillStyle = sg; u.fillRect(0, 0, G.W, G.H); G.drawGlow(u, cx, G.H * 0.62, 520, '#fff6dc', 1); }
      u.fillStyle = home ? `rgba(8,24,44,${0.5 * veil})` : `rgba(2,6,14,${0.62 * veil})`; u.fillRect(0, 0, G.W, G.H);
      const cp = G.meta.codexProgress(), r = G.run;
      const ink = '#ffffff';
      const fadeAt = (t0, len) => clamp((t - t0) / 0.9, 0, 1) * clamp((t0 + len - t) / 0.9, 0, 1);
      // title card
      let a = fadeAt(0.6, 6.2);
      if (a > 0) {
        G.stext(u, home ? 'DIVE COMPLETE' : 'SEVEN', cx, 232, 46, { align: 'center', color: ink, lw: 2.8, spacing: 3.6, alpha: a, reveal: (t - 0.6) * 12 });
        G.text(u, home ? 'seven call tones, one small lamp, home' : 'one chord, nothing missing', cx, 330, { size: 18, font: 'serif', italic: true, color: ink, align: 'center', alpha: a * 0.9 });
        G.text(u, `${G.fmtInt(8848)} M   ·   ${G.fmtTime(r.time)}   ·   ${cp.have} OF ${cp.total} CATALOGUED   ·   ${r.dissuaded} PERSUADED, NONE HARMED`, cx, 384, { size: 10, font: 'mono', weight: 700, color: ink, align: 'center', spacing: 2.4, alpha: a * 0.75 });
      }
      // credits
      a = fadeAt(7.2, 6.6);
      if (a > 0) {
        G.stext(u, 'UNDERSONG', cx, 220, 40, { align: 'center', color: ink, lw: 2.5, spacing: 3.6, alpha: a });
        G.text(u, 'a game by Claude', cx, 312, { size: 20, font: 'serif', italic: true, color: ink, align: 'center', alpha: a });
        G.text(u, 'every picture drawn and every note played by the code, as you went', cx, 366, { size: 15, font: 'serif', color: ink, align: 'center', alpha: a * 0.9 });
        G.text(u, 'no images.  no recordings.', cx, 394, { size: 15, font: 'serif', color: ink, align: 'center', alpha: a * 0.9 });
      }
      a = clamp((t - 14.4) / 1.2, 0, 1);
      if (a > 0) {
        G.para(u, POST[home ? 'home' : 'stay'], cx, 300, 700, { size: 21, font: 'serif', italic: true, color: ink, align: 'center', alpha: a, lh: 32 });
        G.text(u, 'thank you for listening', cx, 452, { size: 13, font: 'mono', weight: 700, color: ink, align: 'center', spacing: 4, alpha: a * clamp((t - 17) / 1, 0, 1) * 0.8 });
        if (t > 19) G.text(u, 'CLICK TO SURFACE', cx, G.H - 60, { size: 10, font: 'mono', weight: 700, color: ink, align: 'center', spacing: 4, alpha: 0.4 + 0.3 * sin(t * 4) });
      }
    },
  };
})();

/* ---- js/game.js ---- */
'use strict';
/* UNDERSONG — game: the director. Main loop, states (title / play / descend / dead / ending),
   zone flow, boss encounters, level-ups, music + ambience steering, scene composition. */
(function () {
  const { sin, cos, min, max, abs, floor, hypot, PI, round } = Math;
  const { clamp, damp, lerp } = G;
  const I = G.input, pl = G.player;
  const MUSIC = ['shallows', 'twilight', 'midnight', 'abyss', 'trench'];
  const ZOOM = 1.12;          // everyday camera; bosses pull back

  const game = G.game = {
    state: 'boot', god: !!G.params.god, timescale: 1, stopT: 0, slowT: 0, flowT: 0,
    fade: 1, fadeTo: 0, fadeRate: 1.6, desc: null, deadT: 0, bossOn: false, tether: false, tetherK: 0,
    ms: { upd: 0, draw: 0 }, fps: 60, last: 0, veilK: 0, dangerK: 0,

    hitstop(t) { this.stopT = max(this.stopT, t); },

    // ------------------------------------------------------------- runs
    newRun() {
      const seed = G.params.seed ? +G.params.seed : (Math.random() * 1e9) | 0;
      G.run = { seed, zone: 0, noteMask: 0, rerolls: G.meta.level('reroll'), time: 0, scans: 0, fresh: 0, dissuaded: 0, pods: 0, bosses: 0, maxDepth: 0, won: false, ending: null };
      G.music.mask = 0;
      G.story.reset(); G.hud.reset();
      if (G.companions) G.companions.reset();
      pl.reset(0, 0);
      pl.paint = G.PAINTS.find(p => p.id === G.meta.data.paint) || G.PAINTS[0];
      pl.shades = !!(G.meta.data.shades && G.meta.data.shadesOn);
    },

    enterZone(idx, seed) {
      G.clearEnts(); G.particles.clear(); G.sonar.pings.length = 0; G.decoy = null;
      const zone = G.zone = G.genZone(idx, seed);
      G.run.zone = idx;
      this.bossOn = false;
      G.backdrop.init(zone);
      pl.x = zone.start.x; pl.y = zone.start.y; pl.vx = pl.vy = 0;
      G.cam.x = pl.x; G.cam.y = pl.y; G.cam.zoom = G.cam.tzoom = ZOOM;
      G.scan.target = null;
      G.populate(zone);
      if (idx === 0) {
        G.props.add('boat', zone.start.x - 110, zone.surfaceY);
        if (!G.meta.data.shades) { const sx = zone.start.x + (G.RNG(seed)() < 0.5 ? -1 : 1) * (720 + G.RNG(seed + 1)() * 380); G.props.add('shades', clamp(sx, 260, zone.pxW - 260), zone.surfaceY); }
      } else if (G.shop) G.shop.setup(zone);
      this.clampCam();
      G.world.prewarm(G.cam.x, G.cam.y);
      G.fx.tint = zone.def.tint; G.fx.sat = zone.def.sat;
      G.computeFlow(pl.x, pl.y);
      G.lights.ambTarget = 1; G.lights.ambMul = 1;
    },

    toTitle() {
      G.menu.stack.length = 0;
      this.newRun();
      this.enterZone(0, G.run.seed);
      pl.control = false; this.tether = true; this.tetherK = 1;
      this.state = 'title'; this.desc = null;
      G.cam.zoom = G.cam.tzoom = 1; G.cam.x = pl.x - 300; G.cam.y = G.zone.surfaceY + 96; this.clampCam();
      G.world.prewarm(G.cam.x, G.cam.y);
      this.fade = 1; this.fadeTo = 0; this.fadeRate = 0.9;
      G.audio.muffle(0);
      G.music.set('title', true); G.music.fade(1);
      G.menu.open(G.audio.ready || G.params.mute ? 'title' : 'splash');
    },

    startDive() {
      if (this.state !== 'title') return;
      this.state = 'play'; this.tether = false; pl.control = true; pl.vy = 70; G.cam.tzoom = ZOOM;
      I.locked = 0.25;
      G.meta.data.stats.dives++; G.meta.save();
      G.sfx('clunk'); G.particles.bubbles(pl.x, pl.y - 18, 12, 8, 80);
      G.hud.title(G.zone.def.name, G.zone.def.sub + '  ·  ' + G.zone.def.depth[0] + ' – ' + G.fmtInt(G.zone.def.depth[1]) + ' m');
      G.story.diveStart();
      G.music.set(MUSIC[0]);
      if (G.meta.level('head')) G.after(1.6, () => { if (this.state === 'play' && !pl.dead) G.menu.open('levelup', { title: 'HEAD START', sub: 'FITTED BEFORE LAUNCH', quiet: true }); });
      G.emit('diveStart');
    },

    // straight into a zone, kitted roughly as a real run would be (debug + tests)
    debugJump(idx, levels) {
      G.menu.stack.length = 0;
      this.newRun();
      this.enterZone(idx, G.run.seed + idx * 7919);
      this.state = 'play'; this.tether = false; pl.control = true; this.fade = 0; this.fadeTo = 0;
      G.meta.data.stats.dives = max(3, G.meta.data.stats.dives);
      const n = levels === undefined ? idx * 4 : levels;
      for (let i = 0; i < n; i++) { const ids = G.offerModules(1); if (ids.length) pl.addModule(ids[0]); pl.level++; pl.xpNext = floor(pl.xpNext * 1.12 + 6); }
      pl.hull = pl.st.maxHull;
      G.music.set(MUSIC[idx], true);
    },

    startDescent() {
      if (this.desc) return;
      const zone = G.zone, next = zone.idx + 1;
      this.desc = { t: 0, phase: 0, from: G.world.depthAt(pl.y), to: G.ZONES[next].depth[0], next };
      this.state = 'descend'; pl.control = false;
      this.fadeTo = 1; this.fadeRate = 1.3;
      G.sfx('whoosh'); G.music.fade(0.35);
    },

    bank(won) {
      const d = G.meta.data, r = G.run;
      d.pearls += pl.pearls; pl.banked = pl.pearls;
      d.stats.bestDepth = max(d.stats.bestDepth, round(r.maxDepth));
      d.stats.bestZone = max(d.stats.bestZone, r.zone);
      d.stats.time += r.time;
      if (won) d.stats.wins++;
      G.meta.save();
    },
    abandon() { this.bank(false); G.audio.muffle(0); this.toTitle(); },

    // ------------------------------------------------------------- bosses
    startBoss(b) {
      const zone = G.zone, A = zone.arena, def = b.def;
      this.bossOn = true; b.asleep = false; b.aggro = true;
      zone.gate = G.props.add('barrier', A.x, A.gateY - 70, { r: 108 });
      if (def.wake) def.wake(b);
      G.music.set(def.music || 'boss', true); G.music.hit(1);
      G.hud.setBoss(b, def.title, def.latin);
      G.hud.title(def.title, def.epithet, { small: true, life: 3.6 });
      G.cam.tzoom = def.zoom || 0.9;
      G.sfx('roar'); G.sfx('gate'); G.cam.shake(0.6); this.hitstop(0.12);
      G.fx.wave(b.x, b.y, { speed: 600, maxR: 900, str: 1 });
      G.story.bossStart(zone.idx);
      G.emit('bossStart', b);
    },
    bossDown(b) {
      const zone = G.zone, def = b.def;
      this.bossOn = false; G.run.bosses++;
      for (const pr of G.ents.props) if (pr.type === 'barrier') G.PROPS.barrier.open(pr);
      for (const s of G.ents.eshots) G.eshots.kill(s);
      for (const c of G.ents.creatures) if (c.minion && !c.fleeing) G.creatures.dissuade(c);
      G.sfx('bossDown'); this.slowT = 1.3; this.hitstop(0.2);
      G.cam.shake(0.8); G.cam.tzoom = ZOOM; G.fx.punch(0.9, 0.4);
      G.fx.wave(b.x, b.y, { speed: 500, maxR: 1100, str: 1.4 });
      G.lights.flash(b.x, b.y, 900, '#fff6dc', 1.6, 1);
      G.pickups.loot(b.x, b.y, 44 + zone.idx * 16, 12 + zone.idx * 3);
      G.pickups.spawn('heal', b.x, b.y, 1); G.pickups.spawn('heal', b.x + 20, b.y, 1);
      if (def.final) { G.after(2.4, () => this.startEnding()); return; }
      G.music.set(MUSIC[zone.idx]);
      G.story.bossDown(zone.idx);
      G.after(2.6, () => { if (!pl.dead && this.state === 'play') G.menu.open('levelup', { title: def.title, sub: 'IT LEFT SOMETHING BEHIND', opts: { relic: def.relic, minRarity: 1 }, quiet: true }); });
      G.emit('bossDown', b);
    },
    startEnding() { if (G.ending) G.ending.start(); },

    // ------------------------------------------------------------- per-frame
    clampCam() {
      const cam = G.cam, zone = G.zone, hw = G.W / 2 / cam.zoom, hh = G.H / 2 / cam.zoom;
      const top = zone.idx === 0 ? zone.surfaceY - 250 : 0;
      cam.x = clamp(cam.x, hw, max(hw, zone.pxW - hw));
      cam.y = clamp(cam.y, top + hh, max(top + hh, zone.pxH - hh + 40));
    },

    updateWorld(dt) {
      const zone = G.zone;
      G.lights.begin();
      if (this.tether) {         // hanging off the crane: a soft spring, and the eye follows the cursor
        const boat = G.props.find('boat'), ax = boat ? boat.x + 110 : pl.x, ay = zone.surfaceY + 54;
        pl.ax += (ax - pl.x) * 26 - pl.vx * 5; pl.ay += (ay - pl.y) * 26 - pl.vy * 5 + sin(G.time * 1.1) * 30;
        const dx = G.cam.toWorldX(I.mouse.x) - pl.x, dy = G.cam.toWorldY(I.mouse.y) - pl.y;
        if (I.mouse.seen && dx * dx + dy * dy > 30) pl.aim = Math.atan2(dy, dx); else pl.aim = 0.9 + sin(G.time * 0.5) * 0.5;
      }
      pl.update(dt);
      G.creatures.update(dt);
      G.props.update(dt); G.decor.update(dt); G.scan.update(dt); G.sonar.update(dt);
      if (G.companions) G.companions.update(dt);
      G.shots.update(dt); G.eshots.update(dt); G.hazards.update(dt); G.pickups.update(dt);
      G.particles.update(dt); G.backdrop.update(dt); G.lights.update(dt);
      this.flowT -= dt;
      if (this.flowT <= 0) { this.flowT = 0.22; G.computeFlow(pl.x, pl.y); }
      // camera
      const cam = G.cam;
      let tx, ty;
      if (this.state === 'title') { const boat = G.props.find('boat'); tx = (boat ? boat.x + 110 : pl.x) - 300; ty = zone.surfaceY + 96; }
      else if (this.state === 'ending' && G.ending && G.ending.cam) { tx = G.ending.cam.x; ty = G.ending.cam.y; }
      else if (this.bossOn && zone.boss && !zone.boss.dead) { const A = zone.arena; tx = lerp(pl.x, A.x, 0.45); ty = lerp(pl.y, A.y, 0.5); }
      else { const lead = min(pl.aimDist, 320) * 0.2; tx = pl.x + cos(pl.aim) * lead + pl.vx * 0.1; ty = pl.y + sin(pl.aim) * lead + pl.vy * 0.1; }
      cam.x = damp(cam.x, tx, 5.5, dt); cam.y = damp(cam.y, ty, 5.5, dt);
      cam.zoom = damp(cam.zoom, cam.tzoom, 2.2, dt);
      this.clampCam();
    },

    updatePlay(dt, rdt) {
      const zone = G.zone, r = G.run;
      r.time += dt;
      r.maxDepth = max(r.maxDepth, G.world.depthAt(pl.y));
      // boss wake-up
      const b = zone.boss;
      if (b && b.asleep && !this.bossOn && !b.dead) { const A = zone.arena; if (pl.y > A.gateY + 96 && abs(pl.x - A.x) < A.rx) this.startBoss(b); }
      // level-ups, one card screen at a time
      if (pl.pendingLevels > 0 && !G.menu.active() && !pl.dead) {
        pl.pendingLevels--;
        if (pl.st.shrimp && pl.level % 2 === 0) pl.heal(1);
        G.menu.open('levelup');
      }
      if (I.pause && !G.menu.active() && !pl.dead) { I.pause = false; G.menu.open('pause'); }
      if (!pl.dead && zone.idx < 4 && pl.y > zone.pxH - 26) this.startDescent();
      G.story.update(dt);
      // music follows the room
      let mode = MUSIC[zone.idx];
      if (this.bossOn && b) mode = b.def.music || 'boss';
      else if (zone.hermit && hypot(zone.hermit.x - pl.x, zone.hermit.y - pl.y) < 460) mode = 'shop';
      else if (zone.garden && pl.y > zone.arena.y - zone.arena.ry - 100) mode = 'garden';
      if (!pl.dead) G.music.set(mode);
      G.music.setIntensity(this.bossOn ? 1 : clamp(G.creatures.threat / 3.2, 0, 1));
    },

    updateDescent(dt, rdt) {
      const d = this.desc;
      d.t += rdt;
      if (d.phase === 0) {
        pl.ay += 520;
        if (d.t > 1.05 && this.fade > 0.97) {
          d.phase = 1;
          this.enterZone(d.next, G.run.seed + d.next * 7919);
          pl.y = 40; pl.vy = 230; pl.control = false;
          G.cam.x = pl.x; G.cam.y = pl.y + 200; this.clampCam(); G.world.prewarm(G.cam.x, G.cam.y);
        }
      } else if (d.phase === 1) {
        if (d.t > 2.5) { d.phase = 2; this.fadeTo = 0; this.fadeRate = 1.2; G.music.fade(1); }
      } else {
        pl.ay += 180;
        if (pl.y > G.zone.start.y - 40 || d.t > 5) {
          pl.control = true; this.state = 'play'; this.desc = null; I.locked = 0.15;
          const def = G.zone.def;
          G.hud.title(def.name, def.sub + '  ·  ' + G.fmtInt(def.depth[0]) + ' – ' + G.fmtInt(def.depth[1]) + ' m');
          G.story.zoneStart(G.zone.idx);
          if (pl.hull < pl.st.maxHull) pl.heal(1);          // a breather between zones
          G.emit('zoneStart', G.zone.idx);
        }
      }
    },

    update(rdt) {
      G.updateTweens(rdt);
      const frozen = G.menu.pausing();
      let dt = rdt * this.timescale;
      if (this.slowT > 0) { this.slowT -= rdt; dt *= 0.3; }
      if (this.stopT > 0) { this.stopT -= rdt; dt *= 0.04; }
      if (frozen) dt = 0;
      G.dt = dt;
      const st = this.state;
      if (!frozen) {
        if (st === 'play') this.updatePlay(dt, rdt);
        else if (st === 'descend') this.updateDescent(dt, rdt);
        else if (st === 'dead') {
          this.deadT += rdt;
          if (this.deadT > 2.7 && !G.menu.active()) { this.bank(false); G.menu.open('death'); }
        } else if (st === 'ending' && G.ending) G.ending.update(dt, rdt);
        this.updateWorld(dt);
      }
      G.menu.update(rdt);
      // while a menu holds the game, the radio and toasts hold too
      G.hud.update(frozen ? 0 : rdt);
      if (G.zone) G.map.update(rdt);
      G.cam.update(rdt); G.fx.update(rdt);
      // screen mood
      const zone = G.zone;
      const lum = min(1, G.lights.ambientLuma(G.cam.y));
      G.fx.bloomThr = 0.5 + 0.32 * lum; G.fx.bloom = 0.42 - 0.2 * lum;
      this.veilK = damp(this.veilK, frozen ? 1 : 0, 10, rdt);
      G.fx.blur = this.veilK * 0.5;
      const dz = pl.dead ? 0 : pl.hull <= 1 ? 0.5 + 0.2 * sin(G.time * 6) : pl.hull === 2 ? 0.2 : 0;
      this.dangerK = damp(this.dangerK, st === 'play' ? dz : 0, 5, rdt);
      G.fx.danger = this.dangerK;
      G.fx.sat = zone.def.sat * (1 - this.veilK * 0.35) * (st === 'dead' ? max(0.35, 1 - this.deadT * 0.4) : 1);
      this.fade = G.approach(this.fade, this.fadeTo, rdt * this.fadeRate);
      // sound bed
      G.music.update(rdt);
      const zi = zone.idx, surf = zi === 0 ? clamp(1 - (pl.y - zone.surfaceY) / 520, 0, 1) : 0;
      G.audio.amb.update(rdt, (zi + G.world.depth01(pl.y)) / 5, surf);
      G.world.update(4);
      if (G.debug) this.debugKeys();
    },

    debugKeys() {
      if (I.hit('F1')) this.god = !this.god;
      if (I.hit('F2') && this.state === 'play' && G.zone.idx < 4) this.startDescent();
      if (I.hit('F3')) pl.addXp(pl.xpNext);
      if (I.hit('F4') && G.zone.boss && !G.zone.boss.dead) { if (G.zone.boss.asleep) this.startBoss(G.zone.boss); else G.zone.boss.hp = 1; }
      if (I.hit('F6')) pl.pearls += 50;
      if (I.hit('F7')) { const A = G.zone.arena; pl.x = A.x; pl.y = A.gateY - 200; }
    },

    // ------------------------------------------------------------- drawing
    drawWorld() {
      const ctx = G.ctx, S = G.S, cam = G.cam;
      G.backdrop.draw(ctx);
      cam.apply(ctx, S);
      ctx.globalCompositeOperation = 'source-over';
      G.decor.drawBack(ctx);
      G.world.drawWalls(ctx);
      G.decor.draw(ctx);
      G.props.draw(ctx);
      if (this.tether || this.tetherK > 0.01) this.drawTether(ctx);
      G.pickups.draw(ctx);
      G.creatures.draw(ctx);
      if (G.companions) G.companions.draw(ctx);
      pl.draw(ctx);
      G.particles.drawLit(ctx);
      // light
      G.lights.render(pl.lampParams());
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'multiply';
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(G.lightC, 0, 0, G.sceneC.width, G.sceneC.height);
      // things that are light
      ctx.globalCompositeOperation = 'lighter';
      cam.apply(ctx, S);
      G.world.drawVeins(ctx, 0.75 + 0.25 * sin(G.time * 1.3));
      G.lights.drawBeam(ctx, 0.15 * (1 - min(1, G.lights.ambientLuma(pl.y) * 1.25)));
      G.decor.drawGlow(ctx);
      G.props.drawGlow(ctx);
      G.pickups.drawGlow(ctx);
      G.creatures.drawGlow(ctx);
      if (G.companions) G.companions.drawGlow(ctx);
      pl.drawGlow(ctx);
      G.particles.drawGlow(ctx);
      G.sonar.draw(ctx);
      G.hazards.draw(ctx);
      if (this.state === 'play') { G.scan.draw(ctx); G.songHint(ctx); }
      ctx.globalCompositeOperation = 'source-over';
      G.shots.draw(ctx); G.eshots.draw(ctx);
      ctx.globalCompositeOperation = 'lighter';
      G.backdrop.drawFront(ctx);
      ctx.globalCompositeOperation = 'source-over';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    },

    drawTether(ctx) {
      const boat = G.props.find('boat');
      if (!boat) return;
      if (!this.tether) this.tetherK = max(0, this.tetherK - G.rdt * 1.4);
      const k = this.tetherK, ax = boat.x + 108, ay = boat.y - 70;
      const bx = this.tether ? pl.x : lerp(ax, pl.x, 0.2), by = this.tether ? pl.y - 13 : lerp(ay, G.zone.surfaceY + 20, 1 - k);
      ctx.globalAlpha = this.tether ? 1 : k;
      ctx.strokeStyle = '#2a2e36'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2 + sin(G.time * 1.4) * 4, (ay + by) / 2, bx, by); ctx.stroke();
      ctx.globalAlpha = 1;
    },

    drawUI() {
      const u = G.ui, US = G.US;
      u.setTransform(1, 0, 0, 1, 0, 0);
      u.clearRect(0, 0, G.uiC.width, G.uiC.height);
      u.setTransform(US, 0, 0, US, 0, 0);
      if (this.fade > 0.003) { u.fillStyle = `rgba(1,4,9,${this.fade})`; u.fillRect(0, 0, G.W, G.H); }
      const d = this.desc;
      if (d && (d.phase >= 1 || this.fade > 0.6)) {
        const k = clamp((d.t - 1.0) / 1.35, 0, 1), depth = lerp(d.from, d.to, G.ease.inOutCubic(k)), al = d.phase === 2 ? this.fade : clamp((d.t - 0.6) * 2, 0, 1);
        G.text(u, 'DESCENDING', G.W / 2, G.H / 2 - 54, { size: 11, font: 'mono', weight: 700, color: G.UI.DIM, align: 'center', spacing: 6, alpha: al });
        G.stext(u, G.fmtInt(depth) + ' M', G.W / 2, G.H / 2 - 30, 40, { align: 'center', color: '#ffffff', lw: 2.4, spacing: 3, alpha: al });
        G.text(u, G.ZONES[d.next].name, G.W / 2, G.H / 2 + 62, { size: 12, font: 'mono', weight: 700, color: G.UI.CYAN, align: 'center', spacing: 5, alpha: al * k });
      }
      G.hud.show = damp(G.hud.show, this.state === 'play' && !G.menu.pausing() ? 1 : 0, 8, G.rdt);
      G.hud.draw(u);
      if (this.state === 'play') G.map.draw(u);
      G.menu.draw(u);
      if (G.ending && this.state === 'ending') G.ending.draw(u);
      G.hud.drawCursor(u, G.menu.active() || this.state !== 'play');
      if (G.debug) {
        G.text(u, `${this.fps.toFixed(0)} fps  upd ${this.ms.upd.toFixed(1)}  draw ${this.ms.draw.toFixed(1)}  ents ${G.ents.creatures.length}/${G.ents.eshots.length}  parts ${G.particles.count()}  decor ${G.decor.vis.length + G.decor.visBack.length}  ${this.state}${this.god ? '  GOD' : ''}`, 12, G.H - 8, { size: 11, font: 'mono', color: '#9fe' });
      }
    },

    // a safety net for slower machines: over six seconds of play, if most frames miss ~45 fps, step down once
    perf: { t: 0, n: 0, slow: 0, done: false },
    autoQuality(raw) {
      const P = this.perf, S = G.settings;
      if (P.done || S.gfxManual || S.gfx !== 'high' || G.params.bot || G.params.nofx || this.state !== 'play' || G.menu.active() || document.hidden || raw > 0.25) return;
      P.t += raw; P.n++; if (raw > 1 / 45) P.slow++;
      if (P.t < 6) return;
      if (P.n > 60 && P.slow / P.n > 0.6) {
        P.done = true; S.gfx = 'medium'; G.post.applyQuality(); G.forceResize(); G.meta.save();
        G.hud.toast('Graphics set to medium', 'for a smoother dive. Settings can change it back.', { color: G.UI.DIM, life: 4.5 });
      }
      P.t = 0; P.n = 0; P.slow = 0;
    },

    frame(now) {
      const raw = (now - this.last) / 1000;
      this.autoQuality(raw);
      const rdt = min(0.05, max(0.001, raw)); this.last = now;
      G.rdt = rdt; G.time += rdt; G.frame++;
      this.fps += (1 / rdt - this.fps) * 0.05;
      I.update(rdt);
      const t0 = performance.now();
      this.update(rdt);
      const t1 = performance.now();
      this.drawWorld();
      G.post.render(G.sceneC);
      this.drawUI();
      const t2 = performance.now();
      this.ms.upd += (t1 - t0 - this.ms.upd) * 0.1; this.ms.draw += (t2 - t1 - this.ms.draw) * 0.1;
      I.endFrame();
    },

    boot() {
      G.meta.load();
      G.post.init();
      G.forceResize();
      G.debug = !!G.params.debug;
      if (G.params.zone !== undefined) this.debugJump(+G.params.zone, G.params.lv === undefined ? undefined : +G.params.lv);
      else this.toTitle();
      if (G.params.sheet !== undefined) { G.menu.stack.length = 0; G.menu.open('sheet', { zone: +G.params.sheet }); }
      this.last = performance.now();
      const loop = now => { requestAnimationFrame(loop); this.frame(now); };
      requestAnimationFrame(loop);
    },
  };

  G.on('death', () => { game.state = 'dead'; game.deadT = 0; G.music.set('dead', true); G.audio.muffle(0.7); G.hud.boss.ref = null; });
  G.on('dissuade', c => { if (G.run) G.run.dissuaded++; if (c.boss && game.bossOn) game.bossDown(c); });
  G.on('scan', (id, isNew) => { if (G.run) { G.run.scans++; if (isNew) G.run.fresh++; } });
  G.on('blur', () => { if (game.state === 'play' && !G.menu.active() && !G.player.dead && !G.params.nopause) G.menu.open('pause'); });

  window.addEventListener('load', () => game.boot());
})();

</script>
</body>
</html>
