<body>
<div id="stage"><canvas id="view"></canvas><canvas id="ui"></canvas><div id="err" hidden></div></div>
<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('err'); if (!el) return;
  el.hidden = false; el.textContent = 'Something broke: ' + (e.message || e) + (e.filename ? '  (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
});
</script>
<script src="js/core.js"></script>
<script src="js/input.js"></script>
